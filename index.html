<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#166534">
<meta name="description" content="Sistem Informasi TPQ Wardatul Wathon Tukum Kidul Lumajang">
<title>TPQ Wardatul Wathon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --primary:#166534; --primary-dark:#14532d; --primary-light:#22c55e;
  --bg:#f4f7f5; --card:#ffffff; --text:#172033; --muted:#64748b; --border:#e2e8f0;
  --danger:#dc2626; --warning:#d97706; --info:#2563eb; --success:#16a34a;
  --sidebar:250px; --radius:15px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ============ LOGIN ============ */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top left,#22c55e 0,#166534 35%,#052e16 100%)}
.login-card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.login-logo{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
.login-title,.login-subtitle{text-align:center;margin:0}
.login-subtitle{color:var(--muted);margin-top:7px}
.login-error{min-height:20px;color:var(--danger);text-align:center;font-size:13px;margin-top:12px}
.setup-link{border:0;background:none;color:var(--primary);font-weight:700;margin-top:15px}

/* ============ FORMS ============ */
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,.1)}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:var(--muted);cursor:not-allowed}

/* ============ BUTTONS ============ */
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-full{width:100%}
.btn-danger{background:var(--danger)} .btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning)} .btn-warning:hover{background:#b45309}
.btn-info{background:var(--info)} .btn-info:hover{background:#1d4ed8}
.btn-success{background:var(--success)} .btn-success:hover{background:#15803d}
.btn-light{background:#e2e8f0;color:var(--text)} .btn-light:hover{background:#cbd5e1}
.btn-sm{padding:7px 10px;font-size:12px}

/* ============ LAYOUT ============ */
.app{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--primary-dark);color:#fff;z-index:100;padding:16px 13px;overflow-y:auto;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:7px 6px 20px}
.brand-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand-name{font-size:13px;font-weight:800}
.brand-role{display:block;margin-top:3px;color:#bbf7d0;font-size:11px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:#dcfce7;width:100%;text-align:left;border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:8px;transition:.15s}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.13);color:#fff}
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.top-left{display:flex;align-items:center;gap:10px}
.page-title{font-weight:800}
.user-area{display:flex;align-items:center;gap:10px;font-size:13px}
.page{padding:24px;max-width:1500px;margin:auto;width:100%;flex:1}
.mobile-menu{display:none}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-card{position:relative;overflow:hidden}
.stat-icon{font-size:25px}
.stat-label{color:var(--muted);font-size:13px;margin-top:8px}
.stat-value{font-size:28px;font-weight:800;margin-top:3px}
.section-title{margin:0 0 4px}
.muted{color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.search-box{max-width:260px}

/* ============ TABLES ============ */
.table-container{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;text-align:left}
th{background:#f8fafc;font-size:12px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
.empty{text-align:center;padding:35px;color:var(--muted)}

/* ============ BADGES ============ */
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#e2e8f0;color:#334155}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:15px;animation:fadeIn .15s}
.modal-box{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;animation:slideUp .2s}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.modal-header h3{margin:0}
.modal-close{width:34px;height:34px;border:0;border-radius:50%;background:#e2e8f0;font-size:20px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#cbd5e1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============ MISC ============ */
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{border-left:4px solid var(--primary);background:#f0fdf4;padding:14px;border-radius:8px;margin-bottom:10px}
.notice-warn{border-left-color:var(--warning);background:#fffbeb}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:320px;animation:slideUp .2s}
.toast.error{background:var(--danger)}
.spinner{width:22px;height:22px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:8px;color:var(--muted);padding:30px;justify-content:center}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}

/* ============ PDF UPLOAD ============ */
.pdf-upload-box{border:2px dashed #cbd5e1;border-radius:14px;padding:18px;background:#f8fafc;transition:.2s}
.pdf-upload-box:hover{border-color:var(--primary);background:#f0fdf4}
.pdf-upload-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.pdf-file-info{margin-top:10px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:13px}
.pdf-file-info strong{display:block;color:var(--text)}
.pdf-progress{display:none;margin-top:12px}
.pdf-progress.active{display:block}
.pdf-progress-track{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.pdf-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#166534,#22c55e);border-radius:999px;transition:width .2s}
.pdf-progress-text{font-size:12px;color:var(--muted);margin-top:6px}
.pdf-current{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f0fdf4;color:#166534;font-size:13px}

/* ============ PDF VIEWER ============ */
.pdf-viewer{position:relative;background:#202124;border-radius:16px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.18)}
.pdf-toolbar{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#111827;color:#fff;flex-wrap:wrap}
.pdf-toolbar-group{display:flex;align-items:center;gap:6px}
.pdf-toolbar button{border:0;min-width:36px;height:36px;border-radius:8px;background:#374151;color:#fff;font-weight:700;transition:.15s}
.pdf-toolbar button:hover{background:#4b5563}
.pdf-page-indicator{min-width:90px;text-align:center;font-size:13px;font-weight:700}
.pdf-frame-wrap{position:relative;background:#525659;min-height:600px}
.pdf-frame{width:100%;height:78vh;min-height:500px;border:0;display:block;background:#525659}
.pdf-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(32,33,36,.92);color:#fff;z-index:2}
.pdf-loading.hidden{display:none}
.pdf-info-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#111827;color:#cbd5e1;font-size:12px;flex-wrap:wrap}

/* ============ RESPONSIVE ============ */
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.summary-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%)} .sidebar.open{transform:translateX(0)}
  .main{margin-left:0} .mobile-menu{display:inline-flex} .topbar{padding:0 15px} .user-name{display:none}
  .modal-box{max-height:95vh;padding:18px}
}
@media(max-width:600px){
  .page{padding:15px} .grid{grid-template-columns:1fr} .row{grid-template-columns:1fr}
  .login-card{padding:24px} .summary-strip{grid-template-columns:1fr}
  .pdf-upload-row{grid-template-columns:1fr}
  .pdf-frame{height:65vh;min-height:400px}
}
</style>
</head>
<body>

<!-- ============================= LOGIN ============================= -->
<section id="loginScreen">
  <div class="login-card">
    <div class="login-logo">📖</div>
    <h1 class="login-title">TPQ Wardatul Wathon</h1>
    <div class="login-subtitle">Tukum Kidul • Lumajang</div>
    <form id="loginForm" style="margin-top:25px" autocomplete="on">
      <div class="form-group">
        <label for="loginEmail">Email</label>

<section id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">

        <div class="brand-name">TPQ Wardatul Wathon</div>

</section>

<!-- ============================= MODAL & TOAST ============================= -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">

      <h3 id="modalTitle">Modal</h3>
      <button type="button" class="modal-close" id="modalClose" aria-label="Tutup">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- ============================= SCRIPT ============================= -->
<script type="module">
/* ============================================================
   TPQ WARDATUL WATHON — Enterprise Application
   Single-file production-ready build
============================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc,
  updateDoc, deleteDoc, collection, query, where, orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

/* ============================================================
   1. CONFIG
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBUM53K-Av3DkwkW6NNQg0wKQ-ehtVZ428",
  authDomain: "tpqwardah.firebaseapp.com",
  projectId: "tpqwardah",
  messagingSenderId: "308318249706",
  appId: "1:308318249706:web:ad1f631acee81a2fe6ad93",
  measurementId: "G-ZVC3M0L8XJ"
};

const APP_CONFIG = {
  maxPdfSize: 25 * 1024 * 1024,
  driveUploadUrl: "https://script.google.com/macros/s/AKfycbyBsZtsyXWHT25pzjWjIpjLmM7-NTi65gKSxsXLPBrkfeL--wm7kH9E2WvXusgZwAhx/exec",
  driveFolderId: "1SP6RQ9zTGXN8N9fNFV8E03Et_eJ9eSdm",
  sessionTimeoutMs: 30 * 60 * 1000,
  cacheTtlMs: 30_000
};

/* ============================================================
   2. FIREBASE INIT
============================================================ */
const primaryApp   = initializeApp(firebaseConfig);
const secondaryApp = initializeApp(firebaseConfig, "Secondary");
const auth          = getAuth(primaryApp);
const secondaryAuth = getAuth(secondaryApp);
const db            = getFirestore(primaryApp);

/* ============================================================
   3. GLOBAL STATE
============================================================ */
let currentUser    = null;
let currentProfile = null;

/* ============================================================
   4. UTILS
============================================================ */
const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function escapeAttr(value){
  return String(value ?? "")
    .replace(/\\/g,"\\\\").replace(/'/g,"\\'")
    .replace(/"/g,"&quot;").replace(/[\r\n]/g," ");
}
function sanitizeUrl(value){
  const url = String(value || "").trim();
  if(!url) return "";
  if(/^(javascript|data|vbscript|file):/i.test(url)) return "";
  if(!/^(https?:|\.\/|\/|blob:|#)/i.test(url)) return "";
  return url;
}
function assetUrl(value){
  const clean = sanitizeUrl(value);
  if(/firebasestorage\.googleapis\.com|firebasestorage\.app/i.test(clean)) return "";
  return clean;
}
function formatRupiah(value){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(value||0));
}
function formatTanggal(timestamp){
  if(!timestamp) return "-";
  try{
    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    return new Intl.DateTimeFormat("id-ID",{day:"2-digit",month:"long",year:"numeric"}).format(date);
  }catch{ return "-"; }
}
function formatFileSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  if(bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + " MB";
  return (bytes/1024/1024/1024).toFixed(1) + " GB";
}
function debounce(fn, wait=200){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
}
function validatePdfFile(file){
  if(!file) throw new Error("File PDF belum dipilih.");
  const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
  if(!isPdf) throw new Error("File harus berformat PDF.");
  if(file.size > APP_CONFIG.maxPdfSize){
    throw new Error(`Ukuran PDF maksimal ${formatFileSize(APP_CONFIG.maxPdfSize)}.`);
  }
  return true;
}
function withButtonLoading(button, busyText, fn){
  return async (...args) => {
    if(!button) return fn(...args);
    const originalText     = button.textContent;
    const originalDisabled = button.disabled;
    button.disabled = true;
    button.textContent = busyText;
    try{ return await fn(...args); }
    finally{ button.disabled = originalDisabled; button.textContent = originalText; }
  };
}
function attachTableSearch(inputId, tableId){
  const input = $(inputId);
  const table = $(tableId);
  if(!input || !table) return;
  input.addEventListener("input", debounce(() => {
    const term = input.value.trim().toLowerCase();
    table.querySelectorAll("tbody tr[data-row]").forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(term) ? "" : "none";
    });
  }, 150));
}
function statCard(icon,label,value){
  return `
    <div class="card stat-card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-label">${escapeHTML(label)}</div>
      <div class="stat-value">${escapeHTML(value)}</div>
    </div>`;
}
function firebaseError(error){
  const messages = {
    "auth/invalid-credential":     "Email atau password salah.",
    "auth/invalid-email":          "Format email tidak valid.",
    "auth/email-already-in-use":   "Email tersebut sudah digunakan.",
    "auth/weak-password":          "Password minimal 6 karakter.",
    "auth/operation-not-allowed":  "Login Email/Password belum diaktifkan di Firebase.",
    "auth/network-request-failed": "Koneksi internet bermasalah.",
    "auth/too-many-requests":      "Terlalu banyak percobaan. Coba lagi nanti.",
    "auth/user-disabled":          "Akun ini dinonaktifkan.",
    "auth/user-not-found":         "Akun tidak ditemukan.",
    "permission-denied":           "Anda tidak memiliki izin untuk operasi ini.",
    "unavailable":                 "Layanan sedang tidak tersedia. Coba lagi."
  };
  return messages[error?.code] || error?.message || "Terjadi kesalahan.";
}

/* ============================================================
   5. GLOBAL ERROR HANDLER
============================================================ */
window.addEventListener("error", e => {
  console.error("[Global Error]", e.error || e.message);
  if(e.error?.code) showToast(firebaseError(e.error), true);
});
window.addEventListener("unhandledrejection", e => {
  console.error("[Unhandled Promise]", e.reason);
  const msg = e.reason?.code ? firebaseError(e.reason) : (e.reason?.message || "Terjadi kesalahan tak terduga.");
  showToast(msg, true);
});

/* ============================================================
   6. TOAST / MODAL
============================================================ */
let toastTimeout = null;
function showToast(message, isError=false){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.remove("hidden");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>toast.classList.add("hidden"), 3500);
}
function openModal(title, content){
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = content;
  $("modal").classList.remove("hidden");
  setTimeout(()=>{
    const f = $("modalContent").querySelector("input, select, textarea, button");
    f?.focus();
  }, 50);
}
function closeModal(){
  $("modal").classList.add("hidden");
  $("modalContent").innerHTML = "";
}
$("modalClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if(e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("modal").classList.contains("hidden")) closeModal();
});

/* ============================================================
   7. FIRESTORE SERVICES (dengan cache)
============================================================ */
const cache = new Map();

async function getCollectionData(name, { forceRefresh=false } = {}){
  const cached = cache.get(name);
  if(!forceRefresh && cached && Date.now() - cached.time < APP_CONFIG.cacheTtlMs){
    return cached.data;
  }
  const snap = await getDocs(collection(db, name));
  const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  cache.set(name, { data, time: Date.now() });
  return data;
}
function invalidateCache(name){ cache.delete(name); }
async function getDocument(name, id){
  const snap = await getDoc(doc(db, name, id));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}
async function addCollectionData(name, data){
  const result = await addDoc(collection(db, name), {
    ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  });
  invalidateCache(name);
  return result;
}
async function updateCollectionData(name, id, data){
  await updateDoc(doc(db, name, id), { ...data, updatedAt: serverTimestamp() });
  invalidateCache(name);
}
async function deleteCollectionData(name, id){
  await deleteDoc(doc(db, name, id));
  invalidateCache(name);
}

/* ============================================================
   8. AUDIT LOG
============================================================ */
async function logAudit(action, entity, entityId, metadata={}){
  try{

async function createManagedAccount({ email, password, role, profile }){
  // Simpan info admin yang login
  const adminUid = auth.currentUser?.uid;
  if(!adminUid){
    throw new Error("Anda harus login sebagai admin.");
  }
  console.log("[createManagedAccount] Admin yang login:", adminUid);
  console.log("[createManagedAccount] Akan buat akun:", email, "role:", role);

  // STEP 1: Buat user di secondary app (TIDAK mengganti sesi primary)
  const credential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
  const uid = credential.user.uid;
  console.log("[createManagedAccount] Auth berhasil, UID baru:", uid);

  // STEP 2: Bangun payload eksplisit
  const base = {
    uid: uid,
    email: email,
    role: role,                       // ← otomatis (ustadzah/wali/admin)
    nama: profile.nama || "",
    telepon: profile.telepon || "",
    alamat: profile.alamat || "",
    jilidId: profile.jilidId || null,
    jilidNama: profile.jilidNama || null,
    aktif: profile.aktif !== false,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };

  console.log("[createManagedAccount] Payload:", base);

  // STEP 3: Sign out dari secondary SEGERA (sebelum write ke Firestore)
  //        supaya tidak mengganggu sesi primary
  try{
    await signOut(secondaryAuth);
    console.log("[createManagedAccount] Secondary signout berhasil");
  }catch(err){
    console.warn("[createManagedAccount] Secondary signout error:", err);
  }

  // STEP 4: Pastikan primary auth masih admin
  if(auth.currentUser?.uid !== adminUid){
    console.error("[createManagedAccount] ⚠️ Sesi primary berubah!");
    throw new Error("Sesi admin terputus. Silakan login ulang.");
  }

  // STEP 5: Tulis ke Firestore sebagai ADMIN (sesi primary)
  try{
    await setDoc(doc(db, "users", uid), base);
    console.log("[createManagedAccount] ✅ users/" + uid + " tersimpan");

    await setDoc(doc(db, role, uid), base);
    console.log("[createManagedAccount] ✅ " + role + "/" + uid + " tersimpan");
  }catch(err){
    console.error("[createManagedAccount] ❌ Gagal tulis Firestore:", err);
    throw err;
  }

  // STEP 6: Verifikasi
  try{
    const verify = await getDoc(doc(db, "users", uid));
    if(!verify.exists()){
      throw new Error("Verifikasi gagal: users/{uid} tidak ada.");
    }
    console.log("[createManagedAccount] ✅ Verifikasi berhasil");
  }catch(err){
    console.error("[createManagedAccount] Verifikasi error:", err);
  }

  console.log("[createManagedAccount] ✅ Selesai untuk UID:", uid);
  return uid;
}
async function updateManagedAccount(uid, role, data){
  await updateCollectionData("users", uid, data);
  await updateCollectionData(role, uid, data);
}
async function deleteManagedAccountRecord(uid, role){
  await deleteCollectionData("users", uid).catch(()=>{});
  await deleteCollectionData(role, uid).catch(()=>{});
}

function requireRole(role){
  if(!currentProfile || currentProfile.role !== role){
    alert("Akses ditolak untuk peran ini.");
    return false;
  }
  return true;
}

onAuthStateChanged(auth, async user => {
  if(!user){
    currentUser = null; currentProfile = null;
    $("loginScreen").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }
  try{
    const profile = await getDocument("users", user.uid);
    if(!profile){
      alert("Akun berhasil login tetapi profil aplikasi belum dibuat. Hubungi admin.");
      await signOut(auth);
      return;
    }
    if(!["admin","ustadzah","wali"].includes(profile.role)){
      alert("Role akun tidak valid.");
      await signOut(auth);
      return;
    }
    if(profile.aktif === false){
      alert("Akun ini sedang dinonaktifkan. Hubungi admin.");
      await signOut(auth);
      return;
    }
    currentUser = user;
    currentProfile = profile;
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userName").textContent = profile.nama || user.email;
    $("brandRole").textContent = "Portal " + roleLabel(profile.role);
    buildNavigation();
    navigate("dashboard");
    resetIdleTimer();
    logAudit("LOGIN", "users", user.uid, { email: user.email });
  }catch(error){
    console.error(error);
    alert("Gagal membaca profil pengguna: " + error.message);
    await signOut(auth);
  }
});

async function uploadPdfToGoogleDrive(file, jenis, jilidId){
  validatePdfFile(file);

  if(!APP_CONFIG.driveUploadUrl || APP_CONFIG.driveUploadUrl.includes("GANTI_DENGAN")){
    throw new Error("URL Google Apps Script belum diatur.");
  }

  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("Gagal membaca file PDF."));
    reader.readAsDataURL(file);
  });

  const payload = {
    action: "uploadPdf",
    folderId: APP_CONFIG.driveFolderId,
    fileName: file.name,
    mimeType: "application/pdf",
    base64,
    jenis,
    jilidId: jilidId || "",
    uploadedBy: currentProfile?.uid || "",
    uploadedByName: currentProfile?.nama || ""
  };

  return await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", APP_CONFIG.driveUploadUrl, true);
    xhr.timeout = 120000;

    xhr.upload.addEventListener("progress", event => {
      if(!event.lengthComputable) return;
      const percent = Math.round((event.loaded / event.total) * 100);
      const bar = $(`pdfUploadProgressBar_${jenis}`);
      const text = $(`pdfUploadProgressText_${jenis}`);
      if(bar) bar.style.width = percent + "%";
      if(text) text.textContent = `Mengupload PDF... ${percent}%`;
    });

    xhr.onload = () => {
      if(xhr.status < 200 || xhr.status >= 300){
        reject(new Error(`Upload gagal. HTTP ${xhr.status}`));
        return;
      }
      try{
        const response = JSON.parse(xhr.responseText);
        if(!response.success){
          reject(new Error(response.message || "Google Drive menolak upload."));
          return;
        }
        resolve(response);
      }catch{
        reject(new Error("Respons Google Drive tidak valid."));
      }
    };
    xhr.onerror = () => reject(new Error("Tidak dapat terhubung ke server Google Drive."));
    xhr.ontimeout = () => reject(new Error("Upload timeout. Periksa koneksi Anda."));
    xhr.send(JSON.stringify(payload));
  });
}

function attachPdfUploader(type, jilidId){
  const fileInput    = $(`pdfFile_${type}`);
  const uploadButton = $(`uploadPdfBtn_${type}`);
  const info         = $(`pdfFileInfo_${type}`);
  const progress     = $(`pdfUploadProgress_${type}`);
  const bar          = $(`pdfUploadProgressBar_${type}`);
  const progressText = $(`pdfUploadProgressText_${type}`);
  const urlInput     = $(`pdfUrl_${type}`);

  if(!fileInput || !uploadButton) return;

  fileInput.addEventListener("change", () => {
    const file = fileInput.files?.[0];
    if(!file){ info.textContent = "Belum memilih file."; return; }
    try{
      validatePdfFile(file);
      info.innerHTML = `<strong>📄 ${escapeHTML(file.name)}</strong>${formatFileSize(file.size)}`;
    }catch(error){
      fileInput.value = "";
      info.textContent = error.message;
      showToast(error.message, true);
    }
  });

  uploadButton.addEventListener("click", async () => {
    const file = fileInput.files?.[0];
    if(!file){ showToast("Pilih file PDF terlebih dahulu.", true); return; }

    try{
      validatePdfFile(file);
      uploadButton.disabled = true;
      uploadButton.textContent = "⏳ Mengupload...";
      progress.classList.add("active");
      bar.style.width = "0%";
      progressText.textContent = "Menyiapkan upload...";

      const result = await uploadPdfToGoogleDrive(file, type, jilidId);
      if(!result.url) throw new Error("Upload berhasil tetapi URL PDF tidak diterima.");

      urlInput.value = result.url;
      progressText.textContent = "Upload selesai 100%.";
      bar.style.width = "100%";
      info.innerHTML = `<strong>✅ ${escapeHTML(file.name)}</strong>PDF berhasil diupload ke Google Drive.`;
      showToast("PDF berhasil diupload ke Google Drive.");
    }catch(error){
      console.error(error);
      progressText.textContent = error.message;
      showToast(error.message, true);
    }finally{
      uploadButton.disabled = false;
      uploadButton.textContent = "☁️ Upload PDF";
    }
  });

  document.querySelectorAll("[data-preview-current-pdf]").forEach(button => {
    button.addEventListener("click", () => {
      const url = button.dataset.previewCurrentPdf;
      openProfessionalPdfViewer(url, 1, type === "baca" ? "Buku Baca" : "Buku Hafalan");
    });
  });
}

async function renderKeuanganAdmin(){
  if(!requireRole("admin")) return;
  const [keuangan, santriList, tagihanList] = await Promise.all([
    getCollectionData("keuangan"),
    getCollectionData("santri"),
    getCollectionData("tagihan")
  ]);

  const santriMap = Object.fromEntries(santriList.map(s=>[s.id, s]));
  const rows = keuangan
    .map(k => ({ ...k, santriNama: santriMap[k.santriId]?.nama || "(santri dihapus)" }))
    .sort((a,b)=>(b.tanggal?.seconds||0)-(a.tanggal?.seconds||0));

  const totalTagihan  = rows.reduce((sum,r)=>sum+Number(r.nominalTagihan||0),0);
  const totalTerbayar = rows.reduce((sum,r)=>sum+Number(r.terbayar||0),0);
  const totalTunggakan = Math.max(0, totalTagihan - totalTerbayar);

  $("page").innerHTML = `
    <div class="toolbar">
      <div><h2 class="section-title">Keuangan</h2><p class="muted">Rekap seluruh transaksi pembayaran santri.</p></div>
      <div class="actions">
        <input id="searchKeuangan" class="search-box" placeholder="Cari nama santri...">
        <button class="btn" id="btnCatatPembayaran">+ Catat Pembayaran</button>
      </div>
    </div>
    <div class="summary-strip">
      ${statCard("🧾","Total Transaksi", rows.length)}
      ${statCard("💵","Total Tertagih", formatRupiah(totalTagihan))}
      ${statCard("✅","Total Terbayar", formatRupiah(totalTerbayar))}
      ${statCard("⚠️","Total Tunggakan", formatRupiah(totalTunggakan))}
    </div>
    <div class="table-container">
      <table id="tableKeuangan">
        <thead><tr><th>No</th><th>Santri</th><th>Tagihan</th><th>Nominal</th><th>Terbayar</th><th>Metode</th><th>Status</th><th>Tanggal</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map((item,index)=>{
            const lunas = Number(item.terbayar||0) >= Number(item.nominalTagihan||0);
            return `<tr data-row>
              <td>${index+1}</td><td>${escapeHTML(item.santriNama)}</td><td>${escapeHTML(item.tagihanNama || "-")}</td>
              <td>${formatRupiah(item.nominalTagihan||0)}</td><td>${formatRupiah(item.terbayar||0)}</td>
              <td>${escapeHTML(item.metode || "-")}</td>
              <td>${lunas ? `<span class="badge badge-green">Lunas</span>` : `<span class="badge badge-yellow">Belum Lunas</span>`}</td>
              <td>${formatTanggal(item.tanggal)}</td>
            </tr>`;
          }).join("") : `<tr><td colspan="8" class="empty">Belum ada transaksi keuangan.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  attachTableSearch("searchKeuangan","tableKeuangan");
  $("btnCatatPembayaran").addEventListener("click", ()=>openCatatPembayaranModal(null, santriList, tagihanList));
}

async function openCatatPembayaranModal(preselectedSantriId, santriListArg=null, tagihanListArg=null){
  const santriList  = santriListArg || await getCollectionData("santri");
  const tagihanList = (tagihanListArg || await getCollectionData("tagihan")).filter(x=>x.aktif!==false);
  const keuangan    = await getCollectionData("keuangan");

  const preselected = preselectedSantriId
    ? santriList.find(s => s.id === preselectedSantriId)
    : null;

  openModal("Catat Pembayaran", `
    <form id="bayarForm">
      ${preselected ? `
        <div class="form-group">
          <label>Santri</label>
          <input value="${escapeHTML(preselected.nama)}" disabled>
          <input type="hidden" id="bayarSantri" value="${preselected.id}">
        </div>` : `
        <div class="form-group">
          <label>Santri</label>
          <select id="bayarSantri" required>
            <option value="">Pilih santri</option>
            ${santriList.map(s=>`<option value="${s.id}">${escapeHTML(s.nama)}</option>`).join("")}
          </select>
        </div>`}
      <div class="form-group">
        <label>Tagihan</label>
        <select id="bayarTagihan" required>
          <option value="">Pilih tagihan</option>
          ${tagihanList.map(t=>`<option value="${t.id}" data-nominal="${t.nominal||0}">${escapeHTML(t.nama)} (${formatRupiah(t.nominal||0)})</option>`).join("")}
        </select>
      </div>
      <div class="form-group"><label>Jumlah Terbayar</label><input id="bayarNominal" type="number" min="0" required></div>
      <div class="form-group">
        <label>Metode Pembayaran</label>
        <select id="bayarMetode">
          <option value="Tunai">Tunai</option>
          <option value="QRIS">QRIS</option>
          <option value="Transfer">Transfer</option>
        </select>
      </div>
      <div class="form-group"><label>Keterangan</label><textarea id="bayarKeterangan" rows="3"></textarea></div>
      <button class="btn btn-full" type="submit" id="bayarSaveBtn">Simpan Pembayaran</button>
    </form>`);

  $("bayarTagihan").addEventListener("change", e => {
    const opt = e.target.options[e.target.selectedIndex];
    if(opt?.dataset.nominal) $("bayarNominal").value = opt.dataset.nominal;
  });

  $("bayarForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("bayarSaveBtn");
    const santriId = $("bayarSantri").value;
    const tagihanSelect = $("bayarTagihan");
    const tagihanId = tagihanSelect.value;
    const tagihan = tagihanList.find(t=>t.id===tagihanId);
    if(!santriId || !tagihan){ alert("Pilih santri dan tagihan terlebih dahulu."); return; }

    const existing = keuangan.find(x=>x.santriId===santriId && x.tagihanId===tagihanId);
    const payload = {
      santriId, tagihanId, tagihanNama: tagihan.nama,
      nominalTagihan: Number(tagihan.nominal || 0),
      terbayar: Number($("bayarNominal").value),
      metode: $("bayarMetode").value,
      keterangan: $("bayarKeterangan").value.trim(),
      dicatatOleh: currentProfile.uid,
      dicatatOlehNama: currentProfile.nama || "",
      tanggal: serverTimestamp()
    };
    await withButtonLoading(btn, "Menyimpan...", async () => {
      try{
        if(existing){
          await updateCollectionData("keuangan", existing.id, payload);
          logAudit("UPDATE","keuangan",existing.id);
        }else{
          const created = await addCollectionData("keuangan", payload);
          logAudit("CREATE","keuangan",created.id);
        }
        closeModal();
        showToast("Pembayaran berhasil disimpan.");
        if(currentProfile.role === "admin") renderKeuanganAdmin();
      }catch(error){ alert(error.message); }
    })();
  });
}

async function getSantriWali(){
  if(!currentProfile) return [];
  const santri = await getCollectionData("santri");
  return santri.filter(x => x.waliUid === currentProfile.uid && x.aktif !== false);

async function renderPembelajaranWaliOrUstadzah(santriId){
  const santriData = await getCollectionData("santri");
  const santri = santriData.find(x=>x.id===santriId);
  if(!santri){ alert("Data santri tidak ditemukan."); return; }

  const isUstadzah = currentProfile.role === "ustadzah";
  const isWali     = currentProfile.role === "wali";
  if(isWali && santri.waliUid !== currentProfile.uid){
    alert("Anda tidak memiliki akses ke santri ini."); return;
  }
  if(isUstadzah && santri.jilidId !== currentProfile.jilidId){
    alert("Santri ini bukan bagian dari kelas Anda."); return;
  }

  if(isUstadzah) return renderPdfEditorUstadzah(santri);
  return renderPembelajaranWaliView(santri);
}

    <div class="grid" style="margin-top:18px">
      ${renderBelajarCardWali("📖 Baca", baca, assetUrl(jilid?.pdfBacaUrl), "baca")}
      ${renderBelajarCardWali("🧠 Hafalan", hafalan, assetUrl(jilid?.pdfHafalanUrl), "hafalan")}
    </div>
    <div class="card" style="margin-top:18px">
      <h3>📚 Riwayat Pembelajaran</h3>
      <div class="table-container" style="margin-top:12px">
        <table><thead><tr><th>No.</th><th>Materi</th><th>Halaman</th><th>Status</th><th>Pesan</th><th>Tanggal</th></tr></thead>
          <tbody id="riwayatWaliBody"></tbody>
        </table>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3>💰 Riwayat Keuangan</h3>
      <div class="table-container" style="margin-top:12px">
        <table><thead><tr><th>No.</th><th>Tagihan</th><th>Nilai</th><th>Terbayar</th><th>Metode</th><th>Status</th></tr></thead>
          <tbody id="riwayatKeuanganWaliBody"></tbody>
        </table>
      </div>
      <button class="btn btn-sm" id="btnLihatQris" style="margin-top:12px">📱 Lihat QRIS Pembayaran</button>
    </div>`;

  $("btnKembaliWali").addEventListener("click", renderDashboardWali);
  $("btnLihatQris").addEventListener("click", waliTampilkanQRIS);

  // Render tabel riwayat dengan data yang sudah ada (tidak query ulang)
  await renderRiwayatWaliRows(santri, jilid);
  await renderRiwayatKeuanganWaliRows(santri.id);

  // Event untuk tombol PDF di dalam tabel yang baru dibuat
  $("page").querySelectorAll("[data-open-pdf]").forEach(btn => {
    btn.addEventListener("click", () => {
      const url = btn.dataset.url;
      if(!url){ alert("Buku PDF belum tersedia."); return; }
      openProfessionalPdfViewer(url, Number(btn.dataset.page||1), btn.dataset.label);
    });
  });
}

function renderBelajarCardWali(title, progress, pdfUrl, tipe){
  return `
    <div class="card">
      <h3>${title}</h3>
      <div>Halaman terakhir: <b>${progress?.halaman || 1}</b></div>
      <div style="margin-top:10px">${progress?.status==="naik" ? `<span class="badge badge-green">Naik</span>` : `<span class="badge badge-yellow">Mengulang</span>`}</div>
      ${progress?.pesan ? `<div class="notice" style="margin-top:12px"><b>Pesan Ustadzah</b><p style="margin-bottom:0;white-space:pre-wrap">${escapeHTML(progress.pesan)}</p></div>` : ""}
      <button class="btn btn-sm" style="margin-top:12px" data-open-pdf data-url="${escapeAttr(pdfUrl||"")}" data-page="${progress?.halaman||1}" data-label="${escapeAttr(title)}">${tipe==="baca"?"📖":"🧠"} Buka Buku</button>
    </div>`;
}

async function renderRiwayatWaliRows(santri, jilid){
  const data = await getCollectionData("riwayat");
  const rows = data.filter(x=>x.santriId===santri.id)
    .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));

  const body = $("riwayatWaliBody");
  if(!body) return;

  if(!rows.length){
    body.innerHTML = `<tr><td colspan="6" class="empty">Belum ada riwayat pembelajaran.</td></tr>`;
    return;
  }

  body.innerHTML = rows.map((item,index) => {
    const pdfUrl = item.tipe==="hafalan" ? assetUrl(jilid?.pdfHafalanUrl) : assetUrl(jilid?.pdfBacaUrl);
    return `
      <tr>
        <td>${index+1}</td>
        <td>${item.tipe==="hafalan" ? "🧠 Hafalan" : "📖 Baca"}</td>
        <td>
          <b>Halaman ${Number(item.halaman||1)}</b><br>
          <button class="btn btn-sm" style="margin-top:5px"
            data-open-pdf
            data-url="${escapeAttr(pdfUrl||"")}"
            data-page="${Number(item.halaman||1)}"
            data-label="${escapeAttr(item.tipe==="hafalan"?"Buku Hafalan":"Buku Baca")}">
            👁 Lihat
          </button>
        </td>
        <td>${item.status==="naik" ? `<span class="badge badge-green">Naik</span>` : `<span class="badge badge-yellow">Mengulang</span>`}</td>
        <td>${item.pesan ? escapeHTML(item.pesan) : "-"}</td>
        <td>${formatTanggal(item.createdAt)}</td>
      </tr>`;
  }).join("");
}

async function renderRiwayatKeuanganWaliRows(santriId){
  const data = await getCollectionData("keuangan");
  const rows = data.filter(x=>x.santriId===santriId)
    .sort((a,b)=>(b.tanggal?.seconds||0)-(a.tanggal?.seconds||0));

  const body = $("riwayatKeuanganWaliBody");
  if(!body) return;

  if(!rows.length){
    body.innerHTML = `<tr><td colspan="6" class="empty">Belum ada riwayat keuangan.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map((item,index) => {
    const nominal = Number(item.nominalTagihan||0);
    const terbayar = Number(item.terbayar||0);
    const lunas = terbayar >= nominal;
    return `<tr>
      <td>${index+1}</td><td>${escapeHTML(item.tagihanNama||"-")}</td>
      <td>${formatRupiah(nominal)}</td><td>${formatRupiah(terbayar)}</td>
      <td>${item.metode==="QRIS" ? "📱 QRIS" : escapeHTML(item.metode||"-")}</td>
      <td>${lunas ? `<span class="badge badge-green">Lunas</span>` : `<span class="badge badge-yellow">Belum Lunas</span>`}</td>
    </tr>`;
  }).join("");
}

async function waliTampilkanQRIS(){
  const settings = (await getCollectionData("settings")).find(x=>x.id==="app");
  if(!assetUrl(settings?.qrisUrl)){ alert("QRIS belum tersedia. Silakan hubungi admin."); return; }
  openModal("QRIS Pembayaran", `
    <div style="text-align:center">
      <p class="muted">Silakan scan QRIS berikut untuk melakukan pembayaran.</p>
      <img src="${escapeHTML(assetUrl(settings.qrisUrl))}" alt="QRIS Pembayaran" style="width:350px;max-width:100%;border-radius:12px;border:1px solid var(--border)">
      <p class="muted" style="margin-top:12px">Setelah pembayaran, silakan konfirmasi kepada ustadzah/admin sesuai prosedur TPQ.</p>
    </div>`);
}

/* ----- USTADZAH: editable ----- */
async function renderPdfEditorUstadzah(santri){
  const jilid = await getJilidBySantri(santri);
  if(!jilid){ alert("Jilid/kelas santri belum diatur admin."); return; }

  openModal("Pilih Modul", `
    <div style="display:grid;gap:10px">
      <button class="btn" data-tipe="baca">📖 Buka Modul Baca</button>
      <button class="btn btn-info" data-tipe="hafalan">🧠 Buka Modul Hafalan</button>
    </div>`);
  $("modalContent").querySelectorAll("[data-tipe]").forEach(btn => {
    btn.addEventListener("click", async () => {
      closeModal();
      await openPembelajaranEditor(santri, jilid, btn.dataset.tipe);
    });
  });
}

async function openPembelajaranEditor(santri, jilid, tipe){
  const pdfUrl = tipe === "hafalan" ? assetUrl(jilid.pdfHafalanUrl) : assetUrl(jilid.pdfBacaUrl);
  if(!pdfUrl){
    alert(tipe==="hafalan" ? "Buku PDF hafalan belum diatur admin." : "Buku PDF baca belum diatur admin.");
    return;
  }
  const allProgress = await getCollectionData("progress");
  const progress = allProgress.find(x=>x.santriId===santri.id && x.tipe===tipe);
  const halaman = Math.max(1, Number(progress?.halaman || 1));

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="btnKembaliUstadzah">← Kembali</button></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap">
        <div>
          <h2 style="margin:0">${tipe==="hafalan" ? "🧠 Buku Hafalan" : "📖 Buku Baca"}</h2>
          <div class="muted" style="margin-top:5px">Santri: <b>${escapeHTML(santri.nama)}</b> · ${escapeHTML(jilid.nama)}</div>
        </div>
        <span class="badge badge-blue" id="currentPageBadge">Halaman ${halaman}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px">
        <button class="btn btn-sm" id="btnPrevPage">◀</button>
        <input id="pdfPageInput" type="number" min="1" value="${halaman}" style="width:90px;text-align:center">
        <button class="btn btn-sm" id="btnNextPage">▶</button>
        <button class="btn btn-sm btn-success" id="btnSavePage">📌 Tandai Halaman Terakhir</button>
      </div>
      <div style="margin-top:15px;background:#525659;border-radius:12px;overflow:hidden;min-height:650px">
        <iframe id="pdfFrame" src="${escapeHTML(pdfUrl)}#page=${halaman}" style="width:100%;height:750px;border:0;display:block" title="Buku PDF"></iframe>
      </div>
      <div class="card" style="margin-top:15px;background:#f8fafc">
        <h3>Hasil Pembelajaran</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn btn-success" id="btnNaik">↑ Naik</button>
          <button class="btn btn-warning" id="btnMengulang">↻ Mengulang</button>
        </div>
        <div class="form-group" style="margin-top:15px">
          <label>Pesan Ustadzah</label>
          <textarea id="pesanPembelajaran" rows="4" placeholder="Tuliskan catatan untuk wali...">${escapeHTML(progress?.pesan || "")}</textarea>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-info" id="btnSimpanPesan">💾 Simpan Pesan</button>
        </div>
      </div>
    </div>`;

  $("btnKembaliUstadzah").addEventListener("click", renderDaftarSantriUstadzah);

  let currentPageNum = halaman;
  const frame = $("pdfFrame");

  function updateViewerPage(){
    currentPageNum = Math.max(1, Number($("pdfPageInput").value || 1));
    $("currentPageBadge").textContent = `Halaman ${currentPageNum}`;
    frame.src = `${pdfUrl}#page=${currentPageNum}`;
  }
  $("btnPrevPage").addEventListener("click", () => { currentPageNum = Math.max(1, currentPageNum-1); $("pdfPageInput").value = currentPageNum; updateViewerPage(); });
  $("btnNextPage").addEventListener("click", () => { currentPageNum++; $("pdfPageInput").value = currentPageNum; updateViewerPage(); });
  $("pdfPageInput").addEventListener("change", updateViewerPage);

  const saveWith = async (status) => {
    await saveProgress({
      santriId: santri.id, tipe, halaman: currentPageNum,
      status, pesan: $("pesanPembelajaran").value.trim()
    });
  };
  $("btnSavePage").addEventListener("click", ()=>saveWith(progress?.status || "mengulang"));
  $("btnNaik").addEventListener("click", ()=>saveWith("naik"));
  $("btnMengulang").addEventListener("click", ()=>saveWith("mengulang"));
  $("btnSimpanPesan").addEventListener("click", ()=>saveWith(progress?.status || "mengulang"));
}

async function saveProgress({ santriId, tipe, halaman, status, pesan }){
  try{
    const data = await getCollectionData("progress");
    const existing = data.find(x=>x.santriId===santriId && x.tipe===tipe);
    const payload = {
      santriId, tipe,
      halaman: Math.max(1, Number(halaman||1)),
      status: status || "mengulang",
      pesan: pesan || "",
      ustadzahUid: currentProfile.uid,
      ustadzahNama: currentProfile.nama || "",
      updatedAt: serverTimestamp()
    };
    if(existing) await updateCollectionData("progress", existing.id, payload);
    else await addCollectionData("progress", payload);

    await addCollectionData("riwayat", {
      santriId, tipe,
      halaman: payload.halaman,
      status: payload.status,
      pesan: payload.pesan,
      ustadzahUid: currentProfile.uid,
      ustadzahNama: currentProfile.nama || ""
    });
    logAudit("UPDATE","progress",santriId,{ tipe, halaman: payload.halaman, status: payload.status });
    showToast("Hasil pembelajaran berhasil disimpan.");
  }catch(error){
    console.error(error);
    alert("Gagal menyimpan pembelajaran: " + error.message);
  }
}

/* ============================================================
   27. PDF VIEWER PROFESIONAL
============================================================ */
function openProfessionalPdfViewer(url, page=1, label="Dokumen PDF"){
  const safeUrl = assetUrl(url);
  if(!safeUrl){ showToast("PDF belum tersedia.", true); return; }

  let currentPage = Math.max(1, Number(page) || 1);
  let zoom = 100;

  openModal(label, `
    <div class="pdf-viewer">
      <div class="pdf-toolbar">
        <div class="pdf-toolbar-group">
          <button type="button" id="pdfPrevButton" title="Halaman sebelumnya">◀</button>
          <div class="pdf-page-indicator" id="pdfPageIndicator">Halaman ${currentPage}</div>
          <button type="button" id="pdfNextButton" title="Halaman berikutnya">▶</button>
        </div>
        <div class="pdf-toolbar-group">
          <button type="button" id="pdfZoomOut" title="Perkecil">−</button>
          <span id="pdfZoomValue" style="min-width:45px;text-align:center;font-size:12px">100%</span>
          <button type="button" id="pdfZoomIn" title="Perbesar">+</button>
          <button type="button" id="pdfFullscreen" title="Fullscreen">⛶</button>
        </div>
      </div>
      <div class="pdf-frame-wrap">
        <div class="pdf-loading" id="pdfViewerLoading">
          <div style="text-align:center"><span class="spinner"></span><div style="margin-top:8px">Memuat PDF...</div></div>
        </div>
        <iframe id="professionalPdfFrame" class="pdf-frame" title="${escapeHTML(label)}"
          src="${escapeAttr(safeUrl)}#page=${currentPage}&view=FitH"></iframe>
      </div>
      <div class="pdf-info-bar">
        <span>📄 ${escapeHTML(label)}</span>
        <span>Gunakan tombol navigasi untuk berpindah halaman.</span>
      </div>
    </div>`);

  const frame = $("professionalPdfFrame");
  const loading = $("pdfViewerLoading");
  const indicator = $("pdfPageIndicator");
  const zoomValue = $("pdfZoomValue");

  let loadingTimeout = setTimeout(() => loading?.classList.add("hidden"), 8000);
  frame.addEventListener("load", () => {
    clearTimeout(loadingTimeout);
    loading?.classList.add("hidden");
  });

  function updatePdf(){
    indicator.textContent = `Halaman ${currentPage}`;
    loading?.classList.remove("hidden");
    frame.src = `${safeUrl}#page=${currentPage}&zoom=${zoom}&view=FitH`;
    clearTimeout(loadingTimeout);
    loadingTimeout = setTimeout(() => loading?.classList.add("hidden"), 8000);
  }

  $("pdfPrevButton")?.addEventListener("click", ()=>{ currentPage = Math.max(1, currentPage-1); updatePdf(); });
  $("pdfNextButton")?.addEventListener("click", ()=>{ currentPage++; updatePdf(); });
  $("pdfZoomIn")?.addEventListener("click", ()=>{ zoom = Math.min(200, zoom+10); zoomValue.textContent = zoom+"%"; updatePdf(); });
  $("pdfZoomOut")?.addEventListener("click", ()=>{ zoom = Math.max(50, zoom-10); zoomValue.textContent = zoom+"%"; updatePdf(); });
  $("pdfFullscreen")?.addEventListener("click", ()=>{
    const viewer = document.querySelector(".pdf-viewer");
    if(!document.fullscreenElement) viewer?.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });
}
