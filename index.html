<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#166534">
<meta name="description" content="Sistem Informasi TPQ Wardatul Wathon Tukum Kidul Lumajang">
<link rel="manifest" href="./manifest.json">
<title>TPQ Wardatul Wathon</title>

<style>
:root{
 --p:#166534;--p2:#15803d;--bg:#f6f8f7;--card:#fff;
 --text:#172033;--muted:#64748b;--line:#e2e8f0;
 --red:#dc2626;--blue:#2563eb;--orange:#d97706
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px;background:linear-gradient(135deg,#14532d,#166534,#22c55e)}
.login-card{width:100%;max-width:420px;background:white;padding:30px;
border-radius:24px;box-shadow:0 20px 60px #0004}
.logo{width:68px;height:68px;margin:auto auto 16px;border-radius:20px;
display:flex;align-items:center;justify-content:center;background:var(--p);
color:white;font-size:30px}
.center{text-align:center}
.form{margin-top:20px}
.field{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--line);
border-radius:10px;padding:11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.btn{border:0;border-radius:10px;background:var(--p);color:white;
padding:10px 14px;font-weight:700}
.btn:hover{background:#14532d}
.btn.full{width:100%}
.btn.gray{background:#e2e8f0;color:#172033}
.btn.red{background:var(--red)}
.btn.blue{background:var(--blue)}
.btn.orange{background:var(--orange)}
.btn.sm{padding:7px 10px;font-size:12px}
.link{border:0;background:none;color:var(--p);font-weight:700}
.layout{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;
background:#14532d;color:white;padding:18px 14px;z-index:50}
.brand{display:flex;gap:10px;align-items:center;padding:8px 5px 22px}
.brand-icon{width:42px;height:42px;border-radius:12px;background:#22c55e;
display:flex;align-items:center;justify-content:center}
.brand small{display:block;color:#bbf7d0;margin-top:2px}
.nav{display:grid;gap:5px}
.nav button{width:100%;border:0;background:transparent;color:#dcfce7;
text-align:left;padding:11px;border-radius:9px}
.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}
.main{margin-left:250px}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;padding:0 24px;
position:sticky;top:0;z-index:30}
.page{max-width:1450px;margin:auto;padding:24px}
.mobile{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:var(--card);border:1px solid var(--line);
border-radius:15px;padding:18px}
.stat{font-size:28px;font-weight:800;margin-top:5px}
.muted{color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;
gap:10px;flex-wrap:wrap;margin-bottom:15px}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.table-box{overflow:auto;background:#fff;border:1px solid var(--line);
border-radius:15px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:12px;border-bottom:1px solid var(--line);
font-size:14px;text-align:left}
th{background:#f8fafc}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;
font-size:11px;font-weight:800}
.green{background:#dcfce7;color:#166534}
.yellow{background:#fef3c7;color:#92400e}
.redbg{background:#fee2e2;color:#991b1b}
.modal{position:fixed;inset:0;background:#0008;z-index:100;
display:flex;align-items:center;justify-content:center;padding:15px}
.modal-box{width:100%;max-width:700px;max-height:90vh;overflow:auto;
background:white;border-radius:18px;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.close{border:0;width:34px;height:34px;border-radius:50%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pdf{width:100%;height:65vh;border:1px solid var(--line);border-radius:10px}
.notice{background:#f0fdf4;border-left:4px solid var(--p);
padding:13px;margin-bottom:10px;border-radius:8px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;
background:#172033;color:#fff;padding:12px 16px;border-radius:10px}
@media(max-width:900px){
 .sidebar{transform:translateX(-100%);transition:.2s}
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0}
 .mobile{display:inline-block}
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
 .page{padding:15px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="login" class="login">
 <div class="login-card">
  <div class="logo">📖</div>
  <h2 class="center">TPQ Wardatul Wathon</h2>
  <p class="center muted">Tukum Kidul • Lumajang</p>

  <form id="loginForm" class="form">
   <div class="field">
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" required>
   </div>
   <div class="field">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
   </div>
   <button class="btn full">Masuk</button>
  </form>

  <div class="center" style="margin-top:15px">
   <button id="setupBtn" class="link">Setup Admin Pertama</button>
  </div>

  <p id="loginError" class="center" style="color:#dc2626"></p>
 </div>
</div>

<div id="app" class="hidden">
 <aside id="sidebar" class="sidebar">
  <div class="brand">
   <div class="brand-icon">📖</div>
   <div>
    <b>TPQ Wardatul Wathon</b>
    <small id="roleText"></small>
   </div>
  </div>
  <nav id="nav" class="nav"></nav>
 </aside>

 <main class="main">
  <header class="top">
   <div>
    <button class="btn gray mobile" onclick="toggleMenu()">☰</button>
    <b id="title">Dashboard</b>
   </div>
   <div>
    <span id="displayName"></span>
    <button class="btn red sm" onclick="logout()">Keluar</button>
   </div>
  </header>
  <section id="page" class="page"></section>
 </main>
</div>

<div id="modal" class="modal hidden">
 <div class="modal-box">
  <div class="modal-head">
   <h3 id="modalTitle"></h3>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,
 createUserWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
 getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,
 updateDoc,deleteDoc,query,where,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBUM53K-Av3DkwkW6NNQg0wKQ-ehtVZ428",
 authDomain:"tpqwardah.firebaseapp.com",
 projectId:"tpqwardah",
 storageBucket:"tpqwardah.firebasestorage.app",
 messagingSenderId:"308318249706",
 appId:"1:308318249706:web:ad1f631acee81a2fe6ad93",
 measurementId:"G-ZVC3M0L8XJ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let user=null;
let profile=null;
let pageName="dashboard";

const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[c]));
}

function money(n){
 return new Intl.NumberFormat("id-ID",{
  style:"currency",currency:"IDR",maximumFractionDigits:0
 }).format(Number(n||0));
}

function notify(text){
 $("toast").textContent=text;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),2500);
}

function openModal(title,html){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=html;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

window.closeModal=closeModal;

function errorText(e){
 const m={
  "auth/invalid-credential":"Email atau password salah.",
  "auth/email-already-in-use":"Email sudah digunakan.",
  "auth/invalid-email":"Email tidak valid.",
  "auth/weak-password":"Password minimal 6 karakter.",
  "auth/operation-not-allowed":"Login Email/Password belum diaktifkan di Firebase.",
  "auth/network-request-failed":"Koneksi internet bermasalah."
 };
 return m[e.code]||e.message||"Terjadi kesalahan.";
}

/* =========================
   SETUP ADMIN
========================= */

$("setupBtn").addEventListener("click",()=>{
 openModal("Setup Admin Pertama",`
  <form id="setupForm">
   <div class="field">
    <label>Nama Admin</label>
    <input id="adminName" value="Administrator" required>
   </div>
   <div class="field">
    <label>Email Admin</label>
    <input id="adminEmail" type="email" required>
   </div>
   <div class="field">
    <label>Password</label>
    <input id="adminPassword" type="password" minlength="6" required>
   </div>
   <button class="btn full">Buat Akun Admin</button>
  </form>
 `);

 $("setupForm").addEventListener("submit",async e=>{
  e.preventDefault();

  try{
   const name=$("adminName").value.trim();
   const email=$("adminEmail").value.trim();
   const password=$("adminPassword").value;

   const cred=await createUserWithEmailAndPassword(
    auth,email,password
   );

   await setDoc(doc(db,"users",cred.user.uid),{
    uid:cred.user.uid,nama:name,email,role:"admin",
    createdAt:serverTimestamp()
   });

   await setDoc(doc(db,"admin",cred.user.uid),{
    uid:cred.user.uid,nama:name,email,role:"admin",
    createdAt:serverTimestamp()
   });

   closeModal();
   notify("Akun admin berhasil dibuat.");

  }catch(e){
   alert(errorText(e));
  }
 });
});

/* =========================
   LOGIN
========================= */

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 $("loginError").textContent="";

 try{
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
 }catch(e){
  $("loginError").textContent=errorText(e);
 }
});

window.logout=()=>signOut(auth);
window.toggleMenu=()=>$("sidebar").classList.toggle("open");

/* =========================
   AUTH
========================= */

onAuthStateChanged(auth,async u=>{
 if(!u){
  user=null;profile=null;
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }

 try{
  const snap=await getDoc(doc(db,"users",u.uid));

  if(!snap.exists()){
   alert("Akun belum memiliki profil aplikasi.");
   await signOut(auth);
   return;
  }

  user=u;
  profile=snap.data();

  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("displayName").textContent=profile.nama||u.email;
  $("roleText").textContent="Portal "+profile.role;

  makeNav();
  navigate("dashboard");

 }catch(e){
  alert(errorText(e));
 }
});

/* =========================
   NAV
========================= */

function makeNav(){
 let a=[["dashboard","🏠","Dashboard"]];

 if(profile.role==="admin"){
  a.push(
   ["santri","👨‍🎓","Data Santri"],
   ["ustadzah","👩‍🏫","Data Ustadzah"],
   ["wali","👨‍👩‍👧","Data Wali"],
   ["kelas","📚","Jilid / Kelas"],
   ["pengumuman","📢","Pengumuman"],
   ["keuangan","💰","Keuangan"],
   ["settings","⚙️","Pengaturan"]
  );
 }

 if(profile.role==="ustadzah"){
  a.push(
   ["kelasSantri","👨‍🎓","Santri Kelas"],
   ["pengumuman","📢","Pengumuman"]
  );
 }

 if(profile.role==="wali"){
  a.push(
   ["belajar","📖","Baca & Hafalan"],
   ["keuanganWali","💰","Keuangan"],
   ["pengumuman","📢","Pengumuman"]
  );
 }

 $("nav").innerHTML=a.map(x=>`
  <button data-page="${x[0]}" onclick="navigate('${x[0]}')">
   ${x[1]} ${x[2]}
  </button>
 `).join("");
}

const titles={
 dashboard:"Dashboard",santri:"Data Santri",
 ustadzah:"Data Ustadzah",wali:"Data Wali",
 kelas:"Jilid / Kelas",pengumuman:"Pengumuman",
 keuangan:"Keuangan",settings:"Pengaturan",
 kelasSantri:"Santri Kelas",belajar:"Baca & Hafalan",
 keuanganWali:"Riwayat Keuangan"
};

window.navigate=async p=>{
 pageName=p;
 $("title").textContent=titles[p]||"Dashboard";

 document.querySelectorAll("#nav button").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===p)
 });

 $("sidebar").classList.remove("open");

 const fn={
  dashboard:dashboard,
  santri:adminSantri,
  ustadzah:adminUstadzah,
  wali:adminWali,
  kelas:adminKelas,
  pengumuman:showPengumuman,
  keuangan:adminKeuangan,
  settings:settings,
  kelasSantri:ustadzahSantri,
  belajar:waliBelajar,
  keuanganWali:waliKeuangan
 }[p];

 try{
  await (fn||dashboard)();
 }catch(e){
  $("page").innerHTML=
   `<div class="card"><b>Gagal memuat data</b><p>${esc(e.message)}</p></div>`;
 }
};

/* =========================
   DASHBOARD
========================= */

async function size(c){
 return (await getDocs(collection(db,c))).size;
}

async function dashboard(){

 if(profile.role==="admin"){
  const [a,b,c,d]=await Promise.all([
   size("santri"),size("ustadzah"),size("wali"),size("jilid")
  ]);

  $("page").innerHTML=`
   <h2>Dashboard Admin</h2>
   <p class="muted">Selamat datang, ${esc(profile.nama)}.</p>
   <div class="grid">
    ${stat("👨‍🎓","Santri",a)}
    ${stat("👩‍🏫","Ustadzah",b)}
    ${stat("👨‍👩‍👧","Wali",c)}
    ${stat("📚","Kelas / Jilid",d)}
   </div>
  `;
  return;
 }

 if(profile.role==="ustadzah"){
  const q=query(collection(db,"santri"),
   where("ustadzahId","==",user.uid));
  const s=await getDocs(q);

  $("page").innerHTML=`
   <h2>Dashboard Ustadzah</h2>
   <div class="grid">
    ${stat("👨‍🎓","Santri Binaan",s.size)}
    ${stat("📖","Modul","Baca")}
    ${stat("🧠","Modul","Hafalan")}
    ${stat("💰","Modul","Keuangan")}
   </div>
  `;
  return;
 }

 const q=query(collection(db,"santri"),
  where("waliId","==",user.uid));
 const s=await getDocs(q);

 $("page").innerHTML=`
  <h2>Dashboard Wali</h2>
  <div class="grid">
   ${stat("👨‍🎓","Santri",s.size)}
   ${stat("📖","Pembelajaran","Baca & Hafalan")}
   ${stat("💰","Keuangan","Tagihan")}
   ${stat("📢","Informasi","Pengumuman")}
  </div>
 `;
}

function stat(icon,label,value){
 return `
 <div class="card">
  <div style="font-size:25px">${icon}</div>
  <div class="muted">${label}</div>
  <div class="stat">${esc(value)}</div>
 </div>`;
}

/* =========================
   ADMIN SANTRI
========================= */

async function adminSantri(){
 const s=await getDocs(collection(db,"santri"));

 $("page").innerHTML=`
 <div class="toolbar">
  <div><h2>Data Santri</h2><span class="muted">${s.size} data</span></div>
  <button class="btn" onclick="editSantri()">+ Tambah</button>
 </div>
 <div class="table-box">
 <table>
 <thead><tr>
  <th>No</th><th>Nama</th><th>Kelas</th>
  <th>Ustadzah</th><th>Wali</th><th>Aksi</th>
 </tr></thead>
 <tbody>
 ${s.empty?
  `<tr><td colspan="6" class="empty">Belum ada data.</td></tr>`:
  s.docs.map((d,i)=>{
   const x=d.data();
   return `<tr>
    <td>${i+1}</td><td><b>${esc(x.nama)}</b></td>
    <td>${esc(x.kelasNama||"-")}</td>
    <td>${esc(x.ustadzahNama||"-")}</td>
    <td>${esc(x.waliNama||"-")}</td>
    <td class="actions">
     <button class="btn sm" onclick="editSantri('${d.id}')">Edit</button>
     <button class="btn red sm" onclick="removeDoc('santri','${d.id}')">Hapus</button>
    </td>
   </tr>`;
  }).join("")
 }
 </tbody>
 </table></div>`;
}

window.editSantri=async id=>{
 let x={};
 if(id)x=(await getDoc(doc(db,"santri",id))).data()||{};

 const [k,u,w]=await Promise.all([
  getDocs(collection(db,"jilid")),
  getDocs(collection(db,"ustadzah")),
  getDocs(collection(db,"wali"))
 ]);

 openModal(id?"Edit Santri":"Tambah Santri",`
 <form id="santriForm">
  <div class="field">
   <label>Nama Santri</label>
   <input id="sn" value="${esc(x.nama)}" required>
  </div>

  <div class="row">
   <div class="field">
    <label>Kelas / Jilid</label>
    <select id="sk" required>
     <option value="">Pilih</option>
     ${k.docs.map(d=>{
      const z=d.data();
      return `<option value="${d.id}"
       ${x.kelasId===d.id?"selected":""}>
       ${esc(z.nama)}</option>`;
     }).join("")}
    </select>
   </div>

   <div class="field">
    <label>Ustadzah</label>
    <select id="su">
     <option value="">Pilih</option>
     ${u.docs.map(d=>{
      const z=d.data();
      return `<option value="${d.id}"
       ${x.ustadzahId===d.id?"selected":""}>
       ${esc(z.nama)}</option>`;
     }).join("")}
    </select>
   </div>
  </div>

  <div class="field">
   <label>Wali</label>
   <select id="sw">
    <option value="">Pilih</option>
    ${w.docs.map(d=>{
     const z=d.data();
     return `<option value="${d.id}"
      ${x.waliId===d.id?"selected":""}>
      ${esc(z.nama)}</option>`;
    }).join("")}
   </select>
  </div>

  <button class="btn full">Simpan</button>
 </form>
 `);

 $("santriForm").onsubmit=async e=>{
  e.preventDefault();

  const kEl=$("sk"),uEl=$("su"),wEl=$("sw");
  const data={
   nama:$("sn").value.trim(),
   kelasId:kEl.value,
   kelasNama:kEl.selectedOptions[0]?.textContent.trim()||"",
   ustadzahId:uEl.value,
   ustadzahNama:uEl.selectedOptions[0]?.textContent.trim()||"",
   waliId:wEl.value,
   waliNama:wEl.selectedOptions[0]?.textContent.trim()||"",
   updatedAt:serverTimestamp()
  };

  if(id)await updateDoc(doc(db,"santri",id),data);
  else await addDoc(collection(db,"santri"),{
   ...data,createdAt:serverTimestamp()
  });

  closeModal();notify("Data santri tersimpan");adminSantri();
 };
};

/* =========================
   ADMIN USTADZAH
========================= */

async function adminUstadzah(){
 const s=await getDocs(collection(db,"ustadzah"));

 $("page").innerHTML=`
 <div class="toolbar">
  <h2>Data Ustadzah</h2>
  <button class="btn" onclick="editUstadzah()">+ Tambah</button>
 </div>
 <div class="table-box"><table>
 <thead><tr><th>No</th><th>Nama</th><th>Email</th><th>Aksi</th></tr></thead>
 <tbody>
 ${s.empty?`<tr><td colspan="4" class="empty">Belum ada data.</td></tr>`:
 s.docs.map((d,i)=>{
  const x=d.data();
  return `<tr>
   <td>${i+1}</td><td>${esc(x.nama)}</td><td>${esc(x.email)}</td>
   <td><button class="btn sm" onclick="editUstadzah('${d.id}')">Edit</button>
   <button class="btn red sm" onclick="removeDoc('ustadzah','${d.id}')">Hapus</button></td>
  </tr>`;
 }).join("")}
 </tbody></table></div>`;
}

window.editUstadzah=async id=>{
 let x={};
 if(id)x=(await getDoc(doc(db,"ustadzah",id))).data()||{};

 openModal(id?"Edit Ustadzah":"Tambah Ustadzah",`
 <form id="uf">
  <div class="field"><label>Nama</label>
   <input id="un" value="${esc(x.nama)}" required></div>
  <div class="field"><label>Email</label>
   <input id="ue" type="email" value="${esc(x.email)}" required></div>
  <button class="btn full">Simpan</button>
 </form>`);

 $("uf").onsubmit=async e=>{
  e.preventDefault();

  const data={
   nama:$("un").value.trim(),
   email:$("ue").value.trim(),
   role:"ustadzah",
   updatedAt:serverTimestamp()
  };

  if(id)await updateDoc(doc(db,"ustadzah",id),data);
  else await addDoc(collection(db,"ustadzah"),{
   ...data,createdAt:serverTimestamp()
  });

  closeModal();notify("Data ustadzah tersimpan");adminUstadzah();
 };
};

/* =========================
   ADMIN WALI
========================= */

async function adminWali(){
 const s=await getDocs(collection(db,"wali"));

 $("page").innerHTML=`
 <div class="toolbar">
  <h2>Data Wali</h2>

window.openStudy=async(santriId,jenis)=>{
 const sd=await getDoc(doc(db,"santri",santriId));
 if(!sd.exists())return;

 const s=sd.data();
 const kd=await getDoc(doc(db,"jilid",s.kelasId));
 const k=kd.data()||{};

 const q=query(collection(db,"riwayat"),
  where("santriId","==",santriId),
  where("jenis","==",jenis));

 const h=await getDocs(q);
 const docs=h.docs.sort((a,b)=>
  (b.data().createdAt?.seconds||0)-
  (a.data().createdAt?.seconds||0));

 const last=docs[0]?.data()||{};
 const page=last.halamanTerakhir||1;
 const url=jenis==="baca"?k.bukuBacaUrl:k.bukuHafalanUrl;

 openModal(
  `${jenis==="baca"?"📖 Buku Dibaca":"🧠 Buku Hafalan"} — ${s.nama}`,
 `
 ${url?
 `<iframe class="pdf" src="${esc(url)}#page=${page}"></iframe>`:
 `<div class="card empty">PDF belum diatur admin.</div>`}

 <div class="card" style="margin-top:12px">
  <div class="row">
   <div class="field">
    <label>Halaman terakhir</label>
    <input id="lastPage" type="number" min="1" value="${page}">
   </div>
   <div class="field">
    <label>Status</label>
    <select id="status">
     <option value="naik">Naik</option>
     <option value="mengulang">Mengulang</option>
    </select>
   </div>
  </div>

  <div class="field">
   <label>Pesan Ustadzah</label>
   <textarea id="message" rows="3"></textarea>
  </div>

  <button class="btn" onclick="saveProgress('${santriId}','${jenis}')">
   Simpan Progress
  </button>
 </div>
 `);
};

window.saveProgress=async(santriId,jenis)=>{
 await addDoc(collection(db,"riwayat"),{
  santriId,
  jenis,
  halamanTerakhir:Number($("lastPage").value||1),
  status:$("status").value,
  pesan:$("message").value.trim(),
  ustadzahId:user.uid,
  createdAt:serverTimestamp()
 });

 notify("Progress tersimpan.");
};
