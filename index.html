<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#166534">
<meta name="description" content="Sistem Informasi TPQ Wardatul Wathon Tukum Kidul Lumajang">
<link rel="manifest" href="./manifest.json">
<title>TPQ Wardatul Wathon</title>
<style>
:root{
  --primary:#166534; --primary-dark:#14532d; --primary-light:#22c55e;
  --bg:#f4f7f5; --card:#ffffff; --text:#172033; --muted:#64748b; --border:#e2e8f0;
  --danger:#dc2626; --warning:#d97706; --info:#2563eb; --success:#16a34a; --sidebar:250px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top left,#22c55e 0,#166534 35%,#052e16 100%)}
.login-card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.login-logo{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
.login-title,.login-subtitle{text-align:center;margin:0}
.login-subtitle{color:var(--muted);margin-top:7px}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,.1)}
input:disabled{background:#f1f5f9;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:700;transition:.15s}
.btn:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-full{width:100%}
.btn-danger{background:var(--danger)}
.btn-warning{background:var(--warning)}
.btn-info{background:var(--info)}
.btn-success{background:var(--success)}
.btn-light{background:#e2e8f0;color:var(--text)}
.btn-sm{padding:7px 10px;font-size:12px}
.setup-link{border:0;background:none;color:var(--primary);font-weight:700;margin-top:15px}
.login-error{min-height:20px;color:var(--danger);text-align:center;font-size:13px;margin-top:12px}
.app{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--primary-dark);color:#fff;z-index:100;padding:16px 13px;overflow-y:auto;transition:.2s}
.brand{display:flex;align-items:center;gap:10px;padding:7px 6px 20px}
.brand-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand-name{font-size:13px;font-weight:800}
.brand-role{display:block;margin-top:3px;color:#bbf7d0;font-size:11px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:#dcfce7;width:100%;text-align:left;border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:8px}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.13);color:#fff}
.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.top-left{display:flex;align-items:center;gap:10px}
.page-title{font-weight:800}
.user-area{display:flex;align-items:center;gap:10px;font-size:13px}
.page{padding:24px;max-width:1500px;margin:auto}
.mobile-menu{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:18px}
.stat-card{position:relative;overflow:hidden}
.stat-icon{font-size:25px}
.stat-label{color:var(--muted);font-size:13px;margin-top:8px}
.stat-value{font-size:28px;font-weight:800;margin-top:3px}
.section-title{margin:0 0 4px}
.muted{color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.search-box{max-width:260px}
.table-container{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;text-align:left}
th{background:#f8fafc;font-size:12px;color:#475569}
tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:35px;color:var(--muted)}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#e2e8f0;color:#334155}
.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:15px}
.modal-box{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.modal-header h3{margin:0}
.modal-close{width:34px;height:34px;border:0;border-radius:50%;background:#e2e8f0;font-size:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{border-left:4px solid var(--primary);background:#f0fdf4;padding:14px;border-radius:8px;margin-bottom:10px}
.notice-warn{border-left-color:var(--warning);background:#fffbeb}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:320px}
.toast.error{background:var(--danger)}
.spinner{width:22px;height:22px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:8px;color:var(--muted);padding:30px;justify-content:center}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.summary-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%)} .sidebar.open{transform:translateX(0)}
  .main{margin-left:0} .mobile-menu{display:inline-flex} .topbar{padding:0 15px} .user-name{display:none}
}
@media(max-width:600px){
  .page{padding:15px} .grid{grid-template-columns:1fr} .row{grid-template-columns:1fr}
  .login-card{padding:24px} .summary-strip{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="login-logo">📖</div>
    <h1 class="login-title">TPQ Wardatul Wathon</h1>
    <div class="login-subtitle">Tukum Kidul • Lumajang</div>
    <form id="loginForm" style="margin-top:25px">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" placeholder="email@contoh.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-full" id="loginSubmitBtn">Masuk</button>
    </form>
    <div class="login-error" id="loginError"></div>
    <div style="text-align:center">
      <button type="button" class="setup-link" id="setupAdminButton">Setup Admin Pertama</button>
    </div>
  </div>
</section>

<section id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-icon">📖</div>
      <div>
        <div class="brand-name">TPQ Wardatul Wathon</div>
        <span id="brandRole" class="brand-role">Portal</span>
      </div>
    </div>
    <nav id="navigation" class="nav"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button type="button" class="btn btn-light mobile-menu" id="mobileMenuButton">☰</button>
        <span id="pageTitle" class="page-title">Dashboard</span>
      </div>
      <div class="user-area">
        <span id="userName" class="user-name">-</span>
        <button type="button" class="btn btn-danger btn-sm" id="logoutButton">Keluar</button>
      </div>
    </header>
    <section id="page" class="page"></section>
  </main>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button type="button" class="modal-close" id="modalClose">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc,
  addDoc, collection, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";

/* =========================================================
   FIREBASE CONFIG & INIT
   NOTE: a client-side apiKey is not a secret in Firebase's
   model -- real security comes from the Firestore/Storage
   security rules shipped alongside this file (see
   firestore.rules and storage.rules). Deploy those before
   putting this app in front of real users.
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBUM53K-Av3DkwkW6NNQg0wKQ-ehtVZ428",
  authDomain: "tpqwardah.firebaseapp.com",
  projectId: "tpqwardah",
  storageBucket: "tpqwardah.firebasestorage.app",
  messagingSenderId: "308318249706",
  appId: "1:308318249706:web:ad1f631acee81a2fe6ad93",
  measurementId: "G-ZVC3M0L8XJ"
};

const primaryApp = initializeApp(firebaseConfig);
// Secondary app instance: lets an admin create Wali/Ustadzah/Admin
// accounts without Firebase silently switching the active session
// over to the newly created user (a well-known footgun of
// createUserWithEmailAndPassword on the primary auth instance).
const secondaryApp = initializeApp(firebaseConfig, "Secondary");

const auth = getAuth(primaryApp);
const secondaryAuth = getAuth(secondaryApp);
const db = getFirestore(primaryApp);
const storage = getStorage(primaryApp);

/* =========================================================
   GLOBAL STATE
========================================================= */
let currentUser = null;
let currentProfile = null;
let currentPage = "dashboard";
let activeRecorder = null;
let activeAudioChunks = [];

/* =========================================================
   DOM / FORMAT HELPERS
========================================================= */
const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
// Safe to interpolate inside a single-quoted JS string literal
// that itself sits inside a double-quoted HTML attribute.
function escapeAttr(value){
  return String(value ?? "")
    .replace(/\\/g,"\\\\").replace(/'/g,"\\'")
    .replace(/"/g,"&quot;").replace(/[\r\n]/g," ");
}
function formatRupiah(value){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(value||0));
}
function formatTanggal(timestamp){
  if(!timestamp) return "-";
  try{
    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    return new Intl.DateTimeFormat("id-ID",{day:"2-digit",month:"long",year:"numeric"}).format(date);
  }catch{ return "-"; }
}
function showToast(message, isError=false){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.remove("hidden");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.add("hidden"), 3200);
}
function openModal(title, content){
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = content;
  $("modal").classList.remove("hidden");
}
function closeModal(){ $("modal").classList.add("hidden"); }
function pageLoading(){
  $("page").innerHTML = `<div class="loading-row"><span class="spinner"></span> Memuat data...</div>`;
}
function withButtonLoading(button, busyText, fn){
  return async (...args)=>{
    const original = button.textContent;
    button.disabled = true;
    button.textContent = busyText;
    try{ await fn(...args); }
    finally{ button.disabled = false; button.textContent = original; }
  };
}
function statCard(icon,label,value){
  return `
    <div class="card stat-card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-label">${escapeHTML(label)}</div>
      <div class="stat-value">${escapeHTML(value)}</div>
    </div>`;
}
function attachTableSearch(inputId, tableId){
  const input = $(inputId);
  const table = $(tableId);
  if(!input || !table) return;
  input.addEventListener("input", ()=>{
    const term = input.value.trim().toLowerCase();
    table.querySelectorAll("tbody tr[data-row]").forEach(row=>{
      row.style.display = row.textContent.toLowerCase().includes(term) ? "" : "none";
    });
  });
}
function firebaseError(error){
  const messages = {
    "auth/invalid-credential": "Email atau password salah.",
    "auth/invalid-email": "Format email tidak valid.",
    "auth/email-already-in-use": "Email tersebut sudah digunakan.",
    "auth/weak-password": "Password minimal 6 karakter.",
    "auth/operation-not-allowed": "Login Email/Password belum diaktifkan di Firebase.",
    "auth/network-request-failed": "Koneksi internet bermasalah.",
    "auth/too-many-requests": "Terlalu banyak percobaan. Coba lagi nanti."
  };
  return messages[error.code] || error.message || "Terjadi kesalahan.";
}

/* =========================================================
   GENERIC FIRESTORE HELPERS
========================================================= */
async function getCollectionData(collectionName){
  const snapshot = await getDocs(collection(db, collectionName));
  return snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
}
async function addCollectionData(collectionName, data){
  return await addDoc(collection(db, collectionName), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
}
async function updateCollectionData(collectionName, id, data){
  await updateDoc(doc(db, collectionName, id), { ...data, updatedAt: serverTimestamp() });
}
async function deleteCollectionData(collectionName, id){
  await deleteDoc(doc(db, collectionName, id));
}
async function uploadFile(path, file){
  const fileRef = ref(storage, path);
  await uploadBytes(fileRef, file, { contentType: file.type });
  return await getDownloadURL(fileRef);
}

/* =========================================================
   ACCOUNT PROVISIONING (Wali / Ustadzah / Admin)
========================================================= */
async function createManagedAccount({ email, password, role, profile }){
  const credential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
  const uid = credential.user.uid;
  const base = { uid, email, role, aktif: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp(), ...profile };
  await setDoc(doc(db, "users", uid), base);
  await setDoc(doc(db, role, uid), base); // role-specific collection, same doc id = uid
  await signOut(secondaryAuth); // never leave the secondary session signed in
  return uid;
}
async function updateManagedAccount(uid, role, data){
  await updateCollectionData("users", uid, data);
  await updateCollectionData(role, uid, data);
}
async function deleteManagedAccountRecord(uid, role){
  // Client SDKs cannot delete Firebase Auth accounts belonging to
  // other users -- that requires the Admin SDK / a Cloud Function.
  // We remove the Firestore profile (revoking app access) and make
  // that limitation explicit to the admin in the UI.
  await deleteCollectionData("users", uid).catch(()=>{});
  await deleteCollectionData(role, uid).catch(()=>{});
}

function requireRole(role){
  if(!currentProfile || currentProfile.role !== role){
    alert("Akses ditolak untuk peran ini.");
    return false;
  }
  return true;
}

/* =========================================================
   AUTH: SETUP FIRST ADMIN
========================================================= */
$("setupAdminButton").addEventListener("click", openAdminSetup);

function openAdminSetup(){
  openModal("Setup Admin Pertama", `
    <form id="adminSetupForm">
      <div class="form-group"><label>Nama Admin</label><input id="adminName" value="Administrator" required></div>
      <div class="form-group"><label>Email Admin</label><input id="adminEmail" type="email" placeholder="admin@tpqwardah.com" required></div>
      <div class="form-group"><label>Password</label><input id="adminPassword" type="password" minlength="6" placeholder="Minimal 6 karakter" required></div>
      <div class="notice notice-warn">Gunakan tombol ini hanya sekali untuk membuat akun admin pertama. Setelah itu, buat akun tambahan lewat menu "Data Wali" / "Data Ustadzah" di dalam aplikasi.</div>
      <button type="submit" class="btn btn-full" id="adminSetupBtn">Buat Akun Admin</button>
    </form>
  `);
  $("adminSetupForm").addEventListener("submit", async event=>{
    event.preventDefault();
    const btn = $("adminSetupBtn");
    const nama = $("adminName").value.trim();
    const email = $("adminEmail").value.trim();
    const password = $("adminPassword").value;
    await withButtonLoading(btn, "Membuat akun...", async ()=>{
      try{
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = credential.user.uid;
        const profile = { uid, nama, email, role: "admin", aktif: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
        await setDoc(doc(db, "users", uid), profile);
        await setDoc(doc(db, "admin", uid), profile);
        closeModal();
        showToast("Akun admin berhasil dibuat.");
      }catch(error){
        alert(firebaseError(error));
      }
    })();
  });
}

/* =========================================================
   AUTH: LOGIN / LOGOUT
========================================================= */
$("loginForm").addEventListener("submit", async event=>{
  event.preventDefault();
  $("loginError").textContent = "";
  const btn = $("loginSubmitBtn");
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  btn.disabled = true; btn.textContent = "Memproses...";
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(error){
    $("loginError").textContent = firebaseError(error);
  }finally{
    btn.disabled = false; btn.textContent = "Masuk";
  }
});

$("logoutButton").addEventListener("click", async ()=>{ await signOut(auth); });

$("mobileMenuButton").addEventListener("click", ()=>{ $("sidebar").classList.toggle("open"); });
$("modalClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", event=>{ if(event.target === $("modal")) closeModal(); });

onAuthStateChanged(auth, async user=>{
  if(!user){
    currentUser = null; currentProfile = null;
    $("loginScreen").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }
  try{
    const snap = await getDoc(doc(db, "users", user.uid));
    if(!snap.exists()){
      alert("Akun berhasil login tetapi profil aplikasi belum dibuat. Hubungi admin.");
      await signOut(auth);
      return;
    }
    const profile = snap.data();
    if(!["admin","ustadzah","wali"].includes(profile.role)){
      alert("Role akun tidak valid.");
      await signOut(auth);
      return;
    }
    if(profile.aktif === false){
      alert("Akun ini sedang dinonaktifkan. Hubungi admin.");
      await signOut(auth);
      return;
    }
    currentUser = user;
    currentProfile = profile;
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userName").textContent = profile.nama || user.email;
    $("brandRole").textContent = "Portal " + roleLabel(profile.role);
    buildNavigation();
    navigate("dashboard");
  }catch(error){
    console.error(error);
    alert("Gagal membaca profil pengguna: " + error.message);
    await signOut(auth);
  }
});

function roleLabel(role){
  return { admin:"Admin", ustadzah:"Ustadzah", wali:"Wali Santri" }[role] || role;
}

/* =========================================================
   NAVIGATION
========================================================= */
const MENUS = {
  admin: [
    { page:"dashboard", icon:"🏠", label:"Dashboard" },
    { page:"santri", icon:"👨‍🎓", label:"Data Santri" },
    { page:"wali", icon:"👨‍👩‍👧", label:"Data Wali" },
    { page:"ustadzah", icon:"👩‍🏫", label:"Data Ustadzah" },
    { page:"jilid", icon:"📚", label:"Jilid / Kelas" },
    { page:"pengumuman", icon:"📢", label:"Pengumuman" },
    { page:"tagihan", icon:"🧾", label:"Master Tagihan" },
    { page:"keuangan", icon:"💰", label:"Keuangan" },
    { page:"settings", icon:"⚙️", label:"Pengaturan" },
    { page:"profil", icon:"👤", label:"Profil" }
  ],
  ustadzah: [
    { page:"dashboard", icon:"🏠", label:"Dashboard" },
    { page:"daftarSantri", icon:"👨‍🎓", label:"Santri Kelas" },
    { page:"pengumuman", icon:"📢", label:"Pengumuman" },
    { page:"profil", icon:"👤", label:"Profil" }
  ],
  wali: [
    { page:"dashboard", icon:"🏠", label:"Dashboard" },
    { page:"pengumuman", icon:"📢", label:"Pengumuman" },
    { page:"profil", icon:"👤", label:"Profil" }
  ]
};

const PAGE_TITLES = {
  dashboard:"Dashboard", santri:"Data Santri", wali:"Data Wali", ustadzah:"Data Ustadzah",
  jilid:"Jilid / Kelas", pengumuman:"Pengumuman", tagihan:"Master Tagihan", keuangan:"Keuangan",
  settings:"Pengaturan", profil:"Profil", daftarSantri:"Santri Kelas", pembelajaran:"Pembelajaran"
};

const HANDLERS = {
  dashboard: renderDashboard,
  santri: renderSantriAdmin,
  wali: renderWaliAdmin,
  ustadzah: renderUstadzahAdmin,
  jilid: renderJilidAdmin,
  pengumuman: renderPengumuman,
  tagihan: renderTagihanAdmin,
  keuangan: renderKeuanganAdmin,
  settings: renderSettingsAdmin,
  profil: renderProfil,

function buildNavigation(){
  const items = MENUS[currentProfile.role] || [];
  $("navigation").innerHTML = items.map(item=>`
    <button type="button" data-page="${item.page}">${item.icon} ${escapeHTML(item.label)}</button>
  `).join("");
  $("navigation").querySelectorAll("button").forEach(button=>{
    button.addEventListener("click", ()=>navigate(button.dataset.page));
  });
}

async function navigate(page){
  currentPage = page;
  $("pageTitle").textContent = PAGE_TITLES[page] || "Dashboard";
  $("navigation").querySelectorAll("button").forEach(button=>{
    button.classList.toggle("active", button.dataset.page === page);
  });
  $("sidebar").classList.remove("open");
  const handler = HANDLERS[page] || renderDashboard;
  pageLoading();
  try{
    await handler();
  }catch(error){
    console.error(error);
    $("page").innerHTML = `<div class="card empty">Gagal memuat halaman: ${escapeHTML(error.message)}</div>`;
  }
}
window.navigate = navigate;

function openJilidForm(item=null){
  openModal(item ? "Edit Jilid / Kelas" : "Tambah Jilid / Kelas", `

      <div class="form-group"><label>Nama Jilid / Kelas</label><input id="jilidNama" value="${escapeHTML(item?.nama || "")}" placeholder="Contoh: Jilid 1" required></div>

      <div class="form-group">

        <input id="jilidPdfBaca" type="file" accept="application/pdf">
        ${item?.pdfBacaUrl ? `<div class="notice" style="margin-top:8px">PDF baca sudah tersedia. Pilih file baru untuk menggantinya.</div>` : ""}
      </div>
      <div class="form-group">
        <label>PDF Buku Hafalan</label>
        <input id="jilidPdfHafalan" type="file" accept="application/pdf">
        ${item?.pdfHafalanUrl ? `<div class="notice" style="margin-top:8px">PDF hafalan sudah tersedia. Pilih file baru untuk menggantinya.</div>` : ""}
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="jilidAktif">
          <option value="true" ${item?.aktif!==false?"selected":""}>Aktif</option>
          <option value="false" ${item?.aktif===false?"selected":""}>Nonaktif</option>
        </select>
      </div>
      <button type="submit" class="btn btn-full" id="jilidSaveBtn">Simpan</button>
    </form>`);

  $("jilidForm").addEventListener("submit", async event=>{
    event.preventDefault();
    const btn = $("jilidSaveBtn");
    await withButtonLoading(btn, "Menyimpan...", async ()=>{
      try{
        const nama = $("jilidNama").value.trim();
        const keterangan = $("jilidKeterangan").value.trim();
        const aktif = $("jilidAktif").value === "true";
        const bacaFile = $("jilidPdfBaca").files[0];
        const hafalanFile = $("jilidPdfHafalan").files[0];
        validatePdf(bacaFile, "buku baca");
        validatePdf(hafalanFile, "buku hafalan");

        let targetId = item?.id;
        if(!targetId){
          const created = await addCollectionData("jilid", { nama, keterangan, aktif, pdfBacaUrl:null, pdfHafalanUrl:null });
          targetId = created.id;
        }

        const updates = { nama, keterangan, aktif };
        if(bacaFile) updates.pdfBacaUrl = await uploadFile(`buku/${targetId}/baca-${Date.now()}.pdf`, bacaFile);
        if(hafalanFile) updates.pdfHafalanUrl = await uploadFile(`buku/${targetId}/hafalan-${Date.now()}.pdf`, hafalanFile);
        await updateCollectionData("jilid", targetId, updates);

        closeModal();
        showToast("Jilid / kelas berhasil disimpan.");
        renderJilidAdmin();
      }catch(error){ alert("Gagal menyimpan: " + error.message); }
    })();
  });
}

function validatePdf(file, label){
  if(!file) return;
  if(file.type !== "application/pdf") throw new Error(`File ${label} harus berformat PDF.`);
  if(file.size > 50 * 1024 * 1024) throw new Error(`Ukuran PDF ${label} maksimal 50 MB.`);
}

async function renderKeuanganAdmin(){
  if(!requireRole("admin")) return;
  const [keuangan, santriList, tagihanList] = await Promise.all([
    getCollectionData("keuangan"), getCollectionData("santri"), getCollectionData("tagihan")
  ]);

  const santriMap = Object.fromEntries(santriList.map(s=>[s.id, s]));
  const rows = keuangan
    .map(k=>({ ...k, santriNama: santriMap[k.santriId]?.nama || "(santri dihapus)" }))
    .sort((a,b)=>(b.tanggal?.seconds||0)-(a.tanggal?.seconds||0));

  const totalTagihan = rows.reduce((sum,r)=>sum+Number(r.nominalTagihan||0),0);
  const totalTerbayar = rows.reduce((sum,r)=>sum+Number(r.terbayar||0),0);
  const totalTunggakan = Math.max(0, totalTagihan - totalTerbayar);

  $("page").innerHTML = `
    <div class="toolbar">
      <div><h2 class="section-title">Keuangan</h2><p class="muted">Rekap seluruh transaksi pembayaran santri.</p></div>
      <div class="actions">
        <input id="searchKeuangan" class="search-box" placeholder="Cari nama santri...">
        <button class="btn" id="btnCatatPembayaran">+ Catat Pembayaran</button>
      </div>
    </div>
    <div class="summary-strip">
      ${statCard("🧾","Total Transaksi", rows.length)}
      ${statCard("💵","Total Tertagih", formatRupiah(totalTagihan))}
      ${statCard("✅","Total Terbayar", formatRupiah(totalTerbayar))}
      ${statCard("⚠️","Total Tunggakan", formatRupiah(totalTunggakan))}
    </div>
    <div class="table-container">
      <table id="tableKeuangan">
        <thead><tr><th>No</th><th>Santri</th><th>Tagihan</th><th>Nominal</th><th>Terbayar</th><th>Metode</th><th>Status</th><th>Tanggal</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map((item,index)=>{
            const lunas = Number(item.terbayar||0) >= Number(item.nominalTagihan||0);
            return `<tr data-row>
              <td>${index+1}</td><td>${escapeHTML(item.santriNama)}</td><td>${escapeHTML(item.tagihanNama || "-")}</td>
              <td>${formatRupiah(item.nominalTagihan||0)}</td><td>${formatRupiah(item.terbayar||0)}</td>
              <td>${escapeHTML(item.metode || "-")}</td>
              <td>${lunas ? `<span class="badge badge-green">Lunas</span>` : `<span class="badge badge-yellow">Belum Lunas</span>`}</td>
              <td>${formatTanggal(item.tanggal)}</td>
            </tr>`;
          }).join("") : `<tr><td colspan="8" class="empty">Belum ada transaksi keuangan.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  attachTableSearch("searchKeuangan","tableKeuangan");
  $("btnCatatPembayaran").addEventListener("click", ()=>openCatatPembayaranModal(null, santriList, tagihanList));
}

async function openCatatPembayaranModal(preselectedSantriId, santriListArg=null, tagihanListArg=null){
  const santriList = santriListArg || await getCollectionData("santri");
  const tagihanList = (tagihanListArg || await getCollectionData("tagihan")).filter(x=>x.aktif!==false);
  const keuangan = await getCollectionData("keuangan");

  openModal("Catat Pembayaran", `
    <form id="bayarForm">
      ${!preselectedSantriId ? `
        <div class="form-group">
          <label>Santri</label>
          <select id="bayarSantri" required>
            <option value="">Pilih santri</option>
            ${santriList.map(s=>`<option value="${s.id}">${escapeHTML(s.nama)}</option>`).join("")}
          </select>
        </div>` : `<input type="hidden" id="bayarSantri" value="${preselectedSantriId}">`}
      <div class="form-group">
        <label>Tagihan</label>
        <select id="bayarTagihan" required>
          <option value="">Pilih tagihan</option>
          ${tagihanList.map(t=>`<option value="${t.id}" data-nominal="${t.nominal||0}">${escapeHTML(t.nama)} (${formatRupiah(t.nominal||0)})</option>`).join("")}
        </select>
      </div>
      <div class="form-group"><label>Jumlah Terbayar</label><input id="bayarNominal" type="number" min="0" required></div>
      <div class="form-group">
        <label>Metode Pembayaran</label>
        <select id="bayarMetode">
          <option value="Tunai">Tunai</option>
          <option value="QRIS">QRIS</option>
          <option value="Transfer">Transfer</option>
        </select>
      </div>
      <div class="form-group"><label>Keterangan</label><textarea id="bayarKeterangan" rows="3"></textarea></div>
      <button class="btn btn-full" type="submit" id="bayarSaveBtn">Simpan Pembayaran</button>
    </form>`);

  $("bayarTagihan").addEventListener("change", e=>{
    const opt = e.target.options[e.target.selectedIndex];
    if(opt?.dataset.nominal) $("bayarNominal").value = opt.dataset.nominal;
  });

  $("bayarForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const btn = $("bayarSaveBtn");
    const santriId = $("bayarSantri").value;
    const tagihanSelect = $("bayarTagihan");
    const tagihanId = tagihanSelect.value;
    const tagihan = tagihanList.find(t=>t.id===tagihanId);
    if(!santriId || !tagihan){ alert("Pilih santri dan tagihan terlebih dahulu."); return; }

    const existing = keuangan.find(x=>x.santriId===santriId && x.tagihanId===tagihanId);
    const payload = {
      santriId, tagihanId, tagihanNama: tagihan.nama,
      nominalTagihan: Number(tagihan.nominal || 0),
      terbayar: Number($("bayarNominal").value),
      metode: $("bayarMetode").value,
      keterangan: $("bayarKeterangan").value.trim(),
      dicatatOleh: currentProfile.uid,
      dicatatOlehNama: currentProfile.nama || "",
      tanggal: serverTimestamp()
    };
    await withButtonLoading(btn, "Menyimpan...", async ()=>{
      try{
        if(existing) await updateCollectionData("keuangan", existing.id, payload);
        else await addCollectionData("keuangan", payload);
        closeModal();
        showToast("Pembayaran berhasil disimpan.");
        if(currentPage === "keuangan") renderKeuanganAdmin();
        else if(preselectedSantriId) renderKeuanganSantriUstadzah(preselectedSantriId);
      }catch(error){ alert(error.message); }
    })();
  });
}

              <td>${item.aktif===false ? `<span class="badge badge-red">Nonaktif</span>` : `<span class="badge badge-green">Aktif</span>`}</td>
              <td><div class="actions" style="flex-wrap:wrap">
                <button class="btn btn-sm" data-view="${item.id}">📖 Baca &amp; Hafalan</button>
                <button class="btn btn-sm btn-info" data-keuangan="${item.id}">💰 Keuangan</button>
              </div></td>
            </tr>`).join("") : `<tr><td colspan="4" class="empty">Belum ada santri di kelas Anda. ${!currentProfile.jilidId ? "Hubungi admin untuk penugasan kelas." : ""}</td></tr>`}
        </tbody>
      </table>
    </div>`;

  attachTableSearch("searchSantriUstadzah","tableSantriUstadzah");
  $("page").querySelectorAll("[data-view]").forEach(btn=>btn.addEventListener("click", ()=>renderPembelajaranWaliOrUstadzah(btn.dataset.view)));
  $("page").querySelectorAll("[data-keuangan]").forEach(btn=>btn.addEventListener("click", ()=>renderKeuanganSantriUstadzah(btn.dataset.keuangan)));
}

async function renderKeuanganSantriUstadzah(santriId){
  const santri = (await getCollectionData("santri")).find(x=>x.id===santriId);
  if(!santri){ alert("Santri tidak ditemukan."); return; }
  const [tagihan, keuangan] = await Promise.all([getCollectionData("tagihan"), getCollectionData("keuangan")]);
  const aktif = tagihan.filter(x=>x.aktif!==false);

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="btnKembaliDaftar">← Kembali</button></div>
    <div class="card">
      <h2 style="margin-top:0">💰 Keuangan Santri</h2>
      <p class="muted">${escapeHTML(santri.nama)}</p>
      <div class="table-container" style="margin-top:15px">
        <table>
          <thead><tr><th>No.</th><th>Tagihan</th><th>Jenis</th><th>Nilai</th><th>Terbayar</th><th>Metode</th><th>Aksi</th></tr></thead>
          <tbody>
            ${aktif.length ? aktif.map((item,index)=>{
              const pembayaran = keuangan.find(x=>x.santriId===santriId && x.tagihanId===item.id);
              return `<tr>
                <td>${index+1}</td><td>${escapeHTML(item.nama)}</td><td>${escapeHTML(item.jenis)}</td>
                <td>${formatRupiah(item.nominal)}</td><td>${formatRupiah(pembayaran?.terbayar||0)}</td>
                <td>${escapeHTML(pembayaran?.metode || "-")}</td>
                <td><button class="btn btn-sm" data-catat="${item.id}">Catat</button></td>
              </tr>`;
            }).join("") : `<tr><td colspan="7" class="empty">Belum ada tagihan aktif.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;

  $("btnKembaliDaftar").addEventListener("click", renderDaftarSantriUstadzah);
  $("page").querySelectorAll("[data-catat]").forEach(btn=>btn.addEventListener("click", ()=>{
    openCatatPembayaranModal(santriId, [santri], aktif);
  }));
}

/* =========================================================
   PEMBELAJARAN: shared viewer for Wali (read-only) and
   Ustadzah (editable) -- resolved from currentProfile.role
========================================================= */
async function getJilidBySantri(santri){
  if(!santri?.jilidId) return null;
  const data = await getCollectionData("jilid");
  return data.find(x=>x.id===santri.jilidId) || null;
}
async function getProgressSantri(santriId, tipe){
  const data = await getCollectionData("progress");
  return data.find(x=>x.santriId===santriId && x.tipe===tipe) || null;
}
async function getUstadzahPendamping(santri){
  if(!santri?.jilidId) return null;
  const ustadzah = await getCollectionData("ustadzah");
  return ustadzah.find(x=>x.jilidId===santri.jilidId) || null;
}
async function getSantriWali(){
  if(!currentProfile) return [];
  const santri = await getCollectionData("santri");
  return santri.filter(x => x.waliUid === currentProfile.uid && x.aktif !== false);
}

async function renderPembelajaranWaliOrUstadzah(santriId){
  const santriData = await getCollectionData("santri");
  const santri = santriData.find(x=>x.id===santriId);
  if(!santri){ alert("Data santri tidak ditemukan."); return; }

  const isUstadzah = currentProfile.role === "ustadzah";
  const isWali = currentProfile.role === "wali";
  if(isWali && santri.waliUid !== currentProfile.uid){ alert("Anda tidak memiliki akses ke santri ini."); return; }
  if(isUstadzah && santri.jilidId !== currentProfile.jilidId){ alert("Santri ini bukan bagian dari kelas Anda."); return; }

  if(isUstadzah) return renderPdfEditorUstadzah(santri);
  return renderPembelajaranWaliView(santri);
}

/* ----- Wali: read-only view of baca/hafalan + riwayat + keuangan ----- */
async function renderPembelajaranWaliView(santri){
  const jilid = await getJilidBySantri(santri);
  const ustadzah = await getUstadzahPendamping(santri);
  const progress = await getCollectionData("progress");
  const baca = progress.find(x=>x.santriId===santri.id && x.tipe==="baca");
  const hafalan = progress.find(x=>x.santriId===santri.id && x.tipe==="hafalan");

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="btnKembaliWali">← Kembali</button></div>
    <div class="card">
      <h2 style="margin-top:0">${escapeHTML(santri.nama || "-")}</h2>
      <p class="muted">Kelas/Jilid: <b>${escapeHTML(jilid?.nama || santri.jilidNama || "-")}</b></p>
      <p class="muted">Ustadzah Pendamping: <b>${escapeHTML(ustadzah?.nama || "Belum ditentukan")}</b></p>
    </div>
    <div class="grid" style="margin-top:18px">
      ${renderBelajarCardWali("📖 Baca", baca, jilid?.pdfBacaUrl, santri.id, "baca")}

      <h3>📚 Riwayat Pembelajaran</h3>
      <div class="table-container" style="margin-top:12px">
        <table><thead><tr><th>No.</th><th>Materi</th><th>Halaman</th><th>Status</th><th>Pesan</th><th>Tanggal</th></tr></thead>
          <tbody>${await renderRiwayatWaliRows(santri.id)}</tbody>
        </table>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3>💰 Riwayat Keuangan</h3>
      <div class="table-container" style="margin-top:12px">
        <table><thead><tr><th>No.</th><th>Tagihan</th><th>Nilai</th><th>Terbayar</th><th>Metode</th><th>Status</th></tr></thead>
          <tbody>${await renderRiwayatKeuanganWaliRows(santri.id)}</tbody>
        </table>
      </div>
      <button class="btn btn-sm" id="btnLihatQris" style="margin-top:12px">📱 Lihat QRIS Pembayaran</button>
    </div>`;

  $("btnKembaliWali").addEventListener("click", renderDashboardWali);
  $("btnLihatQris").addEventListener("click", waliTampilkanQRIS);
  $("page").querySelectorAll("[data-open-pdf]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const url = btn.dataset.url;
      if(!url){ alert("Buku PDF belum tersedia."); return; }
      openPdfPreviewModal(url, Number(btn.dataset.page||1), btn.dataset.label);
    });

}

function renderBelajarCardWali(title, progress, pdfUrl, santriId, tipe){
  return `
    <div class="card">
      <h3>${title}</h3>
      <div>Halaman terakhir: <b>${progress?.halaman || 1}</b></div>
      <div style="margin-top:10px">${progress?.status==="naik" ? `<span class="badge badge-green">Naik</span>` : `<span class="badge badge-yellow">Mengulang</span>`}</div>
      ${progress?.pesan ? `<div class="notice" style="margin-top:12px"><b>Pesan Ustadzah</b><p style="margin-bottom:0;white-space:pre-wrap">${escapeHTML(progress.pesan)}</p></div>` : ""}
      ${progress?.audioUrl ? `<div style="margin-top:12px"><audio controls src="${escapeHTML(progress.audioUrl)}" style="width:100%"></audio></div>` : ""}
      <button class="btn btn-sm" style="margin-top:12px" data-open-pdf data-url="${escapeAttr(pdfUrl||"")}" data-page="${progress?.halaman||1}" data-label="${title}">${title.includes("Baca")?"📖":"🧠"} Buka Buku</button>
    </div>`;
}

async function renderRiwayatWaliRows(santriId){
  const data = await getCollectionData("riwayat");
  const rows = data.filter(x=>x.santriId===santriId).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if(!rows.length) return `<tr><td colspan="6" class="empty">Belum ada riwayat pembelajaran.</td></tr>`;
  const jilidBySantri = await getJilidBySantri((await getCollectionData("santri")).find(x=>x.id===santriId));
  return rows.map((item,index)=>`
    <tr>
      <td>${index+1}</td>
      <td>${item.tipe==="hafalan" ? "🧠 Hafalan" : "📖 Baca"}</td>
      <td><b>Halaman ${Number(item.halaman||1)}</b><br>
        <button class="btn btn-sm" style="margin-top:5px" data-open-pdf data-url="${escapeAttr(item.tipe==="hafalan" ? jilidBySantri?.pdfHafalanUrl : jilidBySantri?.pdfBacaUrl)}" data-page="${Number(item.halaman||1)}" data-label="${item.tipe==="hafalan"?"Buku Hafalan":"Buku Baca"}">👁 Lihat</button>
      </td>
      <td>${item.status==="naik" ? `<span class="badge badge-green">Naik</span>` : `<span class="badge badge-yellow">Mengulang</span>`}</td>
      <td>${item.pesan ? escapeHTML(item.pesan) : "-"}${item.audioUrl ? `<br><audio controls src="${escapeHTML(item.audioUrl)}" style="width:180px;max-width:100%;margin-top:5px"></audio>` : ""}</td>
      <td>${formatTanggal(item.createdAt)}</td>
    </tr>`).join("");
}

async function renderRiwayatKeuanganWaliRows(santriId){
  const data = await getCollectionData("keuangan");
  const rows = data.filter(x=>x.santriId===santriId).sort((a,b)=>(b.tanggal?.seconds||0)-(a.tanggal?.seconds||0));
  if(!rows.length) return `<tr><td colspan="6" class="empty">Belum ada riwayat keuangan.</td></tr>`;
  return rows.map((item,index)=>{
    const nominal = Number(item.nominalTagihan||0), terbayar = Number(item.terbayar||0), lunas = terbayar>=nominal;
    return `<tr>
      <td>${index+1}</td><td>${escapeHTML(item.tagihanNama||"-")}</td><td>${formatRupiah(nominal)}</td><td>${formatRupiah(terbayar)}</td>
      <td>${item.metode==="QRIS" ? "📱 QRIS" : escapeHTML(item.metode||"-")}</td>
      <td>${lunas ? `<span class="badge badge-green">Lunas</span>` : `<span class="badge badge-yellow">Belum Lunas</span>`}</td>
    </tr>`;
  }).join("");
}

async function waliTampilkanQRIS(){
  const settings = (await getCollectionData("settings")).find(x=>x.id==="app");
  if(!settings?.qrisUrl){ alert("QRIS belum tersedia. Silakan hubungi admin."); return; }
  openModal("QRIS Pembayaran", `
    <div style="text-align:center">
      <p class="muted">Silakan scan QRIS berikut untuk melakukan pembayaran.</p>
      <img src="${escapeHTML(settings.qrisUrl)}" alt="QRIS Pembayaran" style="width:350px;max-width:100%;border-radius:12px;border:1px solid var(--border)">
      <p class="muted" style="margin-top:12px">Setelah pembayaran, silakan konfirmasi kepada ustadzah/admin sesuai prosedur TPQ.</p>
    </div>`);
}

function openPdfPreviewModal(url, page, label){
  const safePage = Math.max(1, Number(page || 1));
  openModal(label, `
    <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
      <span class="badge badge-blue">Halaman ${safePage}</span>
    </div>
    <iframe src="${escapeHTML(url)}#page=${safePage}" style="width:100%;height:75vh;min-height:500px;border:0;border-radius:10px;background:#525659" title="${escapeHTML(label)}"></iframe>`);
}

/* ----- Ustadzah: editable PDF viewer with progress + recorder ----- */
async function renderPdfEditorUstadzah(santri){
  const jilid = await getJilidBySantri(santri);
  if(!jilid){ alert("Jilid/kelas santri belum diatur admin."); return; }

  openModal("Pilih Modul", `
    <div style="display:grid;gap:10px">
      <button class="btn" data-tipe="baca">📖 Buka Modul Baca</button>
      <button class="btn btn-info" data-tipe="hafalan">🧠 Buka Modul Hafalan</button>
    </div>`);
  $("modalContent").querySelectorAll("[data-tipe]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      closeModal();
      await openPembelajaranEditor(santri, jilid, btn.dataset.tipe);
    });
  });
}

async function openPembelajaranEditor(santri, jilid, tipe){
  const pdfUrl = tipe === "hafalan" ? jilid.pdfHafalanUrl : jilid.pdfBacaUrl;
  if(!pdfUrl){ alert(tipe==="hafalan" ? "Buku PDF hafalan belum diatur admin." : "Buku PDF baca belum diatur admin."); return; }
  const progress = await getProgressSantri(santri.id, tipe);
  const halaman = Math.max(1, Number(progress?.halaman || 1));

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="btnKembaliUstadzah">← Kembali</button></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap">
        <div>
          <h2 style="margin:0">${tipe==="hafalan" ? "🧠 Buku Hafalan" : "📖 Buku Baca"}</h2>
          <div class="muted" style="margin-top:5px">Santri: <b>${escapeHTML(santri.nama)}</b> · ${escapeHTML(jilid.nama)}</div>
        </div>
        <span class="badge badge-blue" id="currentPageBadge">Halaman ${halaman}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px">
        <button class="btn btn-sm" id="btnPrevPage">◀</button>
        <input id="pdfPageInput" type="number" min="1" value="${halaman}" style="width:90px;text-align:center">
        <button class="btn btn-sm" id="btnNextPage">▶</button>
        <button class="btn btn-sm btn-success" id="btnSavePage">📌 Tandai Halaman Terakhir</button>
      </div>
      <div style="margin-top:15px;background:#525659;border-radius:12px;overflow:hidden;min-height:650px">
        <iframe id="pdfFrame" src="${escapeHTML(pdfUrl)}#page=${halaman}" style="width:100%;height:750px;border:0;display:block" title="Buku PDF"></iframe>
      </div>
      <div class="card" style="margin-top:15px;background:#f8fafc">
        <h3>Hasil Pembelajaran</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn btn-success" id="btnNaik">↑ Naik</button>
          <button class="btn btn-warning" id="btnMengulang">↻ Mengulang</button>
        </div>
        <div class="form-group" style="margin-top:15px">
          <label>Pesan Ustadzah</label>
          <textarea id="pesanPembelajaran" rows="4" placeholder="Tuliskan catatan untuk wali...">${escapeHTML(progress?.pesan || "")}</textarea>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-info" id="btnSimpanPesan">💾 Simpan Pesan</button>
          <button class="btn" id="btnRecord">🎙 Mulai Rekam</button>
        </div>
        <div id="recordStatus" class="muted" style="margin-top:10px"></div>
        ${progress?.audioUrl ? `<div style="margin-top:15px"><label>Rekaman Sebelumnya</label><audio controls src="${escapeHTML(progress.audioUrl)}" style="width:100%;margin-top:7px"></audio></div>` : ""}
      </div>
    </div>`;

  $("btnKembaliUstadzah").addEventListener("click", renderDaftarSantriUstadzah);

  let currentPageNum = halaman;
  const frame = $("pdfFrame");
  function updateViewerPage(){
    currentPageNum = Math.max(1, Number($("pdfPageInput").value || 1));
    $("currentPageBadge").textContent = `Halaman ${currentPageNum}`;
    frame.src = `${pdfUrl}#page=${currentPageNum}`;
  }
  $("btnPrevPage").addEventListener("click", ()=>{ currentPageNum = Math.max(1, currentPageNum-1); $("pdfPageInput").value = currentPageNum; updateViewerPage(); });
  $("btnNextPage").addEventListener("click", ()=>{ currentPageNum++; $("pdfPageInput").value = currentPageNum; updateViewerPage(); });
  $("pdfPageInput").addEventListener("change", updateViewerPage);

  const saveWith = (status)=>saveProgress({
    santriId: santri.id, tipe, halaman: currentPageNum, status,
    pesan: $("pesanPembelajaran").value.trim(), audioUrl: progress?.audioUrl || null
  });
  $("btnSavePage").addEventListener("click", ()=>saveWith(progress?.status || "mengulang"));
  $("btnNaik").addEventListener("click", ()=>saveWith("naik"));
  $("btnMengulang").addEventListener("click", ()=>saveWith("mengulang"));
  $("btnSimpanPesan").addEventListener("click", ()=>saveWith(progress?.status || "mengulang"));

  setupAudioRecorder({ santriId: santri.id, tipe, halamanGetter: ()=>currentPageNum, progress });
}

async function saveProgress({ santriId, tipe, halaman, status, pesan, audioUrl }){
  try{
    const data = await getCollectionData("progress");
    const existing = data.find(x=>x.santriId===santriId && x.tipe===tipe);
    const payload = {
      santriId, tipe, halaman: Math.max(1, Number(halaman||1)), status: status || "mengulang",
      pesan: pesan || "", audioUrl: audioUrl || null,
      ustadzahUid: currentProfile.uid, ustadzahNama: currentProfile.nama || "",
      updatedAt: serverTimestamp()
    };
    if(existing) await updateCollectionData("progress", existing.id, payload);
    else await addCollectionData("progress", payload);
    await addCollectionData("riwayat", {
      santriId, tipe, halaman: payload.halaman, status: payload.status, pesan: payload.pesan,
      audioUrl: payload.audioUrl, ustadzahUid: currentProfile.uid, ustadzahNama: currentProfile.nama || ""
    });
    showToast("Hasil pembelajaran berhasil disimpan.");
  }catch(error){
    console.error(error);
    alert("Gagal menyimpan pembelajaran: " + error.message);
  }
}

function setupAudioRecorder({ santriId, tipe, halamanGetter, progress }){
  const button = $("btnRecord");
  const status = $("recordStatus");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    button.disabled = true;
    status.textContent = "Browser tidak mendukung rekaman suara.";
    return;
  }
  button.addEventListener("click", async ()=>{
    if(!activeRecorder || activeRecorder.state === "inactive"){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
        activeAudioChunks = [];
        activeRecorder = new MediaRecorder(stream);
        activeRecorder.ondataavailable = event => { if(event.data.size > 0) activeAudioChunks.push(event.data); };
        activeRecorder.onstop = async ()=>{
          stream.getTracks().forEach(track=>track.stop());
          const blob = new Blob(activeAudioChunks, { type: activeRecorder.mimeType || "audio/webm" });
          status.textContent = "Mengupload rekaman...";
          try{
            const extension = blob.type.includes("mp4") ? "mp4" : "webm";
            const audioUrl = await uploadFile(`audio/${santriId}/${tipe}-${Date.now()}.${extension}`, blob);
            const data = await getCollectionData("progress");
            const existing = data.find(x=>x.santriId===santriId && x.tipe===tipe);
            const payload = {
              santriId, tipe, halaman: Number(halamanGetter()), status: existing?.status || "mengulang",
              pesan: existing?.pesan || "", audioUrl, ustadzahUid: currentProfile.uid, ustadzahNama: currentProfile.nama || ""
            };
            if(existing) await updateCollectionData("progress", existing.id, payload);
            else await addCollectionData("progress", payload);
            status.textContent = "Rekaman berhasil disimpan.";
            showToast("Pesan suara berhasil disimpan.");
          }catch(error){
            console.error(error);
            status.textContent = "Upload rekaman gagal.";
            alert("Gagal menyimpan rekaman: " + error.message);
          }
        };
        activeRecorder.start();
        button.textContent = "⏹ Berhenti Rekam";
        button.classList.add("btn-danger");
        status.textContent = "Sedang merekam...";
      }catch(error){
        console.error(error);
        alert("Tidak dapat menggunakan mikrofon. Pastikan izin mikrofon diberikan.");
      }
      return;
    }
    if(activeRecorder.state === "recording"){
      activeRecorder.stop();
      button.textContent = "🎙 Mulai Rekam";
      button.classList.remove("btn-danger");
    }
  });
}
