<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f3d22">
<meta name="description" content="Sistem Informasi TPQ Wardatul Wathon">
<title>TPQ Wardatul Wathon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --primary:#166534; --primary-dark:#0f3d22; --primary-soft:#f0fdf4;
  --accent:#22c55e;
  --bg:#f5f7f6; --card:#fff;
  --text:#0f172a; --text-soft:#475569; --muted:#64748b;
  --border:#e5e9ee; --border-soft:#eef2f0;
  --danger:#dc2626; --warning:#d97706; --info:#2563eb; --success:#16a34a;
  --radius:14px; --radius-sm:10px; --radius-lg:18px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04);
  --shadow-lg:0 8px 24px rgba(15,23,42,.10);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --topbar-h:56px;
  --bottomnav-h:76px;   /* ← DINAIKKAN */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  -webkit-text-size-adjust:100%;
  scroll-padding-bottom:calc(var(--bottomnav-h) + 24px + var(--safe-bottom));  /* ← TAMBAH */
  scroll-behavior:smooth;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em;color:var(--text)}
h1{font-size:20px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:600;margin-bottom:6px}
h4{font-size:13.5px;font-weight:600}
p{margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.soft{color:var(--text-soft)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ============ LOGIN ============ */
#loginScreen{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:linear-gradient(165deg,#166534 0%,#0f3d22 55%,#052e16 100%);
}
.login-card{
  width:100%;max-width:400px;background:#fff;
  border-radius:22px;padding:28px 24px 22px;
  box-shadow:0 24px 70px rgba(0,0,0,.28);
}
.login-logo{
  width:64px;height:64px;margin:0 auto 16px;
  border-radius:18px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;box-shadow:0 8px 20px rgba(22,101,52,.3);
}
.login-title{text-align:center;font-size:20px;font-weight:700}
.login-subtitle{text-align:center;color:var(--muted);margin-top:4px;font-size:13px}
.login-error{min-height:20px;color:var(--danger);text-align:center;font-size:13px;margin-top:10px}
.link-btn{
  border:0;background:none;color:var(--primary);font-weight:600;
  padding:10px;font-size:13.5px;border-radius:8px;min-height:40px;
}
.link-btn:hover{background:var(--primary-soft)}

/* ============ FORM ============ */
.form-group{margin-bottom:14px}
.form-group>label{
  display:block;font-size:13px;font-weight:600;
  margin-bottom:6px;color:var(--text-soft)
}
input,select,textarea{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  background:#fff;color:var(--text);
  outline:none;
  transition:border-color .15s,box-shadow .15s;
  font-size:16px; /* cegah zoom di iOS */
  min-height:46px;
}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(22,101,52,.12);
}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:var(--muted)}
input[type="checkbox"]{width:20px;height:20px;min-height:0;accent-color:var(--primary);cursor:pointer}
input[type="number"]{font-size:16px}
.check-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  max-height:200px;overflow:auto;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;background:#fafbfc;
}
.check-grid label{
  display:flex;align-items:center;gap:8px;
  font-weight:500;font-size:13.5px;cursor:pointer;
  margin:0;padding:6px 4px;border-radius:6px;
  min-height:36px;
}
.check-grid label:active{background:#eef2f0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ============ BUTTON ============ */
.btn{
  border:0;border-radius:var(--radius-sm);
  padding:11px 16px;background:var(--primary);color:#fff;
  font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s,opacity .15s,transform .1s;
  min-height:44px;
  white-space:nowrap;
}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-full{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;min-height:38px}
.btn-icon{padding:9px;min-width:40px}
.btn-danger{background:var(--danger)} .btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning)} .btn-warning:hover{background:#b45309}
.btn-info{background:var(--info)} .btn-info:hover{background:#1d4ed8}
.btn-success{background:var(--success)} .btn-success:hover{background:#15803d}
.btn-light{background:#eef2f0;color:var(--text)} .btn-light:hover{background:#dde4e0}
.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--primary-soft);border-color:var(--primary)}

/* ============ LAYOUT ============ */
.main{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
}
.topbar{
  height:var(--topbar-h);
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  position:sticky;top:0;z-index:50;
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-logo{
  width:34px;height:34px;border-radius:10px;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.topbar-title{
  font-weight:700;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;cursor:pointer;
  border:0;flex-shrink:0;
  transition:transform .15s;
}
.avatar:active{transform:scale(.94)}

/* Chips (desktop/hybrid) — disembunyikan di mobile murni */
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:10px 16px;
  background:#fff;border-bottom:1px solid var(--border);
  position:sticky;top:var(--topbar-h);z-index:49;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chips button{
  border:1.5px solid var(--border);background:#fff;color:var(--text-soft);
  padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;
  white-space:nowrap;transition:.15s;
  display:inline-flex;align-items:center;gap:6px;
  min-height:38px;
}
.chips button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.page{
  padding:14px 14px 24px;
  max-width:1200px;margin:0 auto;width:100%;flex:1;
  overflow-x:hidden;
}

/* ============ PAGE HEAD ============ */
.page-head,.toolbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-bottom:14px;
}
.page-head h2{font-size:18px}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.search-box{max-width:240px;min-width:0}
.stack>*+*{margin-top:12px}

/* ============ TABS (dalam page) ============ */
.tabs{
  display:flex;gap:4px;background:#fff;padding:5px;
  border-radius:12px;border:1px solid var(--border);
  overflow-x:auto;margin-bottom:14px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:0;background:transparent;color:var(--muted);
  padding:9px 14px;border-radius:9px;
  font-weight:600;font-size:13px;
  white-space:nowrap;transition:.15s;
  min-height:38px;
}
.tabs button.active{background:var(--primary);color:#fff}

/* ============ MENU GRID (dashboard) ============ */
.menu-grid{
  display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;
  padding:10px;background:#fff;
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.menu-grid button{
  border:0;background:transparent;
  padding:12px 6px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11.5px;font-weight:600;color:var(--text);
  transition:background .15s, transform .1s;
  min-height:84px;
}
.menu-grid button:active{transform:scale(.96);background:#f1f5f3}
.menu-grid button .ico{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:13px;background:var(--primary-soft);font-size:20px;
  color:var(--primary);flex-shrink:0;transition:.15s;
}
.menu-grid button.active .ico{
  background:var(--primary);color:#fff;
  box-shadow:0 4px 12px rgba(22,101,52,.25);
}
.menu-grid button.active{color:var(--primary)}
.menu-grid button .lbl{text-align:center;line-height:1.2}

.menu-panel{display:none;animation:slideUp .22s ease-out}
.menu-panel.show{display:block}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);
}
.card.soft{background:#f8faf9;box-shadow:none;border-color:var(--border-soft)}
.card.warn{background:#fffbeb;border-color:#fde68a}
.card.danger{background:#fef2f2;border-color:#fecaca}
.card.info{background:#eff6ff;border-color:#bfdbfe}
.card.ok{background:var(--primary-soft);border-color:#bbf7d0}
.stat-icon{font-size:20px;line-height:1}
.stat-label{color:var(--muted);font-size:12.5px;margin-top:6px}
.stat-value{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.balance{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;border:0;margin-bottom:14px;
  box-shadow:0 6px 20px rgba(22,101,52,.2);
}
.balance b{color:#fff}

/* ============ TABLE ============ */
.table-container{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--radius);overflow:auto;
  -webkit-overflow-scrolling:touch;
}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{
  padding:11px 12px;border-bottom:1px solid var(--border);
  font-size:13px;text-align:left;vertical-align:middle;
}
th{
  background:#f8faf9;font-size:11.5px;color:var(--text-soft);
  font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  position:sticky;top:0;z-index:1;
}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px}

/* ============ BADGE / NOTICE ============ */
.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;white-space:nowrap;
  line-height:1.5;
}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#e5e9ee;color:#334155}
.notice{
  border-left:3px solid var(--primary);
  background:var(--primary-soft);
  padding:11px 14px;border-radius:10px;
  margin-bottom:12px;font-size:13px;line-height:1.55;
}
.notice-warn{border-left-color:var(--warning);background:#fffbeb}
.notice p:last-child{margin-bottom:0}

/* ============ MODAL (mobile sheet) ============ */
.modal{
  position:fixed;inset:0;z-index:500;
  background:rgba(15,23,42,.55);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .15s;
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
.modal-box{
  width:100%;max-width:680px;
  max-height:92vh;max-height:92dvh;
  overflow:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + var(--safe-bottom));
  animation:slideUp .25s cubic-bezier(.16,1,.3,1);
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:16px;
  position:sticky;top:-20px;background:#fff;
  padding:8px 0;z-index:2;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:14px;
}
.modal-header h3{margin:0;font-size:16px;font-weight:700}
.modal-close{
  width:36px;height:36px;border:0;border-radius:50%;
  background:#eef2f0;font-size:20px;line-height:1;
  flex-shrink:0;color:var(--text-soft);
  display:flex;align-items:center;justify-content:center;
}
.modal-close:active{background:#dde4e0}
/* Grabber visual */
.modal-box::before{
  content:"";display:block;width:40px;height:4px;
  background:#dde4e0;border-radius:999px;
  margin:-10px auto 14px;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============ TOAST ============ */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(var(--topbar-h) + 12px);
  background:#0f172a;color:#fff;
  padding:12px 18px;border-radius:12px;
  z-index:1000;
  box-shadow:0 12px 32px rgba(0,0,0,.22);
  max-width:calc(100% - 32px);
  font-size:13.5px;font-weight:500;
  animation:toastIn .25s cubic-bezier(.16,1,.3,1);
  text-align:center;
}
.toast.error{background:var(--danger)}
@keyframes toastIn{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ============ SPINNER ============ */
.spinner{
  width:18px;height:18px;
  border:2.5px solid #e2e8f0;border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;
  display:inline-block;vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{
  display:flex;align-items:center;gap:8px;color:var(--muted);
  padding:40px;justify-content:center;font-size:13px;
}

/* ============ PDF VIEWER ============ */
.pdf-viewer{
  background:#1a1d21;
  display:flex;flex-direction:column;
  height:100%;width:100%;
  border-radius:12px;overflow:hidden;
}
.pdf-toolbar{
  min-height:52px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:6px 10px;background:#111827;color:#fff;flex-wrap:wrap;
}
.pdf-toolbar-group{display:flex;align-items:center;gap:5px}
.pdf-toolbar button{
  border:0;min-width:38px;height:38px;border-radius:9px;
  background:#374151;color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.pdf-toolbar button:active{background:#4b5563}
.pdf-page-indicator{
  min-width:78px;text-align:center;font-size:12.5px;font-weight:600;
}
.pdf-frame-wrap{
  position:relative;background:#3a3d41;
  min-height:340px;flex:1;
  display:flex;align-items:flex-start;justify-content:center;
  overflow:auto;padding:6px;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
  overscroll-behavior:auto;
}
.pdf-page-img{
  display:block;width:100%;height:auto;max-width:100%;
  max-height:calc(100vh - 240px);
  object-fit:contain;
  border-radius:4px;background:#fff;
  transform-origin:top center;
  transition:width .15s ease-out;
}
.pdf-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(26,29,33,.94);color:#fff;z-index:2;
}
.pdf-loading.hidden{display:none}
.pdf-info-bar{
  padding:9px 12px;background:#111827;color:#cbd5e1;
  font-size:11.5px;line-height:1.4;
}
.pdf-skeleton{
  width:100%;height:80%;max-width:560px;margin:auto;
  background:linear-gradient(90deg,#2a2d31 25%,#35393e 50%,#2a2d31 75%);
  background-size:200% 100%;animation:pdfShimmer 1.4s infinite;border-radius:6px;
}
@keyframes pdfShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pdf-pesan-bar{
  padding:10px 12px;background:#1f2937;color:#e5e7eb;
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;
}
.pdf-pesan-bar label{
  grid-column:1 / -1;font-size:12.5px;font-weight:600;
  color:#cbd5e1;margin-bottom:2px;
}
.pdf-pesan-bar textarea{
  width:100%;resize:vertical;min-height:44px;max-height:120px;
  padding:9px 11px;border-radius:9px;
  border:1px solid #374151;background:#111827;
  color:#f1f5f9;font-size:14px;
}
.pdf-pesan-bar button{align-self:end;height:44px;white-space:nowrap}
.pdf-upload-box{
  border:1.5px dashed #cbd5e1;border-radius:12px;
  padding:14px;background:#f8faf9;
}
.pdf-upload-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.pdf-file-info{
  margin-top:10px;padding:9px 12px;background:#fff;
  border:1px solid var(--border);border-radius:10px;font-size:12.5px;
}
.pdf-progress{display:none;margin-top:10px}
.pdf-progress.active{display:block}
.pdf-progress-track{height:6px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.pdf-progress-bar{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .2s}
.pdf-progress-text{font-size:12px;color:var(--muted);margin-top:6px}
.pdf-current{
  margin-top:9px;padding:10px 12px;border-radius:10px;
  background:var(--primary-soft);color:var(--primary);font-size:12.5px;
}
/* ============ WELCOME BANNER ============ */
.welcome-banner{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;
  border-radius:var(--radius);
  margin-bottom:14px;
  box-shadow:0 4px 14px rgba(22,101,52,.18);
}
.welcome-banner .wb-text{min-width:0;flex:1}
.welcome-banner .wb-greet{
  font-size:12.5px;opacity:.85;font-weight:500;
}
.welcome-banner .wb-name{
  font-size:16px;font-weight:700;
  margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.welcome-banner .wb-role{
  display:inline-flex;align-items:center;gap:4px;
  margin-top:6px;
  padding:3px 10px;border-radius:999px;
  background:rgba(255,255,255,.18);
  font-size:11.5px;font-weight:600;
}
.welcome-banner .wb-icon{
  font-size:32px;line-height:1;
  flex-shrink:0;
  opacity:.9;
}

/* ============ RESPONSIVE ============ */

@media(max-width:1000px){
  .grid,.summary-strip{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:701px){
  .menu-grid{grid-template-columns:repeat(6, 1fr)}
  .modal{align-items:center}
  .modal-box{border-radius:18px;padding:20px;max-height:88vh}
  .modal-box::before{display:none}
  .modal-header{top:-20px}
}
@media(max-width:700px){

}
function debounce(fn, wait=200){

  finally{ btn.disabled = oldDisabled; btn.textContent = oldText; }
}

/* ===== EXPORT ke Excel (.xls via HTML Table — paling kompatibel) ===== */
function exportToExcel(rows, filename, sheetName="Data"){
  if(!rows || !rows.length){ showToast("Tidak ada data untuk diexport.", true); return; }
  try{
    const headers = Object.keys(rows[0]);
    const safe = s => String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#039;");

    // Escape value untuk HTML
    const td = v => {
      const s = String(v ?? "");
      // Kalau angka murni → biarkan angka (biar Excel treat as number)
      if(/^-?\d+(\.\d+)?$/.test(s)) return `<td>${s}</td>`;
      return `<td style="mso-number-format:'\\@'">${safe(s)}</td>`;
    };

    const html = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:x="urn:schemas-microsoft-com:office:excel"
            xmlns="http://www.w3.org/TR/REC-html40">

            <x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>

          tr:nth-child(even) td{background:#f5f7f6}
        </style>
      </head>
      <body>
        <table>
          <thead><tr>${headers.map(h => `<th>${safe(h)}</th>`).join("")}</tr></thead>
          <tbody>${rows.map(r => `<tr>${headers.map(h => td(r[h])).join("")}</tr>`).join("")}</tbody>
        </table>
      </body>
      </html>`;

    const blob = new Blob(["\uFEFF" + html], { type:"application/vnd.ms-excel;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (filename.endsWith(".xlsx") || filename.endsWith(".xls")) ? filename.replace(/\.xlsx$/i, ".xls") : filename + ".xls";
    document.body.appendChild(a); a.click(); a.remove();

}

/* ============ 5. LAYANAN DATA ============ */
const cache = new Map();
async function getCollectionData(name, { forceRefresh=false } = {}){
  const cached = cache.get(name);
  if(!forceRefresh && cached && Date.now() - cached.time < APP_CONFIG.cacheTtlMs) return cached.data;
  const snap = await getDocs(collection(db, name));
  const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  cache.set(name, { data, time: Date.now() });
  return data;
}
const fresh = name => getCollectionData(name, { forceRefresh:true });
const invalidateCache = name => cache.delete(name);
async function getDocument(name, id){
  const snap = await getDoc(doc(db, name, id));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}
async function addCollectionData(name, data){
  const ref = await addDoc(collection(db, name), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  invalidateCache(name);
  return ref;
}
async function updateCollectionData(name, id, data){
  await updateDoc(doc(db, name, id), { ...data, updatedAt: serverTimestamp() });
  invalidateCache(name);
}
async function deleteCollectionData(name, id){
  await deleteDoc(doc(db, name, id));
  invalidateCache(name);
}

// Audit buffer
const auditBuffer = [];
let auditFlushTimer = null;
const AUDIT_FLUSH_DELAY = 1500;
const AUDIT_FLUSH_MAX = 15;
function flushAuditBuffer(){
  if(!auditBuffer.length) return;
  const items = auditBuffer.splice(0, auditBuffer.length);
  items.forEach(async item => {
    try{ await addCollectionData("audit", item); }
    catch(err){ console.warn("Audit gagal:", err?.code || err?.message); }
  });
}
function logAudit(action, entity, entityId, metadata={}){
  if(!currentProfile?.uid) return;
  auditBuffer.push({
    action, entity, entityId, metadata,
    userUid: currentProfile.uid, userNama: currentProfile.nama || null, userRole: currentProfile.role || null,
    timestamp: new Date().toISOString()
  });
  if(auditBuffer.length >= AUDIT_FLUSH_MAX){
    clearTimeout(auditFlushTimer); auditFlushTimer = null; flushAuditBuffer();
  } else if(!auditFlushTimer){
    auditFlushTimer = setTimeout(() => { auditFlushTimer = null; flushAuditBuffer(); }, AUDIT_FLUSH_DELAY);
  }
}
window.addEventListener("beforeunload", () => flushAuditBuffer());
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushAuditBuffer(); });

const todayStr = () => dateKey(nowWIB());
function tsKey(value){
  const d = toDate(value);
  return d ? dateKey(toWIB(d)) : null;
}

async function getAppSettings(){
  const settings = await getCollectionData("settings");
  return settings.find(x => x.id === "app") || {};
}
async function saveSettings(data){
  await setDoc(doc(db, "settings", "app"), { ...data, updatedAt: serverTimestamp() }, { merge:true });
  invalidateCache("settings");
}
const batasIzinJam = s => num(s?.batasIzinJam ?? APP_CONFIG.batasIzinJam);
const batasAlphaJam = s => num(s?.batasAlphaJam ?? APP_CONFIG.batasAlphaJam);
const batasAlphaHari = s => num(s?.batasAlphaHari ?? APP_CONFIG.batasAlphaHari);
const jumlahHariRekap = s => num(s?.jumlahHariRekap ?? APP_CONFIG.jumlahHariRekap);
const isLewatBatasIzin = s => nowWIB().getHours() >= batasIzinJam(s);
const isLewatBatasAlpha = s => nowWIB().getHours() >= batasAlphaJam(s);

/* ============ 7. HARI LIBUR ============ */
function isHariLibur(tanggal, settings){
  const mingguan = Array.isArray(settings?.liburMingguan) ? settings.liburMingguan : [];
  const events = Array.isArray(settings?.liburEvents) ? settings.liburEvents : [];
  const d = new Date(tanggal + "T00:00:00");
  if(!isNaN(d.getTime()) && mingguan.includes(d.getDay())) return true;
  return events.some(e => e.mulai && e.selesai && tanggal >= e.mulai && tanggal <= e.selesai);
}
function labelLibur(tanggal, settings){
  const mingguan = Array.isArray(settings?.liburMingguan) ? settings.liburMingguan : [];
  const d = new Date(tanggal + "T00:00:00");
  if(mingguan.includes(d.getDay())) return `Libur mingguan (${NAMA_HARI[d.getDay()]})`;
  const ev = (settings?.liburEvents || []).find(e => tanggal >= e.mulai && tanggal <= e.selesai);
  return ev ? `Libur: ${ev.nama || "Event"}` : "Libur";
}
function liburCard(settings){
  const today = todayStr();
  if(!isHariLibur(today, settings)) return "";
  return `<div class="card info" style="margin-bottom:12px"><b style="color:#1e40af">🏖️ Hari ini libur</b>
    <div class="muted small" style="margin-top:4px">${esc(labelLibur(today, settings))}. Tidak ada perhitungan alpha hari ini.</div></div>`;
}
function pengumumanLiburPayload(ev){
  const kadaluarsa = new Date(new Date(ev.selesai + "T23:59:59+07:00").getTime() + 1000);
  const durasi = ev.mulai === ev.selesai ? ev.mulai : `${ev.mulai} s/d ${ev.selesai}`;
  return {
    judul: `🏖️ Libur: ${ev.nama}`,
    isi: `Diberitahukan bahwa TPQ akan libur:\n\n📌 Kegiatan: ${ev.nama}\n📅 Tanggal: ${durasi}\n` +
         (ev.keterangan ? `📝 Keterangan: ${ev.keterangan}\n` : "") +
         `\nKegiatan belajar mengajar kembali normal pada hari berikutnya.\nTerima kasih atas perhatiannya.`,
    aktif: true,
    berlakuSampai: kadaluarsa.toISOString(),
    sumber: "liburEvent", liburNama: ev.nama, liburMulai: ev.mulai, liburSelesai: ev.selesai
  };
}
const pengumumanLiburTerkait = (list, ev) =>
  list.filter(p => p.sumber === "liburEvent" && p.liburNama === ev.nama && p.liburMulai === ev.mulai && p.liburSelesai === ev.selesai);

/* ============ 8. IZIN & KEHADIRAN ============ */
const labelAlasan = a => ({ sakit:"Sakit", kegiatan:"Kegiatan tidak bisa ditinggal", lainnya:"Lainnya" }[a] || a || "-");
function badgeAlasan(a){
  if(a === "sakit") return badge("Sakit","yellow");
  if(a === "kegiatan") return badge("Kegiatan","blue");
  return badge("Lainnya","gray");
}
function pesanSuksesIzin(a){
  if(a === "sakit") return "Izin diajukan. Semoga lekas sehat, aamiin.";
  if(a === "kegiatan") return "Izin diajukan. Semoga urusannya lancar dan selamat sampai tujuan, aamiin.";
  return "Izin diajukan. Semoga urusannya lancar, aamiin.";
}
function badgeStatusHarian(st){
  switch(st.status){
    case "hadir": return badge("Hadir","green");
    case "izin": return badge(`Izin${st.izin ? ` (${labelAlasan(st.izin.alasan)})` : ""}`,"yellow");
    case "alpha": return badge("Alpha","red");
    case "libur": return badge("Libur","blue");
    default: return badge("Belum","gray");
  }
}
const periodeRekapText = s => `${s.mulaiPembelajaran ? `Sejak ${s.mulaiPembelajaran}` : "Seluruh periode"} · ${jumlahHariRekap(s)} hari terakhir`;

async function loadKehadiranContext(){
  const [izinList, riwayat, progress, settings] = await Promise.all([
    fresh("izin"), fresh("riwayat"), fresh("progress"), getAppSettings()
  ]);
  const index = new Set();
  [...riwayat, ...progress].forEach(r => {
    const key = tsKey(r.createdAt || r.updatedAt);
    if(!key) return;
    if(r.santriId) index.add(`s:${r.santriId}:${key}`);
    if(r.ustadzahUid) index.add(`u:${r.ustadzahUid}:${key}`);
  });
  return { izinList, index, settings };
}
function statusHarian({ tanggal, izin, hadir, settings }){
  if(isHariLibur(tanggal, settings)) return { status:"libur" };
  if(izin) return { status:"izin", izin };
  if(hadir) return { status:"hadir" };
  if(tanggal === todayStr() && !isLewatBatasAlpha(settings)) return { status:"belum" };
  return { status:"alpha" };
}
const izinCocok = (z, tanggal) => z.aktif !== false && tanggal >= z.tanggalMulai && tanggal <= z.tanggalSelesai;
function statusSantri(santriId, tanggal, ctx){
  const izin = ctx.izinList.find(z => z.jenis !== "ustadzah" && z.santriId === santriId && izinCocok(z, tanggal)) || null;
  return statusHarian({ tanggal, izin, hadir: ctx.index.has(`s:${santriId}:${tanggal}`), settings: ctx.settings });
}
function statusUstadzah(ustadzahId, tanggal, ctx){
  const izin = ctx.izinList.find(z => z.jenis === "ustadzah" && z.ustadzahId === ustadzahId && izinCocok(z, tanggal)) || null;
  return statusHarian({ tanggal, izin, hadir: ctx.index.has(`u:${ustadzahId}:${tanggal}`), settings: ctx.settings });
}
function daftarTanggalRekap(settings){
  const today = nowWIB(), out = [];
  for(let i = 0; i < jumlahHariRekap(settings); i++){
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = dateKey(d);
    if(settings.mulaiPembelajaran && key < settings.mulaiPembelajaran) continue;
    out.push(key);
  }
  return out;
}
function hitungRekap(list, kind, ctx){
  const days = daftarTanggalRekap(ctx.settings);
  return list.map(item => {
    const r = { hadir:0, izin:0, alpha:0, libur:0 };
    days.forEach(t => {
      const st = kind === "santri" ? statusSantri(item.id, t, ctx) : statusUstadzah(item.id, t, ctx);
      if(r[st.status] !== undefined) r[st.status]++;
    });
    return { item, ...r, total: r.hadir + r.izin + r.alpha };
  }).sort((a,b) => b.hadir - a.hadir || b.izin - a.izin || a.alpha - b.alpha);
}
function rekapCard(title, rekap, settings, emptyText="Belum ada data."){
  const batas = batasAlphaHari(settings);
  const medal = i => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "";
  return `<div class="card"><h3>${title}</h3><p class="muted small">${esc(periodeRekapText(settings))}</p>
    <div style="margin-top:10px">${dataTable("", ["#","Nama","H","I","A","L","Tot"],
      rekap.map((r,i) => `<tr>
        <td><b>${i+1}</b> ${medal(i)}</td><td><b>${esc(r.item.nama || "-")}</b></td>
        <td>${badge(r.hadir,"green")}</td><td>${badge(r.izin,"yellow")}</td>
        <td>${badge(r.alpha, r.alpha >= batas ? "red" : "gray")}</td>
        <td>${badge(r.libur,"blue")}</td><td>${r.total}</td></tr>`), emptyText)}</div></div>`;
}
function peringatanSantriSingkat(rekap, settings){
  const batas = batasAlphaHari(settings);
  const list = rekap.filter(r => r.alpha >= batas);
  if(!list.length) return "";
  return `<div class="card danger" style="margin-bottom:12px">
    <b style="color:#991b1b">⚠️ ${list.length} santri alpha ≥ ${batas} hari</b>
    <div class="muted small" style="margin-top:4px">
      ${list.slice(0,3).map(r => esc(r.item.nama)).join(", ")}${list.length > 3 ? ", dll" : ""}.
      <b>Tap "Rekap" di bawah untuk detail.</b>
    </div></div>`;
}

async function bindIzinForm({ isUstadzah, santriList, settings }){
  const form = $("izinForm");
  if(!form) return;
  const izinList = await fresh("izin");

  $("izinAlasan").addEventListener("change", () => {
    const v = $("izinAlasan").value;
    $("izinKegiatanWrap").classList.toggle("hidden", v !== "kegiatan");
    $("izinKeteranganWrap").classList.toggle("hidden", v === "");
    $("izinNamaKegiatan").required = v === "kegiatan";
  });
  $("izinMulai").addEventListener("change", () => {
    if($("izinSelesai").value < $("izinMulai").value) $("izinSelesai").value = $("izinMulai").value;
    $("izinSelesai").min = $("izinMulai").value;
  });

  if(isUstadzah && $("izinKlaimUstadzah")){
    const ustadzahList = (await getCollectionData("ustadzah")).filter(u => u.id !== currentProfile.uid && u.aktif !== false);
    $("izinKlaimUstadzah").innerHTML = `<option value="">Tidak perlu diklaimkan</option>` +
      ustadzahList.map(u => `<option value="${esc(u.id)}">${esc(u.nama || u.email || "-")}</option>`).join("");
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const today = todayStr();
    const alasan = $("izinAlasan").value;
    const namaKegiatan = alasan === "kegiatan" ? $("izinNamaKegiatan").value.trim() : "";
    const mulai = $("izinMulai").value, selesai = $("izinSelesai").value;
    if(!alasan) return showToast("Pilih alasan izin.", true);
    if(alasan === "kegiatan" && !namaKegiatan) return showToast("Nama kegiatan wajib diisi.", true);
    if(mulai < today) return showToast("Tanggal mulai tidak boleh di masa lalu.", true);
    if(selesai < mulai) return showToast("Tanggal selesai tidak boleh sebelum tanggal mulai.", true);
    if(mulai === today && isLewatBatasIzin(settings)){
      return showToast(`Batas pengajuan izin hari ini sudah lewat (${batasIzinJam(settings)}.00 WIB). Ajukan untuk besok.`, true);
    }

    const santri = isUstadzah ? null : santriList.find(s => s.id === $("izinSantri")?.value);
    if(!isUstadzah && !santri) return showToast("Pilih santri terlebih dahulu.", true);

    const bentrok = izinList.find(z => z.aktif !== false &&
      (isUstadzah ? (z.jenis === "ustadzah" && z.ustadzahId === currentProfile.uid) : (z.jenis !== "ustadzah" && z.santriId === santri.id)) &&
      z.tanggalMulai <= selesai && z.tanggalSelesai >= mulai);
    if(bentrok && !confirm(`Sudah ada izin pada rentang tersebut (${rangeText(bentrok)}). Lanjutkan?`)) return;

    await busy($("izinSaveBtn"), "Mengirim...", async () => {
      try{
        const base = {
          tanggalMulai: mulai, tanggalSelesai: selesai, alasan, namaKegiatan,
          keterangan: $("izinKeterangan")?.value.trim() || "",
          diajukanOleh: currentProfile.uid, diajukanOlehNama: currentProfile.nama || "",
          diajukanOlehRole: currentProfile.role, aktif: true
        };
        const payload = isUstadzah
          ? { ...base, jenis:"ustadzah", santriId:null, santriNama: currentProfile.nama || "Ustadzah", santriJilidId:null, ustadzahId: currentProfile.uid }
          : { ...base, jenis:"santri", santriId: santri.id, santriNama: santri.nama, santriJilidId: santri.jilidId || null, ustadzahId:null };
        const ref = await addCollectionData("izin", payload);

        const penggantiUid = isUstadzah && $("izinKlaimUstadzah") ? $("izinKlaimUstadzah").value : "";
        if(penggantiUid){
          const penggantiNama = $("izinKlaimUstadzah").selectedOptions[0]?.textContent || "";
          const jilidDiampu = (await fresh("jilid")).filter(j => getJilidUstadzahIds(j).includes(currentProfile.uid));
          for(const j of jilidDiampu){
            await updateCollectionData("jilid", j.id, {
              substituteUid: penggantiUid, substituteNama: penggantiNama,
              substituteFrom: mulai, substituteUntil: selesai,
              substituteAlasan: `Izin ${labelAlasan(alasan)}${namaKegiatan ? " — " + namaKegiatan : ""}`
            });
            logAudit("UPDATE","jilid",j.id,{ klaimOleh: penggantiUid, viaIzin: ref.id });
          }
        }
        logAudit("CREATE","izin",ref.id,{ alasan, mulai, selesai });
        showToast(pesanSuksesIzin(alasan));
        renderDashboard();
      }catch(err){ showToast("Gagal mengirim izin: " + firebaseError(err), true); }
    });
  });
}

/* ============ 9. JILID & USTADZAH ============ */
function getJilidUstadzahIds(jilid){
  if(Array.isArray(jilid?.ustadzahIds) && jilid.ustadzahIds.length) return jilid.ustadzahIds.filter(Boolean);
  return jilid?.ustadzahId ? [jilid.ustadzahId] : [];
}
function isSubstituteActive(jilid){
  if(!jilid?.substituteUid || !jilid?.substituteUntil) return false;
  const today = todayStr();
  return jilid.substituteUntil >= today && (!jilid.substituteFrom || jilid.substituteFrom <= today);
}
const namaPengampu = (jilid, ustadzahList) => {
  const map = new Map(ustadzahList.map(u => [u.id, u.nama || u.email || "Ustadzah"]));
  return getJilidUstadzahIds(jilid).map(id => map.get(id) || "Ustadzah");
};
async function getEffectiveJilidIds(profile){
  const jilidList = await getCollectionData("jilid");
  const ids = new Set();
  jilidList.forEach(j => {
    const pengampu = getJilidUstadzahIds(j);
    if(pengampu.includes(profile.uid)) ids.add(j.id);
    if(!pengampu.length && (profile.jilidIds || [profile.jilidId]).includes(j.id)) ids.add(j.id);
    if(isSubstituteActive(j) && j.substituteUid === profile.uid) ids.add(j.id);
  });
  return [...ids];
}
async function getSantriUstadzah(){
  const ids = await getEffectiveJilidIds(currentProfile);
  if(!ids.length) return [];
  return (await getCollectionData("santri")).filter(s => ids.includes(s.jilidId));
}
async function getSantriWali(){
  return (await getCollectionData("santri")).filter(s => s.waliUid === currentProfile.uid && s.aktif !== false);
}

/* ============ 10. KEUANGAN HELPER ============ */
function getPeriodeSekarang(){
  const now = nowWIB();
  return { key: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`, year: now.getFullYear(), month: now.getMonth()+1, tanggal: now.getDate() };
}
function formatPeriodeLabel(key){
  if(!key) return "-";
  const [y,m] = key.split("-").map(Number);
  return y && m ? `${NAMA_BULAN[m-1]} ${y}` : key;
}
function daftarBulanTahunIni(){
  const { year, month } = getPeriodeSekarang();
  const list = [];
  for(let m = 1; m <= month; m++) list.push({ key: `${year}-${String(m).padStart(2,"0")}`, label: `${NAMA_BULAN[m-1]} ${year}` });
  return list.reverse();
}
function hitungStatusTagihan(nominal, terbayar){
  if(num(terbayar) <= 0) return "belum";
  return num(terbayar) >= num(nominal) ? "lunas" : "sebagian";
}
function badgeStatusTagihan(status){
  if(status === "lunas") return badge("Lunas","green");
  if(status === "sebagian") return badge("Sebagian","yellow");
  return badge("Belum bayar","red");
}
function isSppMenunggak(bill, tanggalPeringatan){
  if(!bill || bill.jenis !== "SPP" || bill.status === "lunas") return false;
  const { key, tanggal } = getPeriodeSekarang();
  return bill.periode < key || (bill.periode === key && tanggal >= num(tanggalPeringatan || 10));
}
const hitungSaldoTabungan = (list, santriId) =>
  list.filter(t => t.santriId === santriId).reduce((s,t) => s + (t.jenis === "tarik" ? -num(t.jumlah) : num(t.jumlah)), 0);
function hitungSaldoKas({ tagihan, infaqList, tabunganList, pengeluaranList }){
  const sum = (list, fn) => list.reduce((s,x) => s + num(fn(x)), 0);
  const sppTerbayar = sum(tagihan.filter(x => x.jenis === "SPP"), x => x.terbayar);
  const iuranTerbayar = sum(tagihan.filter(x => x.jenis === "Iuran Kegiatan"), x => x.terbayar);
  const infaqMasuk = sum(infaqList, x => x.jumlah);
  const pengeluaran = sum(pengeluaranList, x => x.jumlah);
  const tabunganSantri = sum(tabunganList, x => x.jenis === "tarik" ? -x.jumlah : x.jumlah);
  const saldoKas = sppTerbayar + iuranTerbayar + infaqMasuk - pengeluaran;
  return { sppTerbayar, iuranTerbayar, infaqMasuk, pengeluaran, tabunganSantri, saldoKas, totalUangDiKas: saldoKas + tabunganSantri };
}

let sppEnsuredPeriode = null;
async function ensureSppBulanIni(){
  const { key: periode } = getPeriodeSekarang();
  if(sppEnsuredPeriode === periode) return;
  try{
    const nominal = num((await getAppSettings()).sppNominal);
    if(nominal <= 0){ sppEnsuredPeriode = periode; return; }
    const [santriList, bills] = await Promise.all([getCollectionData("santri"), getCollectionData("tagihanSantri")]);
    const ada = new Set(bills.map(b => b.id));
    const baru = santriList.filter(s => s.aktif !== false && !ada.has(`spp_${s.id}_${periode}`));
    for(let i = 0; i < baru.length; i += 450){
      const batch = writeBatch(db);
      baru.slice(i, i + 450).forEach(s => {
        batch.set(doc(db, "tagihanSantri", `spp_${s.id}_${periode}`), {
          santriId: s.id, santriNama: s.nama || "-", jenis:"SPP", judul:`SPP ${formatPeriodeLabel(periode)}`,
          periode, kegiatanId:null, nominal, terbayar:0, status:"belum", riwayat:[],
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
      });
      await batch.commit();
    }
    if(baru.length) invalidateCache("tagihanSantri");
    sppEnsuredPeriode = periode;
  }catch(err){ console.warn("Gagal SPP otomatis:", err); }
}

  });

async function catatPembayaranTagihan(billId, { jumlah, metode, keterangan }){
  const bill = await getDocument("tagihanSantri", billId);
  if(!bill) throw new Error("Tagihan tidak ditemukan.");
  const riwayat = [...(bill.riwayat || []), {
    tanggal: new Date().toISOString(), jumlah: num(jumlah), metode: metode || "Tunai", keterangan: keterangan || "",
    dicatatOleh: currentProfile?.uid || "", dicatatOlehNama: currentProfile?.nama || ""
  }];
  const terbayar = riwayat.reduce((s,r) => s + num(r.jumlah), 0);
  const status = hitungStatusTagihan(bill.nominal, terbayar);
  await updateCollectionData("tagihanSantri", billId, { riwayat, terbayar, status });
  logAudit("BAYAR","tagihanSantri",billId,{ jumlah: num(jumlah), status });
}
async function buatIuranKegiatan({ nama, nominal, tanggalMulai, tanggalSelesai, target, targetNama, penerima }){
  const ref = await addCollectionData("kegiatan", { nama, nominal, tanggalMulai, tanggalSelesai, target, targetNama, penerima: penerima || "", aktif:true });
  const santriList = (await getCollectionData("santri")).filter(s => s.aktif !== false && (target === "semua" || s.jilidId === target));
  for(let i = 0; i < santriList.length; i += 450){
    const batch = writeBatch(db);
    santriList.slice(i, i + 450).forEach(s => {
      batch.set(doc(db, "tagihanSantri", `iuran_${s.id}_${ref.id}`), {
        santriId: s.id, santriNama: s.nama || "-", jenis:"Iuran Kegiatan", judul: nama, periode:null, kegiatanId: ref.id,
        nominal, terbayar:0, status:"belum", riwayat:[], createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
    });
    await batch.commit();
  }
  invalidateCache("tagihanSantri");
  await addCollectionData("pengumuman", {
    judul: `📢 Iuran Kegiatan: ${nama}`,
    isi: `Terdapat iuran kegiatan baru: "${nama}".\n\nNominal: ${formatRupiah(nominal)}\nPeriode: ${tanggalMulai || "-"} s/d ${tanggalSelesai || "-"}\nBerlaku untuk: ${targetNama || "Semua Santri"}\n` +
         (penerima ? `Pembayaran ditujukan kepada: ${penerima}\n` : "") + `\nSilakan melakukan pembayaran sesuai batas waktu.`,
    aktif:true,
    berlakuSampai: tanggalSelesai ? new Date(tanggalSelesai + "T23:59:59+07:00").toISOString() : null
  });
}

function openCatatPembayaranModal(billOrList, onSaved){
  // Normalisasi: terima single bill atau list
  const bills = Array.isArray(billOrList) ? billOrList : [billOrList];
  const belumLunas = bills.filter(b => b.status !== "lunas");

  if(!belumLunas.length){
    showToast("Tidak ada tagihan yang belum lunas.", true);
    return;
  }

  const isSpp = belumLunas[0].jenis === "SPP";
  const santriNama = belumLunas[0].santriNama || "-";

  // Urutkan
  belumLunas.sort((a,b) => {
    if(isSpp) return (a.periode||"").localeCompare(b.periode||"");
    return (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0);
  });

  const labelOf = b => isSpp
    ? formatPeriodeLabel(b.periode)
    : (b.judul || "Iuran");

  const sisaOf = b => Math.max(0, num(b.nominal) - num(b.terbayar));

  // Kalau 1 tagihan → langsung, tanpa pilih
  if(belumLunas.length === 1){
    return openFormPembayaranSatu({ bill: belumLunas[0], santriNama, isSpp, labelOf, sisaOf, onSaved });
  }

  // Kalau >1 tagihan → multi-select checkbox
  openModal(isSpp ? "Bayar SPP" : "Bayar Iuran", `
    <div class="notice" style="margin-bottom:12px">
      <b>${esc(santriNama)}</b><br>
      <span class="muted small">Centang tagihan yang mau dibayar (bisa lebih dari satu).</span>
    </div>

    <div class="form-group">
      <label>${isSpp ? "Pilih Bulan SPP" : "Pilih Iuran"}</label>
      <div class="check-grid" id="daftarTagihan" style="grid-template-columns:1fr;max-height:280px">
        ${belumLunas.map(b => {
          const sisa = sisaOf(b);
          return `<label style="justify-content:space-between;width:100%">
            <span style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" class="tagihan-check" value="${esc(b.id)}" data-sisa="${sisa}" checked>
              <span>${esc(labelOf(b))}</span>
            </span>
            <span style="font-weight:700;color:var(--primary)">${formatRupiah(sisa)}</span>
          </label>`;
        }).join("")}
      </div>
    </div>

    <div class="notice" id="bayarInfo" style="margin-top:8px"></div>

    <div class="form-group" style="margin-top:12px">
      <label for="bayarJumlah">Jumlah Dibayar (total)</label>
      <input id="bayarJumlah" type="number" min="1" inputmode="numeric" required>
      <div class="muted small" style="margin-top:4px">Nominal otomatis = total sisa tagihan tercentang. Bisa diubah untuk bayar sebagian.</div>
    </div>

    <div class="form-group">
      <label for="bayarMetode">Metode Pembayaran</label>
      <select id="bayarMetode"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select>
    </div>

    <div class="form-group">
      <label for="bayarKeterangan">Keterangan (opsional)</label>
      <textarea id="bayarKeterangan" rows="2" placeholder="Contoh: bayar 5 bulan sekaligus"></textarea>
    </div>

    <button type="button" class="btn btn-full" id="btnSimpanPembayaran" style="margin-top:8px">
      💾 Simpan Pembayaran
    </button>
  `);

  const cekTerpilih = () => [...document.querySelectorAll(".tagihan-check:checked")]
    .map(x => ({ billId: x.value, sisa: num(x.dataset.sisa) }));

  const updateInfo = () => {
    const terpilih = cekTerpilih();
    const total = terpilih.reduce((s,x) => s + x.sisa, 0);
    $("bayarJumlah").value = total;
    const info = $("bayarInfo");
    if(!terpilih.length){
      info.innerHTML = `<span style="color:var(--danger)">⚠️ Pilih minimal 1 tagihan.</span>`;
      return;
    }
    info.innerHTML = `<b>${terpilih.length} tagihan</b> terpilih · Total sisa: <b>${formatRupiah(total)}</b>`;
  };

  document.querySelectorAll(".tagihan-check").forEach(el =>
    el.addEventListener("change", updateInfo));
  updateInfo();

$("btnSimpanPembayaran").addEventListener("click", async () => {
  const terpilih = cekTerpilih();
  const jumlahTotal = num($("bayarJumlah").value);
  if(!terpilih.length) return showToast("Pilih minimal 1 tagihan.", true);
  if(jumlahTotal <= 0) return showToast("Jumlah harus lebih dari 0.", true);

  const btn = $("btnSimpanPembayaran");
  await busy(btn, "Menyimpan...", async () => {
    try{
      const metode = $("bayarMetode").value;
      const keterangan = $("bayarKeterangan").value.trim();

      if(terpilih.length === 1){
        await catatPembayaranTagihan(terpilih[0].billId, {
          jumlah: jumlahTotal, metode, keterangan
        });
      } else {
        let sisaDana = jumlahTotal;
        for(const t of terpilih){
          if(sisaDana <= 0) break;
          const bill = belumLunas.find(b => b.id === t.billId);
          if(!bill) continue;
          const sisaTagihan = Math.max(0, num(bill.nominal) - num(bill.terbayar));
          const bayarSekarang = Math.min(sisaTagihan, sisaDana);
          if(bayarSekarang > 0){
            await catatPembayaranTagihan(t.billId, {
              jumlah: bayarSekarang, metode,
              keterangan: keterangan || `Bayar ${terpilih.length} tagihan sekaligus`
            });
            sisaDana -= bayarSekarang;
          }
        }
      }

      showToast("Pembayaran dicatat.");
      closeModal();          // ← TAMBAH: auto-close modal pembayaran
      onSaved?.();           // ← Callback (mis. refresh modal keuangan)
    }catch(err){
      console.error(err);
      showToast("Gagal menyimpan: " + firebaseError(err), true);
    }
  });
});
}

function hitungRekapPembelajaran(list){
  const total = list.length;
  const naik = list.filter(r => r.status === "naik").length;
  const sorted = list.slice().sort(byCreatedDesc);
  const tren = [];
  const today = nowWIB();
  for(let i = 6; i >= 0; i--){
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = dateKey(d);
    const hari = list.filter(r => tsKey(r.createdAt) === key);
    tren.push({
      label: `${d.getDate()}/${d.getMonth()+1}`,
      naik: hari.filter(r => r.status === "naik").length,
      mengulang: hari.filter(r => r.status === "mengulang").length,
      total: hari.length
    });
  }
  return {
    total, naik, mengulang: list.filter(r => r.status === "mengulang").length,
    baca: list.filter(r => r.tipe === "baca").length, hafalan: list.filter(r => r.tipe === "hafalan").length,
    terakhirBaca: sorted.find(r => r.tipe === "baca") || null,
    terakhirHafalan: sorted.find(r => r.tipe === "hafalan") || null,
    tren, persenNaik: total ? Math.round(naik / total * 100) : 0
  };
}

const halamanImageCache = new Map();
const halamanDocId = (jilidId, tipe, halaman) => `${jilidId}_${tipe}_${halaman}`;

function validatePdfFile(file){
  if(!file) throw new Error("File PDF belum dipilih.");
  if(!(file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf"))) throw new Error("File harus berformat PDF.");
  if(file.size > APP_CONFIG.maxPdfSize) throw new Error(`Ukuran PDF maksimal ${formatFileSize(APP_CONFIG.maxPdfSize)}.`);
}
async function fetchHalamanGambar(jilidId, tipe, halaman){
  if(!jilidId || !tipe || !halaman) return null;
  const id = halamanDocId(jilidId, tipe, halaman);
  if(halamanImageCache.has(id)) return halamanImageCache.get(id);
  const snap = await getDoc(doc(db, "jilidHalaman", id));
  const gambar = snap.exists() ? (snap.data().gambar || null) : null;
  if(gambar) halamanImageCache.set(id, gambar);
  return gambar;
}
async function deleteHalamanRange(jilidId, tipe, dari, sampai){
  for(let p = dari; p <= sampai; p++){
    const id = halamanDocId(jilidId, tipe, p);
    halamanImageCache.delete(id);
    try{ await deleteDoc(doc(db, "jilidHalaman", id)); }catch{ /* sudah tidak ada */ }
  }
}
let pdfJsPromise = null;
async function loadPdfJs(){
  const resolve = () => window.pdfjsLib || window["pdfjs-dist/build/pdf"] || null;
  if(!resolve()){
    pdfJsPromise ??= new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = APP_CONFIG.pdfJsScriptUrl;
      s.onload = () => resolve() ? ok(resolve()) : fail(new Error("Pustaka pdf.js tidak dikenali browser."));
      s.onerror = () => { pdfJsPromise = null; fail(new Error("Gagal memuat pdf.js dari CDN.")); };
      document.head.appendChild(s);
    });
    await pdfJsPromise;
  }
  const lib = resolve();
  lib.GlobalWorkerOptions.workerSrc = APP_CONFIG.pdfJsWorkerUrl;
  return lib;
}
function canvasKeDataUrl(canvas, mime, quality){
  try{
    const url = canvas.toDataURL(mime, quality);
    if(mime !== "image/png" && url.startsWith("data:image/png")) return null;
    return url;
  }catch{ return null; }
}
async function renderPageToDataUrl(pdfPage, maxBytes){
  const baseViewport = pdfPage.getViewport({ scale: 1 });
  const maxDimAwal = APP_CONFIG.pdfMaxDim;
  const skalaAwal = Math.min(2, maxDimAwal / Math.max(baseViewport.width, baseViewport.height));
  let scale = Math.max(0.6, skalaAwal);
  let quality = APP_CONFIG.imageQualityAwal;
  let last = null;
  const mime = APP_CONFIG.imageMime;

  for(let i = 0; i < 8; i++){
    const viewport = pdfPage.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(viewport.width));
    canvas.height = Math.max(1, Math.round(viewport.height));
    const ctx = canvas.getContext("2d", { alpha:false });
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await pdfPage.render({ canvasContext: ctx, viewport }).promise;
    const url = canvasKeDataUrl(canvas, mime, quality);
    last = url || canvas.toDataURL("image/jpeg", quality);
    if(Math.ceil(last.length * 0.75) <= maxBytes) return last;
    if(quality > APP_CONFIG.imageQualityMin) quality = Math.max(APP_CONFIG.imageQualityMin, quality - 0.1);
    else scale = Math.max(0.55, scale - 0.15);
  }
  return last;
}
async function uploadPdfPerPage(file, jilidId, tipe, onProgress){
  validatePdfFile(file);
  const pdfjs = await loadPdfJs();
  const pdfDoc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  for(let p = 1; p <= pdfDoc.numPages; p++){
    const dataUrl = await renderPageToDataUrl(await pdfDoc.getPage(p), APP_CONFIG.maxHalamanBytes);
    if(!dataUrl) throw new Error(`Gagal memproses halaman ${p}.`);
    const id = halamanDocId(jilidId, tipe, p);
    await setDoc(doc(db, "jilidHalaman", id), { jilidId, tipe, halaman: p, gambar: dataUrl, updatedAt: serverTimestamp() });
    halamanImageCache.set(id, dataUrl);
    onProgress?.(p, pdfDoc.numPages);
  }
  return pdfDoc.numPages;
}

function bindPdfUploader(type, jilidId, initialTotal, persist){
  let total = num(initialTotal);
  const label = type === "baca" ? "Buku Baca" : "Buku Hafalan";
  const el = id => $(`${id}_${type}`);

  function renderCurrent(){
    el("pdfCurrent").innerHTML = total > 0 ? `<div class="pdf-current">✅ ${total} halaman tersimpan.
      <div class="actions" style="margin-top:7px"><button type="button" class="btn btn-sm" id="pdfView_${type}">👁 Lihat buku</button>
      <button type="button" class="btn btn-sm btn-danger" id="pdfDel_${type}">🗑 Hapus semua</button></div></div>`
      : `<div class="muted small" style="margin-top:8px">Belum ada halaman.</div>`;
    el("pdfView")?.addEventListener("click", () => openHalamanViewer({ jilidId, tipe:type, halaman:1, totalHalaman:total, label }));
    el("pdfDel")?.addEventListener("click", async () => {
      if(!confirm(`Hapus semua ${total} halaman ${label}?`)) return;
      try{
        await deleteHalamanRange(jilidId, type, 1, total);
        total = 0; await persist?.(0); renderCurrent();
        showToast(`Semua halaman ${label} dihapus.`);
      }catch(err){ showToast("Gagal menghapus: " + err.message, true); }
    });
  }
  renderCurrent();

  el("pdfFile").addEventListener("change", () => {
    const file = el("pdfFile").files?.[0];
    if(!file){ el("pdfInfo").textContent = PDF_INFO_DEFAULT; return; }
    try{
      validatePdfFile(file);
      el("pdfInfo").innerHTML = `<b>📄 ${esc(file.name)}</b> · ${formatFileSize(file.size)} · siap.`;
    }catch(err){ el("pdfFile").value = ""; el("pdfInfo").textContent = err.message; showToast(err.message, true); }
  });

  el("pdfUploadBtn").addEventListener("click", async () => {
    const file = el("pdfFile").files?.[0];
    if(!file) return showToast("Pilih file PDF terlebih dahulu.", true);
    const oldTotal = total, btn = el("pdfUploadBtn");
    try{
      validatePdfFile(file);
      btn.disabled = true; btn.textContent = "⏳ Memproses...";
      el("pdfProg").classList.add("active");
      el("pdfBar").style.width = "0%";
      el("pdfText").textContent = "Menyiapkan...";
      const pages = await uploadPdfPerPage(file, jilidId, type, (cur, all) => {
        const pct = Math.round(cur / all * 100);
        el("pdfBar").style.width = pct + "%";
        el("pdfText").textContent = `Upload ${cur} / ${all} (${pct}%)...`;
      });
      if(oldTotal > pages) await deleteHalamanRange(jilidId, type, pages + 1, oldTotal);
      total = pages; await persist?.(total);
      el("pdfText").textContent = `Selesai. ${pages} halaman tersimpan.`;
      el("pdfInfo").innerHTML = `<b>✅ ${esc(file.name)}</b> · ${pages} halaman diupload.`;
      renderCurrent();
      showToast(`${label}: ${pages} halaman diupload.`);
    }catch(err){
      console.error(err);
      el("pdfText").textContent = err.message;
      showToast(err.message, true);
    }finally{ btn.disabled = false; btn.textContent = "☁️ Upload"; }
  });
  return { getTotal: () => total };
}

async function navigate(tab){

  // Update active state di chips
  $("mainChips").querySelectorAll("button").forEach(b =>

  window.scrollTo({ top: 0, behavior: "instant" });
 const map = {
    dashboard:  () => renderDashboard(),
    pengumuman: () => renderPengumuman(),
    dataUser:   () => renderDataUserAdmin(),
    ruangNgaji: () => renderRuangNgajiAdmin(),
    keuangan:   () => renderKeuanganAdmin(),

  };
  const fn = map[tab];

/* ============ HELPER MENU GRID ============ */
function scrollPanelIntoView(panel){
  if(!panel) return;
  const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--topbar-h")) || 56;
  const rect = panel.getBoundingClientRect();
  const y = window.scrollY + rect.top - topbarH - 8;
  window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
}

function bindMenuGrid(menuId){
  const menuEl = $(menuId);
  if(!menuEl) return;
  const panelScope = document.getElementById("page") || document;
  let panelAktif = null;

  menuEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const target = b.dataset.menu;
    const panel = panelScope.querySelector(`#panel-${target}`);
    if(!panel) return;
    const semuaPanel = panelScope.querySelectorAll(".menu-panel");

    if(panelAktif === target){
      menuEl.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      semuaPanel.forEach(p => p.classList.remove("show"));
      panelAktif = null;
      return;
    }

    menuEl.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
    semuaPanel.forEach(p => p.classList.toggle("show", p === panel));
    panelAktif = target;
    setTimeout(() => scrollPanelIntoView(panel), 60);
  }));
}

function lazyPanel(panelId, loader){
  const panel = $(panelId);
  if(!panel) return;
  if(panel.dataset.loaded === "1") return;
  panel.dataset.loaded = "1";
  loader?.(panel);
  // Setelah konten terisi, scroll ulang dengan offset
  setTimeout(() => scrollPanelIntoView(panel), 120);
}

  const progress = (await getCollectionData("progress")).find(x => x.santriId === santriId && x.tipe === tipe);
  let current = Math.min(total, Math.max(1, num(progress?.halaman) || 1));

        <img id="halImage" class="pdf-page-img" alt="Halaman buku" decoding="async">
      </div>

  // Override modal-box → full screen untuk viewer
  const modalBox = $("modalContent").closest(".modal-box");
  modalBox.style.maxWidth = "none";
  modalBox.style.width = "100%";
  modalBox.style.height = "100vh";
  modalBox.style.height = "100dvh";
  modalBox.style.maxHeight = "100vh";
  modalBox.style.maxHeight = "100dvh";
  modalBox.style.borderRadius = "0";
  modalBox.style.padding = "0";
  modalBox.style.display = "flex";
  modalBox.style.flexDirection = "column";
  modalBox.style.overflow = "hidden";

  const observer = new MutationObserver(() => {
    if($("modal").classList.contains("hidden")){
      modalBox.style.cssText = "";
      observer.disconnect();
    }
  });
  observer.observe($("modal"), { attributes:true, attributeFilter:["class"] });

  const modalHeader = modalBox.querySelector(".modal-header");
  if(modalHeader){
    modalHeader.style.position = "absolute";
    modalHeader.style.top = "8px";
    modalHeader.style.right = "8px";
    modalHeader.style.zIndex = "10";
    modalHeader.style.marginBottom = "0";
    modalHeader.style.padding = "0";
    modalHeader.style.borderBottom = "none";
    modalHeader.style.background = "transparent";
    const h3 = modalHeader.querySelector("h3");
    if(h3) h3.style.display = "none";
  }

  const img = $("halImage");
  async function load(){
    $("halIndicator").textContent = `Halaman ${current}${total ? `/${total}` : ""}`;
    $("halInfoPage").textContent = `Hal ${current} / ${total}`;
    $("halLoading").classList.remove("hidden");
    try{
      const gambar = await fetchHalamanGambar(jilid.id, tipe, current);
      if(gambar) img.src = gambar;
      else{ img.removeAttribute("src"); showToast(`Halaman ${current} belum tersedia.`, true); }
    }catch(err){ showToast("Gagal memuat: " + firebaseError(err), true); }
    finally{ $("halLoading").classList.add("hidden"); }
    if(current < total) fetchHalamanGambar(jilid.id, tipe, current + 1).catch(() => {});
    if(current > 1) fetchHalamanGambar(jilid.id, tipe, current - 1).catch(() => {});
  }
  $("halPrev").addEventListener("click", () => { current = Math.max(1, current - 1); load(); });
  $("halNext").addEventListener("click", () => { if(current < total){ current++; load(); } });

  const konfirmasiDanSimpan = (status) => {
    openKonfirmasiPesanModal({
      santri, tipe, jilid, halaman: current, status,
      pesanAwal: progress?.pesan || "",
      onSaved: () => closeModal()
    });
  };
  $("btnNaikModal").addEventListener("click", () => konfirmasiDanSimpan("naik"));
  $("btnMengulangModal").addEventListener("click", () => konfirmasiDanSimpan("mengulang"));

  // Swipe navigasi
  let sx = 0, sy = 0, tracking = false;
  const wrap = $("halFrameWrap");
  wrap.addEventListener("touchstart", e => {
    if(e.touches.length !== 1){ tracking = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    tracking = true;
  }, { passive:true });
  wrap.addEventListener("touchmove", e => {
    if(!tracking || e.touches.length !== 1) return;
    const dx = Math.abs(e.touches[0].clientX - sx);
    const dy = Math.abs(e.touches[0].clientY - sy);
    if(dy > dx + 6) tracking = false;
  }, { passive:true });
  wrap.addEventListener("touchend", e => {
    if(!tracking || !e.changedTouches.length){ tracking = false; return; }
    tracking = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 70) return;
    if(Math.abs(dy) > Math.abs(dx) * 0.7) return;
    if(dx < 0 && current < total){ current++; load(); }
    else if(dx > 0 && current > 1){ current--; load(); }
  }, { passive:true });

  load();
}

function openKonfirmasiPesanModal({ santri, tipe, jilid, halaman, status, pesanAwal, onSaved }){
  const isNaik = status === "naik";
  const labelTipe = tipe === "hafalan" ? "🧠 Buku Hafalan" : "📖 Buku Baca";
  const badgeStatus = isNaik
    ? `<span class="badge badge-green">Naik</span>`
    : `<span class="badge badge-yellow">Mengulang</span>`;

  const kontenUtama = $("modalContent").innerHTML;
  const judulUtama = $("modalTitle").textContent;

  openModal(isNaik ? "✅ Konfirmasi Naik" : "🔄 Konfirmasi Mengulang", `
    <div class="notice">
      <div style="margin-bottom:6px">
        <b>${esc(santri.nama)}</b> · ${esc(jilid.nama)}
      </div>
      <div class="muted small">${labelTipe} · Halaman <b>${halaman}</b></div>
      <div style="margin-top:8px">
        Status: ${badgeStatus}
      </div>
    </div>
    <div class="form-group">
      <label for="pesanKonfirmasi">💬 Pesan Ustadzah (opsional)</label>
      <textarea id="pesanKonfirmasi" rows="4" placeholder="Catatan untuk wali...">${esc(pesanAwal)}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button type="button" class="btn btn-light" id="btnBatalKonfirmasi">Batal</button>
      <button type="button" class="btn ${isNaik ? "btn-success" : "btn-warning"}" id="btnSimpanKonfirmasi">
        💾 Simpan
      </button>
    </div>
  `);

  const pesanEl = $("pesanKonfirmasi");
  pesanEl?.focus();

  $("btnBatalKonfirmasi").addEventListener("click", () => {
    openModal(judulUtama, kontenUtama);
  });

  $("btnSimpanKonfirmasi").addEventListener("click", async () => {
    const btn = $("btnSimpanKonfirmasi");
    await busy(btn, "Menyimpan...", async () => {
      try{
        await saveProgress({
          santriId: santri.id, tipe,
          halaman, status,
          pesan: $("pesanKonfirmasi").value.trim()
        });
        onSaved?.();
      }catch(err){
        showToast("Gagal menyimpan: " + firebaseError(err), true);
      }
    });
  });
}

  const santri = (await getCollectionData("santri")).find(x => x.id === santriId);
  if(!santri) return showToast("Santri tidak ditemukan.", true);

  // Paksa fresh untuk tagihan & tabungan
  const [settings, tagihan, tabunganList] = await Promise.all([
    getAppSettings(), fresh("tagihanSantri"), fresh("tabungan")
  ]);
  const bills = tagihan.filter(x => x.santriId === santriId);
  
// Wali tidak boleh edit (bayar/backfill/setor/tarik)
const editable = currentProfile.role !== "wali";

openModal(`💰 Keuangan — ${esc(santri.nama)}`, `
  <div id="keuanganModalContent">${keuanganSantriHtml({ bills, tabunganList, santriId, settings, editable })}</div>
`);

  const bind = (billsNow, tabunganNow) => {
    const scope = $("keuanganModalContent");
    if(!scope) return;

  // Wali tidak boleh aksi apapun — tombol tidak dirender karena editable=false
  if(!editable) return;

    scope.querySelectorAll("[data-aksi]").forEach(b =>
      b.addEventListener("click", () => {
        const aksi = b.dataset.aksi;

if(aksi === "spp"){
  const sppBelum = billsNow.filter(x => x.jenis === "SPP" && x.status !== "lunas");
  if(!sppBelum.length) return showToast("Semua SPP sudah lunas.", true);
  openCatatPembayaranModal(sppBelum, () => openKeuanganSantriModal(santriId));
}
else if(aksi === "iuran"){
  const iuranBelum = billsNow.filter(x => x.jenis === "Iuran Kegiatan" && x.status !== "lunas");
  if(!iuranBelum.length) return showToast("Semua iuran sudah lunas.", true);
  openCatatPembayaranModal(iuranBelum, () => openKeuanganSantriModal(santriId));
}
else if(aksi === "backfill"){
  openBackfillNunggakModal({
    santri,
    settings,
    onSuccess: async () => {
      // 1. Ambil data terbaru dari Firestore
      const freshTagihan = await fresh("tagihanSantri");
      const billsBaru = freshTagihan.filter(x => x.santriId === santriId);
      const sppBelum = billsBaru.filter(x => x.jenis === "SPP" && x.status !== "lunas");

      // 2. Tutup modal keuangan lama, buka ulang dengan data baru

      await openKeuanganSantriModal(santriId);

      // 3. Setelah modal keuangan ter-render dengan data baru,
      //    baru buka modal bayar SPP
      if(sppBelum.length){
        setTimeout(() => {
          openCatatPembayaranModal(sppBelum, () => {
            // Setelah bayar, refresh modal keuangan
            openKeuanganSantriModal(santriId);
          });
        }, 350);
      }
    }
  });
}
        else if(aksi === "setor"){
          openTabunganModal({
            santriList: [santri], tabunganList: tabunganNow, jenis: "setor",
            santriId: santri.id, onSaved: reload
          });
        }
        else if(aksi === "tarik"){
          openTabunganModal({
            santriList: [santri], tabunganList: tabunganNow, jenis: "tarik",
            santriId: santri.id, onSaved: reload
          });
        }
      }));
  };

  const reload = async () => {
  const [t, tb] = await Promise.all([fresh("tagihanSantri"), fresh("tabungan")]);
  const b = t.filter(x => x.santriId === santriId);
  const wrap = $("keuanganModalContent");
  if(!wrap) return;
  wrap.innerHTML = keuanganSantriHtml({ bills:b, tabunganList:tb, santriId, settings, editable });
  bind(b, tb);
};
  bind(bills, tabunganList);
}

/* ============ PENGUMUMAN (tab utama) ============ */
async function renderPengumuman(){
  const isAdmin = currentProfile.role === "admin";
  const all = await fresh("pengumuman");
  let filterStatus = "semua";

  const terapkanFilter = list => {
    if(!isAdmin) return list.filter(isPengumumanTampil);
    if(filterStatus === "semua") return list;
    if(filterStatus === "aktif") return list.filter(p => p.aktif !== false && p.manualHidden !== true && !isPengumumanKadaluarsa(p));
    if(filterStatus === "kadaluarsa") return list.filter(p => isPengumumanKadaluarsa(p));
    if(filterStatus === "disembunyikan") return list.filter(p => p.manualHidden === true || p.aktif === false);
    return list;
  };

  function renderKonten(){
    const data = terapkanFilter(all).sort(byCreatedDesc);
    $("listPengumuman").innerHTML = data.length ? data.map(p => {
      const redup = isPengumumanKadaluarsa(p) || p.manualHidden === true;
      const tersembunyi = redup || p.aktif === false;
      return `<div class="card ${redup ? "soft" : ""}" style="${redup ? "opacity:.75" : ""}">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div>
            <h3 style="margin:0">${esc(p.judul || "-")}</h3>
            <div class="muted small" style="margin-top:4px">Dibuat: ${formatTanggal(p.createdAt)}</div>
            ${p.berlakuSampai ? `<div class="muted small">Berlaku sampai: <b>${formatTanggalJam(p.berlakuSampai)}</b></div>` : ""}
          </div>
          ${isAdmin ? badgeStatusPengumuman(p) : ""}
        </div>
        <p style="white-space:pre-wrap;line-height:1.6;margin-top:10px">${esc(p.isi || "")}</p>
        ${isAdmin ? `<div class="actions">
          <button class="btn btn-sm btn-info" data-edit="${esc(p.id)}">✏️ Edit</button>
          ${tersembunyi
            ? `<button class="btn btn-sm btn-success" data-tampilkan="${esc(p.id)}">👁 Tampilkan</button>`
            : `<button class="btn btn-sm btn-warning" data-sembunyikan="${esc(p.id)}">🙈 Sembunyikan</button>`}
          <button class="btn btn-sm btn-danger" data-remove="${esc(p.id)}">🗑 Hapus</button>
        </div>` : ""}
      </div>`;
    }).join("") : `<div class="card empty">Belum ada pengumuman.</div>`;
    bindActions();
  }

  function bindActions(){
    if(!isAdmin) return;
    const act = async (fn, okMsg) => { try{ await fn(); showToast(okMsg); renderPengumuman(); }catch(err){ showToast(firebaseError(err), true); } };
    const onClick = (sel, attr, handler) => $("listPengumuman").querySelectorAll(sel).forEach(b => b.addEventListener("click", () => handler(b.dataset[attr])));
    onClick("[data-edit]", "edit", id => openPengumumanForm(all.find(x => x.id === id)));
    onClick("[data-remove]", "remove", id => confirm("Hapus pengumuman ini permanen?") &&
      act(async () => { await deleteCollectionData("pengumuman", id); logAudit("DELETE","pengumuman",id); }, "Pengumuman dihapus."));
    onClick("[data-sembunyikan]", "sembunyikan", id => confirm("Sembunyikan pengumuman ini?") &&
      act(async () => {
        await updateCollectionData("pengumuman", id, { manualHidden:true, hiddenAt: new Date().toISOString(), hiddenBy: currentProfile.nama || "" });
        logAudit("UPDATE","pengumuman",id,{ manualHidden:true });
      }, "Pengumuman disembunyikan."));
    onClick("[data-tampilkan]", "tampilkan", id => act(async () => {
      const item = all.find(x => x.id === id);
      const updates = { manualHidden:false, aktif:true };
      if(item && isPengumumanKadaluarsa(item)) updates.berlakuSampai = null;
      await updateCollectionData("pengumuman", id, updates);
      logAudit("UPDATE","pengumuman",id,{ ditampilkanLagi:true });
    }, "Pengumuman ditampilkan kembali."));
  }

  const hitung = {
    semua: all.length,
    aktif: all.filter(p => p.aktif !== false && p.manualHidden !== true && !isPengumumanKadaluarsa(p)).length,
    kadaluarsa: all.filter(isPengumumanKadaluarsa).length,
    disembunyikan: all.filter(p => p.manualHidden === true || p.aktif === false).length
  };

  $("page").innerHTML = `
    ${pageHead("📢 Pengumuman",
      isAdmin ? "Semua pengumuman, termasuk yang kadaluarsa." : "Informasi terbaru dari admin TPQ.",
      isAdmin ? `<button class="btn" id="btnTambahPengumuman">+ Buat</button>` : "")}
    ${isAdmin ? `<div class="tabs" id="filterPengumuman" style="margin-bottom:12px">
      <button data-f="semua" class="active">Semua (${hitung.semua})</button>
      <button data-f="aktif">Aktif (${hitung.aktif})</button>
      <button data-f="kadaluarsa">Kadaluarsa (${hitung.kadaluarsa})</button>
      <button data-f="disembunyikan">Disembunyikan (${hitung.disembunyikan})</button>
    </div>` : ""}
    <div class="grid grid-2" id="listPengumuman"></div>`;

  if(isAdmin){
    $("btnTambahPengumuman").addEventListener("click", () => openPengumumanForm(null));
    $("filterPengumuman").querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
      filterStatus = b.dataset.f;
      $("filterPengumuman").querySelectorAll("[data-f]").forEach(x => x.classList.toggle("active", x === b));
      renderKonten();
    }));
  }
  renderKonten();
}

function openPengumumanForm(item){
  const toLocal = value => {
    const d = toDate(value); if(!d) return "";
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  openFormModal({
    title: item ? "Edit pengumuman" : "Buat pengumuman", submit: "Simpan pengumuman",
    body: `${fg("Judul", `<input id="pgmJudul" value="${esc(item?.judul)}" required>`)}
      ${fg("Isi pengumuman", `<textarea id="pgmIsi" rows="7" required>${esc(item?.isi)}</textarea>`)}
      ${fg("⏰ Berlaku sampai (opsional)", `<input id="pgmSampai" type="datetime-local" value="${toLocal(item?.berlakuSampai)}">
        <div class="muted small" style="margin-top:4px">Setelah waktu ini, pengumuman otomatis disembunyikan.</div>`)}
      ${fg("Status", `<select id="pgmAktif"><option value="true" ${item?.aktif !== false ? "selected" : ""}>Aktif</option><option value="false" ${item?.aktif === false ? "selected" : ""}>Nonaktif</option></select>`)}
      ${item && isPengumumanKadaluarsa(item) ? `<div class="notice">Sudah kadaluarsa pada ${formatTanggalJam(item.berlakuSampai)}.</div>` : ""}`,
    onSubmit: async () => {
      const sampai = $("pgmSampai").value;
      const payload = {
        judul: $("pgmJudul").value.trim(), isi: $("pgmIsi").value.trim(),
        aktif: $("pgmAktif").value === "true", berlakuSampai: sampai ? new Date(sampai).toISOString() : null
      };
      if(item?.manualHidden === true && payload.aktif) payload.manualHidden = false;
      if(item){ await updateCollectionData("pengumuman", item.id, payload); logAudit("UPDATE","pengumuman",item.id); }
      else{ const ref = await addCollectionData("pengumuman", payload); logAudit("CREATE","pengumuman",ref.id,{ judul: payload.judul }); }
      showToast("Pengumuman disimpan.");
      renderPengumuman();
    }
  });
}

function openAkunForm(role, item, onSaved, jilidList=[]){
  const isUstadzah = role === "ustadzah";
  const label = isUstadzah ? "ustadzah" : "wali";
  const kelasAwal = item ? jilidList.filter(j => getJilidUstadzahIds(j).includes(item.id)).map(j => j.id) : [];
  openFormModal({
    title: item ? `Edit ${label}` : `Buat akun ${label}`,
    body: `${fg("Nama", `<input id="akunNama" value="${esc(item?.nama)}" required>`)}
      ${fg("Email", `<input id="akunEmail" type="email" value="${esc(item?.email)}" ${item ? "disabled" : ""} required>`)}
      ${!item ? fg("Password awal", `<input id="akunPassword" type="password" minlength="6" placeholder="Minimal 6 karakter" required>`) : ""}
      ${fg("Telepon", `<input id="akunTelepon" value="${esc(item?.telepon)}" placeholder="08xxxxxxxxxx">`)}
      ${isUstadzah
        ? fg("Kelas / jilid diampu", `<div class="check-grid">${jilidList.length ? jilidList.map(k => `
            <label><input type="checkbox" class="jilid-check" value="${esc(k.id)}" ${kelasAwal.includes(k.id) ? "checked" : ""}>${esc(k.nama)}</label>`).join("")
            : `<span class="muted small">Belum ada kelas/jilid.</span>`}</div>`)
        : fg("Alamat", `<textarea id="akunAlamat" rows="2">${esc(item?.alamat)}</textarea>`)}
      ${fg("Status", `<select id="akunAktif"><option value="true" ${item?.aktif !== false ? "selected" : ""}>Aktif</option><option value="false" ${item?.aktif === false ? "selected" : ""}>Nonaktif</option></select>`)}`,
    onSubmit: async () => {
      const profile = { nama: $("akunNama").value.trim(), telepon: $("akunTelepon").value.trim(), aktif: $("akunAktif").value === "true" };
      let terpilih = [];
      if(isUstadzah){
        terpilih = [...document.querySelectorAll(".jilid-check:checked")].map(x => x.value);
        const names = jilidList.filter(k => terpilih.includes(k.id)).map(k => k.nama);
        Object.assign(profile, { jilidIds: terpilih, jilidNames: names, jilidId: terpilih[0] || null, jilidNama: names[0] || null });
      }else profile.alamat = $("akunAlamat").value.trim();

      let uid = item?.id;
      if(item) await updateManagedAccount(uid, role, profile);
      else uid = await createManagedAccount({ email: $("akunEmail").value.trim(), password: $("akunPassword").value, role, profile });

      if(isUstadzah){
        for(const j of jilidList){
          const ids = getJilidUstadzahIds(j), punya = ids.includes(uid), mau = terpilih.includes(j.id);
          if(punya === mau) continue;
          await updateCollectionData("jilid", j.id, { ustadzahIds: mau ? [...ids, uid] : ids.filter(x => x !== uid) });
        }
      }
      logAudit(item ? "UPDATE" : "CREATE", role, uid);
      showToast(`Data ${label} disimpan.`);
      onSaved?.();
    }
  });
}
