<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f3d22">
<meta name="description" content="Sistem Informasi TPQ Wardatul Wathon Tukum Kidul Lumajang">
<title>TPQ Wardatul Wathon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#166534; --primary-dark:#0f3d22; --primary-soft:#f0fdf4; --accent:#22c55e;
  --bg:#f5f7f6; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e5e9ee;
  --danger:#dc2626; --warning:#d97706; --info:#2563eb; --success:#16a34a;
  --sidebar:230px; --radius:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 10px rgba(15,23,42,.04);
  --tap:44px; /* ukuran minimum tombol di HP */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin-bottom:4px}
p{margin:0 0 8px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#166534 0%,#0f3d22 60%,#052e16 100%)}
.login-card{width:100%;max-width:390px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.login-logo{width:60px;height:60px;margin:0 auto 14px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
.login-title,.login-subtitle{text-align:center}
.login-subtitle{color:var(--muted);margin-top:4px}
.login-error{min-height:18px;color:var(--danger);text-align:center;font-size:12.5px;margin-top:10px}
.link-btn{border:0;background:none;color:var(--primary);font-weight:600;padding:6px;font-size:13px}

/* ---------- FORM ---------- */
.form-group{margin-bottom:12px}
.form-group>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#334155}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,.12)}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:var(--muted);cursor:not-allowed}
input[type="checkbox"]{width:auto;margin:0;accent-color:var(--primary);cursor:pointer}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:190px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:10px}
.check-grid label{display:flex;align-items:center;gap:8px;font-weight:400;font-size:13px;cursor:pointer;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- BUTTON ---------- */
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--primary);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:background .15s,opacity .15s,transform .1s}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-full{width:100%}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-icon{padding:8px;min-width:36px}
.btn-danger{background:var(--danger)} .btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning)} .btn-warning:hover{background:#b45309}
.btn-info{background:var(--info)} .btn-info:hover{background:#1d4ed8}
.btn-success{background:var(--success)} .btn-success:hover{background:#15803d}
.btn-light{background:#eef2f0;color:var(--text)} .btn-light:hover{background:#dde4e0}

/* ---------- LAYOUT ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--primary-dark);color:#fff;z-index:100;padding:16px 10px;overflow-y:auto;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.brand-icon{width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.brand-name{font-size:12.5px;font-weight:700;line-height:1.25}
.brand-role{display:block;margin-top:2px;color:#bbf7d0;font-size:10.5px;font-weight:400}
.nav{display:grid;gap:3px}
.nav button{border:0;background:transparent;color:#d1fae5;width:100%;text-align:left;border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:9px;transition:background .15s;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50}
.top-left,.user-area{display:flex;align-items:center;gap:8px}
.page-title{font-weight:700;font-size:14.5px}
.user-area{font-size:13px}
.page{padding:18px;max-width:1400px;margin:0 auto;width:100%;flex:1}
.mobile-menu{display:none}
.page-head,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{font-size:19px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.search-box{max-width:240px}
.stack>*+*{margin-top:14px}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:3px;background:#fff;padding:4px;border-radius:11px;border:1px solid var(--border);overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:8px;font-weight:600;font-size:12.5px;white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{background:#f1f5f3;color:var(--text)}
.tabs button.active{background:var(--primary);color:#fff}

/* ---------- CARD ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.soft{background:#f8faf9;box-shadow:none}
.card.warn{background:#fffbeb;border-color:#fde68a}
.card.danger{background:#fef2f2;border-color:#fecaca}
.card.info{background:#eff6ff;border-color:#bfdbfe}
.card.ok{background:var(--primary-soft);border-color:#bbf7d0}
.stat-icon{font-size:20px}
.stat-label{color:var(--muted);font-size:12.5px;margin-top:6px}
.stat-value{font-size:22px;font-weight:700;margin-top:2px}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.balance{background:var(--primary);color:#fff;border:0;margin-bottom:14px}
/* ---------- GRID MENU (ala mobile banking) ---------- */
.menu-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  margin:0 0 14px;
  padding:12px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.menu-grid button{
  border:0;
  background:transparent;
  padding:8px 4px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:600;
  color:var(--text);
  transition:background .15s, transform .1s;
  min-height:72px;
}
.menu-grid button:hover{background:#f1f5f3}
.menu-grid button:active{transform:scale(.96)}
.menu-grid button .ico{
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:13px;
  background:var(--primary-soft);
  font-size:19px;
  color:var(--primary);
  flex-shrink:0;
  transition:background .15s, color .15s, box-shadow .15s;
}
.menu-grid button.active .ico{
  background:var(--primary);
  color:#fff;
  box-shadow:0 4px 12px rgba(22,101,52,.25);
}
.menu-grid button.active{color:var(--primary)}
.menu-grid button .lbl{text-align:center;line-height:1.2}

/* Panel konten (muncul saat tombol ditap) */
.menu-panel{
  display:none;
  animation:slideUp .2s;
}
.menu-panel.show{display:block}

@media(max-width:480px){
  .menu-grid{grid-template-columns:repeat(4, 1fr);gap:6px;padding:10px}
  .menu-grid button{min-height:66px;font-size:10.5px}
  .menu-grid button .ico{width:38px;height:38px;font-size:17px;border-radius:11px}
}
@media(min-width:700px){
  .menu-grid{grid-template-columns:repeat(6, 1fr)}
}
/* ---------- TABLE ---------- */
.table-container{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;text-align:left;vertical-align:middle}
th{background:#f8faf9;font-size:12px;color:#475569;font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px}

/* ---------- BADGE / NOTICE ---------- */
.badge{display:inline-block;padding:2.5px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#e5e9ee;color:#334155}
.notice{border-left:3px solid var(--primary);background:var(--primary-soft);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:13px}
.notice-warn{border-left-color:var(--warning);background:#fffbeb}
.notice p:last-child{margin-bottom:0}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:500;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:12px;animation:fadeIn .15s}
.modal-box{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;animation:slideUp .2s}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:-18px;background:#fff;padding:6px 0;z-index:1}
.modal-header h3{margin:0;font-size:16px}
.modal-close{width:32px;height:32px;border:0;border-radius:50%;background:#eef2f0;font-size:19px;line-height:1;flex-shrink:0}
.modal-close:hover{background:#dde4e0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ---------- TOAST / SPINNER ---------- */
.toast{position:fixed;right:16px;bottom:16px;background:#0f172a;color:#fff;padding:11px 14px;border-radius:10px;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:320px;font-size:13px;animation:slideUp .2s}
.toast.error{background:var(--danger)}
.spinner{width:18px;height:18px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:8px;color:var(--muted);padding:36px;justify-content:center}

/* ---------- PDF UPLOAD ---------- */
.pdf-upload-box{border:1.5px dashed #cbd5e1;border-radius:12px;padding:14px;background:#f8faf9}
.pdf-upload-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.pdf-file-info{margin-top:9px;padding:8px 11px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:12.5px}
.pdf-progress{display:none;margin-top:10px}
.pdf-progress.active{display:block}
.pdf-progress-track{height:6px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.pdf-progress-bar{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .2s}
.pdf-progress-text{font-size:12px;color:var(--muted);margin-top:6px}
.pdf-current{margin-top:9px;padding:9px 11px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-size:12.5px}

/* ---------- PDF VIEWER (auto-fit, hemat) ---------- */
.pdf-viewer{background:#202124;border-radius:14px;overflow:hidden}
.pdf-toolbar{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:#111827;color:#fff;flex-wrap:wrap}
.pdf-toolbar-group{display:flex;align-items:center;gap:5px}
.pdf-toolbar button{border:0;min-width:34px;height:34px;border-radius:8px;background:#374151;color:#fff;font-weight:700;font-size:15px}
.pdf-toolbar button:hover{background:#4b5563}
.pdf-page-indicator{min-width:78px;text-align:center;font-size:12.5px;font-weight:600}
.pdf-frame-wrap{
  position:relative;
  background:#3a3d41;
  min-height:340px;
  max-height:calc(100vh - 200px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  overflow:auto;
  padding:6px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.pdf-page-img{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
  max-height:calc(100vh - 220px);
  object-fit:contain;
  border-radius:4px;
  background:#fff;
  transform-origin:top center;
  transition:width .15s ease-out;
  will-change:width;
}
.pdf-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(32,33,36,.92);color:#fff;z-index:2}
.pdf-loading.hidden{display:none}
.pdf-info-bar{padding:8px 12px;background:#111827;color:#cbd5e1;font-size:11.5px;line-height:1.4}

/* Skeleton halaman buku */
.pdf-skeleton{
  width:100%;height:80%;max-width:560px;margin:auto;
  background:linear-gradient(90deg,#2a2d31 25%,#35393e 50%,#2a2d31 75%);
  background-size:200% 100%;
  animation:pdfShimmer 1.4s infinite;
  border-radius:6px;
}
@keyframes pdfShimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1000px){
  .grid,.summary-strip{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu{display:inline-flex}
  .topbar{padding:0 12px}
  .user-name{display:none}
  /* Di HP: sembunyikan teks pada tombol aksi toolbar supaya bersih */
  .btn-mobile-icon{padding:8px;min-width:36px}
  .btn-mobile-icon .btn-label{display:none}
}
@media(max-width:600px){
  .page{padding:12px}
  .grid,.grid-3,.grid-2,.summary-strip,.row{grid-template-columns:1fr}
  .login-card{padding:22px}
  .pdf-upload-row{grid-template-columns:1fr}
  .page-head h2{font-size:17px}
  .check-grid{grid-template-columns:1fr}
  .pdf-frame-wrap{min-height:280px;max-height:calc(100vh - 180px);padding:4px}
  .pdf-page-img{max-height:calc(100vh - 200px);border-radius:2px}
  .pdf-toolbar button{min-width:32px;height:32px;font-size:14px}
  .pdf-page-indicator{font-size:11.5px;min-width:66px}
  .modal{padding:8px}
  .modal-box{padding:14px;border-radius:14px;max-height:94vh}
  .modal-header{top:-14px;padding:4px 0}
  th,td{padding:9px 10px;font-size:12.5px}
  .card{padding:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="login-logo">📖</div>
    <h1 class="login-title">TPQ Wardatul Wathon</h1>
    <div class="login-subtitle">Tukum Kidul, Lumajang</div>
    <form id="loginForm" style="margin-top:22px" autocomplete="on">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" placeholder="email@contoh.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-full" id="loginSubmitBtn">Masuk</button>
    </form>
    <div class="login-error" id="loginError"></div>
    <div style="text-align:center;margin-top:6px">
      <button type="button" class="link-btn" id="forgotPasswordButton">Lupa password?</button>
    </div>
    <div style="text-align:center">
      <button type="button" class="link-btn" id="setupAdminButton">Setup admin pertama</button>
    </div>
  </div>
</section>

<section id="app" class="hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-icon">📖</div>
      <div><div class="brand-name">TPQ Wardatul Wathon</div><span id="brandRole" class="brand-role">Portal</span></div>
    </div>
    <nav id="navigation" class="nav"></nav>
  </aside>
  <div id="backdrop" class="backdrop hidden"></div>
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button type="button" class="btn btn-light mobile-menu btn-icon" id="mobileMenuButton" aria-label="Menu">☰</button>
        <span id="pageTitle" class="page-title">Dashboard</span>
      </div>
      <div class="user-area">
        <span id="userName" class="user-name">-</span>
        <button type="button" class="btn btn-light btn-sm btn-icon" id="logoutButton" title="Keluar">⏏</button>
      </div>
    </header>
    <section id="page" class="page"></section>
  </main>
</section>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button type="button" class="modal-close" id="modalClose" aria-label="Tutup">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script type="module">

const $ = id => document.getElementById(id);
const num = v => Number(v || 0);
const ESC_MAP = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" };
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESC_MAP[c]);

function sanitizeUrl(value){
  const url = String(value || "").trim();
  if(!url || /^(javascript|data|vbscript|file):/i.test(url)) return "";
  return /^(https?:|\.\/|\/|blob:|#)/i.test(url) ? url : "";
}
function assetUrl(value){
  const clean = sanitizeUrl(value);
  return /firebasestorage\.googleapis\.com|firebasestorage\.app/i.test(clean) ? "" : clean;
}
const formatRupiah = v => new Intl.NumberFormat("id-ID",{ style:"currency", currency:"IDR", maximumFractionDigits:0 }).format(num(v));
function toDate(value){
  if(!value) return null;
  const d = value.toDate ? value.toDate() : new Date(value);
  return isNaN(d.getTime()) ? null : d;
}
function formatTanggal(value){
  const d = toDate(value);
  return d ? new Intl.DateTimeFormat("id-ID",{ day:"2-digit", month:"long", year:"numeric" }).format(d) : "-";
}
function formatTanggalJam(value){
  const d = toDate(value);
  return d ? new Intl.DateTimeFormat("id-ID",{ day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }).format(d) : "-";
}
function formatFileSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}
function debounce(fn, wait=200){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}
async function busy(btn, text, fn){
  if(!btn) return fn();
  const oldText = btn.textContent, oldDisabled = btn.disabled;
  btn.disabled = true; btn.textContent = text;
  try{ return await fn(); }
  finally{ btn.disabled = oldDisabled; btn.textContent = oldText; }
}
function attachTableSearch(inputId, tableId){
  const input = $(inputId), table = $(tableId);
  if(!input || !table) return;
  input.addEventListener("input", debounce(() => {
    const term = input.value.trim().toLowerCase();
    table.querySelectorAll("tbody tr[data-row]").forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(term) ? "" : "none";
    });
  }, 150));
}

// Export array of object jadi .xlsx (fallback .csv kalau XLSX gagal)
function exportToExcel(rows, filename, sheetName="Data"){
  if(!rows || !rows.length){ showToast("Tidak ada data untuk diexport.", true); return; }
  try{
    if(!window.XLSX) throw new Error("Pustaka XLSX belum siap.");
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 30));
    XLSX.writeFile(wb, filename.endsWith(".xlsx") ? filename : filename + ".xlsx");
    showToast("File Excel berhasil diunduh.");
  }catch(err){
    console.error(err);
    try{
      const headers = Object.keys(rows[0]);
      const csv = [
        headers.map(h => `"${h}"`).join(","),
        ...rows.map(r => headers.map(h => `"${String(r[h] ?? "").replaceAll('"','""')}"`).join(","))
      ].join("\r\n");
      const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type:"text/csv;charset=utf-8;" }));
      const a = Object.assign(document.createElement("a"), { href:url, download: filename.replace(/\.xlsx$/i, ".csv") });
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast("Diexport sebagai CSV (Excel tidak tersedia).");
    }catch(err2){
      showToast("Gagal export: " + err2.message, true);
    }
  }
}

  const buttons = tabsEl.querySelectorAll("button");
  buttons.forEach(b => b.addEventListener("click", () => {

// Toggle grid menu → panel. Klik tombol sama = tutup.
function bindMenuGrid(menuId){
  const menuEl = $(menuId);
  if(!menuEl) return;
  let panelAktif = null;
  menuEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const target = b.dataset.menu;
    const panel = $(`panel-${target}`);
    if(!panel) return;

    if(panelAktif === target){
      menuEl.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      document.querySelectorAll(".menu-panel").forEach(p => p.classList.remove("show"));
      panelAktif = null;
      return;
    }

    menuEl.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll(".menu-panel").forEach(p => p.classList.toggle("show", p === panel));
    panelAktif = target;
    setTimeout(() => panel.scrollIntoView({ behavior:"smooth", block:"start" }), 50);
  }));
}

let toastTimeout = null;
function showToast(message, isError=false){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.remove("hidden");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.add("hidden"), 3500);
}
function openModal(title, content){
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = content;
  $("modal").classList.remove("hidden");
  setTimeout(() => $("modalContent").querySelector("input:not([type=hidden]):not([type=file]), select, textarea")?.focus(), 50);
}
function closeModal(){
  $("modal").classList.add("hidden");
  $("modalContent").innerHTML = "";
}
function openFormModal({ title, body, submit="Simpan", submitClass="", onSubmit }){
  openModal(title, `<form id="modalForm">${body}<button type="submit" class="btn btn-full ${submitClass}" id="modalSubmit">${esc(submit)}</button></form>`);
  $("modalForm").addEventListener("submit", async e => {
    e.preventDefault();
    await busy($("modalSubmit"), "Menyimpan...", async () => {
      try{
        if(await onSubmit() !== false) closeModal();
      }catch(err){
        console.error(err);
        showToast(firebaseError(err), true);
      }
    });
  });
}
$("modalClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if(e.target === $("modal")) closeModal(); });

/* ============ 5. LAYANAN DATA ============ */
const cache = new Map();
async function getCollectionData(name, { forceRefresh=false } = {}){
  const cached = cache.get(name);
  if(!forceRefresh && cached && Date.now() - cached.time < APP_CONFIG.cacheTtlMs) return cached.data;
  const snap = await getDocs(collection(db, name));
  const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  cache.set(name, { data, time: Date.now() });
  return data;
}
const fresh = name => getCollectionData(name, { forceRefresh:true });
const invalidateCache = name => cache.delete(name);
async function getDocument(name, id){
  const snap = await getDoc(doc(db, name, id));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}
async function addCollectionData(name, data){
  const ref = await addDoc(collection(db, name), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  invalidateCache(name);
  return ref;
}
async function updateCollectionData(name, id, data){
  await updateDoc(doc(db, name, id), { ...data, updatedAt: serverTimestamp() });
  invalidateCache(name);
}
async function deleteCollectionData(name, id){
  await deleteDoc(doc(db, name, id));
  invalidateCache(name);
}

// Audit buffer — kurangi write ke Firestore, hindari error resource-exhausted.
const auditBuffer = [];
let auditFlushTimer = null;
const AUDIT_FLUSH_DELAY = 1500;   // 1.5 detik
const AUDIT_FLUSH_MAX = 15;

function flushAuditBuffer(){
  if(!auditBuffer.length) return;
  const items = auditBuffer.splice(0, auditBuffer.length);
  items.forEach(async item => {
    try{ await addCollectionData("audit", item); }
    catch(err){ console.warn("Audit log gagal (diabaikan):", err?.code || err?.message); }
  });
}
function logAudit(action, entity, entityId, metadata={}){
  if(!currentProfile?.uid) return;
  auditBuffer.push({
    action, entity, entityId, metadata,
    userUid: currentProfile.uid, userNama: currentProfile.nama || null, userRole: currentProfile.role || null,
    timestamp: new Date().toISOString()
  });
  if(auditBuffer.length >= AUDIT_FLUSH_MAX){
    clearTimeout(auditFlushTimer); auditFlushTimer = null; flushAuditBuffer();
  } else if(!auditFlushTimer){
    auditFlushTimer = setTimeout(() => { auditFlushTimer = null; flushAuditBuffer(); }, AUDIT_FLUSH_DELAY);
  }
}
window.addEventListener("beforeunload", () => flushAuditBuffer());
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushAuditBuffer(); });

const toWIB = d => new Date(d.toLocaleString("en-US", { timeZone:"Asia/Jakarta" }));
const nowWIB = () => toWIB(new Date());
function dateKey(d){
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
const todayStr = () => dateKey(nowWIB());
function tsKey(value){
  const d = toDate(value);
  return d ? dateKey(toWIB(d)) : null;
}

/* ============ 7. HARI LIBUR ============ */
function isHariLibur(tanggal, settings){
  const mingguan = Array.isArray(settings?.liburMingguan) ? settings.liburMingguan : [];
  const events = Array.isArray(settings?.liburEvents) ? settings.liburEvents : [];
  const d = new Date(tanggal + "T00:00:00");
  if(!isNaN(d.getTime()) && mingguan.includes(d.getDay())) return true;
  return events.some(e => e.mulai && e.selesai && tanggal >= e.mulai && tanggal <= e.selesai);
}
function labelLibur(tanggal, settings){
  const mingguan = Array.isArray(settings?.liburMingguan) ? settings.liburMingguan : [];
  const d = new Date(tanggal + "T00:00:00");
  if(mingguan.includes(d.getDay())) return `Libur mingguan (${NAMA_HARI[d.getDay()]})`;
  const ev = (settings?.liburEvents || []).find(e => tanggal >= e.mulai && tanggal <= e.selesai);
  return ev ? `Libur: ${ev.nama || "Event"}` : "Libur";
}
function liburCard(settings){
  const today = todayStr();
  if(!isHariLibur(today, settings)) return "";
  return `<div class="card info"><b style="color:#1e40af">🏖️ Hari ini libur</b>
    <div class="muted small" style="margin-top:4px">${esc(labelLibur(today, settings))}. Tidak ada perhitungan alpha hari ini.</div></div>`;
}
function pengumumanLiburPayload(ev){
  const kadaluarsa = new Date(new Date(ev.selesai + "T23:59:59+07:00").getTime() + 1000);
  const durasi = ev.mulai === ev.selesai ? ev.mulai : `${ev.mulai} s/d ${ev.selesai}`;
  return {
    judul: `🏖️ Libur: ${ev.nama}`,
    isi: `Diberitahukan bahwa TPQ akan libur:\n\n📌 Kegiatan: ${ev.nama}\n📅 Tanggal: ${durasi}\n` +
         (ev.keterangan ? `📝 Keterangan: ${ev.keterangan}\n` : "") +
         `\nKegiatan belajar mengajar kembali normal pada hari berikutnya.\nTerima kasih atas perhatiannya.`,
    aktif: true,
    berlakuSampai: kadaluarsa.toISOString(),
    sumber: "liburEvent", liburNama: ev.nama, liburMulai: ev.mulai, liburSelesai: ev.selesai
  };
}
const pengumumanLiburTerkait = (list, ev) =>
  list.filter(p => p.sumber === "liburEvent" && p.liburNama === ev.nama && p.liburMulai === ev.mulai && p.liburSelesai === ev.selesai);

const periodeRekapText = s => `${s.mulaiPembelajaran ? `Sejak ${s.mulaiPembelajaran}` : "Seluruh periode"} · ${jumlahHariRekap(s)} hari terakhir`;

async function loadKehadiranContext(){
  const [izinList, riwayat, progress, settings] = await Promise.all([
    fresh("izin"), fresh("riwayat"), fresh("progress"), getAppSettings()
  ]);
  const index = new Set();
  [...riwayat, ...progress].forEach(r => {
    const key = tsKey(r.createdAt || r.updatedAt);
    if(!key) return;
    if(r.santriId) index.add(`s:${r.santriId}:${key}`);
    if(r.ustadzahUid) index.add(`u:${r.ustadzahUid}:${key}`);
  });
  return { izinList, index, settings };
}
function statusHarian({ tanggal, izin, hadir, settings }){
  if(isHariLibur(tanggal, settings)) return { status:"libur" };
  if(izin) return { status:"izin", izin };
  if(hadir) return { status:"hadir" };
  if(tanggal === todayStr() && !isLewatBatasAlpha(settings)) return { status:"belum" };
  return { status:"alpha" };
}
const izinCocok = (z, tanggal) => z.aktif !== false && tanggal >= z.tanggalMulai && tanggal <= z.tanggalSelesai;
function statusSantri(santriId, tanggal, ctx){
  const izin = ctx.izinList.find(z => z.jenis !== "ustadzah" && z.santriId === santriId && izinCocok(z, tanggal)) || null;
  return statusHarian({ tanggal, izin, hadir: ctx.index.has(`s:${santriId}:${tanggal}`), settings: ctx.settings });
}
function statusUstadzah(ustadzahId, tanggal, ctx){
  const izin = ctx.izinList.find(z => z.jenis === "ustadzah" && z.ustadzahId === ustadzahId && izinCocok(z, tanggal)) || null;
  return statusHarian({ tanggal, izin, hadir: ctx.index.has(`u:${ustadzahId}:${tanggal}`), settings: ctx.settings });
}
function daftarTanggalRekap(settings){
  const today = nowWIB(), out = [];
  for(let i = 0; i < jumlahHariRekap(settings); i++){
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = dateKey(d);
    if(settings.mulaiPembelajaran && key < settings.mulaiPembelajaran) continue;
    out.push(key);
  }
  return out;
}
function hitungRekap(list, kind, ctx){
  const days = daftarTanggalRekap(ctx.settings);
  return list.map(item => {
    const r = { hadir:0, izin:0, alpha:0, libur:0 };
    days.forEach(t => {
      const st = kind === "santri" ? statusSantri(item.id, t, ctx) : statusUstadzah(item.id, t, ctx);
      if(r[st.status] !== undefined) r[st.status]++;
    });
    return { item, ...r, total: r.hadir + r.izin + r.alpha };
  }).sort((a,b) => b.hadir - a.hadir || b.izin - a.izin || a.alpha - b.alpha);
}

}

async function bindIzinForm({ isUstadzah, santriList, settings }){
  const form = $("izinForm");
  if(!form) return;
  const izinList = await fresh("izin");

  $("izinAlasan").addEventListener("change", () => {
    const v = $("izinAlasan").value;
    $("izinKegiatanWrap").classList.toggle("hidden", v !== "kegiatan");
    $("izinKeteranganWrap").classList.toggle("hidden", v === "");
    $("izinNamaKegiatan").required = v === "kegiatan";
  });
  $("izinMulai").addEventListener("change", () => {
    if($("izinSelesai").value < $("izinMulai").value) $("izinSelesai").value = $("izinMulai").value;
    $("izinSelesai").min = $("izinMulai").value;
  });

  if(isUstadzah){
    const ustadzahList = (await getCollectionData("ustadzah")).filter(u => u.id !== currentProfile.uid && u.aktif !== false);
    $("izinKlaimUstadzah").innerHTML = `<option value="">Tidak perlu diklaimkan</option>` +
      ustadzahList.map(u => `<option value="${esc(u.id)}">${esc(u.nama || u.email || "-")}</option>`).join("");
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const today = todayStr();
    const alasan = $("izinAlasan").value;
    const namaKegiatan = alasan === "kegiatan" ? $("izinNamaKegiatan").value.trim() : "";
    const mulai = $("izinMulai").value, selesai = $("izinSelesai").value;
    if(!alasan) return showToast("Pilih alasan izin.", true);
    if(alasan === "kegiatan" && !namaKegiatan) return showToast("Nama kegiatan wajib diisi.", true);
    if(mulai < today) return showToast("Tanggal mulai tidak boleh di masa lalu.", true);
    if(selesai < mulai) return showToast("Tanggal selesai tidak boleh sebelum tanggal mulai.", true);
    if(mulai === today && isLewatBatasIzin(settings)){
      return showToast(`Batas pengajuan izin hari ini sudah lewat (${batasIzinJam(settings)}.00 WIB). Ajukan untuk besok.`, true);
    }

    const santri = isUstadzah ? null : santriList.find(s => s.id === $("izinSantri")?.value);
    if(!isUstadzah && !santri) return showToast("Pilih santri terlebih dahulu.", true);

    const bentrok = izinList.find(z => z.aktif !== false &&
      (isUstadzah ? (z.jenis === "ustadzah" && z.ustadzahId === currentProfile.uid) : (z.jenis !== "ustadzah" && z.santriId === santri.id)) &&
      z.tanggalMulai <= selesai && z.tanggalSelesai >= mulai);
    if(bentrok && !confirm(`Sudah ada izin pada rentang tersebut (${rangeText(bentrok)}). Lanjutkan?`)) return;

    await busy($("izinSaveBtn"), "Mengirim...", async () => {
      try{
        const base = {
          tanggalMulai: mulai, tanggalSelesai: selesai, alasan, namaKegiatan,
          keterangan: $("izinKeterangan")?.value.trim() || "",
          diajukanOleh: currentProfile.uid, diajukanOlehNama: currentProfile.nama || "",
          diajukanOlehRole: currentProfile.role, aktif: true
        };
        const payload = isUstadzah
          ? { ...base, jenis:"ustadzah", santriId:null, santriNama: currentProfile.nama || "Ustadzah", santriJilidId:null, ustadzahId: currentProfile.uid }
          : { ...base, jenis:"santri", santriId: santri.id, santriNama: santri.nama, santriJilidId: santri.jilidId || null, ustadzahId:null };
        const ref = await addCollectionData("izin", payload);

        const penggantiUid = isUstadzah ? $("izinKlaimUstadzah").value : "";
        if(penggantiUid){
          const penggantiNama = $("izinKlaimUstadzah").selectedOptions[0]?.textContent || "";
          const jilidDiampu = (await fresh("jilid")).filter(j => getJilidUstadzahIds(j).includes(currentProfile.uid));
          for(const j of jilidDiampu){
            await updateCollectionData("jilid", j.id, {
              substituteUid: penggantiUid, substituteNama: penggantiNama,
              substituteFrom: mulai, substituteUntil: selesai,
              substituteAlasan: `Izin ${labelAlasan(alasan)}${namaKegiatan ? " — " + namaKegiatan : ""}`
            });
            logAudit("UPDATE","jilid",j.id,{ klaimOleh: penggantiUid, viaIzin: ref.id });
          }
        }
        logAudit("CREATE","izin",ref.id,{ alasan, mulai, selesai });
        showToast(pesanSuksesIzin(alasan));
        renderDashboard();
      }catch(err){ showToast("Gagal mengirim izin: " + firebaseError(err), true); }
    });
  });
}

/* ============ 9. JILID & USTADZAH ============ */
function getJilidUstadzahIds(jilid){
  if(Array.isArray(jilid?.ustadzahIds) && jilid.ustadzahIds.length) return jilid.ustadzahIds.filter(Boolean);
  return jilid?.ustadzahId ? [jilid.ustadzahId] : [];
}
function isSubstituteActive(jilid){
  if(!jilid?.substituteUid || !jilid?.substituteUntil) return false;
  const today = todayStr();
  return jilid.substituteUntil >= today && (!jilid.substituteFrom || jilid.substituteFrom <= today);
}
const namaPengampu = (jilid, ustadzahList) => {
  const map = new Map(ustadzahList.map(u => [u.id, u.nama || u.email || "Ustadzah"]));
  return getJilidUstadzahIds(jilid).map(id => map.get(id) || "Ustadzah");
};
async function getEffectiveJilidIds(profile){
  const jilidList = await getCollectionData("jilid");
  const ids = new Set();
  jilidList.forEach(j => {
    const pengampu = getJilidUstadzahIds(j);
    if(pengampu.includes(profile.uid)) ids.add(j.id);
    if(!pengampu.length && (profile.jilidIds || [profile.jilidId]).includes(j.id)) ids.add(j.id);
    if(isSubstituteActive(j) && j.substituteUid === profile.uid) ids.add(j.id);
  });
  return [...ids];
}
async function getSantriUstadzah(){
  const ids = await getEffectiveJilidIds(currentProfile);
  if(!ids.length) return [];
  return (await getCollectionData("santri")).filter(s => ids.includes(s.jilidId));
}

/* ============ 10. KEUANGAN HELPER ============ */
function getPeriodeSekarang(){
  const now = nowWIB();
  return { key: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`, year: now.getFullYear(), month: now.getMonth()+1, tanggal: now.getDate() };
}
function formatPeriodeLabel(key){
  if(!key) return "-";
  const [y,m] = key.split("-").map(Number);
  return y && m ? `${NAMA_BULAN[m-1]} ${y}` : key;
}
function daftarBulanTahunIni(){
  const { year, month } = getPeriodeSekarang();
  const list = [];
  for(let m = 1; m <= month; m++) list.push({ key: `${year}-${String(m).padStart(2,"0")}`, label: `${NAMA_BULAN[m-1]} ${year}` });
  return list.reverse();
}
function hitungStatusTagihan(nominal, terbayar){
  if(num(terbayar) <= 0) return "belum";
  return num(terbayar) >= num(nominal) ? "lunas" : "sebagian";
}
function badgeStatusTagihan(status){
  if(status === "lunas") return badge("Lunas","green");
  if(status === "sebagian") return badge("Sebagian","yellow");
  return badge("Belum bayar","red");
}
function isSppMenunggak(bill, tanggalPeringatan){
  if(!bill || bill.jenis !== "SPP" || bill.status === "lunas") return false;
  const { key, tanggal } = getPeriodeSekarang();
  return bill.periode < key || (bill.periode === key && tanggal >= num(tanggalPeringatan || 10));
}
const hitungSaldoTabungan = (list, santriId) =>
  list.filter(t => t.santriId === santriId).reduce((s,t) => s + (t.jenis === "tarik" ? -num(t.jumlah) : num(t.jumlah)), 0);
function hitungSaldoKas({ tagihan, infaqList, tabunganList, pengeluaranList }){
  const sum = (list, fn) => list.reduce((s,x) => s + num(fn(x)), 0);
  const sppTerbayar = sum(tagihan.filter(x => x.jenis === "SPP"), x => x.terbayar);
  const iuranTerbayar = sum(tagihan.filter(x => x.jenis === "Iuran Kegiatan"), x => x.terbayar);
  const infaqMasuk = sum(infaqList, x => x.jumlah);
  const pengeluaran = sum(pengeluaranList, x => x.jumlah);
  const tabunganSantri = sum(tabunganList, x => x.jenis === "tarik" ? -x.jumlah : x.jumlah);
  const saldoKas = sppTerbayar + iuranTerbayar + infaqMasuk - pengeluaran;
  return { sppTerbayar, iuranTerbayar, infaqMasuk, pengeluaran, tabunganSantri, saldoKas, totalUangDiKas: saldoKas + tabunganSantri };
}

// SPP bulan berjalan otomatis dibuat lewat writeBatch (hemat write).
let sppEnsuredPeriode = null;
async function ensureSppBulanIni(){
  const { key: periode } = getPeriodeSekarang();
  if(sppEnsuredPeriode === periode) return;
  try{
    const nominal = num((await getAppSettings()).sppNominal);
    if(nominal <= 0){ sppEnsuredPeriode = periode; return; }
    const [santriList, bills] = await Promise.all([getCollectionData("santri"), getCollectionData("tagihanSantri")]);
    const ada = new Set(bills.map(b => b.id));
    const baru = santriList.filter(s => s.aktif !== false && !ada.has(`spp_${s.id}_${periode}`));
    for(let i = 0; i < baru.length; i += 450){
      const batch = writeBatch(db);
      baru.slice(i, i + 450).forEach(s => {
        batch.set(doc(db, "tagihanSantri", `spp_${s.id}_${periode}`), {
          santriId: s.id, santriNama: s.nama || "-", jenis:"SPP", judul:`SPP ${formatPeriodeLabel(periode)}`,
          periode, kegiatanId:null, nominal, terbayar:0, status:"belum", riwayat:[],
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
      });
      await batch.commit();
    }
    if(baru.length) invalidateCache("tagihanSantri");
    sppEnsuredPeriode = periode;
  }catch(err){ console.warn("Gagal membuat SPP otomatis:", err); }
}
async function backfillSppSantri(santriId, santriNama, periode, nominal){
  const id = `spp_${santriId}_${periode}`;
  if(await getDocument("tagihanSantri", id)) return;
  await setDoc(doc(db, "tagihanSantri", id), {
    santriId, santriNama, jenis:"SPP", judul:`SPP ${formatPeriodeLabel(periode)}`, periode, kegiatanId:null,
    nominal: num(nominal), terbayar:0, status:"belum", riwayat:[],
    createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  });
  invalidateCache("tagihanSantri");
}
async function catatPembayaranTagihan(billId, { jumlah, metode, keterangan }){
  const bill = await getDocument("tagihanSantri", billId);
  if(!bill) throw new Error("Tagihan tidak ditemukan.");
  const riwayat = [...(bill.riwayat || []), {
    tanggal: new Date().toISOString(), jumlah: num(jumlah), metode: metode || "Tunai", keterangan: keterangan || "",
    dicatatOleh: currentProfile?.uid || "", dicatatOlehNama: currentProfile?.nama || ""
  }];
  const terbayar = riwayat.reduce((s,r) => s + num(r.jumlah), 0);
  const status = hitungStatusTagihan(bill.nominal, terbayar);
  await updateCollectionData("tagihanSantri", billId, { riwayat, terbayar, status });
  logAudit("BAYAR","tagihanSantri",billId,{ jumlah: num(jumlah), status });
}
async function buatIuranKegiatan({ nama, nominal, tanggalMulai, tanggalSelesai, target, targetNama, penerima }){
  const ref = await addCollectionData("kegiatan", { nama, nominal, tanggalMulai, tanggalSelesai, target, targetNama, penerima: penerima || "", aktif:true });
  const santriList = (await getCollectionData("santri")).filter(s => s.aktif !== false && (target === "semua" || s.jilidId === target));
  for(let i = 0; i < santriList.length; i += 450){
    const batch = writeBatch(db);
    santriList.slice(i, i + 450).forEach(s => {
      batch.set(doc(db, "tagihanSantri", `iuran_${s.id}_${ref.id}`), {
        santriId: s.id, santriNama: s.nama || "-", jenis:"Iuran Kegiatan", judul: nama, periode:null, kegiatanId: ref.id,
        nominal, terbayar:0, status:"belum", riwayat:[], createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
    });
    await batch.commit();
  }
  invalidateCache("tagihanSantri");
  await addCollectionData("pengumuman", {
    judul: `📢 Iuran Kegiatan: ${nama}`,
    isi: `Terdapat iuran kegiatan baru: "${nama}".\n\nNominal: ${formatRupiah(nominal)}\nPeriode pembayaran: ${tanggalMulai || "-"} s/d ${tanggalSelesai || "-"}\nBerlaku untuk: ${targetNama || "Semua Santri"}\n` +
         (penerima ? `Pembayaran ditujukan kepada: ${penerima}\n` : "") + `\nSilakan lakukan pembayaran sesuai batas waktu di atas.`,
    aktif:true,
    berlakuSampai: tanggalSelesai ? new Date(tanggalSelesai + "T23:59:59+07:00").toISOString() : null
  });
}

function hitungRekapPembelajaran(list){
  const total = list.length;
  const naik = list.filter(r => r.status === "naik").length;
  const sorted = list.slice().sort(byCreatedDesc);
  const tren = [];
  const today = nowWIB();
  for(let i = 6; i >= 0; i--){
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = dateKey(d);
    const hari = list.filter(r => tsKey(r.createdAt) === key);
    tren.push({
      label: `${d.getDate()}/${d.getMonth()+1}`,
      naik: hari.filter(r => r.status === "naik").length,
      mengulang: hari.filter(r => r.status === "mengulang").length,
      total: hari.length
    });
  }
  return {
    total, naik, mengulang: list.filter(r => r.status === "mengulang").length,
    baca: list.filter(r => r.tipe === "baca").length, hafalan: list.filter(r => r.tipe === "hafalan").length,
    terakhirBaca: sorted.find(r => r.tipe === "baca") || null,
    terakhirHafalan: sorted.find(r => r.tipe === "hafalan") || null,
    tren, persenNaik: total ? Math.round(naik / total * 100) : 0
  };
}

const halamanImageCache = new Map();
const halamanDocId = (jilidId, tipe, halaman) => `${jilidId}_${tipe}_${halaman}`;

function validatePdfFile(file){
  if(!file) throw new Error("File PDF belum dipilih.");
  if(!(file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf"))) throw new Error("File harus berformat PDF.");
  if(file.size > APP_CONFIG.maxPdfSize) throw new Error(`Ukuran PDF maksimal ${formatFileSize(APP_CONFIG.maxPdfSize)}.`);
}

async function fetchHalamanGambar(jilidId, tipe, halaman){
  if(!jilidId || !tipe || !halaman) return null;
  const id = halamanDocId(jilidId, tipe, halaman);
  if(halamanImageCache.has(id)) return halamanImageCache.get(id);
  const snap = await getDoc(doc(db, "jilidHalaman", id));
  const gambar = snap.exists() ? (snap.data().gambar || null) : null;
  if(gambar) halamanImageCache.set(id, gambar);
  return gambar;
}
async function deleteHalamanRange(jilidId, tipe, dari, sampai){
  for(let p = dari; p <= sampai; p++){
    const id = halamanDocId(jilidId, tipe, p);
    halamanImageCache.delete(id);
    try{ await deleteDoc(doc(db, "jilidHalaman", id)); }catch{ /* sudah tidak ada */ }
  }
}
let pdfJsPromise = null;
async function loadPdfJs(){
  const resolve = () => window.pdfjsLib || window["pdfjs-dist/build/pdf"] || null;
  if(!resolve()){
    pdfJsPromise ??= new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = APP_CONFIG.pdfJsScriptUrl;
      s.onload = () => resolve() ? ok(resolve()) : fail(new Error("Pustaka pdf.js tidak dikenali browser."));
      s.onerror = () => { pdfJsPromise = null; fail(new Error("Gagal memuat pdf.js dari CDN. Periksa koneksi internet.")); };
      document.head.appendChild(s);
    });
    await pdfJsPromise;
  }
  const lib = resolve();
  lib.GlobalWorkerOptions.workerSrc = APP_CONFIG.pdfJsWorkerUrl;
  return lib;
}

// Konversi canvas ke blob → dataURL, pakai WebP bila didukung.
function canvasKeDataUrl(canvas, mime, quality){
  try{
    const url = canvas.toDataURL(mime, quality);
    // Jika browser tidak dukung mime, akan fallback ke PNG (data:image/png) — deteksi.
    if(mime !== "image/png" && url.startsWith("data:image/png")) return null;
    return url;
  }catch{ return null; }
}

async function renderPageToDataUrl(pdfPage, maxBytes){
  // Skala awal berdasarkan lebar viewport target
  const baseViewport = pdfPage.getViewport({ scale: 1 });
  const maxDimAwal = APP_CONFIG.pdfMaxDim;
  const skalaAwal = Math.min(2, maxDimAwal / Math.max(baseViewport.width, baseViewport.height));
  let scale = Math.max(0.6, skalaAwal);
  let quality = APP_CONFIG.imageQualityAwal;
  let last = null;
  const mime = APP_CONFIG.imageMime;

  for(let i = 0; i < 8; i++){
    const viewport = pdfPage.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(viewport.width));
    canvas.height = Math.max(1, Math.round(viewport.height));
    const ctx = canvas.getContext("2d", { alpha:false });
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await pdfPage.render({ canvasContext: ctx, viewport }).promise;
    const url = canvasKeDataUrl(canvas, mime, quality);
    if(!url){
      // Browser tidak dukung WebP, fallback ke JPEG
      last = canvas.toDataURL("image/jpeg", quality);
    } else last = url;
    if(Math.ceil(last.length * 0.75) <= maxBytes) return last;
    if(quality > APP_CONFIG.imageQualityMin) quality = Math.max(APP_CONFIG.imageQualityMin, quality - 0.1);
    else scale = Math.max(0.55, scale - 0.15);
  }
  return last;
}

async function uploadPdfPerPage(file, jilidId, tipe, onProgress){
  validatePdfFile(file);
  const pdfjs = await loadPdfJs();
  const pdfDoc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  for(let p = 1; p <= pdfDoc.numPages; p++){
    const dataUrl = await renderPageToDataUrl(await pdfDoc.getPage(p), APP_CONFIG.maxHalamanBytes);
    if(!dataUrl) throw new Error(`Gagal memproses halaman ${p}.`);
    const id = halamanDocId(jilidId, tipe, p);
    await setDoc(doc(db, "jilidHalaman", id), { jilidId, tipe, halaman: p, gambar: dataUrl, updatedAt: serverTimestamp() });
    halamanImageCache.set(id, dataUrl);
    onProgress?.(p, pdfDoc.numPages);
  }
  return pdfDoc.numPages;
}

const PDF_INFO_DEFAULT = "PDF diproses menjadi gambar per halaman di browser (WebP ringan), lalu tiap halaman disimpan di Firestore.";
function pdfUploadBlock(type, label){

    <div class="pdf-upload-row"><input id="pdfFile_${type}" type="file" accept="application/pdf,.pdf">

function bindPdfUploader(type, jilidId, initialTotal, persist){
  let total = num(initialTotal);
  const label = type === "baca" ? "Buku Baca" : "Buku Hafalan";
  const el = id => $(`${id}_${type}`);

  function renderCurrent(){
    el("pdfCurrent").innerHTML = total > 0 ? `<div class="pdf-current">✅ ${total} halaman tersimpan.
      <div class="actions" style="margin-top:7px"><button type="button" class="btn btn-sm" id="pdfView_${type}">👁 Lihat buku</button>
      <button type="button" class="btn btn-sm btn-danger" id="pdfDel_${type}">🗑 Hapus semua halaman</button></div></div>`
      : `<div class="muted small" style="margin-top:8px">Belum ada halaman yang diupload.</div>`;
    el("pdfView")?.addEventListener("click", () => openHalamanViewer({ jilidId, tipe:type, halaman:1, totalHalaman:total, label }));
    el("pdfDel")?.addEventListener("click", async () => {
      if(!confirm(`Hapus semua ${total} halaman ${label}? Tindakan ini tidak bisa dibatalkan.`)) return;
      try{
        await deleteHalamanRange(jilidId, type, 1, total);
        total = 0; await persist?.(0); renderCurrent();
        showToast(`Semua halaman ${label} dihapus.`);
      }catch(err){ showToast("Gagal menghapus halaman: " + err.message, true); }
    });
  }
  renderCurrent();

  el("pdfFile").addEventListener("change", () => {
    const file = el("pdfFile").files?.[0];
    if(!file){ el("pdfInfo").textContent = PDF_INFO_DEFAULT; return; }
    try{
      validatePdfFile(file);
      el("pdfInfo").innerHTML = `<b>📄 ${esc(file.name)}</b> · ${formatFileSize(file.size)} · siap diproses.`;
    }catch(err){ el("pdfFile").value = ""; el("pdfInfo").textContent = err.message; showToast(err.message, true); }
  });

  el("pdfUploadBtn").addEventListener("click", async () => {
    const file = el("pdfFile").files?.[0];
    if(!file) return showToast("Pilih file PDF terlebih dahulu.", true);
    const oldTotal = total, btn = el("pdfUploadBtn");
    try{
      validatePdfFile(file);
      btn.disabled = true; btn.textContent = "⏳ Memproses...";
      el("pdfProg").classList.add("active");
      el("pdfBar").style.width = "0%";
      el("pdfText").textContent = "Menyiapkan pustaka PDF...";
      const pages = await uploadPdfPerPage(file, jilidId, type, (cur, all) => {
        const pct = Math.round(cur / all * 100);
        el("pdfBar").style.width = pct + "%";
        el("pdfText").textContent = `Mengupload halaman ${cur} dari ${all} (${pct}%)...`;
      });
      if(oldTotal > pages) await deleteHalamanRange(jilidId, type, pages + 1, oldTotal);
      total = pages; await persist?.(total);
      el("pdfText").textContent = `Selesai. ${pages} halaman tersimpan.`;
      el("pdfInfo").innerHTML = `<b>✅ ${esc(file.name)}</b> · ${pages} halaman berhasil diupload.`;
      renderCurrent();
      showToast(`${label}: ${pages} halaman berhasil diupload.`);
    }catch(err){
      console.error(err);
      el("pdfText").textContent = err.message;
      showToast(err.message, true);
    }finally{ btn.disabled = false; btn.textContent = "☁️ Upload"; }
  });
  return { getTotal: () => total };
}

async function createManagedAccount({ email, password, role, profile }){
  const adminUid = auth.currentUser?.uid;
  if(!adminUid) throw new Error("Anda harus login sebagai admin.");
  const credential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
  const uid = credential.user.uid;
  try{ await signOut(secondaryAuth); }catch(err){ console.warn("Secondary signout:", err); }
  if(auth.currentUser?.uid !== adminUid) throw new Error("Sesi admin terputus. Silakan login ulang.");

  const data = {
    uid, email, role,
    nama: profile.nama || "", telepon: profile.telepon || "", alamat: profile.alamat || "",
    jilidId: profile.jilidId || null, jilidNama: profile.jilidNama || null,
    aktif: profile.aktif !== false, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  };
  if(profile.jilidIds) data.jilidIds = profile.jilidIds;
  if(profile.jilidNames) data.jilidNames = profile.jilidNames;
  await setDoc(doc(db, "users", uid), data);
  await setDoc(doc(db, role, uid), data);
  invalidateCache(role);
  return uid;
}

    title: "Setup admin pertama", submit: "Buat akun admin",

      ${fg("Email admin", `<input id="adminEmail" type="email" placeholder="admin@tpqwardah.com" required>`)}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginError").textContent = "";
  await busy($("loginSubmitBtn"), "Memproses...", async () => {
    try{ await signInWithEmailAndPassword(auth, $("loginEmail").value.trim(), $("loginPassword").value); }
    catch(err){ $("loginError").textContent = firebaseError(err); }
  });
});
$("logoutButton").addEventListener("click", async () => {
  if(!confirm("Yakin ingin keluar dari aplikasi?")) return;
  logAudit("LOGOUT","users",currentUser?.uid || "");
  await signOut(auth);
});
const toggleSidebar = open => {
  $("sidebar").classList.toggle("open", open);
  $("backdrop").classList.toggle("hidden", !open);
};
$("mobileMenuButton").addEventListener("click", () => toggleSidebar(!$("sidebar").classList.contains("open")));
$("backdrop").addEventListener("click", () => toggleSidebar(false));

onAuthStateChanged(auth, async user => {
  if(!user){
    currentUser = null; currentProfile = null; sppEnsuredPeriode = null; cache.clear();
    $("loginScreen").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }
  try{
    const profile = await getDocument("users", user.uid);
    const problem = !profile ? "Akun berhasil login tetapi profil aplikasi belum dibuat. Hubungi admin."
      : !["admin","ustadzah","wali"].includes(profile.role) ? "Role akun tidak valid."
      : profile.aktif === false ? "Akun ini sedang dinonaktifkan. Hubungi admin." : null;
    if(problem){ showToast(problem, true); await signOut(auth); return; }

    currentUser = user; currentProfile = profile;
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userName").textContent = profile.nama || user.email;
    $("brandRole").textContent = "Portal " + roleLabel(profile.role);
    buildNavigation();
    navigate("dashboard");
    resetIdleTimer();
    logAudit("LOGIN","users",user.uid,{ email: user.email });
  }catch(err){
    console.error(err);
    showToast("Gagal membaca profil pengguna: " + firebaseError(err), true);
    await signOut(auth);
  }
});

let idleTimer = null;
function resetIdleTimer(){
  clearTimeout(idleTimer);
  if(!currentUser) return;
  idleTimer = setTimeout(async () => {
    showToast("Sesi berakhir karena tidak aktif. Silakan login kembali.", true);
    await signOut(auth);
  }, APP_CONFIG.sessionTimeoutMs);
}
["click","keydown","mousemove","touchstart"].forEach(evt => document.addEventListener(evt, resetIdleTimer, { passive:true }));
window.addEventListener("offline", () => showToast("⚠️ Anda sedang offline.", true));
window.addEventListener("online", () => showToast("✅ Koneksi kembali online."));

    { page:"ruangNgaji", icon:"📚", label:"Ruang Ngaji" }, { page:"keuangan", icon:"💰", label:"Keuangan" },

  ],

  ],

};
const HANDLERS = {
  dashboard: () => renderDashboard(), dataUser: () => renderDataUserAdmin(), ruangNgaji: () => renderRuangNgajiAdmin(),
  keuangan: () => renderKeuanganAdmin(), pengaturan: () => renderPengaturanAdmin(), pengumuman: () => renderPengumuman(),
  profil: () => renderProfil(), daftarSantri: () => renderDaftarSantriUstadzah()
};
function buildNavigation(){
  const items = MENUS[currentProfile.role] || [];
  $("navigation").innerHTML = items.map(i => `<button type="button" data-page="${i.page}"><span style="font-size:15px">${i.icon}</span> ${esc(i.label)}</button>`).join("");
  $("navigation").querySelectorAll("button").forEach(b => b.addEventListener("click", () => navigate(b.dataset.page)));
}
async function navigate(page){
  const item = (MENUS[currentProfile.role] || []).find(i => i.page === page);
  $("pageTitle").textContent = item?.label || "Dashboard";
  $("navigation").querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.page === page));
  toggleSidebar(false);
  $("page").innerHTML = `<div class="loading-row"><span class="spinner"></span> Memuat...</div>`;
  try{ await HANDLERS[page](); }
  catch(err){
    console.error(err);
    $("page").innerHTML = `<div class="card empty">Gagal memuat halaman: ${esc(firebaseError(err))}</div>`;
  }
}

const pesanDashboard = s => s.pesan ? `<div class="notice" style="margin-top:14px;white-space:pre-wrap">${esc(s.pesan)}</div>` : "";

async function renderDashboardAdmin(){
  await ensureSppBulanIni();
  const [santri, wali, ustadzah, jilid, ctx, tagihan, infaqList, pengeluaranList, tabunganList] = await Promise.all([
    getCollectionData("santri"), getCollectionData("wali"), getCollectionData("ustadzah"), getCollectionData("jilid"),
    loadKehadiranContext(), getCollectionData("tagihanSantri"), getCollectionData("infaq"), getCollectionData("pengeluaran"), getCollectionData("tabungan")
  ]);
  const aktif = list => list.filter(x => x.aktif !== false);
  const rekap = hitungRekap(aktif(ustadzah), "ustadzah", ctx);

  const saldo = hitungSaldoKas({ tagihan, infaqList, tabunganList, pengeluaranList });
  const sppBulanIni = tagihan.filter(t => t.jenis === "SPP" && t.periode === getPeriodeSekarang().key);
  const totalSppTertagih = sppBulanIni.reduce((s,x) => s + num(x.nominal), 0);
  const totalSppTerbayar = sppBulanIni.reduce((s,x) => s + num(x.terbayar), 0);

  $("page").innerHTML = `
    ${pageHead("Dashboard admin", `Selamat datang, ${esc(currentProfile.nama)}.`)}
    <div class="grid">
      ${statCard("👨‍🎓","Santri aktif", aktif(santri).length)}${statCard("👩‍🏫","Ustadzah aktif", aktif(ustadzah).length)}
      ${statCard("👨‍👩‍👧","Wali aktif", aktif(wali).length)}${statCard("📚","Kelas / jilid", aktif(jilid).length)}
    </div>
    <div class="card balance" style="margin-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div><div style="font-size:12.5px;opacity:.85">Saldo kas TPQ</div>
          <div style="font-size:26px;font-weight:700;margin-top:4px">${formatRupiah(saldo.saldoKas)}</div>
          <div style="font-size:11.5px;opacity:.8;margin-top:4px">Termasuk tabungan santri ${formatRupiah(saldo.tabunganSantri)}.</div></div>
        <div style="text-align:right;font-size:12.5px;line-height:1.7">
          <div>💵 SPP bulan ini: <b>${formatRupiah(totalSppTerbayar)}</b> / ${formatRupiah(totalSppTertagih)}</div>
          <div>🙏 Infaq total: <b>${formatRupiah(saldo.infaqMasuk)}</b></div>
          <div>📤 Pengeluaran: <b>${formatRupiah(saldo.pengeluaran)}</b></div>
        </div>
      </div>
    </div>
    ${pesanDashboard(ctx.settings)}
    <div class="stack" style="margin-top:14px">
      ${liburCard(ctx.settings)}
      ${rekapCard("📊 Rekap kehadiran ustadzah", rekap, ctx.settings)}
    </div>`;
}

async function renderDashboardUstadzah(){
  await ensureSppBulanIni();
  const [santri, jilidList, ustadzahList, ctx] = await Promise.all([
    getSantriUstadzah(), getCollectionData("jilid"), getCollectionData("ustadzah"), loadKehadiranContext()
  ]);
  const { settings, izinList } = ctx;
  const efektifIds = await getEffectiveJilidIds(currentProfile);
  const jilidNames = jilidList.filter(j => efektifIds.includes(j.id)).map(j => j.nama);
  const klaimAktif = jilidList.filter(j => isSubstituteActive(j) && j.substituteUid === currentProfile.uid);
  const today = todayStr();

  const rekapSantri = hitungRekap(santri, "santri", ctx);
  const rekapSaya = hitungRekap([{ id: currentProfile.uid, nama: currentProfile.nama || "Ustadzah" }], "ustadzah", ctx)[0];

  const santriIds = new Set(santri.map(s => s.id));
  const ustadzahKlaim = new Set(klaimAktif.flatMap(getJilidUstadzahIds));
  const riwayatIzin = izinList.filter(z => z.jenis === "ustadzah"
      ? (z.ustadzahId === currentProfile.uid || ustadzahKlaim.has(z.ustadzahId))
      : santriIds.has(z.santriId))
    .sort(byCreatedDesc).slice(0, 10);

  const santriKelasIds = new Set(santri.map(s => s.id));
  const izinHariIni = izinList.filter(z =>
    z.jenis !== "ustadzah" && santriKelasIds.has(z.santriId) && izinCocok(z, today)
  );

  // Ringkasan SPP menunggak
  const tagihanList = await fresh("tagihanSantri");
  const sppTanggalPeringatan = num(settings.sppTanggalPeringatan || 10);
  const tunggakanPerSantri = {};
  tagihanList.forEach(bill => {
    if(bill.jenis !== "SPP") return;
    if(!santriKelasIds.has(bill.santriId)) return;
    if(!isSppMenunggak(bill, sppTanggalPeringatan)) return;
    const sisa = Math.max(0, num(bill.nominal) - num(bill.terbayar));
    if(!tunggakanPerSantri[bill.santriId]){
      tunggakanPerSantri[bill.santriId] = { santriId: bill.santriId, santriNama: bill.santriNama || "-", bulanList: [], totalTunggakan: 0 };
    }
    tunggakanPerSantri[bill.santriId].bulanList.push({ label: formatPeriodeLabel(bill.periode), sisa });
    tunggakanPerSantri[bill.santriId].totalTunggakan += sisa;
  });
  const daftarMenunggak = Object.values(tunggakanPerSantri).sort((a,b) => b.totalTunggakan - a.totalTunggakan);
  const totalTunggakanKelas = daftarMenunggak.reduce((s,x) => s + x.totalTunggakan, 0);

  $("page").innerHTML = `
    ${pageHead("Dashboard", `Selamat datang, ${esc(currentProfile.nama || "Ustadzah")}.`)}

    <!-- Kartu utama -->
    <div class="card balance">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <div style="font-size:12px;opacity:.85">Kelas efektif hari ini</div>
          <div style="font-size:17px;font-weight:700;margin-top:4px">${jilidNames.length ? jilidNames.map(esc).join(", ") : "Belum ada kelas"}</div>
        </div>
        <div style="text-align:right;font-size:12px;line-height:1.6">
          <div>Santri: <b>${santri.length}</b></div>
          <div>Klaim: <b>${klaimAktif.length}</b></div>
        </div>
      </div>
    </div>

    ${pesanDashboard(settings)}
    ${liburCard(settings)}
    ${peringatanSantriSingkat(rekapSantri, settings)}
    ${rekapSaya.alpha >= batasAlphaHari(settings)
       ? `<div class="card danger"><b style="color:#991b1b">⚠️ Peringatan kehadiran Anda</b>
          <div class="muted small" style="margin-top:4px">Alpha ${rekapSaya.alpha} hari dalam ${jumlahHariRekap(settings)} hari terakhir.</div></div>` : ""}
    ${daftarMenunggak.length
       ? `<div class="card danger"><b style="color:#991b1b">💵 ${daftarMenunggak.length} santri menunggak SPP</b>
          <div class="muted small" style="margin-top:4px">Total ${formatRupiah(totalTunggakanKelas)}. Tap <b>Tunggakan</b> untuk detail.</div></div>` : ""}

    <!-- GRID MENU -->
    <div class="menu-grid" id="menuUstadzah" style="margin-top:14px">
      <button data-menu="kelas"><div class="ico">📚</div><div class="lbl">Kelas</div></button>
      <button data-menu="izin-santri"><div class="ico">📝</div><div class="lbl">Izin Santri</div></button>

      <button data-menu="rekap-santri"><div class="ico">📊</div><div class="lbl">Rekap Santri</div></button>
      <button data-menu="rekap-saya"><div class="ico">✅</div><div class="lbl">Rekap Saya</div></button>
      <button data-menu="riwayat-izin"><div class="ico">📋</div><div class="lbl">Riwayat Izin</div></button>
      <button data-menu="klaim"><div class="ico">🤝</div><div class="lbl">Klaim Kelas</div></button>
    </div>

    <!-- PANEL KONTEN -->
    <div class="menu-panel" id="panel-kelas">
      <div class="card"><h3>Kelas Anda hari ini</h3>
        ${jilidNames.length ? `<p>${jilidNames.map(esc).join(", ")}</p>` : `<p class="muted">Belum ada kelas.</p>`}
        ${klaimAktif.length ? `<div class="notice" style="margin-top:8px"><b>Anda menggantikan:</b><br>${klaimAktif.map(j => `• ${esc(j.nama)}${j.substituteAlasan ? ` — ${esc(j.substituteAlasan)}` : ""}`).join("<br>")}</div>` : ""}
        <button class="btn btn-sm" id="btnKeKlaim" style="margin-top:10px">🤝 Kelola klaim kelas</button></div>
    </div>

    <div class="menu-panel" id="panel-izin-santri">
      ${izinHariIni.length ? `<div class="card warn"><h3 style="color:#92400e">📝 Santri izin hari ini</h3><div style="margin-top:10px">
        ${dataTable("", ["Santri","Alasan","Tanggal","Pengaju"], izinHariIni.map(z => `<tr>
          <td><b style="color:#dc2626">${esc(z.santriNama)}</b></td>
          <td>${badgeAlasan(z.alasan)}${z.alasan === "kegiatan" && z.namaKegiatan ? ` ${esc(z.namaKegiatan)}` : ""}</td>
          <td>${esc(rangeText(z))}</td><td>${esc(z.diajukanOlehNama || "-")}</td></tr>`), "")}</div></div>`

              ${daftarMenunggak.length} santri · total <b>${formatRupiah(totalTunggakanKelas)}</b></p></div>
          <button class="btn btn-sm" id="btnKeKeuanganSpp">💰 Catat pembayaran</button>
        </div>
        <div style="margin-top:10px">
          ${dataTable("", ["Santri","Bulan","Sisa"], daftarMenunggak.map(item => `<tr>
            <td><b style="color:#dc2626">${esc(item.santriNama)}</b></td>
            <td>${item.bulanList.map(b => `${esc(b.label)} <span class="muted small">(${formatRupiah(b.sisa)})</span>`).join("<br>")}</td>
            <td><b style="color:#dc2626">${formatRupiah(item.totalTunggakan)}</b></td></tr>`), "")}
        </div></div>` : `<div class="card ok"><h3 style="color:#166534">✅ Semua SPP lunas</h3>
          <p class="muted small" style="margin:4px 0 0">Tidak ada tunggakan SPP untuk kelas Anda.</p></div>`}
    </div>

    <div class="menu-panel" id="panel-rekap-santri">
      <div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
          <h3 style="margin:0">📊 Rekap kehadiran santri</h3>
          <button class="btn btn-sm btn-light btn-mobile-icon" id="btnExportRekapSantri">⬇<span class="btn-label"> Excel</span></button>

async function renderDashboardWali(){

  ]);
  const { settings, izinList } = ctx;

  const pengumumanAktif = pengumuman.filter(isPengumumanTampil).sort(byCreatedDesc);
  const rekap = hitungRekap(santri, "santri", ctx);
  const ids = new Set(santri.map(s => s.id));
  const riwayatIzin = izinList.filter(z => ids.has(z.santriId)).sort(byCreatedDesc).slice(0, 10);

  const pendampingSet = new Set();
  santri.forEach(s => {
    const j = jilidList.find(x => x.id === s.jilidId);

  });
  const pendamping = [...pendampingSet].join(", ");

  $("page").innerHTML = `
    ${pageHead("Dashboard wali", `Selamat datang, ${esc(currentProfile.nama || "Wali Santri")}.`)}
    <div class="grid grid-3">
      ${statCard("👨‍🎓","Jumlah santri", santri.length)}${statCard("📢","Pengumuman", pengumumanAktif.length)}
      <div class="card"><div class="stat-icon">👩‍🏫</div><div class="stat-label">Ustadzah pendamping</div><div style="font-weight:700;margin-top:4px">${esc(pendamping || "Belum ditentukan")}</div></div>
    </div>
    ${pesanDashboard(settings)}
    <div class="stack" style="margin-top:14px">
      ${liburCard(settings)}
      ${peringatanCard(rekap, settings, "Santri Anda")}
      ${santri.length ? `<div class="card"><h3>Ananda</h3><div class="grid grid-3" style="margin-top:10px">
        ${santri.map(s => {
          const st = statusSantri(s.id, today, ctx);

function openAkunForm(role, item, onSaved, jilidList=[]){
  const isUstadzah = role === "ustadzah";
  const label = isUstadzah ? "ustadzah" : "wali";
  const kelasAwal = item ? jilidList.filter(j => getJilidUstadzahIds(j).includes(item.id)).map(j => j.id) : [];
  openFormModal({
    title: item ? `Edit data ${label}` : `Buat akun ${label}`,
    body: `${fg("Nama", `<input id="akunNama" value="${esc(item?.nama)}" required>`)}
      ${fg("Email", `<input id="akunEmail" type="email" value="${esc(item?.email)}" ${item ? "disabled" : ""} required>`)}
      ${!item ? fg("Password awal", `<input id="akunPassword" type="password" minlength="6" placeholder="Minimal 6 karakter" required>`) : ""}
      ${fg("Telepon", `<input id="akunTelepon" value="${esc(item?.telepon)}" placeholder="08xxxxxxxxxx">`)}
      ${isUstadzah
        ? fg("Kelas / jilid diampu", `<div class="check-grid">${jilidList.length ? jilidList.map(k => `
            <label><input type="checkbox" class="jilid-check" value="${esc(k.id)}" ${kelasAwal.includes(k.id) ? "checked" : ""}>${esc(k.nama)}</label>`).join("") : `<span class="muted small">Belum ada kelas/jilid.</span>`}</div>`)
        : fg("Alamat", `<textarea id="akunAlamat" rows="2">${esc(item?.alamat)}</textarea>`)}
      ${fg("Status", `<select id="akunAktif"><option value="true" ${item?.aktif !== false ? "selected" : ""}>Aktif</option><option value="false" ${item?.aktif === false ? "selected" : ""}>Nonaktif</option></select>`)}`,
    onSubmit: async () => {
      const profile = { nama: $("akunNama").value.trim(), telepon: $("akunTelepon").value.trim(), aktif: $("akunAktif").value === "true" };
      let terpilih = [];
      if(isUstadzah){
        terpilih = [...document.querySelectorAll(".jilid-check:checked")].map(x => x.value);
        const names = jilidList.filter(k => terpilih.includes(k.id)).map(k => k.nama);
        Object.assign(profile, { jilidIds: terpilih, jilidNames: names, jilidId: terpilih[0] || null, jilidNama: names[0] || null });
      }else profile.alamat = $("akunAlamat").value.trim();

      let uid = item?.id;
      if(item) await updateManagedAccount(uid, role, profile);
      else uid = await createManagedAccount({ email: $("akunEmail").value.trim(), password: $("akunPassword").value, role, profile });

      if(isUstadzah){
        for(const j of jilidList){
          const ids = getJilidUstadzahIds(j), punya = ids.includes(uid), mau = terpilih.includes(j.id);
          if(punya === mau) continue;
          await updateCollectionData("jilid", j.id, { ustadzahIds: mau ? [...ids, uid] : ids.filter(x => x !== uid) });
        }
      }
      logAudit(item ? "UPDATE" : "CREATE", role, uid);
      showToast(`Data ${label} berhasil disimpan.`);
      onSaved?.();
    }
  });
}
