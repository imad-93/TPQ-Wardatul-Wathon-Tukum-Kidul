function downloadTemplateSantri(){
  const rows = [
    ["Nama Santri","Jenis Kelamin","Kelas / Jilid","Email Wali","Nama Wali (Tampilan)","Password Wali (opsional)","Status (Aktif/Nonaktif)"],
    ["Ahmad Fauzi","Laki-laki","Jilid 1","ayah.ahmad@gmail.com","Bpk. Ahmad","wali123456","Aktif"],
    ["Siti Aminah","Perempuan","Jilid 2","ibu.siti@gmail.com","Ibu Siti","","Aktif"],
    ["Muhammad Rizki","Laki-laki","","","Bpk. Rizki","","Aktif"]
  ];
  const csv = rows.map(r => r.map(c => `"${String(c ?? "").replaceAll('"','""')}"`).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type:"text/csv;charset=utf-8;" }));
  const a = Object.assign(document.createElement("a"), { href:url, download:"template-import-santri.csv" });
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Template CSV diunduh.");
}
async function parseSpreadsheetFile(file){
  if(!window.XLSX) throw new Error("Pustaka pembaca Excel belum siap. Muat ulang halaman.");
  if(!file) throw new Error("File belum dipilih.");
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:"", raw:false });
}
const findHeader = (keys, kws) => { for(const kw of kws){ const k = keys.find(x => String(x).toLowerCase().includes(kw)); if(k) return k; } return null; };
function normalizeGender(v){
  const s = String(v || "").trim().toLowerCase();
  if(/^(l|lk|laki|pria|male|m)/.test(s)) return "Laki-laki";
  if(/^(p|pr|perempuan|wanita|female|f)/.test(s)) return "Perempuan";
  return "";
}
const normalizeAktif = v => !["nonaktif","non-aktif","non aktif","tidak","no","n","0","false","off"].includes(String(v || "").trim().toLowerCase());

function openImportSantriModal(existingSantri, onDone){
  openModal("Import data santri", `
    <form id="importForm">
      <div class="notice"><b>Petunjuk</b><ol style="margin:6px 0 0 18px;padding:0">
        <li>Unduh <b>Template</b> untuk melihat format kolom.</li>
        <li>Kolom <b>Nama Santri</b> wajib. Kolom lain opsional.</li>
        <li><b>Kelas / Jilid</b> harus sama persis dengan nama jilid di menu Ruang Ngaji.</li>
        <li>Jika <b>Email Wali</b> belum terdaftar, akun wali dibuat otomatis.</li>
        <li>Baris dengan nama santri dan kelas yang sama dengan data lama dilewati.</li></ol></div>
      ${fg("File CSV / Excel", `<input id="importFile" type="file" accept=".csv,.xls,.xlsx" required>`)}
      ${fg("Password default untuk wali baru", `<input id="importPassword" type="text" minlength="6" value="wali123456" required>
        <div class="muted small" style="margin-top:4px">Dipakai bila kolom password di file kosong.</div>`)}
      <div id="importPreview"></div>
      <button type="submit" class="btn btn-full" id="importSubmit" style="margin-top:14px">Import sekarang</button>
    </form>`);

  $("importFile").addEventListener("change", async () => {
    const box = $("importPreview"); box.innerHTML = "";
    const file = $("importFile").files?.[0]; if(!file) return;
    try{
      const rows = await parseSpreadsheetFile(file);
      box.innerHTML = rows.length
        ? `<div class="notice" style="margin-top:12px">Terbaca <b>${rows.length} baris</b>. Pratinjau 3 baris pertama:<pre style="white-space:pre-wrap;font-size:12px;margin:8px 0 0;max-height:160px;overflow:auto">${esc(JSON.stringify(rows.slice(0,3), null, 2))}</pre></div>`
        : `<div class="notice notice-warn">File kosong atau tidak ada baris data.</div>`;
    }catch(err){ box.innerHTML = `<div class="notice notice-warn">Gagal membaca file: ${esc(err.message)}</div>`; }
  });

  $("importForm").addEventListener("submit", async e => {
    e.preventDefault();
    const file = $("importFile").files?.[0];
    if(!file) return showToast("Pilih file terlebih dahulu.", true);
    await busy($("importSubmit"), "Mengimpor...", async () => {
      try{
        const rows = await parseSpreadsheetFile(file);
        if(!rows.length) throw new Error("Tidak ada baris data di file.");
        const [jilidList, waliList] = await Promise.all([fresh("jilid"), fresh("wali")]);
        const jilidByName = new Map(jilidList.map(j => [String(j.nama).trim().toLowerCase(), j]));
        const waliByEmail = new Map(waliList.map(w => [String(w.email || "").trim().toLowerCase(), w]));
        const waliByNama = new Map(waliList.map(w => [String(w.nama || "").trim().toLowerCase(), w]));
        const existingKeys = new Set(existingSantri.map(s => `${String(s.nama || "").trim().toLowerCase()}|${s.jilidId || ""}`));

        const keys = Object.keys(rows[0]);
        const hNama = findHeader(keys, ["nama santri"]) || keys.find(k => /nama/i.test(k) && !/wali/i.test(k));
        if(!hNama) throw new Error("Kolom 'Nama Santri' tidak ditemukan di file.");
        const h = {
          gender: findHeader(keys, ["jenis kelamin","gender","jk"]), jilid: findHeader(keys, ["jilid","kelas"]),
          email: findHeader(keys, ["email"]), waliNama: findHeader(keys, ["nama wali","tampilan"]),
          pass: findHeader(keys, ["password"]), aktif: findHeader(keys, ["status"])
        };
        const cell = (row, key) => key ? String(row[key] ?? "").trim() : "";
        const defaultPassword = $("importPassword").value.trim();

        let berhasil = 0, dilewati = 0;
        const gagal = [], tanpaJilid = [], waliBaru = [];

        for(const row of rows){
          const nama = cell(row, hNama);
          if(!nama){ dilewati++; continue; }
          const jilidRaw = cell(row, h.jilid);
          const jilid = jilidRaw ? jilidByName.get(jilidRaw.toLowerCase()) : null;
          if(jilidRaw && !jilid) tanpaJilid.push(`${nama} → "${jilidRaw}"`);
          const key = `${nama.toLowerCase()}|${jilid?.id || ""}`;
          if(existingKeys.has(key)){ dilewati++; continue; }

          const email = cell(row, h.email), waliNamaRaw = cell(row, h.waliNama);
          let wali = (email && waliByEmail.get(email.toLowerCase())) || (waliNamaRaw && waliByNama.get(waliNamaRaw.toLowerCase())) || null;
          if(!wali && email){
            try{
              const password = cell(row, h.pass) || defaultPassword;
              if(password.length < 6) throw new Error("password minimal 6 karakter");
              const namaWali = waliNamaRaw || email.split("@")[0];
              const uid = await createManagedAccount({ email, password, role:"wali", profile:{ nama: namaWali, aktif:true } });
              wali = { id: uid, email, nama: namaWali };
              waliByEmail.set(email.toLowerCase(), wali); waliByNama.set(namaWali.toLowerCase(), wali);
              waliBaru.push(`${namaWali} <${email}>`);
            }catch(err){ gagal.push(`Wali untuk "${nama}" (${email}): ${firebaseError(err)}`); }
          }
          try{
            await addCollectionData("santri", {
              nama, jenisKelamin: normalizeGender(cell(row, h.gender)),
              jilidId: jilid?.id || null, jilidNama: jilid?.nama || jilidRaw || null,
              waliUid: wali?.id || null, waliNama: wali?.nama || waliNamaRaw || null,
              aktif: normalizeAktif(cell(row, h.aktif))
            });
            existingKeys.add(key); berhasil++;
          }catch(err){ gagal.push(`${nama}: ${firebaseError(err)}`); }
        }
        sppEnsuredPeriode = null;
        logAudit("IMPORT","santri","",{ berhasil, dilewati, waliDibuat: waliBaru.length, gagal: gagal.length });

        const list = arr => arr.map(esc).join("<br>");
        openModal("Hasil import santri", `
          <div class="notice">✅ <b>${berhasil}</b> santri ditambahkan.<br>👤 <b>${waliBaru.length}</b> akun wali baru dibuat.<br>
            ⏭ <b>${dilewati}</b> baris dilewati.<br>❌ <b>${gagal.length}</b> gagal disimpan.</div>
          ${waliBaru.length ? `<div class="notice" style="margin-top:10px"><b>Akun wali baru:</b><br><span class="small">${list(waliBaru)}</span>
            <div class="muted small" style="margin-top:6px">Password awal: <b>${esc(defaultPassword)}</b>.</div></div>` : ""}
          ${tanpaJilid.length ? `<div class="notice notice-warn" style="margin-top:10px"><b>Jilid tidak ditemukan (${tanpaJilid.length}):</b><br><span class="small">${list(tanpaJilid)}</span></div>` : ""}
          ${gagal.length ? `<div class="notice notice-warn" style="margin-top:10px"><b>Gagal:</b><br><span class="small">${list(gagal)}</span></div>` : ""}
          <button class="btn btn-full" id="importDone" style="margin-top:14px">Selesai</button>`);
        $("importDone").addEventListener("click", () => { closeModal(); onDone?.(); });
      }catch(err){
        console.error(err);
        showToast("Gagal import: " + firebaseError(err), true);
      }
    });
  });
}

  async function renderTabHarian(){
    const [jilidList, santriList, ctx] = await Promise.all([fresh("jilid"), fresh("santri"), loadKehadiranContext()]);
    const today = todayStr();
    const kelasAktif = jilidList.filter(j => j.aktif !== false);

    $("ruangNgajiContent").innerHTML = `
      <div class="card">
        <div class="row">
          ${fg("Tanggal", `<input id="rekapTanggal" type="date" value="${today}" max="${today}">`)}
          ${fg("Kelas / jilid", `<select id="rekapJilid">
            <option value="">Semua kelas</option>
            ${kelasAktif.map(j => `<option value="${esc(j.id)}">${esc(j.nama)}</option>`).join("")}
          </select>`)}
        </div>
      </div>
      <div id="rekapHarianBody" style="margin-top:14px"></div>`;

    function renderKonten(){
      const tanggal = $("rekapTanggal").value || today;
      const jid = $("rekapJilid").value;
      const santri = santriList.filter(s => s.aktif !== false && (!jid || s.jilidId === jid));
      if(!santri.length){ $("rekapHarianBody").innerHTML = `<div class="card empty">Belum ada santri.</div>`; return; }

      const rows = santri.map(s => ({ santri: s, st: statusSantri(s.id, tanggal, ctx) }));
      const count = { hadir:0, izin:0, alpha:0, libur:0, belum:0 };
      rows.forEach(r => { count[r.st.status] = (count[r.st.status] || 0) + 1; });

      const liburInfo = isHariLibur(tanggal, ctx.settings)
        ? `<div class="card info"><b style="color:#1e40af">🏖️ ${esc(labelLibur(tanggal, ctx.settings))}</b>
            <div class="muted small" style="margin-top:4px">Tanggal ini libur.</div></div>`
        : "";

      $("rekapHarianBody").innerHTML = `
        ${liburInfo}
        <div class="grid" style="margin-top:12px">
          ${statCard("✅","Hadir", count.hadir || 0)}${statCard("🟡","Izin", count.izin || 0)}
          ${statCard("🔴","Alpha", count.alpha || 0)}${statCard("⏳","Belum", count.belum || 0)}
        </div>
        <div class="card" style="margin-top:14px">
          <h3>Detail kehadiran ${esc(tanggal)}</h3>
          <div style="margin-top:10px">
            ${dataTable("", ["No","Santri","Kelas","Status","Ket"],
              rows.map((r, i) => {
                const ket = r.st.status === "izin" && r.st.izin
                  ? `${labelAlasan(r.st.izin.alasan)}${r.st.izin.namaKegiatan ? " — " + esc(r.st.izin.namaKegiatan) : ""}`
                  : "-";
                return `<tr><td>${i+1}</td>
                  <td><b style="${r.st.status === "izin" ? "color:#dc2626" : ""}">${esc(r.santri.nama)}</b></td>
                  <td>${esc(r.santri.jilidNama || "-")}</td>
                  <td>${badgeStatusHarian(r.st)}</td><td>${ket}</td></tr>`;
              }), "Belum ada santri.")}
          </div>
        </div>`;
    }
    $("rekapTanggal").addEventListener("change", renderKonten);
    $("rekapJilid").addEventListener("change", renderKonten);
    renderKonten();
  }
}

async function openJilidForm(item, onSaved){
  const jilidId = item?.id || (crypto.randomUUID ? crypto.randomUUID() : `jilid_${Date.now()}_${Math.random().toString(16).slice(2)}`);
  const ustadzahList = await getCollectionData("ustadzah");
  const currentIds = getJilidUstadzahIds(item);
  const persist = field => item ? (total => updateCollectionData("jilid", item.id, { [field]: total })) : null;

  openFormModal({
    title: item ? "Edit jilid / kelas" : "Tambah jilid / kelas", submit: "💾 Simpan",
    body: `${fg("Nama jilid / kelas", `<input id="jilidNama" value="${esc(item?.nama)}" placeholder="Contoh: Jilid 1" required>`)}
      ${fg("Keterangan", `<textarea id="jilidKeterangan" rows="2">${esc(item?.keterangan)}</textarea>`)}
      ${fg("Ustadzah pengampu", `<div class="check-grid">${ustadzahList.length ? ustadzahList.map(u => `
        <label><input type="checkbox" class="ustadzah-check" value="${esc(u.id)}" ${currentIds.includes(u.id) ? "checked" : ""}>${esc(u.nama || u.email || "-")}</label>`).join("")
        : `<span class="muted small">Belum ada akun ustadzah.</span>`}</div>`)}
      ${pdfUploadBlock("baca", "📖 Buku baca (PDF)")}<div style="height:10px"></div>${pdfUploadBlock("hafalan", "🧠 Buku hafalan (PDF)")}
      <div class="notice" style="margin-top:12px">PDF dikompres otomatis (~180 KB/halaman, WebP) supaya ringan di HP.</div>
      ${fg("Status", `<select id="jilidAktif"><option value="true" ${item?.aktif !== false ? "selected" : ""}>Aktif</option><option value="false" ${item?.aktif === false ? "selected" : ""}>Nonaktif</option></select>`)}`,
    onSubmit: async () => {
      const ustadzahIds = [...document.querySelectorAll(".ustadzah-check:checked")].map(x => x.value);
      const payload = {
        nama: $("jilidNama").value.trim(), keterangan: $("jilidKeterangan").value.trim(), aktif: $("jilidAktif").value === "true",
        totalHalamanBaca: uploaders.baca.getTotal(), totalHalamanHafalan: uploaders.hafalan.getTotal(),
        ustadzahIds, ustadzahNames: ustadzahList.filter(u => ustadzahIds.includes(u.id)).map(u => u.nama || u.email || "")
      };
      if(item){ await updateCollectionData("jilid", item.id, payload); logAudit("UPDATE","jilid",item.id,{ nama: payload.nama }); }
      else{
        await setDoc(doc(db, "jilid", jilidId), { ...payload, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        invalidateCache("jilid"); logAudit("CREATE","jilid",jilidId,{ nama: payload.nama });
      }
      showToast("Jilid berhasil disimpan.");
      onSaved?.();
    }
  });
  const uploaders = {
    baca: bindPdfUploader("baca", jilidId, item?.totalHalamanBaca, persist("totalHalamanBaca")),
    hafalan: bindPdfUploader("hafalan", jilidId, item?.totalHalamanHafalan, persist("totalHalamanHafalan"))
  };
}

      guarded(() => hapusDenganAudit("tagihanSantri", id, "Tagihan tidak ditemukan.", x => ({ jenis:x.jenis, judul:x.judul, santriNama:x.santriNama, nominal:x.nominal, terbayar:x.terbayar })), "Tagihan dihapus.");

    const t = tabunganList.find(x => x.id === id);
    if(t && confirm(`Hapus transaksi ${t.jenis === "tarik" ? "tarik" : "setor"} ${formatRupiah(t.jumlah)} untuk ${t.santriNama}?`))
      guarded(() => hapusDenganAudit("tabungan", id, "Transaksi tidak ditemukan.", x => ({ santriNama:x.santriNama, jenis:x.jenis, jumlah:x.jumlah })), "Transaksi tabungan dihapus.");
  });

  $("btnExportSpp").addEventListener("click", () => {

      "Sisa": Math.max(0, num(b.nominal) - num(b.terbayar)),
      "Status": b.status === "lunas" ? "Lunas" : b.status === "sebagian" ? "Sebagian" : "Belum Bayar",
      "Menunggak": isSppMenunggak(b, tgl) ? "Ya" : "Tidak"
    }));

  });
  // Export Excel Tabungan
  $("btnExportTabungan").addEventListener("click", () => {
    const rows = tabunganSorted.map((t, i) => ({
      "No": i + 1, "Nama Santri": t.santriNama || "",
      "Jenis": t.jenis === "tarik" ? "Tarik" : "Setor",
      "Jumlah": num(t.jumlah), "Keterangan": t.keterangan || "",
      "Tanggal": formatTanggal(t.tanggal), "Dicatat Oleh": t.dicatatOlehNama || ""
    }));
    exportToExcel(rows, `rekap-tabungan-${todayStr()}.xlsx`, "Rekap Tabungan");
  });

  $("btnSetor").addEventListener("click", () => openTabunganModal({ santriList: santriAktif, tabunganList, jenis:"setor", onSaved: reload }));
  $("btnTarik").addEventListener("click", () => openTabunganModal({ santriList: santriAktif, tabunganList, jenis:"tarik", onSaved: reload }));

  // Rekap tabungan per santri
  $("btnRekapTabungan").addEventListener("click", () => {
    const rekap = santriAktif.map(s => ({
      santri: s,
      saldo: hitungSaldoTabungan(tabunganList, s.id),
      setor: tabunganList.filter(t => t.santriId === s.id && t.jenis === "setor").reduce((a,b) => a + num(b.jumlah), 0),
      tarik: tabunganList.filter(t => t.santriId === s.id && t.jenis === "tarik").reduce((a,b) => a + num(b.jumlah), 0)
    })).sort((a,b) => b.saldo - a.saldo);

    const totalSaldo = rekap.reduce((s,r) => s + r.saldo, 0);
    openModal("📊 Rekap tabungan santri", `
      <div class="notice"><b>Total saldo tabungan semua santri: ${formatRupiah(totalSaldo)}</b></div>
      ${dataTable("", ["No","Santri","Setor","Tarik","Saldo"],
        rekap.map((r,i) => `<tr><td>${i+1}</td><td><b>${esc(r.santri.nama)}</b></td>
          <td>${formatRupiah(r.setor)}</td><td>${formatRupiah(r.tarik)}</td>
          <td><b style="color:${r.saldo >= 0 ? '#166534' : '#dc2626'}">${formatRupiah(r.saldo)}</b></td></tr>`),
        "Belum ada data.")}`);
  });

  $("btnCatatInfaq").addEventListener("click", () => openInfaqModal(donaturList, reload));
  onClick("[data-hapus-infaq]", "hapusInfaq", id => {
    const x = infaqList.find(i => i.id === id);

  });

  $("btnTambahDonatur").addEventListener("click", () => openDonaturForm(null, reload));
  onClick("[data-edit-donatur]", "editDonatur", id => openDonaturForm(donaturList.find(d => d.id === id), reload));
  onClick("[data-hapus-donatur]", "hapusDonatur", id => {
    const d = donaturList.find(x => x.id === id); if(!d) return;
    const n = infaqList.filter(x => x.donaturId === id).length;
    if(confirm(n ? `Donatur "${d.nama}" punya ${n} catatan infaq. Hapus donatur saja (infaq tetap tersimpan)?` : `Hapus donatur "${d.nama}"?`))
      guarded(() => hapusDenganAudit("donatur", id, "Donatur tidak ditemukan.", x => ({ nama:x.nama })), "Donatur dihapus.");
  });

  $("btnCatatPengeluaran").addEventListener("click", () => openPengeluaranModal(reload));
  onClick("[data-hapus-pengeluaran]", "hapusPengeluaran", id => {
    const x = pengeluaranList.find(p => p.id === id);

  });
}

function editLiburEvent(idx, onSaved){
  getAppSettings().then(s => {
    const target = (s.liburEvents || [])[idx];
    if(!target) return showToast("Libur event tidak ditemukan.", true);
    openFormModal({
      title: "Edit libur event", submit: "Simpan perubahan",
      body: `${fg("Nama event", `<input id="elNama" value="${esc(target.nama)}" required>`)}
        <div class="row">${fg("Tanggal mulai", `<input id="elMulai" type="date" value="${esc(target.mulai)}" required>`)}${fg("Tanggal selesai", `<input id="elSelesai" type="date" value="${esc(target.selesai)}" required>`)}</div>
        ${fg("Keterangan", `<textarea id="elKet" rows="2">${esc(target.keterangan)}</textarea>`)}`,
      onSubmit: async () => {
        const baru = { nama: $("elNama").value.trim(), mulai: $("elMulai").value, selesai: $("elSelesai").value, keterangan: $("elKet").value.trim() };
        if(baru.selesai < baru.mulai){ showToast("Tanggal selesai tidak boleh sebelum tanggal mulai.", true); return false; }
        const cur = await getAppSettings();
        const list = [...(cur.liburEvents || [])]; list[idx] = baru;
        await saveSettings({ liburEvents: list });
        const payload = pengumumanLiburPayload(baru);
        for(const p of pengumumanLiburTerkait(await fresh("pengumuman"), target)) await updateCollectionData("pengumuman", p.id, payload);
        logAudit("UPDATE","settings","app",{ editLiburEvent: baru });
        showToast("Libur event diperbarui.");
        onSaved?.();
      }
    });
  });
}

function openBackfillSppForm(settings){
  getCollectionData("santri").then(list => {
    const aktif = list.filter(s => s.aktif !== false);
    openFormModal({
      title: "Backfill SPP menunggak", submit: "Buat tagihan SPP",
      body: `<div class="notice">Buat tagihan SPP bulan-bulan sebelumnya (tahun ini) untuk santri yang menunggak.</div>
        ${fg("Santri", `<select id="bfSantri" required><option value="">Pilih santri</option>${aktif.map(s => `<option value="${esc(s.id)}">${esc(s.nama)}</option>`).join("")}</select>`)}
        ${fg("Bulan tertagih", `<select id="bfBulan">${daftarBulanTahunIni().map(b => `<option value="${b.key}">${b.label}</option>`).join("")}</select>`)}
        ${fg("Nominal SPP bulan tersebut", `<input id="bfNominal" type="number" min="0" value="${num(settings.sppNominal)}" required>`)}`,
      onSubmit: async () => {
        const santri = aktif.find(s => s.id === $("bfSantri").value);
        if(!santri){ showToast("Pilih santri terlebih dahulu.", true); return false; }
        const periode = $("bfBulan").value;

async function jalankanMigrasiMultiUstadzah(){
  if(!confirm("Jalankan migrasi struktur data? Jalankan hanya sekali setelah pembaruan.")) return;
  try{
    let nJilid = 0, nUstadzah = 0;
    for(const j of await fresh("jilid")){
      if(Array.isArray(j.ustadzahIds)) continue;
      await updateCollectionData("jilid", j.id, { ustadzahIds: j.ustadzahId ? [j.ustadzahId] : [], ustadzahNames: j.ustadzahNama ? [j.ustadzahNama] : [] });
      nJilid++;
    }
    for(const u of await fresh("ustadzah")){
      if(Array.isArray(u.jilidIds)) continue;
      await updateCollectionData("ustadzah", u.id, { jilidIds: u.jilidId ? [u.jilidId] : [], jilidNames: u.jilidNama ? [u.jilidNama] : [] });
      nUstadzah++;
    }
    showToast(`Migrasi selesai. Jilid: ${nJilid}, ustadzah: ${nUstadzah}.`);
  }catch(err){ showToast("Gagal migrasi: " + firebaseError(err), true); }
}
window.jalankanMigrasiMultiUstadzah = jalankanMigrasiMultiUstadzah;

/* ============ 22. PENGUMUMAN ============ */
async function renderPengumuman(){
  const isAdmin = currentProfile.role === "admin";
  const all = await fresh("pengumuman");
  let filterStatus = "semua";

  const terapkanFilter = list => {
    if(!isAdmin) return list.filter(isPengumumanTampil);
    if(filterStatus === "semua") return list;
    if(filterStatus === "aktif") return list.filter(p => p.aktif !== false && p.manualHidden !== true && !isPengumumanKadaluarsa(p));
    if(filterStatus === "kadaluarsa") return list.filter(p => isPengumumanKadaluarsa(p));
    if(filterStatus === "disembunyikan") return list.filter(p => p.manualHidden === true || p.aktif === false);
    return list;
  };

  function renderKonten(){
    const data = terapkanFilter(all).sort(byCreatedDesc);
    $("listPengumuman").innerHTML = data.length ? data.map(p => {
      const redup = isPengumumanKadaluarsa(p) || p.manualHidden === true;
      const tersembunyi = redup || p.aktif === false;
      return `<div class="card ${redup ? "soft" : ""}" style="${redup ? "opacity:.75" : ""}">
        <div style="display:flex;justify-content:space-between;gap:10px"><div><h3 style="margin:0">${esc(p.judul || "-")}</h3>
          <div class="muted small" style="margin-top:4px">Dibuat: ${formatTanggal(p.createdAt)}</div>
          ${p.berlakuSampai ? `<div class="muted small">Berlaku sampai: <b>${formatTanggalJam(p.berlakuSampai)}</b></div>` : ""}</div>${isAdmin ? badgeStatusPengumuman(p) : ""}</div>
        <p style="white-space:pre-wrap;line-height:1.6;margin-top:10px">${esc(p.isi || "")}</p>
        ${isAdmin ? `<div class="actions">
          <button class="btn btn-sm btn-mobile-icon" data-edit="${esc(p.id)}" title="Edit">✏️<span class="btn-label"> Edit</span></button>
          ${tersembunyi ? `<button class="btn btn-sm btn-success btn-mobile-icon" data-tampilkan="${esc(p.id)}" title="Tampilkan">👁<span class="btn-label"> Tampilkan</span></button>` 
                        : `<button class="btn btn-sm btn-warning btn-mobile-icon" data-sembunyikan="${esc(p.id)}" title="Sembunyikan">🙈<span class="btn-label"> Sembunyikan</span></button>`}
          <button class="btn btn-sm btn-danger btn-mobile-icon" data-remove="${esc(p.id)}" title="Hapus">🗑<span class="btn-label"> Hapus</span></button></div>` : ""}</div>`;
    }).join("") : `<div class="card empty">Belum ada pengumuman.</div>`;
    bindActions();
  }

  function bindActions(){
    if(!isAdmin) return;
    const act = async (fn, okMsg) => { try{ await fn(); showToast(okMsg); renderPengumuman(); }catch(err){ showToast(firebaseError(err), true); } };
    const onClick = (sel, attr, handler) => $("listPengumuman").querySelectorAll(sel).forEach(b => b.addEventListener("click", () => handler(b.dataset[attr])));
    onClick("[data-edit]", "edit", id => openPengumumanForm(all.find(x => x.id === id)));
    onClick("[data-remove]", "remove", id => confirm("Hapus pengumuman ini permanen?") &&
      act(async () => { await deleteCollectionData("pengumuman", id); logAudit("DELETE","pengumuman",id); }, "Pengumuman dihapus."));
    onClick("[data-sembunyikan]", "sembunyikan", id => confirm("Sembunyikan pengumuman ini dari wali dan ustadzah? Anda bisa menampilkannya lagi nanti.") &&
      act(async () => {
        await updateCollectionData("pengumuman", id, { manualHidden:true, hiddenAt: new Date().toISOString(), hiddenBy: currentProfile.nama || "" });
        logAudit("UPDATE","pengumuman",id,{ manualHidden:true });
      }, "Pengumuman disembunyikan."));
    onClick("[data-tampilkan]", "tampilkan", id => act(async () => {
      const item = all.find(x => x.id === id);
      const updates = { manualHidden:false, aktif:true };
      if(item && isPengumumanKadaluarsa(item)) updates.berlakuSampai = null;
      await updateCollectionData("pengumuman", id, updates);
      logAudit("UPDATE","pengumuman",id,{ ditampilkanLagi:true });
    }, "Pengumuman ditampilkan kembali."));
  }

  const hitung = {
    semua: all.length,
    aktif: all.filter(p => p.aktif !== false && p.manualHidden !== true && !isPengumumanKadaluarsa(p)).length,
    kadaluarsa: all.filter(isPengumumanKadaluarsa).length,
    disembunyikan: all.filter(p => p.manualHidden === true || p.aktif === false).length
  };

  $("page").innerHTML = `
    ${pageHead("📢 Pengumuman", isAdmin ? "Semua pengumuman, termasuk yang kadaluarsa." : "Informasi terbaru dari admin TPQ.",
      isAdmin ? `<button class="btn" id="btnTambahPengumuman">+ Buat</button>` : "")}
    ${isAdmin ? `<div class="tabs" id="filterPengumuman" style="margin-bottom:14px">
      <button data-f="semua" class="active">Semua (${hitung.semua})</button>
      <button data-f="aktif">Aktif (${hitung.aktif})</button>
      <button data-f="kadaluarsa">Kadaluarsa (${hitung.kadaluarsa})</button>
      <button data-f="disembunyikan">Disembunyikan (${hitung.disembunyikan})</button>
    </div>` : ""}
    <div class="grid grid-2" id="listPengumuman"></div>`;

  if(isAdmin){
    $("btnTambahPengumuman").addEventListener("click", () => openPengumumanForm(null));
    $("filterPengumuman").querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
      filterStatus = b.dataset.f;
      $("filterPengumuman").querySelectorAll("[data-f]").forEach(x => x.classList.toggle("active", x === b));
      renderKonten();
    }));
  }
  renderKonten();
}
function openPengumumanForm(item){
  const toLocal = value => {
    const d = toDate(value); if(!d) return "";
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  openFormModal({
    title: item ? "Edit pengumuman" : "Buat pengumuman", submit: "Simpan pengumuman",
    body: `${fg("Judul", `<input id="pgmJudul" value="${esc(item?.judul)}" required>`)}
      ${fg("Isi pengumuman", `<textarea id="pgmIsi" rows="7" required>${esc(item?.isi)}</textarea>`)}
      ${fg("⏰ Berlaku sampai (opsional)", `<input id="pgmSampai" type="datetime-local" value="${toLocal(item?.berlakuSampai)}">
        <div class="muted small" style="margin-top:4px">Setelah tanggal dan jam ini lewat, pengumuman otomatis disembunyikan. Kosongkan bila tidak perlu kadaluarsa.</div>`)}
      ${fg("Status", `<select id="pgmAktif"><option value="true" ${item?.aktif !== false ? "selected" : ""}>Aktif</option><option value="false" ${item?.aktif === false ? "selected" : ""}>Nonaktif</option></select>`)}
      ${item && isPengumumanKadaluarsa(item) ? `<div class="notice">Pengumuman ini sudah kadaluarsa pada ${formatTanggalJam(item.berlakuSampai)}.</div>` : ""}`,
    onSubmit: async () => {
      const sampai = $("pgmSampai").value;
      const payload = {
        judul: $("pgmJudul").value.trim(), isi: $("pgmIsi").value.trim(),
        aktif: $("pgmAktif").value === "true", berlakuSampai: sampai ? new Date(sampai).toISOString() : null
      };
      if(item?.manualHidden === true && payload.aktif) payload.manualHidden = false;
      if(item){ await updateCollectionData("pengumuman", item.id, payload); logAudit("UPDATE","pengumuman",item.id); }
      else{ const ref = await addCollectionData("pengumuman", payload); logAudit("CREATE","pengumuman",ref.id,{ judul: payload.judul }); }
      showToast("Pengumuman berhasil disimpan.");
      renderPengumuman();
    }
  });
}

function openKlaimKelasModal(bisaKlaim, ustadzahList, izinList){
  const izinAktif = new Map(izinList.filter(z => z.jenis === "ustadzah" && z.aktif !== false && izinCocok(z, todayStr())).map(z => [z.ustadzahId, z]));
  const opsi = bisaKlaim.map(j => {
    const sedangIzin = getJilidUstadzahIds(j).map(id => izinAktif.get(id)).filter(Boolean);
    const catatan = sedangIzin.length ? ` ⚠️ ${sedangIzin.map(z => z.santriNama || "Ustadzah").join(", ")} sedang izin (${labelAlasan(sedangIzin[0].alasan)})` : "";
    return `<option value="${esc(j.id)}">${esc(j.nama)} — pengampu: ${esc(namaPengampu(j, ustadzahList).join(", ") || "belum ditentukan")}${esc(catatan)}</option>`;
  }).join("");
  openFormModal({
    title: "Klaim kelas pengganti", submit: "Klaim sekarang",
    body: `<div class="notice">Pilih kelas yang ingin Anda gantikan. Klaim berakhir otomatis pada tanggal yang Anda tentukan.</div>
      ${fg("Pilih kelas", `<select id="klaimJilid" required>${opsi}</select>`)}
      ${fg("Alasan menggantikan (opsional)", `<input id="klaimAlasan" placeholder="Contoh: Ustadzah A sakit">`)}

    onSubmit: async () => {
      const id = $("klaimJilid").value;
      await updateCollectionData("jilid", id, {
        substituteUid: currentProfile.uid, substituteNama: currentProfile.nama || "",
        substituteFrom: todayStr(), substituteUntil: $("klaimSampai").value || todayStr(), substituteAlasan: $("klaimAlasan").value.trim()
      });
      logAudit("UPDATE","jilid",id,{ klaim:true, uid: currentProfile.uid });
      showToast("Kelas berhasil diklaim.");
      renderDaftarSantriUstadzah();
    }
  });
}

async function renderKeuanganSantriUstadzah(santriId){
  const santri = (await getCollectionData("santri")).find(x => x.id === santriId);
  if(!santri) return showToast("Santri tidak ditemukan.", true);
  const [settings, tagihan, tabunganList] = await Promise.all([getAppSettings(), getCollectionData("tagihanSantri"), getCollectionData("tabungan")]);
  const bills = tagihan.filter(x => x.santriId === santriId);
  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-light btn-sm" id="btnKembali">← Kembali</button></div>

    <div class="stack">${keuanganSantriHtml({ bills, tabunganList, santriId, settings, editable:true })}</div>`;

async function openPembelajaranEditor(santri, jilid, tipe){
  const total = totalHalamanJilid(jilid, tipe);
  if(total <= 0) return showToast(`Buku ${tipe === "hafalan" ? "hafalan" : "baca"} belum diupload admin.`, true);
  const progress = (await getCollectionData("progress")).find(x => x.santriId === santri.id && x.tipe === tipe);
  let current = Math.min(total, Math.max(1, num(progress?.halaman) || 1));
  let status = progress?.status || "mengulang";

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-light btn-sm" id="btnKembali">← Kembali</button></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div><h2 style="font-size:18px">${tipe === "hafalan" ? "🧠 Buku hafalan" : "📖 Buku baca"}</h2>
          <div class="muted" style="margin-top:4px">Santri: <b>${esc(santri.nama)}</b> · ${esc(jilid.nama)}</div></div>
        <span class="badge badge-blue" id="pageBadge"></span></div>
      <div class="actions" style="margin-top:14px">
        <button class="btn btn-sm" id="btnPrev">◀</button>
        <input id="pageInput" type="number" min="1" max="${total}" value="${current}" style="width:80px;text-align:center">
        <button class="btn btn-sm" id="btnNext">▶</button>
        <button class="btn btn-sm btn-success btn-mobile-icon" id="btnSavePage">📌<span class="btn-label"> Tandai terakhir</span></button></div>
      <div class="pdf-frame-wrap" style="margin-top:12px;border-radius:12px">
        <div class="pdf-loading" id="pageLoading"><div class="pdf-skeleton"></div></div>
        <img id="pageImage" class="pdf-page-img" alt="Halaman buku" decoding="async"></div>
      <div class="card soft" style="margin-top:12px"><h3>Hasil pembelajaran</h3>
        <div class="actions" style="margin-top:8px">
          <button class="btn btn-success" id="btnNaik">↑ Naik</button>
          <button class="btn btn-warning" id="btnMengulang">↻ Mengulang</button></div>
        ${fg("Pesan ustadzah", `<textarea id="pesanPembelajaran" rows="3" placeholder="Tuliskan catatan untuk wali...">${esc(progress?.pesan)}</textarea>`, "", "pesanWrap")}
        <button class="btn btn-info" id="btnSimpanPesan">💾 Simpan pesan</button></div></div>`;

  $("btnKembali").addEventListener("click", renderDaftarSantriUstadzah);
  async function showPage(){
    current = Math.min(total, Math.max(1, num($("pageInput").value) || 1));
    $("pageInput").value = current;
    $("pageBadge").textContent = `Halaman ${current}/${total}`;
    $("pageLoading").classList.remove("hidden");
    try{
      const gambar = await fetchHalamanGambar(jilid.id, tipe, current);
      if(gambar) $("pageImage").src = gambar;
      else{ $("pageImage").removeAttribute("src"); showToast(`Halaman ${current} belum tersedia.`, true); }
    }catch(err){ showToast("Gagal memuat halaman: " + firebaseError(err), true); }
    finally{ $("pageLoading").classList.add("hidden"); }

    // Preload halaman tetangga (tidak blocking)
    if(current < total) fetchHalamanGambar(jilid.id, tipe, current + 1).catch(() => {});
    if(current > 1) fetchHalamanGambar(jilid.id, tipe, current - 1).catch(() => {});
  }
  $("btnPrev").addEventListener("click", () => { $("pageInput").value = current - 1; showPage(); });
  $("btnNext").addEventListener("click", () => { $("pageInput").value = current + 1; showPage(); });
  $("pageInput").addEventListener("change", showPage);
  showPage();

  const save = async newStatus => {
    status = newStatus || status;
    await saveProgress({ santriId: santri.id, tipe, halaman: current, status, pesan: $("pesanPembelajaran").value.trim() });
  };
  $("btnSavePage").addEventListener("click", () => save());
  $("btnSimpanPesan").addEventListener("click", () => save());
  $("btnNaik").addEventListener("click", () => save("naik"));
  $("btnMengulang").addEventListener("click", () => save("mengulang"));
}

async function saveProgress({ santriId, tipe, halaman, status, pesan }){
  try{
    const existing = (await getCollectionData("progress")).find(x => x.santriId === santriId && x.tipe === tipe);
    const payload = {
      santriId, tipe, halaman: Math.max(1, num(halaman) || 1), status: status || "mengulang", pesan: pesan || "",
      ustadzahUid: currentProfile.uid, ustadzahNama: currentProfile.nama || ""
    };
    if(existing) await updateCollectionData("progress", existing.id, payload);
    else await addCollectionData("progress", payload);
    await addCollectionData("riwayat", payload);
    logAudit("UPDATE","progress",santriId,{ tipe, halaman: payload.halaman, status: payload.status });
    showToast("Hasil pembelajaran disimpan.");
  }catch(err){
    console.error(err);
    showToast("Gagal menyimpan: " + firebaseError(err), true);
  }
}

async function renderPembelajaranWali(santriId){
  const santri = (await getCollectionData("santri")).find(x => x.id === santriId);
  if(!santri) return showToast("Data santri tidak ditemukan.", true);
  if(santri.waliUid !== currentProfile.uid) return showToast("Anda tidak memiliki akses ke santri ini.", true);

  const [jilidList, ustadzahList, progress, riwayatList, tagihan, tabunganList, settings] = await Promise.all([
    getCollectionData("jilid"), getCollectionData("ustadzah"), getCollectionData("progress"), fresh("riwayat"),
    getCollectionData("tagihanSantri"), getCollectionData("tabungan"), getAppSettings()
  ]);
  const jilid = jilidList.find(j => j.id === santri.jilidId) || null;
  const pendamping = jilid ? namaPengampu(jilid, ustadzahList).join(", ") : "";
  const riwayat = riwayatList.filter(r => r.santriId === santri.id).sort(byCreatedDesc);
  const kartu = (title, tipe) => {
    const p = progress.find(x => x.santriId === santri.id && x.tipe === tipe);
    const total = totalHalamanJilid(jilid, tipe);
    return `<div class="card"><h3>${title}</h3>
      <div>Halaman terakhir: <b>${p?.halaman || 1}</b>${total ? ` dari ${total}` : ""}</div>
      <div style="margin-top:10px">${badgePembelajaran(p?.status)}</div>
      ${p?.pesan ? `<div class="notice" style="margin-top:12px"><b>Pesan ustadzah</b><p style="white-space:pre-wrap;margin:4px 0 0">${esc(p.pesan)}</p></div>` : ""}
      <div style="margin-top:12px">${bukaHalamanBtn({ jilidId: jilid?.id, tipe, page: p?.halaman || 1, total, label: title, text: `${tipe === "baca" ? "📖" : "🧠"} Buka buku` })}</div></div>`;
  };

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-light btn-sm" id="btnKembali">← Kembali</button>
      <button class="btn btn-sm btn-success btn-mobile-icon" id="btnRiwayatLengkap">📊<span class="btn-label"> Riwayat lengkap</span></button></div>
    <div class="stack">
      <div class="card"><h2 style="font-size:18px">${esc(santri.nama || "-")}</h2>
        <p class="muted" style="margin:6px 0 0">Kelas/jilid: <b>${esc(jilid?.nama || santri.jilidNama || "-")}</b></p>
        <p class="muted" style="margin:0">Ustadzah pendamping: <b>${esc(pendamping || "Belum ditentukan")}</b></p></div>
      <div class="grid grid-2">${kartu("📖 Baca","baca")}${kartu("🧠 Hafalan","hafalan")}</div>
      <div class="card"><h3>📚 Riwayat pembelajaran</h3><div style="margin-top:10px">
        ${dataTable("", ["No.","Materi","Halaman","Status","Tanggal"], riwayat.map((r,i) => `<tr><td>${i+1}</td><td>${r.tipe === "hafalan" ? "🧠 Hafalan" : "📖 Baca"}</td>
          <td><b>Hlm ${num(r.halaman) || 1}</b><br>${bukaHalamanBtn({ jilidId: jilid?.id, tipe: r.tipe, page: r.halaman, total: totalHalamanJilid(jilid, r.tipe), label: r.tipe === "hafalan" ? "Buku Hafalan" : "Buku Baca" })}</td>
          <td>${badgePembelajaran(r.status)}</td><td>${formatTanggal(r.createdAt)}</td></tr>`), "Belum ada riwayat pembelajaran.")}</div></div>
      ${keuanganSantriHtml({ bills: tagihan.filter(x => x.santriId === santri.id), tabunganList, santriId: santri.id, settings, editable:false })}
      <div><button class="btn btn-sm" id="btnLihatQris">📱 Lihat QRIS pembayaran</button></div>
    </div>`;

  $("btnKembali").addEventListener("click", renderDashboardWali);
  $("btnRiwayatLengkap").addEventListener("click", () => renderRiwayatPembelajaranSantri(santri.id, "waliDashboard"));
  $("btnLihatQris").addEventListener("click", () => {
    const url = assetUrl(settings.qrisUrl);
    if(!url) return showToast("QRIS belum tersedia. Hubungi admin.", true);
    openModal("QRIS pembayaran", `<div style="text-align:center"><p class="muted">Scan QRIS berikut untuk melakukan pembayaran.</p>
      <img src="${esc(url)}" alt="QRIS pembayaran" style="width:320px;max-width:100%;border-radius:12px;border:1px solid var(--border)">
      <p class="muted" style="margin-top:12px">Setelah membayar, konfirmasikan kepada ustadzah atau admin sesuai prosedur TPQ.</p></div>`);
  });
  bindHalamanButtons($("page"));
}

async function renderRiwayatPembelajaranSantri(santriId, kembali="daftarSantri"){
  const santri = (await getCollectionData("santri")).find(x => x.id === santriId);
  if(!santri) return showToast("Santri tidak ditemukan.", true);
  const [riwayatList, jilidList, ustadzahList] = await Promise.all([fresh("riwayat"), getCollectionData("jilid"), getCollectionData("ustadzah")]);
  const jilid = jilidList.find(j => j.id === santri.jilidId) || null;
  const riwayat = riwayatList.filter(r => r.santriId === santriId).sort(byCreatedDesc);
  const rekap = hitungRekapPembelajaran(riwayat);
  let filter = "semua";

  const rows = () => {
    const data = filter === "semua" ? riwayat : riwayat.filter(r => r.tipe === filter);
    if(!data.length) return `<tr><td colspan="6" class="empty">Belum ada riwayat pembelajaran.</td></tr>`;
    return data.map((r,i) => {
      const total = totalHalamanJilid(jilid, r.tipe);
      return `<tr><td>${i+1}</td><td>${r.tipe === "hafalan" ? "🧠 Hafalan" : "📖 Baca"}</td>
        <td><b>Hlm ${num(r.halaman) || 1}</b>${total ? ` / ${total}` : ""}<br>${bukaHalamanBtn({ jilidId: jilid?.id, tipe: r.tipe, page: r.halaman, total, label: r.tipe === "hafalan" ? "Buku Hafalan" : "Buku Baca", text: "👁 Lihat" })}</td>
        <td>${badgePembelajaran(r.status)}</td><td>${esc(r.pesan || "-")}</td>
        <td>${esc(r.ustadzahNama || ustadzahList.find(u => u.id === r.ustadzahUid)?.nama || "-")}<br><span class="muted small">${formatTanggal(r.createdAt)}</span></td></tr>`;
    }).join("");
  };
  const terakhir = (title, r, tipe) => `<div class="card"><h3>${title}</h3>${r ? `
    <p>Halaman: <b>${r.halaman}/${totalHalamanJilid(jilid, tipe) || "?"}</b></p><p>${badgePembelajaran(r.status)}</p>
    ${r.pesan ? `<div class="notice"><b>Pesan:</b><p style="margin:4px 0 0;white-space:pre-wrap">${esc(r.pesan)}</p></div>` : ""}
    <div class="muted small">${formatTanggal(r.createdAt)}</div>` : `<p class="muted">Belum ada catatan.</p>`}</div>`;

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-light btn-sm" id="btnKembali">← Kembali</button><span class="muted small">Riwayat &amp; rekap pembelajaran</span></div>
    <div class="stack">
      <div class="card"><div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start">
        <div><h2 style="font-size:18px">${esc(santri.nama)}</h2><p class="muted" style="margin:4px 0 0">Kelas: <b>${esc(jilid?.nama || santri.jilidNama || "-")}</b></p></div>
        <div style="text-align:right"><div class="muted small">% Naik</div><div style="font-size:26px;font-weight:700;color:#166534">${rekap.persenNaik}%</div></div></div></div>
      <div class="grid grid-3">${statCard("📚","Catatan", rekap.total)}${statCard("📖","Baca", rekap.baca)}${statCard("🧠","Hafalan", rekap.hafalan)}
        ${statCard("⬆️","Naik", rekap.naik)}${statCard("🔄","Mengulang", rekap.mengulang)}${statCard("🎯","% Naik", rekap.persenNaik + "%")}</div>
      <div class="card"><h3>📈 Tren 7 hari terakhir</h3>${chartTren(rekap.tren)}</div>
      <div class="grid grid-2">${terakhir("📖 Buku baca — terakhir", rekap.terakhirBaca, "baca")}${terakhir("🧠 Buku hafalan — terakhir", rekap.terakhirHafalan, "hafalan")}</div>
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 style="margin:0">📋 Riwayat lengkap</h3>
        <div class="actions" id="filterBtns">
          <button class="btn btn-sm" data-f="semua">Semua</button>
          <button class="btn btn-sm btn-light" data-f="baca">📖 Baca</button>
          <button class="btn btn-sm btn-light" data-f="hafalan">🧠 Hafalan</button></div></div>
        <div class="table-container" style="margin-top:12px"><table><thead><tr><th>No.</th><th>Materi</th><th>Halaman</th><th>Status</th><th>Pesan</th><th>Ustadzah</th></tr></thead>
          <tbody id="riwayatBody">${rows()}</tbody></table></div></div>
    </div>`;

  $("btnKembali").addEventListener("click", () => {
    if(kembali === "ruangNgaji") navigate("ruangNgaji");
    else if(kembali === "waliDashboard") renderDashboardWali();
    else renderDaftarSantriUstadzah();
  });
  $("filterBtns").querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f;
    $("riwayatBody").innerHTML = rows();
    $("filterBtns").querySelectorAll("[data-f]").forEach(x => x.classList.toggle("btn-light", x.dataset.f !== filter));
    bindHalamanButtons($("riwayatBody"));
  }));
  bindHalamanButtons($("page"));
}

/* ============ 25. VIEWER HALAMAN (RINGAN, AUTO-FIT) ============ */
function openHalamanViewer({ jilidId, tipe, halaman=1, totalHalaman=0, label="Buku" }){
  if(!jilidId || !tipe) return showToast("Buku belum tersedia.", true);
  let page = Math.max(1, num(halaman) || 1), zoom = 100;
  const total = Math.max(0, num(totalHalaman));

  openModal(label, `<div class="pdf-viewer">
    <div class="pdf-toolbar">
      <div class="pdf-toolbar-group">
        <button type="button" id="halPrev" title="Sebelumnya">◀</button>
        <div class="pdf-page-indicator" id="halIndicator"></div>
        <button type="button" id="halNext" title="Berikutnya">▶</button></div>
      <div class="pdf-toolbar-group">
        <button type="button" id="halZoomOut" title="Perkecil">−</button>
        <span id="halZoom" style="min-width:42px;text-align:center;font-size:12px">100%</span>
        <button type="button" id="halZoomIn" title="Perbesar">+</button>
        <button type="button" id="halFull" title="Layar penuh">⛶</button></div></div>
    <div class="pdf-frame-wrap" id="halFrameWrap">
      <div class="pdf-loading" id="halLoading"><div class="pdf-skeleton"></div></div>
      <img id="halImage" class="pdf-page-img" alt="${esc(label)}" decoding="async"></div>
    <div class="pdf-info-bar">📄 ${esc(label)} · halaman dimuat satu per satu dari Firestore.</div></div>`);

  const img = $("halImage");
  async function load(){
    $("halIndicator").textContent = `Halaman ${page}${total ? `/${total}` : ""}`;
    $("halLoading").classList.remove("hidden");
    try{
      const gambar = await fetchHalamanGambar(jilidId, tipe, page);
      if(gambar) img.src = gambar;
      else{ img.removeAttribute("src"); showToast(`Halaman ${page} belum tersedia.`, true); }
    }catch(err){ showToast("Gagal memuat halaman: " + firebaseError(err), true); }
    finally{ $("halLoading").classList.add("hidden"); }

    // Preload tetangga
    if(total && page < total) fetchHalamanGambar(jilidId, tipe, page + 1).catch(() => {});
    if(page > 1) fetchHalamanGambar(jilidId, tipe, page - 1).catch(() => {});
  }
  const applyZoom = delta => {
    zoom = Math.min(300, Math.max(50, zoom + delta));
    $("halZoom").textContent = zoom + "%";
    if(zoom === 100){
      img.style.width = "100%";
      img.style.maxWidth = "100%";
    }else{
      img.style.width = zoom + "%";
      img.style.maxWidth = "none";
    }
  };
  $("halPrev").addEventListener("click", () => { page = Math.max(1, page - 1); load(); });
  $("halNext").addEventListener("click", () => { if(!total || page < total){ page++; load(); } });
  $("halZoomIn").addEventListener("click", () => applyZoom(10));
  $("halZoomOut").addEventListener("click", () => applyZoom(-10));
  $("halFull").addEventListener("click", () => {
    const v = document.querySelector(".pdf-viewer");
    if(!document.fullscreenElement) v?.requestFullscreen().catch(() => {}); else document.exitFullscreen();
  });

  // Swipe gesture horizontal untuk ganti halaman di HP
  let startX = 0, startY = 0;
  const wrap = $("halFrameWrap");
  wrap.addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive:true });
  wrap.addEventListener("touchend", e => {
    if(!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    if(dx < 0 && (!total || page < total)){ page++; load(); }
    else if(dx > 0 && page > 1){ page--; load(); }
  }, { passive:true });

  load();
}
