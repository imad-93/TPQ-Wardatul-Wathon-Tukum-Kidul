<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#166534">
  <meta name="description" content="Sistem Informasi TPQ Wardatul Wathon Tukum Kidul Lumajang">

  <link rel="manifest" href="./manifest.json">

  <title>TPQ Wardatul Wathon</title>

  <style>
    :root{
      --primary:#166534;
      --primary-dark:#14532d;
      --primary-light:#22c55e;
      --bg:#f4f7f5;
      --card:#ffffff;
      --text:#172033;
      --muted:#64748b;
      --border:#e2e8f0;
      --danger:#dc2626;
      --warning:#d97706;
      --info:#2563eb;
      --success:#16a34a;
      --sidebar:250px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .hidden{
      display:none!important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(circle at top left,#22c55e 0,#166534 35%,#052e16 100%);
    }

    .login-card{
      width:100%;
      max-width:430px;
      background:white;
      border-radius:24px;
      padding:30px;
      box-shadow:0 25px 80px rgba(0,0,0,.25);
    }

    .login-logo{
      width:72px;
      height:72px;
      margin:0 auto 18px;
      border-radius:20px;
      background:var(--primary);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
    }

    .login-title{
      text-align:center;
      margin:0;
    }

    .login-subtitle{
      text-align:center;
      color:var(--muted);
      margin-top:7px;
    }

    .form-group{
      margin-bottom:15px;
    }

    .form-group label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:6px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:11px 12px;
      border:1px solid var(--border);
      border-radius:10px;
      background:white;
      color:var(--text);
      outline:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(22,101,52,.1);
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:10px 15px;
      background:var(--primary);
      color:white;
      font-weight:700;
      transition:.15s;
    }

    .btn:hover{
      background:var(--primary-dark);
    }

    .btn-full{
      width:100%;
    }

    .btn-danger{
      background:var(--danger);
    }

    .btn-warning{
      background:var(--warning);
    }

    .btn-info{
      background:var(--info);
    }

    .btn-success{
      background:var(--success);
    }

    .btn-light{
      background:#e2e8f0;
      color:var(--text);
    }

    .btn-sm{
      padding:7px 10px;
      font-size:12px;
    }

    .setup-link{
      border:0;
      background:none;
      color:var(--primary);
      font-weight:700;
      margin-top:15px;
    }

    .login-error{
      min-height:20px;
      color:var(--danger);
      text-align:center;
      font-size:13px;
      margin-top:12px;
    }

    /* =========================
       APP
    ========================= */

    .app{
      min-height:100vh;
    }

    .sidebar{
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      width:var(--sidebar);
      background:var(--primary-dark);
      color:white;
      z-index:100;
      padding:16px 13px;
      overflow-y:auto;
      transition:.2s;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:7px 6px 20px;
    }

    .brand-icon{
      width:42px;
      height:42px;
      border-radius:12px;
      background:var(--primary-light);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      flex-shrink:0;
    }

    .brand-name{
      font-size:13px;
      font-weight:800;
    }

    .brand-role{
      display:block;
      margin-top:3px;
      color:#bbf7d0;
      font-size:11px;
    }

    .nav{
      display:grid;
      gap:5px;
    }

    .nav button{
      border:0;
      background:transparent;
      color:#dcfce7;
      width:100%;
      text-align:left;
      border-radius:9px;
      padding:11px 12px;
    }

    .nav button:hover,
    .nav button.active{
      background:rgba(255,255,255,.13);
      color:white;
    }

    .main{
      margin-left:var(--sidebar);
      min-height:100vh;
    }

    .topbar{
      height:68px;
      background:white;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 24px;
      position:sticky;
      top:0;
      z-index:50;
    }

    .top-left{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .page-title{
      font-weight:800;
    }

    .user-area{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
    }

    .page{
      padding:24px;
      max-width:1500px;
      margin:auto;
    }

    .mobile-menu{
      display:none;
    }

    /* =========================
       CARDS
    ========================= */

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:15px;
      padding:18px;
    }

    .stat-card{
      position:relative;
      overflow:hidden;
    }

    .stat-icon{
      font-size:25px;
    }

    .stat-label{
      color:var(--muted);
      font-size:13px;
      margin-top:8px;
    }

    .stat-value{
      font-size:28px;
      font-weight:800;
      margin-top:3px;
    }

    .section-title{
      margin:0 0 4px;
    }

    .muted{
      color:var(--muted);
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .actions{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    /* =========================
       TABLE
    ========================= */

    .table-container{
      background:white;
      border:1px solid var(--border);
      border-radius:15px;
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:700px;
    }

    th,
    td{
      padding:12px;
      border-bottom:1px solid var(--border);
      font-size:14px;
      text-align:left;
    }

    th{
      background:#f8fafc;
      font-size:12px;
      color:#475569;
    }

    tr:last-child td{
      border-bottom:0;
    }

    .empty{
      text-align:center;
      padding:35px;
      color:var(--muted);
    }

    .badge{
      display:inline-block;
      padding:4px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
    }

    .badge-green{
      background:#dcfce7;
      color:#166534;
    }

    .badge-yellow{
      background:#fef3c7;
      color:#92400e;
    }

    .badge-red{
      background:#fee2e2;
      color:#991b1b;
    }

    .badge-blue{
      background:#dbeafe;
      color:#1e40af;
    }

    /* =========================
       MODAL
    ========================= */

    .modal{
      position:fixed;
      inset:0;
      z-index:500;
      background:rgba(0,0,0,.65);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:15px;
    }

    .modal-box{
      width:100%;
      max-width:720px;
      max-height:90vh;
      overflow:auto;
      background:white;
      border-radius:18px;
      padding:22px;
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:18px;
    }

    .modal-header h3{
      margin:0;
    }

    .modal-close{
      width:34px;
      height:34px;
      border:0;
      border-radius:50%;
      background:#e2e8f0;
      font-size:20px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    /* =========================
       NOTICE
    ========================= */

    .notice{
      border-left:4px solid var(--primary);
      background:#f0fdf4;
      padding:14px;
      border-radius:8px;
      margin-bottom:10px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#172033;
      color:white;
      padding:12px 16px;
      border-radius:10px;
      z-index:1000;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:1000px){
      .grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:800px){
      .sidebar{
        transform:translateX(-100%);
      }

      .sidebar.open{
        transform:translateX(0);
      }

      .main{
        margin-left:0;
      }

      .mobile-menu{
        display:inline-flex;
      }

      .topbar{
        padding:0 15px;
      }

      .user-name{
        display:none;
      }
    }

    @media(max-width:600px){
      .page{
        padding:15px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .row{
        grid-template-columns:1fr;
      }

      .login-card{
        padding:24px;
      }
    }
  </style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="login-card">

    <div class="login-logo">
      📖
    </div>

    <h1 class="login-title">
      TPQ Wardatul Wathon
    </h1>

    <div class="login-subtitle">
      Tukum Kidul • Lumajang
    </div>

    <form id="loginForm" style="margin-top:25px">

      <div class="form-group">
        <label for="loginEmail">
          Email
        </label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="username"
          placeholder="email@contoh.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="loginPassword">
          Password
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >
      </div>

      <button
        type="submit"
        class="btn btn-full"
      >
        Masuk
      </button>

    </form>

    <div class="login-error" id="loginError"></div>

    <div style="text-align:center">
      <button
        type="button"
        class="setup-link"
        id="setupAdminButton"
      >
        Setup Admin Pertama
      </button>
    </div>

  </div>

</section>


<!-- =====================================================
     APPLICATION
===================================================== -->

<section id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">

    <div class="brand">

      <div class="brand-icon">
        📖
      </div>

      <div>
        <div class="brand-name">
          TPQ Wardatul Wathon
        </div>

        <span
          id="brandRole"
          class="brand-role"
        >
          Portal
        </span>
      </div>

    </div>

    <nav
      id="navigation"
      class="nav"
    ></nav>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          type="button"
          class="btn btn-light mobile-menu"
          id="mobileMenuButton"
        >
          ☰
        </button>

        <span
          id="pageTitle"
          class="page-title"
        >
          Dashboard
        </span>

      </div>

      <div class="user-area">

        <span
          id="userName"
          class="user-name"
        >
          -
        </span>

        <button
          type="button"
          class="btn btn-danger btn-sm"
          id="logoutButton"
        >
          Keluar
        </button>

      </div>

    </header>


    <section
      id="page"
      class="page"
    ></section>

  </main>

</section>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="modalTitle">
        Modal
      </h3>

      <button
        type="button"
        class="modal-close"
        id="modalClose"
      >
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="toast"
  class="toast hidden"
></div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBUM53K-Av3DkwkW6NNQg0wKQ-ehtVZ428",

    authDomain:
      "tpqwardah.firebaseapp.com",

    projectId:
      "tpqwardah",

    storageBucket:
      "tpqwardah.firebasestorage.app",

    messagingSenderId:
      "308318249706",

    appId:
      "1:308318249706:web:ad1f631acee81a2fe6ad93",

    measurementId:
      "G-ZVC3M0L8XJ"

  };


  /* =====================================================
     INIT
  ===================================================== */

  const firebaseApp =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(firebaseApp);

  const db =
    getFirestore(firebaseApp);


  /* =====================================================
     GLOBAL STATE
  ===================================================== */

  let currentUser = null;
  let currentProfile = null;
  let currentPage = "dashboard";


  /* =====================================================
     HELPER
  ===================================================== */

  const $ = id =>
    document.getElementById(id);


  function escapeHTML(value){

    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function showToast(message){

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.remove("hidden");

    setTimeout(() => {

      toast.classList.add("hidden");

    },2500);

  }


  function openModal(title,content){

    $("modalTitle").textContent =
      title;

    $("modalContent").innerHTML =
      content;

    $("modal").classList.remove("hidden");

  }


  function closeModal(){

    $("modal").classList.add("hidden");

  }


  function firebaseError(error){

    const messages = {

      "auth/invalid-credential":
        "Email atau password salah.",

      "auth/invalid-email":
        "Format email tidak valid.",

      "auth/email-already-in-use":
        "Email tersebut sudah digunakan.",

      "auth/weak-password":
        "Password minimal 6 karakter.",

      "auth/operation-not-allowed":
        "Login Email/Password belum diaktifkan di Firebase.",

      "auth/network-request-failed":
        "Koneksi internet bermasalah."

    };

    return messages[error.code]
      || error.message
      || "Terjadi kesalahan.";

  }


  /* =====================================================
     MODAL EVENTS
  ===================================================== */

  $("modalClose")
    .addEventListener(
      "click",
      closeModal
    );


  $("modal")
    .addEventListener("click",event=>{

      if(event.target === $("modal")){

        closeModal();

      }

    });


  /* =====================================================
     SETUP ADMIN PERTAMA
  ===================================================== */

  $("setupAdminButton")
    .addEventListener(
      "click",
      openAdminSetup
    );


  function openAdminSetup(){

    openModal(

      "Setup Admin Pertama",

      `
      <form id="adminSetupForm">

        <div class="form-group">

          <label>
            Nama Admin
          </label>

          <input
            id="adminName"
            value="Administrator"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Email Admin
          </label>

          <input
            id="adminEmail"
            type="email"
            placeholder="admin@tpqwardah.com"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Password
          </label>

          <input
            id="adminPassword"
            type="password"
            minlength="6"
            placeholder="Minimal 6 karakter"
            required
          >

        </div>


        <button
          type="submit"
          class="btn btn-full"
        >
          Buat Akun Admin
        </button>

      </form>
      `
    );


    $("adminSetupForm")
      .addEventListener(
        "submit",
        createFirstAdmin
      );

  }


  async function createFirstAdmin(event){

    event.preventDefault();

    const name =
      $("adminName").value.trim();

    const email =
      $("adminEmail").value.trim();

    const password =
      $("adminPassword").value;


    try{

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const uid =
        credential.user.uid;


      /*
       * PROFILE USER
       */

      await setDoc(
        doc(db,"users",uid),
        {

          uid,

          nama:name,

          email,

          role:"admin",

          aktif:true,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


      /*
       * PROFILE ADMIN
       */

      await setDoc(
        doc(db,"admin",uid),
        {

          uid,

          nama:name,

          email,

          role:"admin",

          aktif:true,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


      closeModal();

      showToast(
        "Akun admin berhasil dibuat."
      );


    }catch(error){

      alert(
        firebaseError(error)
      );

    }

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  $("loginForm")
    .addEventListener(
      "submit",
      login
    );


  async function login(event){

    event.preventDefault();

    $("loginError").textContent = "";

    const email =
      $("loginEmail").value.trim();

    const password =
      $("loginPassword").value;


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      $("loginError").textContent =
        firebaseError(error);

    }

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  $("logoutButton")
    .addEventListener(
      "click",
      async()=>{

        await signOut(auth);

      }
    );


  /* =====================================================
     MOBILE MENU
  ===================================================== */

  $("mobileMenuButton")
    .addEventListener(
      "click",
      ()=>{

        $("sidebar")
          .classList.toggle("open");

      }
    );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  onAuthStateChanged(
    auth,
    async user=>{

      if(!user){

        currentUser = null;

        currentProfile = null;

        $("loginScreen")
          .classList.remove("hidden");

        $("app")
          .classList.add("hidden");

        return;

      }


      try{

        const profileSnapshot =
          await getDoc(
            doc(
              db,
              "users",
              user.uid
            )
          );


        if(!profileSnapshot.exists()){

          alert(
            "Akun berhasil login tetapi profil aplikasi belum dibuat."
          );

          await signOut(auth);

          return;

        }


        const profile =
          profileSnapshot.data();


        if(
          !["admin","ustadzah","wali"]
            .includes(profile.role)
        ){

          alert(
            "Role akun tidak valid."
          );

          await signOut(auth);

          return;

        }


        if(profile.aktif === false){

          alert(
            "Akun ini sedang dinonaktifkan."
          );

          await signOut(auth);

          return;

        }


        currentUser =
          user;

        currentProfile =
          profile;


        $("loginScreen")
          .classList.add("hidden");

        $("app")
          .classList.remove("hidden");


        $("userName")
          .textContent =
            profile.nama
            || user.email;


        $("brandRole")
          .textContent =
            "Portal "
            + profile.role;


        buildNavigation();

        navigate("dashboard");


      }catch(error){

        console.error(error);

        alert(
          "Gagal membaca profil pengguna: "
          + error.message
        );

        await signOut(auth);

      }

    }
  );


  /* =====================================================
     NAVIGATION
  ===================================================== */

  const pageTitles = {

    dashboard:
      "Dashboard",

    santri:
      "Data Santri",

    wali:
      "Data Wali",

    ustadzah:
      "Data Ustadzah",

    kelas:
      "Jilid / Kelas",

    pengumuman:
      "Pengumuman",

    keuangan:
      "Keuangan",

    settings:
      "Pengaturan",

    kelasSantri:
      "Santri Kelas",

    pembelajaran:
      "Pembelajaran",

    keuanganUstadzah:
      "Keuangan Santri",

    belajar:
      "Baca & Hafalan",

    keuanganWali:
      "Riwayat Keuangan",

    profil:
      "Profil"

  };


  function buildNavigation(){

    const role =
      currentProfile.role;

    const items = [

      {
        page:"dashboard",
        icon:"🏠",
        label:"Dashboard",
        roles:["admin","ustadzah","wali"]
      },

      {
        page:"santri",
        icon:"👨‍🎓",

  /* =====================================================
     NAVIGATE
  ===================================================== */

  async function navigate(page){

    currentPage = page;

    $("pageTitle")
      .textContent =
        pageTitles[page]
        || "Dashboard";


    $("navigation")
      .querySelectorAll("button")
      .forEach(button=>{

        button.classList.toggle(
          "active",
          button.dataset.page === page
        );

      });


    $("sidebar")
      .classList.remove("open");


    const handlers = {

      dashboard:
        renderDashboard,

      santri:
        renderSantri,

      wali:
        renderWali,

      ustadzah:
        renderUstadzah,

      kelas:
        renderKelas,

      pengumuman:
        renderPengumuman,

      keuangan:
        renderKeuangan,

      settings:
        renderSettings,

      kelasSantri:
        renderKelasSantri,

      pembelajaran:
        renderPembelajaran,

      keuanganUstadzah:
        renderKeuanganUstadzah,

      belajar:
        renderBelajar,

      keuanganWali:
        renderKeuanganWali,

      profil:
        renderProfil

    };


    const handler =
      handlers[page];


    if(handler){

      await handler();

    }else{

      renderDashboard();

    }

  }
