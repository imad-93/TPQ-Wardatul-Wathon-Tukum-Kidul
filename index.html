<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#166534">
<meta name="description" content="Sistem Informasi TPQ Wardatul Wathon Tukum Kidul Lumajang">
<title>TPQ Wardatul Wathon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#166534; --primary-dark:#14532d; --primary-light:#22c55e;
  --bg:#f4f7f5; --card:#ffffff; --text:#172033; --muted:#64748b; --border:#e2e8f0;
  --danger:#dc2626; --warning:#d97706; --info:#2563eb; --success:#16a34a;
  --sidebar:250px; --radius:15px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ============ LOGIN ============ */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top left,#22c55e 0,#166534 35%,#052e16 100%)}
.login-card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.login-logo{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
.login-title,.login-subtitle{text-align:center;margin:0}
.login-subtitle{color:var(--muted);margin-top:7px}
.login-error{min-height:20px;color:var(--danger);text-align:center;font-size:13px;margin-top:12px}
.setup-link{border:0;background:none;color:var(--primary);font-weight:700;margin-top:15px}

/* ============ FORMS ============ */
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,.1)}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:var(--muted);cursor:not-allowed}

/* ============ BUTTONS ============ */
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-full{width:100%}
.btn-danger{background:var(--danger)} .btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning)} .btn-warning:hover{background:#b45309}
.btn-info{background:var(--info)} .btn-info:hover{background:#1d4ed8}
.btn-success{background:var(--success)} .btn-success:hover{background:#15803d}
.btn-light{background:#e2e8f0;color:var(--text)} .btn-light:hover{background:#cbd5e1}
.btn-sm{padding:7px 10px;font-size:12px}

/* ============ LAYOUT ============ */
.app{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--primary-dark);color:#fff;z-index:100;padding:16px 13px;overflow-y:auto;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:7px 6px 20px}
.brand-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand-name{font-size:13px;font-weight:800}
.brand-role{display:block;margin-top:3px;color:#bbf7d0;font-size:11px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:#dcfce7;width:100%;text-align:left;border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:8px;transition:.15s}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.13);color:#fff}
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.top-left{display:flex;align-items:center;gap:10px}
.page-title{font-weight:800}
.user-area{display:flex;align-items:center;gap:10px;font-size:13px}
.page{padding:24px;max-width:1500px;margin:auto;width:100%;flex:1}
.mobile-menu{display:none}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-card{position:relative;overflow:hidden}
.stat-icon{font-size:25px}
.stat-label{color:var(--muted);font-size:13px;margin-top:8px}
.stat-value{font-size:28px;font-weight:800;margin-top:3px}
.section-title{margin:0 0 4px}
.muted{color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.search-box{max-width:260px}

/* ============ TABLES ============ */
.table-container{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;text-align:left}
th{background:#f8fafc;font-size:12px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
.empty{text-align:center;padding:35px;color:var(--muted)}

/* ============ BADGES ============ */
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#e2e8f0;color:#334155}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:15px;animation:fadeIn .15s}
.modal-box{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;animation:slideUp .2s}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.modal-header h3{margin:0}
.modal-close{width:34px;height:34px;border:0;border-radius:50%;background:#e2e8f0;font-size:20px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#cbd5e1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============ MISC ============ */
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{border-left:4px solid var(--primary);background:#f0fdf4;padding:14px;border-radius:8px;margin-bottom:10px}
.notice-warn{border-left-color:var(--warning);background:#fffbeb}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:320px;animation:slideUp .2s}
.toast.error{background:var(--danger)}
.spinner{width:22px;height:22px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:8px;color:var(--muted);padding:30px;justify-content:center}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}

/* ============ PDF UPLOAD ============ */
.pdf-upload-box{border:2px dashed #cbd5e1;border-radius:14px;padding:18px;background:#f8fafc;transition:.2s}
.pdf-upload-box:hover{border-color:var(--primary);background:#f0fdf4}
.pdf-upload-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.pdf-file-info{margin-top:10px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:13px}
.pdf-file-info strong{display:block;color:var(--text)}
.pdf-progress{display:none;margin-top:12px}
.pdf-progress.active{display:block}
.pdf-progress-track{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.pdf-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#166534,#22c55e);border-radius:999px;transition:width .2s}
.pdf-progress-text{font-size:12px;color:var(--muted);margin-top:6px}
.pdf-current{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f0fdf4;color:#166534;font-size:13px}

/* ============ PDF VIEWER ============ */
.pdf-viewer{position:relative;background:#202124;border-radius:16px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.18)}
.pdf-toolbar{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#111827;color:#fff;flex-wrap:wrap}
.pdf-toolbar-group{display:flex;align-items:center;gap:6px}
.pdf-toolbar button{border:0;min-width:36px;height:36px;border-radius:8px;background:#374151;color:#fff;font-weight:700;transition:.15s}
.pdf-toolbar button:hover{background:#4b5563}
.pdf-page-indicator{min-width:90px;text-align:center;font-size:13px;font-weight:700}
.pdf-frame-wrap{position:relative;background:#525659;min-height:600px}
.pdf-frame{width:100%;height:78vh;min-height:500px;border:0;display:block;background:#525659}
.pdf-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(32,33,36,.92);color:#fff;z-index:2}
.pdf-loading.hidden{display:none}
.pdf-info-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#111827;color:#cbd5e1;font-size:12px;flex-wrap:wrap}

/* ============ RESPONSIVE ============ */
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.summary-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%)} .sidebar.open{transform:translateX(0)}
  .main{margin-left:0} .mobile-menu{display:inline-flex} .topbar{padding:0 15px} .user-name{display:none}
  .modal-box{max-height:95vh;padding:18px}
}
@media(max-width:600px){
  .page{padding:15px} .grid{grid-template-columns:1fr} .row{grid-template-columns:1fr}
  .login-card{padding:24px} .summary-strip{grid-template-columns:1fr}
  .pdf-upload-row{grid-template-columns:1fr}
  .pdf-frame{height:65vh;min-height:400px}
}
</style>
</head>
<body>

<!-- ============================= LOGIN ============================= -->
<section id="loginScreen">
  <div class="login-card">
    <div class="login-logo">📖</div>
    <h1 class="login-title">TPQ Wardatul Wathon</h1>

    <form id="loginForm" style="margin-top:25px" autocomplete="on">

  <aside id="sidebar" class="sidebar">

      <div>
        <div class="brand-name">TPQ Wardatul Wathon</div>

</section>

<!-- ============================= MODAL & TOAST ============================= -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">

      <h3 id="modalTitle">Modal</h3>
      <button type="button" class="modal-close" id="modalClose" aria-label="Tutup">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- ============================= SCRIPT ============================= -->
<script type="module">
/* ============================================================
   TPQ WARDATUL WATHON — Enterprise Application
   Single-file production-ready build
============================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc,
  updateDoc, deleteDoc, collection, query, where, orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

/* ============================================================
   1. CONFIG
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBUM53K-Av3DkwkW6NNQg0wKQ-ehtVZ428",
  authDomain: "tpqwardah.firebaseapp.com",
  projectId: "tpqwardah",
  messagingSenderId: "308318249706",
  appId: "1:308318249706:web:ad1f631acee81a2fe6ad93",
  measurementId: "G-ZVC3M0L8XJ"
};

const APP_CONFIG = {
  maxPdfSize: 60 * 1024 * 1024,       // batas ukuran file PDF asli yang diproses di browser
  maxHalamanBytes: 700 * 1024,        // target ukuran maksimal per halaman (base64) agar aman di bawah limit dokumen Firestore (1 MiB)
  pdfJsScriptUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfJsWorkerUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  sessionTimeoutMs: 30 * 60 * 1000,
  cacheTtlMs: 30_000
};

/* ============================================================
   2. FIREBASE INIT
============================================================ */
const primaryApp   = initializeApp(firebaseConfig);
const secondaryApp = initializeApp(firebaseConfig, "Secondary");
const auth          = getAuth(primaryApp);
const secondaryAuth = getAuth(secondaryApp);
const db            = getFirestore(primaryApp);

/* ============================================================
   3. GLOBAL STATE
============================================================ */
let currentUser    = null;
let currentProfile = null;

/* ============================================================
   4. UTILS
============================================================ */
const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function escapeAttr(value){
  return String(value ?? "")
    .replace(/\\/g,"\\\\").replace(/'/g,"\\'")
    .replace(/"/g,"&quot;").replace(/[\r\n]/g," ");
}
function sanitizeUrl(value){
  const url = String(value || "").trim();
  if(!url) return "";
  if(/^(javascript|data|vbscript|file):/i.test(url)) return "";
  if(!/^(https?:|\.\/|\/|blob:|#)/i.test(url)) return "";
  return url;
}
function assetUrl(value){
  const clean = sanitizeUrl(value);
  if(/firebasestorage\.googleapis\.com|firebasestorage\.app/i.test(clean)) return "";
  return clean;
}
function formatRupiah(value){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(value||0));
}
function formatTanggal(timestamp){
  if(!timestamp) return "-";
  try{
    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    return new Intl.DateTimeFormat("id-ID",{day:"2-digit",month:"long",year:"numeric"}).format(date);
  }catch{ return "-"; }
}
function formatFileSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  if(bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + " MB";
  return (bytes/1024/1024/1024).toFixed(1) + " GB";
}
function debounce(fn, wait=200){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
}
function validatePdfFile(file){
  if(!file) throw new Error("File PDF belum dipilih.");
  const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
  if(!isPdf) throw new Error("File harus berformat PDF.");
  if(file.size > APP_CONFIG.maxPdfSize){
    throw new Error(`Ukuran PDF maksimal ${formatFileSize(APP_CONFIG.maxPdfSize)}.`);
  }
  return true;
}
function withButtonLoading(button, busyText, fn){
  return async (...args) => {
    if(!button) return fn(...args);
    const originalText     = button.textContent;
    const originalDisabled = button.disabled;
    button.disabled = true;
    button.textContent = busyText;
    try{ return await fn(...args); }
    finally{ button.disabled = originalDisabled; button.textContent = originalText; }
  };
}
function attachTableSearch(inputId, tableId){
  const input = $(inputId);
  const table = $(tableId);
  if(!input || !table) return;
  input.addEventListener("input", debounce(() => {
    const term = input.value.trim().toLowerCase();
    table.querySelectorAll("tbody tr[data-row]").forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(term) ? "" : "none";
    });
  }, 150));
}
function statCard(icon,label,value){
  return `
    <div class="card stat-card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-label">${escapeHTML(label)}</div>
      <div class="stat-value">${escapeHTML(value)}</div>
    </div>`;
}
function firebaseError(error){
  const messages = {
    "auth/invalid-credential":     "Email atau password salah.",
    "auth/invalid-email":          "Format email tidak valid.",
    "auth/email-already-in-use":   "Email tersebut sudah digunakan.",
    "auth/weak-password":          "Password minimal 6 karakter.",
    "auth/operation-not-allowed":  "Login Email/Password belum diaktifkan di Firebase.",
    "auth/network-request-failed": "Koneksi internet bermasalah.",
    "auth/too-many-requests":      "Terlalu banyak percobaan. Coba lagi nanti.",
    "auth/user-disabled":          "Akun ini dinonaktifkan.",
    "auth/user-not-found":         "Akun tidak ditemukan.",
    "permission-denied":           "Anda tidak memiliki izin untuk operasi ini.",
    "unavailable":                 "Layanan sedang tidak tersedia. Coba lagi."
  };
  return messages[error?.code] || error?.message || "Terjadi kesalahan.";
}

/* ============================================================
   5. GLOBAL ERROR HANDLER
============================================================ */
window.addEventListener("error", e => {
  console.error("[Global Error]", e.error || e.message);
  if(e.error?.code) showToast(firebaseError(e.error), true);
});
window.addEventListener("unhandledrejection", e => {
  console.error("[Unhandled Promise]", e.reason);
  const msg = e.reason?.code ? firebaseError(e.reason) : (e.reason?.message || "Terjadi kesalahan tak terduga.");
  showToast(msg, true);
});

/* ============================================================
   6. TOAST / MODAL
============================================================ */
let toastTimeout = null;
function showToast(message, isError=false){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.remove("hidden");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>toast.classList.add("hidden"), 3500);
}
function openModal(title, content){
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = content;
  $("modal").classList.remove("hidden");
  setTimeout(()=>{
    const f = $("modalContent").querySelector("input, select, textarea, button");
    f?.focus();
  }, 50);
}
function closeModal(){
  $("modal").classList.add("hidden");
  $("modalContent").innerHTML = "";
}
$("modalClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if(e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("modal").classList.contains("hidden")) closeModal();
});

/* ============================================================
   6B. KEUANGAN: HELPER SPP / IURAN KEGIATAN / TABUNGAN
============================================================ */
function getPeriodeSekarang(){
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1; // 1-12
  const key = `${year}-${String(month).padStart(2,"0")}`;
  return { key, year, month, tanggal: now.getDate() };
}
function formatPeriodeLabel(periodeKey){
  if(!periodeKey) return "-";
  const [y,m] = periodeKey.split("-").map(Number);
  if(!y || !m) return periodeKey;
  const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return `${namaBulan[m-1]} ${y}`;
}
function daftarBulanTahunIni(){
  const { year, month } = getPeriodeSekarang();
  const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const list = [];
  for(let m=1; m<=month; m++){
    list.push({ key: `${year}-${String(m).padStart(2,"0")}`, label: `${namaBulan[m-1]} ${year}` });
  }
  return list.reverse(); // bulan terbaru dulu
}
function hitungStatusTagihan(nominal, terbayar){
  const n = Number(nominal||0), t = Number(terbayar||0);
  if(t <= 0) return "belum";
  if(t >= n) return "lunas";
  return "sebagian";
}
function badgeStatusTagihan(status){
  if(status === "lunas") return `<span class="badge badge-green">Lunas</span>`;
  if(status === "sebagian") return `<span class="badge badge-yellow">Sebagian</span>`;
  return `<span class="badge badge-red">Belum Bayar</span>`;
}
function isSppMenunggak(bill, sppTanggalPeringatan){
  if(!bill || bill.jenis !== "SPP" || bill.status === "lunas") return false;
  const { key: periodeIni, tanggal } = getPeriodeSekarang();
  if(bill.periode < periodeIni) return true; // bulan lalu belum lunas = pasti menunggak
  if(bill.periode === periodeIni && tanggal >= Number(sppTanggalPeringatan||10)) return true;
  return false;
}

// Buat/pastikan tagihan SPP bulan berjalan untuk semua santri aktif.
// Dipanggil otomatis saat admin/ustadzah membuka dashboard/menu keuangan.
// Tidak menagihkan mundur ke bulan-bulan lama secara otomatis (itu memakai
// fitur "Backfill SPP" manual di menu Master Tagihan agar tidak tiba-tiba
// membuat banyak tagihan lama tanpa sepengetahuan admin).
let sppEnsureDone = false;
async function ensureSppBulanIniUntukSemuaSantri(){
  if(sppEnsureDone) return;
  try{
    const appSettings = await getAppSettings();
    const nominal = Number(appSettings.sppNominal || 0);
    if(nominal <= 0){ sppEnsureDone = true; return; } // admin belum atur nominal SPP

    const { key: periode } = getPeriodeSekarang();
    const [santriList, existingBills] = await Promise.all([
      getCollectionData("santri"),
      getCollectionData("tagihanSantri")
    ]);
    const existingIds = new Set(existingBills.map(b=>b.id));
    const aktifSantri = santriList.filter(s=>s.aktif!==false);

    for(const s of aktifSantri){
      const id = `spp_${s.id}_${periode}`;
      if(existingIds.has(id)) continue;
      await setDoc(doc(db,"tagihanSantri", id), {
        santriId: s.id, santriNama: s.nama || "-",
        jenis: "SPP", judul: `SPP ${formatPeriodeLabel(periode)}`,
        periode, kegiatanId: null,
        nominal, terbayar: 0, status: "belum", riwayat: [],
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
    }
    invalidateCache("tagihanSantri");
    sppEnsureDone = true;
  }catch(err){
    console.warn("Gagal auto-generate SPP bulan ini:", err);
  }
}

async function catatPembayaranTagihan(billId, { jumlah, metode, keterangan }){
  const bill = await getDocument("tagihanSantri", billId);
  if(!bill) throw new Error("Tagihan tidak ditemukan.");
  const riwayat = Array.isArray(bill.riwayat) ? [...bill.riwayat] : [];
  riwayat.push({
    tanggal: new Date().toISOString(),
    jumlah: Number(jumlah||0),
    metode: metode || "Tunai",
    keterangan: keterangan || "",
    dicatatOleh: currentProfile?.uid || "",
    dicatatOlehNama: currentProfile?.nama || ""
  });
  const terbayar = riwayat.reduce((sum,r)=>sum+Number(r.jumlah||0), 0);
  const status = hitungStatusTagihan(bill.nominal, terbayar);
  await updateCollectionData("tagihanSantri", billId, { riwayat, terbayar, status });
  logAudit("BAYAR","tagihanSantri",billId,{ jumlah: Number(jumlah||0), status });
  return { terbayar, status };
}

function todayStr(){

}

// Ambil array ustadzahIds dari dokumen jilid, dengan fallback ke struktur lama.
function getJilidUstadzahIds(jilid){
  if(Array.isArray(jilid?.ustadzahIds)) return jilid.ustadzahIds.filter(Boolean);
  if(jilid?.ustadzahId) return [jilid.ustadzahId];
  return [];
}

// Apakah klaim pengganti pada jilid ini masih berlaku hari ini?
function isSubstituteActive(jilid){
  if(!jilid?.substituteUid || !jilid?.substituteUntil) return false;
  return jilid.substituteUntil >= todayStr();
}

// Daftar jilidId yang efektif untuk profil ustadzah (asli + pengganti aktif).
async function getEffectiveJilidIdsForUstadzah(profile){
  const jilidList = await getCollectionData("jilid");
  const ids = new Set();

  (profile.jilidIds || (profile.jilidId ? [profile.jilidId] : [])).forEach(x => x && ids.add(x));

  jilidList.forEach(j => {
    if(getJilidUstadzahIds(j).includes(profile.uid)) ids.add(j.id);
    if(isSubstituteActive(j) && j.substituteUid === profile.uid) ids.add(j.id);
  });

  return [...ids];
}

const cache = new Map();

async function getCollectionData(name, { forceRefresh=false } = {}){
  const cached = cache.get(name);
  if(!forceRefresh && cached && Date.now() - cached.time < APP_CONFIG.cacheTtlMs){
    return cached.data;
  }
  const snap = await getDocs(collection(db, name));
  const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  cache.set(name, { data, time: Date.now() });
  return data;
}
function invalidateCache(name){ cache.delete(name); }
async function getDocument(name, id){
  const snap = await getDoc(doc(db, name, id));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}
async function addCollectionData(name, data){
  const result = await addDoc(collection(db, name), {
    ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  });
  invalidateCache(name);
  return result;
}
async function updateCollectionData(name, id, data){
  await updateDoc(doc(db, name, id), { ...data, updatedAt: serverTimestamp() });
  invalidateCache(name);
}
async function deleteCollectionData(name, id){
  await deleteDoc(doc(db, name, id));
  invalidateCache(name);
}

/* ============================================================
   7B. HALAMAN BUKU (PDF per-halaman) DI FIRESTORE
   Setiap halaman buku (baca/hafalan) disimpan sebagai satu dokumen
   di koleksi "jilidHalaman" dengan id `${jilidId}_${tipe}_${halaman}`.
   Ini membuat aplikasi jauh lebih ringan karena hanya halaman yang
   sedang dibuka yang diunduh, bukan seluruh file PDF.
============================================================ */
const halamanImageCache = new Map();

function halamanDocId(jilidId, tipe, halaman){
  return `${jilidId}_${tipe}_${halaman}`;
}

async function fetchHalamanGambar(jilidId, tipe, halaman){
  if(!jilidId || !tipe || !halaman) return null;
  const id = halamanDocId(jilidId, tipe, halaman);
  if(halamanImageCache.has(id)) return halamanImageCache.get(id);
  const snap = await getDoc(doc(db, "jilidHalaman", id));
  const gambar = snap.exists() ? (snap.data().gambar || null) : null;
  if(gambar) halamanImageCache.set(id, gambar);
  return gambar;
}

async function deleteHalamanRange(jilidId, tipe, fromPage, toPage){
  for(let p = fromPage; p <= toPage; p++){
    const id = halamanDocId(jilidId, tipe, p);
    halamanImageCache.delete(id);
    try{ await deleteDoc(doc(db, "jilidHalaman", id)); }catch{ /* abaikan jika sudah tidak ada */ }
  }
}

let pdfJsLoadingPromise = null;
async function loadPdfJsLibrary(){
  const resolveGlobal = () => window.pdfjsLib || window["pdfjs-dist/build/pdf"] || null;
  if(resolveGlobal()) return resolveGlobal();
  if(!pdfJsLoadingPromise){
    pdfJsLoadingPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = APP_CONFIG.pdfJsScriptUrl;
      script.onload = () => {
        const lib = resolveGlobal();
        if(lib) resolve(lib);
        else reject(new Error("Pustaka pdf.js dimuat tetapi tidak dikenali oleh browser."));
      };
      script.onerror = () => reject(new Error("Gagal memuat pustaka pdf.js dari CDN. Periksa koneksi internet atau coba lagi."));
      document.head.appendChild(script);
    });
  }
  const pdfjsLib = await pdfJsLoadingPromise;
  pdfjsLib.GlobalWorkerOptions.workerSrc = APP_CONFIG.pdfJsWorkerUrl;
  return pdfjsLib;
}

async function renderPdfPageToDataUrl(pdfPage, maxBytes){
  let scale = 1.4;
  let quality = 0.72;
  let lastDataUrl = null;
  for(let attempt = 0; attempt < 7; attempt++){
    const viewport = pdfPage.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(viewport.width));
    canvas.height = Math.max(1, Math.round(viewport.height));
    const ctx = canvas.getContext("2d");
    await pdfPage.render({ canvasContext: ctx, viewport }).promise;
    const dataUrl = canvas.toDataURL("image/jpeg", quality);
    lastDataUrl = dataUrl;
    const approxBytes = Math.ceil(dataUrl.length * 0.75);
    if(approxBytes <= maxBytes) return dataUrl;
    if(quality > 0.35) quality = Math.max(0.35, quality - 0.12);
    else scale = Math.max(0.6, scale - 0.2);
  }
  return lastDataUrl;
}

async function uploadPdfPerPageToFirestore(file, jilidId, tipe, onProgress){
  validatePdfFile(file);
  if(!jilidId) throw new Error("ID Jilid/Kelas belum tersedia.");

  const pdfjsLib = await loadPdfJsLibrary();
  const buffer = await file.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument({ data: buffer }).promise;
  const totalPages = pdfDoc.numPages;

  for(let p = 1; p <= totalPages; p++){
    const pdfPage = await pdfDoc.getPage(p);
    const dataUrl = await renderPdfPageToDataUrl(pdfPage, APP_CONFIG.maxHalamanBytes);
    if(!dataUrl) throw new Error(`Gagal memproses halaman ${p} dari PDF.`);
    const id = halamanDocId(jilidId, tipe, p);
    await setDoc(doc(db, "jilidHalaman", id), {
      jilidId, tipe, halaman: p,
      gambar: dataUrl,
      updatedAt: serverTimestamp()
    });
    halamanImageCache.set(id, dataUrl);
    onProgress?.(p, totalPages);
  }
  return totalPages;
}

async function createManagedAccount({ email, password, role, profile }){
  // Simpan info admin yang login
  const adminUid = auth.currentUser?.uid;
  if(!adminUid){
    throw new Error("Anda harus login sebagai admin.");
  }
  console.log("[createManagedAccount] Admin yang login:", adminUid);
  console.log("[createManagedAccount] Akan buat akun:", email, "role:", role);

  // STEP 1: Buat user di secondary app (TIDAK mengganti sesi primary)
  const credential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
  const uid = credential.user.uid;
  console.log("[createManagedAccount] Auth berhasil, UID baru:", uid);

  // STEP 2: Bangun payload eksplisit
  const base = {
    uid: uid,
    email: email,
    role: role,                       // ← otomatis (ustadzah/wali/admin)
    nama: profile.nama || "",
    telepon: profile.telepon || "",
    alamat: profile.alamat || "",
    jilidId: profile.jilidId || null,
    jilidNama: profile.jilidNama || null,
    aktif: profile.aktif !== false,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };

  console.log("[createManagedAccount] Payload:", base);

  // STEP 3: Sign out dari secondary SEGERA (sebelum write ke Firestore)
  //        supaya tidak mengganggu sesi primary
  try{
    await signOut(secondaryAuth);
    console.log("[createManagedAccount] Secondary signout berhasil");
  }catch(err){
    console.warn("[createManagedAccount] Secondary signout error:", err);
  }

  // STEP 4: Pastikan primary auth masih admin
  if(auth.currentUser?.uid !== adminUid){
    console.error("[createManagedAccount] ⚠️ Sesi primary berubah!");
    throw new Error("Sesi admin terputus. Silakan login ulang.");
  }

  // STEP 5: Tulis ke Firestore sebagai ADMIN (sesi primary)
  try{
    await setDoc(doc(db, "users", uid), base);
    console.log("[createManagedAccount] ✅ users/" + uid + " tersimpan");

    await setDoc(doc(db, role, uid), base);
    console.log("[createManagedAccount] ✅ " + role + "/" + uid + " tersimpan");
  }catch(err){
    console.error("[createManagedAccount] ❌ Gagal tulis Firestore:", err);
    throw err;
  }

  // STEP 6: Verifikasi
  try{
    const verify = await getDoc(doc(db, "users", uid));
    if(!verify.exists()){
      throw new Error("Verifikasi gagal: users/{uid} tidak ada.");
    }
    console.log("[createManagedAccount] ✅ Verifikasi berhasil");
  }catch(err){
    console.error("[createManagedAccount] Verifikasi error:", err);
  }

  console.log("[createManagedAccount] ✅ Selesai untuk UID:", uid);
  return uid;
}

onAuthStateChanged(auth, async user => {
  if(!user){
    currentUser = null; currentProfile = null;
    $("loginScreen").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }
  try{
    const profile = await getDocument("users", user.uid);
    if(!profile){
      alert("Akun berhasil login tetapi profil aplikasi belum dibuat. Hubungi admin.");
      await signOut(auth);
      return;
    }
    if(!["admin","ustadzah","wali"].includes(profile.role)){
      alert("Role akun tidak valid.");
      await signOut(auth);
      return;
    }
    if(profile.aktif === false){
      alert("Akun ini sedang dinonaktifkan. Hubungi admin.");
      await signOut(auth);
      return;
    }
    currentUser = user;
    currentProfile = profile;
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userName").textContent = profile.nama || user.email;
    $("brandRole").textContent = "Portal " + roleLabel(profile.role);
    buildNavigation();
    navigate("dashboard");
    resetIdleTimer();
    logAudit("LOGIN", "users", user.uid, { email: user.email });
  }catch(error){
    console.error(error);
    alert("Gagal membaca profil pengguna: " + error.message);
    await signOut(auth);
  }
});

// Baca file (csv / xlsx / xls) jadi array of object {header: value}.
async function parseSpreadsheetFile(file){
  if(!window.XLSX) throw new Error("Pustaka pembaca Excel belum siap. Coba reload halaman.");
  if(!file) throw new Error("File belum dipilih.");

  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type:"array" });
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:"", raw:false });
  return rows;
}

// Cari header dengan kata kunci tertentu (case-insensitive, mengandung).
function findHeader(keys, keywordGroup){
  // keywordGroup: array of string keywords; header cocok jika mengandung salah satu.
  return keys.find(k => {
    const lk = String(k).toLowerCase();
    return keywordGroup.some(kw => lk.includes(kw.toLowerCase()));
  }) || null;
}

function normalizeGender(val){
  const v = String(val||"").trim().toLowerCase();
  if(!v) return "";
  if(/^(l|lk|laki|pria|male|m)/.test(v)) return "Laki-laki";
  if(/^(p|pr|perempuan|wanita|female|f)/.test(v)) return "Perempuan";
  return "";
}

function normalizeAktif(val){
  const v = String(val||"").trim().toLowerCase();
  if(!v) return true;
  if(["nonaktif","non-aktif","non aktif","tidak","no","n","0","false","off"].includes(v)) return false;
  return true;
}

// Cek duplikat: nama santri + jilidNama (kalau sama, skip).
const existingKeys = new Set(
  existingSantri.map(s=>`${String(s.nama||"").trim().toLowerCase()}|${String(s.jilidId||"").trim()}`)
);

let berhasil = 0, dilewati = 0, waliDibuat = 0;
const gagal = [];
const tanpaJilid = [];
const waliBaruList = [];

// Cari nama-nama header yang relevan.
const sampleKeys = Object.keys(rows[0]);
const hNama      = findHeader(sampleKeys, ["nama santri","nama"]);
const hGender    = findHeader(sampleKeys, ["jenis kelamin","gender","jk"]);
const hJilid     = findHeader(sampleKeys, ["kelas","jilid"]);
const hWaliEmail = findHeader(sampleKeys, ["email wali","wali (email)","login wali","email"]);
const hWaliNama  = findHeader(sampleKeys, ["nama wali","wali (tampilan)","wali"]);
const hWaliPass  = findHeader(sampleKeys, ["password wali","password"]);
const hAktif     = findHeader(sampleKeys, ["status"]);

if(!hNama) throw new Error("Kolom 'Nama Santri' tidak ditemukan di file.");

const defaultPassword = $("importDefaultPassword").value.trim();

for(let i=0; i<rows.length; i++){
  const row = rows[i];
  const nama = String(row[hNama]||"").trim();
  if(!nama){ dilewati++; continue; }

  const genderRaw  = hGender    ? row[hGender]                              : "";
  const jilidRaw   = hJilid     ? String(row[hJilid]     || "").trim()      : "";
  const waliEmailRaw = hWaliEmail ? String(row[hWaliEmail] || "").trim()    : "";
  const waliNamaRaw  = hWaliNama  ? String(row[hWaliNama]  || "").trim()    : "";
  const waliPassRaw  = hWaliPass  ? String(row[hWaliPass]  || "").trim()    : "";
  const aktifRaw     = hAktif     ? row[hAktif]                             : "";

  // Match jilid
  let jilidObj = null;
  if(jilidRaw){
    jilidObj = jilidByName.get(jilidRaw.toLowerCase()) || null;
    if(!jilidObj) tanpaJilid.push(`${nama} → "${jilidRaw}"`);
  }

  // === AUTO-CREATE WALI ===
  // Prioritas pencarian: email → nama tampilan.
  let waliObj = null;
  if(waliEmailRaw){
    waliObj = waliByEmail.get(waliEmailRaw.toLowerCase()) || null;
  }
  if(!waliObj && waliNamaRaw){
    waliObj = waliByNama.get(waliNamaRaw.toLowerCase()) || null;
  }

  // Kalau email ada & belum terdaftar → buat akun wali baru.
  if(!waliObj && waliEmailRaw){
    try{
      const password = waliPassRaw || defaultPassword;
      if(password.length < 6){
        throw new Error("password minimal 6 karakter");
      }
      const namaWali = waliNamaRaw || waliEmailRaw.split("@")[0];
      const profile = {
        nama: namaWali,
        telepon: "",
        alamat: "",
        aktif: true
      };
      const newUid = await createManagedAccount({
        email: waliEmailRaw,
        password,
        role: "wali",
        profile
      });
      waliObj = { id: newUid, email: waliEmailRaw, nama: namaWali, ...profile };
      waliByEmail.set(waliEmailRaw.toLowerCase(), waliObj);
      waliByNama.set(namaWali.toLowerCase(), waliObj);
      waliBaruList.push(`${namaWali} <${waliEmailRaw}>`);
      waliDibuat++;
    }catch(err){
      gagal.push(`Wali untuk "${nama}" (${waliEmailRaw}): ${firebaseError(err)}`);
      // Lanjutkan: tetap buat santri tanpa wali, atau skip? Kita buat tanpa wali.
      waliObj = null;
    }
  }

  const key = `${nama.toLowerCase()}|${jilidObj?.id || ""}`;
  if(existingKeys.has(key)){ dilewati++; continue; }

  try{
    await addCollectionData("santri", {
      nama,
      jenisKelamin: normalizeGender(genderRaw),
      jilidId:   jilidObj?.id   || null,
      jilidNama: jilidObj?.nama || (jilidRaw || null),
      waliUid:   waliObj?.id    || null,
      waliNama:  waliObj?.nama  || (waliNamaRaw || null),
      aktif: normalizeAktif(aktifRaw)
    });
    existingKeys.add(key);
    berhasil++;
  }catch(err){
    gagal.push(`${nama}: ${err.message}`);
  }
}

logAudit("IMPORT","santri","",{ berhasil, dilewati, waliDibuat, gagal: gagal.length });


        // Tampilkan ringkasan hasil
        closeModal();
openModal("Hasil Import Santri", `
  <div class="notice">
    ✅ <b>${berhasil}</b> santri berhasil ditambahkan.<br>
    👤 <b>${waliDibuat}</b> akun wali baru otomatis dibuat.<br>
    ⏭ <b>${dilewati}</b> baris dilewati (nama kosong / duplikat).<br>
    ❌ <b>${gagal.length}</b> baris gagal disimpan.
  </div>
  ${waliBaruList.length ? `
    <div class="notice" style="margin-top:10px">
      <b>Akun wali baru (${waliBaruList.length}):</b><br>
      <span style="font-size:12px">${waliBaruList.map(escapeHTML).join("<br>")}</span>
      <div class="muted" style="font-size:12px;margin-top:6px">
        Password awal: <b>${escapeHTML(defaultPassword)}</b> (atau dari kolom "Password Wali"). Mohon infokan ke wali masing-masing, dan sarankan untuk reset lewat menu Profil.
      </div>
    </div>` : ""}
  ${tanpaJilid.length ? `
    <div class="notice notice-warn" style="margin-top:10px">
      <b>Jilid tidak ditemukan (${tanpaJilid.length}):</b><br>
      <span style="font-size:12px">${tanpaJilid.map(escapeHTML).join("<br>")}</span>
      <div class="muted" style="font-size:12px;margin-top:6px">Santri tetap dibuat tanpa jilid. Buat jilid-nya dulu di menu Jilid/Kelas, lalu edit santri via menu Data Santri.</div>
    </div>` : ""}
  ${gagal.length ? `
    <div class="notice notice-warn" style="margin-top:10px">
      <b>Gagal (${gagal.length}):</b><br>
      <span style="font-size:12px">${gagal.map(escapeHTML).join("<br>")}</span>
    </div>` : ""}
  <button class="btn btn-full" id="importSelesaiBtn" style="margin-top:14px">Selesai</button>
`);
$("importSelesaiBtn").addEventListener("click", ()=>{ closeModal(); renderSantriAdmin(); });
       
      }catch(error){

        alert("Gagal import: " + error.message);
      }
    })();
  });
}

  return `
    <div class="pdf-upload-box">

          </div>
          <button type="button" class="btn btn-info" id="uploadPdfBtn_${type}">☁️ Upload &amp; Pecah per Halaman</button>
        </div>
        <div class="pdf-file-info" id="pdfFileInfo_${type}">Belum memilih file. PDF akan diproses menjadi gambar per halaman di browser Anda, lalu setiap halaman disimpan sebagai dokumen tersendiri di Firestore (bukan Google Drive) agar lebih ringan.</div>
        <div class="pdf-progress" id="pdfUploadProgress_${type}">

              ✅ ${total} halaman tersimpan di Firestore.
              <br>
              <div class="actions" style="margin-top:7px">
                <button type="button" class="btn btn-sm" id="btnPreviewCurrent_${type}">👁 Lihat Buku</button>
                <button type="button" class="btn btn-sm btn-danger" id="btnHapusHalaman_${type}">🗑 Hapus Semua Halaman</button>
              </div>
            </div>
          ` : `
            <div class="muted" style="font-size:12px;margin-top:8px">Belum ada halaman yang diupload.</div>
          `}
        </div>
        <input type="hidden" id="pdfTotal_${type}" value="${total}">
      </div>
    </div>`;
}

function attachPdfUploader(type, jilidId){
  const fileInput    = $(`pdfFile_${type}`);
  const uploadButton = $(`uploadPdfBtn_${type}`);
  const info         = $(`pdfFileInfo_${type}`);
  const progress     = $(`pdfUploadProgress_${type}`);
  const bar          = $(`pdfUploadProgressBar_${type}`);
  const progressText = $(`pdfUploadProgressText_${type}`);
  const totalInput   = $(`pdfTotal_${type}`);
  const currentWrap  = $(`pdfCurrentWrap_${type}`);
  const label        = type === "baca" ? "Buku Baca" : "Buku Hafalan";

  if(!fileInput || !uploadButton) return;

  const defaultInfoText = "Belum memilih file. PDF akan diproses menjadi gambar per halaman di browser Anda, lalu setiap halaman disimpan sebagai dokumen tersendiri di Firestore (bukan Google Drive) agar lebih ringan.";

  function refreshCurrentWrap(){
    const total = Number(totalInput.value || 0);
    currentWrap.innerHTML = total > 0 ? `
      <div class="pdf-current">
        ✅ ${total} halaman tersimpan di Firestore.
        <br>
        <div class="actions" style="margin-top:7px">
          <button type="button" class="btn btn-sm" id="btnPreviewCurrent_${type}">👁 Lihat Buku</button>
          <button type="button" class="btn btn-sm btn-danger" id="btnHapusHalaman_${type}">🗑 Hapus Semua Halaman</button>
        </div>
      </div>
    ` : `<div class="muted" style="font-size:12px;margin-top:8px">Belum ada halaman yang diupload.</div>`;
    attachCurrentWrapEvents();
  }

  function attachCurrentWrapEvents(){
    $(`btnPreviewCurrent_${type}`)?.addEventListener("click", () => {
      const total = Number(totalInput.value || 0);
      if(!jilidId || total <= 0){ showToast("Belum ada halaman untuk ditampilkan.", true); return; }
      openHalamanViewer({ jilidId, tipe: type, halaman: 1, totalHalaman: total, label });
    });
    $(`btnHapusHalaman_${type}`)?.addEventListener("click", async () => {
      const total = Number(totalInput.value || 0);
      if(!jilidId || total <= 0) return;
      if(!confirm(`Hapus semua ${total} halaman ${label}? Tindakan ini tidak bisa dibatalkan.`)) return;
      try{
        await deleteHalamanRange(jilidId, type, 1, total);
        totalInput.value = "0";
        refreshCurrentWrap();
        showToast(`Semua halaman ${label} berhasil dihapus.`);
      }catch(error){ showToast("Gagal menghapus halaman: " + error.message, true); }
    });
  }
  attachCurrentWrapEvents();

  fileInput.addEventListener("change", () => {
    const file = fileInput.files?.[0];
    if(!file){ info.textContent = defaultInfoText; return; }
    try{
      validatePdfFile(file);
      info.innerHTML = `<strong>📄 ${escapeHTML(file.name)}</strong>${formatFileSize(file.size)} — siap diproses per halaman.`;
    }catch(error){
      fileInput.value = "";
      info.textContent = error.message;
      showToast(error.message, true);
    }
  });

  uploadButton.addEventListener("click", async () => {
    const file = fileInput.files?.[0];
    if(!file){ showToast("Pilih file PDF terlebih dahulu.", true); return; }
    if(!jilidId){ showToast("ID Jilid/Kelas belum siap. Coba lagi.", true); return; }

    const oldTotal = Number(totalInput.value || 0);

    try{
      validatePdfFile(file);
      uploadButton.disabled = true;
      uploadButton.textContent = "⏳ Memproses...";
      progress.classList.add("active");
      bar.style.width = "0%";
      progressText.textContent = "Menyiapkan pustaka PDF...";

      const totalPages = await uploadPdfPerPageToFirestore(file, jilidId, type, (current, total) => {
        const percent = Math.round((current/total)*100);
        bar.style.width = percent + "%";
        progressText.textContent = `Mengupload halaman ${current} dari ${total} (${percent}%)...`;
      });

      // Bersihkan sisa halaman lama jika PDF baru lebih pendek
      if(oldTotal > totalPages){
        progressText.textContent = "Membersihkan sisa halaman lama...";
        await deleteHalamanRange(jilidId, type, totalPages+1, oldTotal);
      }

      totalInput.value = String(totalPages);
      progressText.textContent = `Selesai. ${totalPages} halaman tersimpan di Firestore.`;
      bar.style.width = "100%";
      info.innerHTML = `<strong>✅ ${escapeHTML(file.name)}</strong>${totalPages} halaman berhasil diupload ke Firestore.`;

      showToast(error.message, true);
    }finally{
      uploadButton.disabled = false;

  });
}

// Modal generik untuk mencatat pembayaran satu tagihan (SPP / Iuran Kegiatan).
// Mendukung pembayaran bertahap/cicilan — setiap kali dicatat, jumlahnya
// ditambahkan ke riwayat tagihan tersebut, tidak menimpa nilai sebelumnya.
function openCatatPembayaranModal(bill, onSaved){
  const sisa = Math.max(0, Number(bill.nominal||0) - Number(bill.terbayar||0));
  openModal(`Catat Pembayaran`, `
    <form id="bayarForm">
      <div class="notice">
        <b>${escapeHTML(bill.santriNama)}</b><br>
        ${escapeHTML(bill.judul)}<br>
        Nominal: ${formatRupiah(bill.nominal||0)} · Sudah dibayar: ${formatRupiah(bill.terbayar||0)}<br>
        <b>Sisa tagihan: ${formatRupiah(sisa)}</b>
      </div>
      <div class="form-group"><label>Jumlah Dibayar Sekarang</label><input id="bayarJumlah" type="number" min="1" value="${sisa>0?sisa:''}" required></div>
      <div class="form-group">
        <label>Metode Pembayaran</label>
        <select id="bayarMetode">
          <option value="Tunai">Tunai</option>
          <option value="QRIS">QRIS</option>
          <option value="Transfer">Transfer</option>
        </select>
      </div>
      <div class="form-group"><label>Keterangan (opsional)</label><textarea id="bayarKeterangan" rows="2" placeholder="Contoh: cicilan ke-1"></textarea></div>
      <button class="btn btn-full" type="submit" id="bayarSaveBtn">Simpan Pembayaran</button>
    </form>`);

  $("bayarForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("bayarSaveBtn");
    const jumlah = Number($("bayarJumlah").value||0);
    if(jumlah <= 0){ alert("Jumlah harus lebih dari 0."); return; }
    await withButtonLoading(btn, "Menyimpan...", async () => {
      try{
        await catatPembayaranTagihan(bill.id, {
          jumlah, metode: $("bayarMetode").value, keterangan: $("bayarKeterangan").value.trim()
        });
        closeModal();
        showToast("Pembayaran berhasil dicatat.");
        onSaved?.();
      }catch(error){ alert(error.message); }
    })();
  });
}

// Modal untuk mencatat tabungan (sukarela, bebas kapan saja & berapa saja).
function openCatatTabunganModal(santriList, onSaved){
  openModal("Catat Tabungan", `
    <form id="tabunganForm">
      <div class="form-group">
        <label>Santri</label>
        <select id="tabunganSantri" required>
          <option value="">Pilih santri</option>

        </select>
      </div>
      <div class="form-group">
        <label>Jenis Transaksi</label>
        <select id="tabunganJenis">
          <option value="setor">Setor (Menabung)</option>
          <option value="tarik">Tarik (Pengambilan)</option>
        </select>
      </div>
      <div class="form-group"><label>Jumlah</label><input id="tabunganJumlah" type="number" min="1" required></div>
      <div class="form-group"><label>Keterangan (opsional)</label><textarea id="tabunganKeterangan" rows="2"></textarea></div>
      <button class="btn btn-full" type="submit" id="tabunganSaveBtn">Simpan Transaksi</button>
    </form>`);

    e.preventDefault();
    const btn = $("tabunganSaveBtn");

        showToast("Transaksi tabungan berhasil dicatat.");

    })();
  });
}

   24. USTADZAH: DAFTAR SANTRI KELAS
============================================================ */
async function getSantriUstadzah(){
  const effectiveIds = await getEffectiveJilidIdsForUstadzah(currentProfile);
  if(!effectiveIds.length) return [];
  const semua = await getCollectionData("santri");
  return semua.filter(x => effectiveIds.includes(x.jilidId));
}

async function renderDaftarSantriUstadzah(){
  if(!requireRole("ustadzah")) return;
  await ensureSppBulanIniUntukSemuaSantri();

  const [santri, jilidList] = await Promise.all([
    getSantriUstadzah(),
    getCollectionData("jilid", { forceRefresh:true })
  ]);

  const today = todayStr();

  const klaimAktif = jilidList.filter(j =>
    isSubstituteActive(j) && j.substituteUid === currentProfile.uid
  );

  const asliIds = jilidList
    .filter(j => getJilidUstadzahIds(j).includes(currentProfile.uid))
    .map(j => j.id);

  const bisaKlaim = jilidList.filter(j =>
    j.aktif !== false &&
    !asliIds.includes(j.id) &&
    !(isSubstituteActive(j) && j.substituteUid !== currentProfile.uid)
  );

  const jilidEfektif = jilidList
    .filter(j => asliIds.includes(j.id) || klaimAktif.some(k=>k.id===j.id))
    .map(j => j.nama);

  $("page").innerHTML = `
    <div class="toolbar">
      <div>
        <h2 class="section-title">Daftar Santri</h2>
        <p class="muted">
          Kelas efektif hari ini: <b>${jilidEfektif.length ? escapeHTML(jilidEfektif.join(", ")) : "Belum ada"}</b>
        </p>
      </div>
      <input id="searchSantriUstadzah" class="search-box" placeholder="Cari nama santri...">
    </div>

    ${klaimAktif.length ? `
      <div class="card" style="margin-bottom:16px;background:#f0fdf4;border-color:#bbf7d0">
        <h3 style="margin-top:0">🤝 Anda Menggantikan Kelas Hari Ini (${today})</h3>
        <div class="table-container" style="margin-top:10px">
          <table>
            <thead><tr><th>Kelas</th><th>Pengampu Asli</th><th>Alasan</th><th>Aksi</th></tr></thead>
            <tbody>
              ${klaimAktif.map(j=>`
                <tr>
                  <td><b>${escapeHTML(j.nama)}</b></td>
                  <td>${escapeHTML((j.ustadzahNames||[]).join(", ") || "-")}</td>
                  <td>${escapeHTML(j.substituteAlasan || "-")}</td>
                  <td><button class="btn btn-sm btn-danger" data-lepas="${j.id}">Lepas Klaim</button></td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>` : ""}

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>
          <h3 style="margin:0">🤝 Klaim Kelas Pengganti</h3>
          <p class="muted" style="margin:4px 0 0 0;font-size:13px">
            Gunakan tombol di bawah jika Anda menggantikan ustadzah lain yang tidak hadir hari ini.
          </p>
        </div>
        ${bisaKlaim.length
          ? `<button class="btn" id="btnBukaKlaim">+ Klaim Kelas</button>`
          : `<span class="badge badge-gray">Tidak ada kelas yang bisa diklaim</span>`}
      </div>
    </div>

    <div class="table-container">
      <table id="tableSantriUstadzah">
        <thead><tr><th>No.</th><th>Nama Santri</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody>
          ${santri.length ? santri.map((item,index)=>`
            <tr data-row>
              <td>${index+1}</td><td><b>${escapeHTML(item.nama || "-")}</b></td>
              <td>${item.aktif===false ? `<span class="badge badge-red">Nonaktif</span>` : `<span class="badge badge-green">Aktif</span>`}</td>
              <td><div class="actions" style="flex-wrap:wrap">
                <button class="btn btn-sm" data-view="${item.id}">📖 Baca &amp; Hafalan</button>
                <button class="btn btn-sm btn-info" data-keuangan="${item.id}">💰 Keuangan</button>
              </div></td>
            </tr>`).join("") : `<tr><td colspan="4" class="empty">Belum ada santri di kelas Anda. ${!currentProfile.jilidId && !(currentProfile.jilidIds||[]).length ? "Hubungi admin untuk penugasan kelas." : ""}</td></tr>`}
        </tbody>
      </table>
    </div>`;

  attachTableSearch("searchSantriUstadzah","tableSantriUstadzah");
  $("page").querySelectorAll("[data-view]").forEach(btn => btn.addEventListener("click", ()=>renderPembelajaranWaliOrUstadzah(btn.dataset.view)));
  $("page").querySelectorAll("[data-keuangan]").forEach(btn => btn.addEventListener("click", ()=>renderKeuanganSantriUstadzah(btn.dataset.keuangan)));

  $("btnBukaKlaim")?.addEventListener("click", ()=>openKlaimKelasModal(bisaKlaim));

  $("page").querySelectorAll("[data-lepas]").forEach(btn => btn.addEventListener("click", async () => {
    const j = jilidList.find(x=>x.id===btn.dataset.lepas);
    if(!j) return;
    if(!confirm(`Lepas klaim kelas "${j.nama}"?`)) return;
    try{
      await updateCollectionData("jilid", j.id, {
        substituteUid: null,
        substituteNama: null,
        substituteUntil: null,
        substituteAlasan: ""
      });
      logAudit("UPDATE","jilid",j.id,{ lepasKlaim:true });
      showToast("Klaim dilepas.");
      renderDaftarSantriUstadzah();
    }catch(err){ showToast("Gagal: " + err.message, true); }
  }));
}

    </div>

  `);

    await withButtonLoading($("klaimSaveBtn"), "Menyimpan...", async () => {
      try{
        await updateCollectionData("jilid", jilidId, {
          substituteUid: currentProfile.uid,
          substituteNama: currentProfile.nama || "",
          substituteUntil: $("klaimSampai").value || todayStr(),
          substituteAlasan: $("klaimAlasan").value.trim()
        });
        logAudit("UPDATE","jilid",jilidId,{ klaim:true, uid: currentProfile.uid });
        closeModal();
        showToast("Kelas berhasil diklaim.");
        renderDaftarSantriUstadzah();
      }catch(err){ alert("Gagal klaim: " + err.message); }
    })();
  });
}

async function renderKeuanganSantriUstadzah(santriId){
  const santri = (await getCollectionData("santri")).find(x=>x.id===santriId);
  if(!santri){ alert("Santri tidak ditemukan."); return; }
  const [appSettings, tagihanSantriList, tabunganList] = await Promise.all([
    getAppSettings(), getCollectionData("tagihanSantri"), getCollectionData("tabungan")
  ]);
  const sppTanggalPeringatan = Number(appSettings.sppTanggalPeringatan||10);
  const bills = tagihanSantriList.filter(x=>x.santriId===santriId);
  const sppBills = bills.filter(x=>x.jenis==="SPP").sort((a,b)=>(b.periode||"").localeCompare(a.periode||""));
  const iuranBills = bills.filter(x=>x.jenis==="Iuran Kegiatan");
  const tabunganSantri = tabunganList.filter(x=>x.santriId===santriId).sort((a,b)=>(b.tanggal?.seconds||0)-(a.tanggal?.seconds||0));
  const saldoTabungan = hitungSaldoTabungan(tabunganList, santriId);

  function renderBillRows(list){
    if(!list.length) return `<tr><td colspan="6" class="empty">Belum ada tagihan.</td></tr>`;
    return list.map((item,index)=>{
      const menunggak = isSppMenunggak(item, sppTanggalPeringatan);
      return `<tr>
        <td>${index+1}</td><td>${escapeHTML(item.judul||"-")}</td>
        <td>${formatRupiah(item.nominal||0)}</td><td>${formatRupiah(item.terbayar||0)}</td>
        <td>${badgeStatusTagihan(item.status)}${menunggak?` <span class="badge badge-red">Menunggak</span>`:""}</td>
        <td><button class="btn btn-sm" data-bayar="${item.id}">Catat Bayar</button></td>
      </tr>`;
    }).join("");
  }

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="btnKembaliDaftar">← Kembali</button></div>
    <div class="card">
      <h2 style="margin-top:0">💰 Keuangan Santri</h2>
      <p class="muted">${escapeHTML(santri.nama)}</p>

      <h3 style="margin-top:18px">💵 SPP</h3>
      <div class="table-container" style="margin-top:8px">
        <table><thead><tr><th>No.</th><th>Bulan</th><th>Nominal</th><th>Terbayar</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>${renderBillRows(sppBills)}</tbody>
        </table>
      </div>

      <h3 style="margin-top:18px">🎉 Iuran Kegiatan</h3>
      <div class="table-container" style="margin-top:8px">
        <table><thead><tr><th>No.</th><th>Kegiatan</th><th>Nominal</th><th>Terbayar</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>${renderBillRows(iuranBills)}</tbody>
        </table>
      </div>

      <h3 style="margin-top:18px">💰 Tabungan (Saldo: ${formatRupiah(saldoTabungan)})</h3>
      <div class="table-container" style="margin-top:8px">
        <table><thead><tr><th>No.</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th><th>Tanggal</th></tr></thead>
          <tbody>
            ${tabunganSantri.length ? tabunganSantri.map((item,index)=>`
              <tr><td>${index+1}</td>
                <td>${item.jenis==="tarik"?`<span class="badge badge-red">Tarik</span>`:`<span class="badge badge-green">Setor</span>`}</td>
                <td>${formatRupiah(item.jumlah||0)}</td><td>${escapeHTML(item.keterangan||"-")}</td>
                <td>${formatTanggal(item.tanggal)}</td>
              </tr>`).join("") : `<tr><td colspan="5" class="empty">Belum ada transaksi tabungan.</td></tr>`}
          </tbody>
        </table>
      </div>
      <button class="btn btn-sm" id="btnCatatTabunganSantri" style="margin-top:10px">+ Catat Tabungan</button>
    </div>`;

  $("btnKembaliDaftar").addEventListener("click", renderDaftarSantriUstadzah);
  $("page").querySelectorAll("[data-bayar]").forEach(btn => btn.addEventListener("click", () => {
    const bill = bills.find(x=>x.id===btn.dataset.bayar);
    if(bill) openCatatPembayaranModal(bill, ()=>renderKeuanganSantriUstadzah(santriId));
  }));
  $("btnCatatTabunganSantri").addEventListener("click", () => {
    openCatatTabunganModal([santri], ()=>renderKeuanganSantriUstadzah(santriId));
  });
}

async function getJilidBySantri(santri){
  if(!santri?.jilidId) return null;
  const data = await getCollectionData("jilid");
  return data.find(x=>x.id===santri.jilidId) || null;
}
async function getUstadzahPendamping(santri){
  if(!santri?.jilidId) return null;
  const ustadzah = await getCollectionData("ustadzah");
  return ustadzah.find(x=>x.jilidId===santri.jilidId) || null;
}
async function getSantriWali(){
  if(!currentProfile) return [];
  const santri = await getCollectionData("santri");
  return santri.filter(x => x.waliUid === currentProfile.uid && x.aktif !== false);
}

async function renderPembelajaranWaliOrUstadzah(santriId){
  const santriData = await getCollectionData("santri");
  const santri = santriData.find(x=>x.id===santriId);
  if(!santri){ alert("Data santri tidak ditemukan."); return; }

  const isUstadzah = currentProfile.role === "ustadzah";
  const isWali     = currentProfile.role === "wali";
  if(isWali && santri.waliUid !== currentProfile.uid){
    alert("Anda tidak memiliki akses ke santri ini."); return;
  }
  if(isUstadzah && santri.jilidId !== currentProfile.jilidId){
    alert("Santri ini bukan bagian dari kelas Anda."); return;
  }

  if(isUstadzah) return renderPdfEditorUstadzah(santri);
  return renderPembelajaranWaliView(santri);
}

async function openPembelajaranEditor(santri, jilid, tipe){
  const totalHalaman = Number(tipe === "hafalan" ? jilid.totalHalamanHafalan : jilid.totalHalamanBaca) || 0;
  if(totalHalaman <= 0){
    alert(tipe==="hafalan" ? "Buku hafalan belum diupload admin (belum ada halaman di Firestore)." : "Buku baca belum diupload admin (belum ada halaman di Firestore).");
    return;
  }
  const allProgress = await getCollectionData("progress");
  const progress = allProgress.find(x=>x.santriId===santri.id && x.tipe===tipe);
  const halaman = Math.min(totalHalaman, Math.max(1, Number(progress?.halaman || 1)));

  $("page").innerHTML = `
    <div class="toolbar"><button class="btn btn-sm" id="btnKembaliUstadzah">← Kembali</button></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap">
        <div>
          <h2 style="margin:0">${tipe==="hafalan" ? "🧠 Buku Hafalan" : "📖 Buku Baca"}</h2>
          <div class="muted" style="margin-top:5px">Santri: <b>${escapeHTML(santri.nama)}</b> · ${escapeHTML(jilid.nama)}</div>
        </div>
        <span class="badge badge-blue" id="currentPageBadge">Halaman ${halaman}/${totalHalaman}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px">
        <button class="btn btn-sm" id="btnPrevPage">◀</button>
        <input id="pdfPageInput" type="number" min="1" max="${totalHalaman}" value="${halaman}" style="width:90px;text-align:center">
        <button class="btn btn-sm" id="btnNextPage">▶</button>
        <button class="btn btn-sm btn-success" id="btnSavePage">📌 Tandai Halaman Terakhir</button>
      </div>
      <div style="margin-top:15px;background:#525659;border-radius:12px;overflow:auto;min-height:650px;display:flex;align-items:flex-start;justify-content:center;padding:12px;position:relative">
        <div class="pdf-loading" id="editorPageLoading"><div style="text-align:center"><span class="spinner"></span><div style="margin-top:8px">Memuat halaman...</div></div></div>
        <img id="editorPageImage" style="max-width:100%;display:block;border-radius:4px" alt="Halaman buku">
      </div>
      <div class="card" style="margin-top:15px;background:#f8fafc">
        <h3>Hasil Pembelajaran</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn btn-success" id="btnNaik">↑ Naik</button>
          <button class="btn btn-warning" id="btnMengulang">↻ Mengulang</button>
        </div>
        <div class="form-group" style="margin-top:15px">
          <label>Pesan Ustadzah</label>
          <textarea id="pesanPembelajaran" rows="4" placeholder="Tuliskan catatan untuk wali...">${escapeHTML(progress?.pesan || "")}</textarea>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-info" id="btnSimpanPesan">💾 Simpan Pesan</button>
        </div>
      </div>
    </div>`;

  $("btnKembaliUstadzah").addEventListener("click", renderDaftarSantriUstadzah);

  let currentPageNum = halaman;
  const imgEl = $("editorPageImage");
  const loadingEl = $("editorPageLoading");

  async function updateViewerPage(){
    currentPageNum = Math.min(totalHalaman, Math.max(1, Number($("pdfPageInput").value || 1)));
    $("pdfPageInput").value = currentPageNum;
    $("currentPageBadge").textContent = `Halaman ${currentPageNum}/${totalHalaman}`;
    loadingEl?.classList.remove("hidden");
    try{
      const gambar = await fetchHalamanGambar(jilid.id, tipe, currentPageNum);
      if(gambar) imgEl.src = gambar;
      else{ imgEl.removeAttribute("src"); showToast(`Halaman ${currentPageNum} belum tersedia.`, true); }
    }catch(err){
      showToast("Gagal memuat halaman: " + err.message, true);
    }finally{
      loadingEl?.classList.add("hidden");
    }
  }
  $("btnPrevPage").addEventListener("click", () => { $("pdfPageInput").value = Math.max(1, currentPageNum-1); updateViewerPage(); });
  $("btnNextPage").addEventListener("click", () => { $("pdfPageInput").value = Math.min(totalHalaman, currentPageNum+1); updateViewerPage(); });
  $("pdfPageInput").addEventListener("change", updateViewerPage);
  updateViewerPage();

  const saveWith = async (status) => {
    await saveProgress({
      santriId: santri.id, tipe, halaman: currentPageNum,
      status, pesan: $("pesanPembelajaran").value.trim()
    });
  };
  $("btnSavePage").addEventListener("click", ()=>saveWith(progress?.status || "mengulang"));
  $("btnNaik").addEventListener("click", ()=>saveWith("naik"));
  $("btnMengulang").addEventListener("click", ()=>saveWith("mengulang"));
  $("btnSimpanPesan").addEventListener("click", ()=>saveWith(progress?.status || "mengulang"));
}

async function saveProgress({ santriId, tipe, halaman, status, pesan }){
  try{
    const data = await getCollectionData("progress");
    const existing = data.find(x=>x.santriId===santriId && x.tipe===tipe);
    const payload = {
      santriId, tipe,
      halaman: Math.max(1, Number(halaman||1)),
      status: status || "mengulang",
      pesan: pesan || "",
      ustadzahUid: currentProfile.uid,
      ustadzahNama: currentProfile.nama || "",
      updatedAt: serverTimestamp()
    };
    if(existing) await updateCollectionData("progress", existing.id, payload);
    else await addCollectionData("progress", payload);

    await addCollectionData("riwayat", {
      santriId, tipe,
      halaman: payload.halaman,
      status: payload.status,
      pesan: payload.pesan,
      ustadzahUid: currentProfile.uid,
      ustadzahNama: currentProfile.nama || ""
    });
    logAudit("UPDATE","progress",santriId,{ tipe, halaman: payload.halaman, status: payload.status });
    showToast("Hasil pembelajaran berhasil disimpan.");
  }catch(error){
    console.error(error);
    alert("Gagal menyimpan pembelajaran: " + error.message);
  }
}

/* ============================================================
   27. VIEWER HALAMAN BUKU (dari Firestore, per halaman)
============================================================ */
function openHalamanViewer({ jilidId, tipe, halaman=1, totalHalaman=0, label="Buku" }){
  if(!jilidId || !tipe){ showToast("Buku belum tersedia.", true); return; }

  let currentPage = Math.max(1, Number(halaman) || 1);
  const total = Math.max(0, Number(totalHalaman) || 0);
  let zoom = 100;

  openModal(label, `
    <div class="pdf-viewer">
      <div class="pdf-toolbar">
        <div class="pdf-toolbar-group">
          <button type="button" id="halPrevButton" title="Halaman sebelumnya">◀</button>
          <div class="pdf-page-indicator" id="halPageIndicator">Halaman ${currentPage}${total?`/${total}`:""}</div>
          <button type="button" id="halNextButton" title="Halaman berikutnya">▶</button>
        </div>
        <div class="pdf-toolbar-group">
          <button type="button" id="halZoomOut" title="Perkecil">−</button>
          <span id="halZoomValue" style="min-width:45px;text-align:center;font-size:12px">100%</span>
          <button type="button" id="halZoomIn" title="Perbesar">+</button>
          <button type="button" id="halFullscreen" title="Fullscreen">⛶</button>
        </div>
      </div>
      <div class="pdf-frame-wrap" style="display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:10px">
        <div class="pdf-loading" id="halLoading">
          <div style="text-align:center"><span class="spinner"></span><div style="margin-top:8px">Memuat halaman...</div></div>
        </div>
        <img id="halImage" style="max-width:100%;display:block;transform-origin:top center;border-radius:4px" alt="${escapeHTML(label)}">
      </div>
      <div class="pdf-info-bar">
        <span>📄 ${escapeHTML(label)}</span>
        <span>Halaman dimuat langsung dari Firestore, satu per satu.</span>
      </div>
    </div>`);

  const imgEl       = $("halImage");
  const loadingEl   = $("halLoading");
  const indicatorEl = $("halPageIndicator");
  const zoomValueEl = $("halZoomValue");

  async function loadPage(){
    indicatorEl.textContent = `Halaman ${currentPage}${total?`/${total}`:""}`;
    loadingEl?.classList.remove("hidden");
    try{
      const gambar = await fetchHalamanGambar(jilidId, tipe, currentPage);
      if(!gambar){
        imgEl.removeAttribute("src");
        showToast(`Halaman ${currentPage} belum tersedia.`, true);
      }else{
        imgEl.src = gambar;
      }
    }catch(err){
      showToast("Gagal memuat halaman: " + err.message, true);
    }finally{
      loadingEl?.classList.add("hidden");
    }
  }

  $("halPrevButton")?.addEventListener("click", ()=>{ currentPage = Math.max(1, currentPage-1); loadPage(); });
  $("halNextButton")?.addEventListener("click", ()=>{ if(!total || currentPage < total){ currentPage++; loadPage(); } });
  $("halZoomIn")?.addEventListener("click", ()=>{ zoom = Math.min(200, zoom+10); zoomValueEl.textContent = zoom+"%"; imgEl.style.transform = `scale(${zoom/100})`; });
  $("halZoomOut")?.addEventListener("click", ()=>{ zoom = Math.max(50, zoom-10); zoomValueEl.textContent = zoom+"%"; imgEl.style.transform = `scale(${zoom/100})`; });
  $("halFullscreen")?.addEventListener("click", ()=>{
    const viewer = document.querySelector(".pdf-viewer");
    if(!document.fullscreenElement) viewer?.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });

  loadPage();
}
