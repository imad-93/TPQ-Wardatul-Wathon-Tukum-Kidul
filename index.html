function downloadTemplateSantri(){
  const rows = [
    ["Nama Santri","Jenis Kelamin","Kelas / Jilid","Email Wali","Nama Wali (Tampilan)","Password Wali (opsional)","Status (Aktif/Nonaktif)"],
    ["Ahmad Fauzi","Laki-laki","Jilid 1","ayah.ahmad@gmail.com","Bpk. Ahmad","wali123456","Aktif"],
    ["Siti Aminah","Perempuan","Jilid 2","ibu.siti@gmail.com","Ibu Siti","","Aktif"],
    ["Muhammad Rizki","Laki-laki","","","Bpk. Rizki","","Aktif"]
  ];
  const csv = rows.map(r => r.map(c => `"${String(c ?? "").replaceAll('"','""')}"`).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type:"text/csv;charset=utf-8;" }));
  const a = Object.assign(document.createElement("a"), { href:url, download:"template-import-santri.csv" });
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Template CSV diunduh.");
}
async function parseSpreadsheetFile(file){
  if(!window.XLSX) throw new Error("Pustaka Excel belum siap.");
  if(!file) throw new Error("File belum dipilih.");
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:"", raw:false });
}
const findHeader = (keys, kws) => { for(const kw of kws){ const k = keys.find(x => String(x).toLowerCase().includes(kw)); if(k) return k; } return null; };
function normalizeGender(v){
  const s = String(v || "").trim().toLowerCase();
  if(/^(l|lk|laki|pria|male|m)/.test(s)) return "Laki-laki";
  if(/^(p|pr|perempuan|wanita|female|f)/.test(s)) return "Perempuan";
  return "";
}
const normalizeAktif = v => !["nonaktif","non-aktif","non aktif","tidak","no","n","0","false","off"].includes(String(v || "").trim().toLowerCase());

function openImportSantriModal(existingSantri, onDone){
  openModal("Import Data Santri", `
    <form id="importForm">
      <div class="notice"><b>Petunjuk</b><ol style="margin:6px 0 0 18px;padding:0">
        <li>Unduh <b>Template</b> untuk melihat format kolom.</li>
        <li>Kolom <b>Nama Santri</b> wajib. Kolom lain opsional.</li>
        <li><b>Kelas / Jilid</b> harus sama persis dengan nama jilid di Ruang Ngaji.</li>
        <li>Jika <b>Email Wali</b> belum terdaftar, akun wali dibuat otomatis.</li>
      </ol></div>
      ${fg("File CSV / Excel", `<input id="importFile" type="file" accept=".csv,.xls,.xlsx" required>`)}
      ${fg("Password default wali baru", `<input id="importPassword" type="text" minlength="6" value="wali123456" required>`)}
      <div id="importPreview"></div>
      <button type="submit" class="btn btn-full" id="importSubmit" style="margin-top:14px">Import sekarang</button>
    </form>`);

  $("importFile").addEventListener("change", async () => {
    const box = $("importPreview"); box.innerHTML = "";
    const file = $("importFile").files?.[0]; if(!file) return;
    try{
      const rows = await parseSpreadsheetFile(file);
      box.innerHTML = rows.length
        ? `<div class="notice" style="margin-top:12px">Terbaca <b>${rows.length} baris</b>. Pratinjau 3 baris:
          <pre style="white-space:pre-wrap;font-size:12px;margin:8px 0 0;max-height:140px;overflow:auto">${esc(JSON.stringify(rows.slice(0,3), null, 2))}</pre></div>`
        : `<div class="notice notice-warn">File kosong.</div>`;
    }catch(err){ box.innerHTML = `<div class="notice notice-warn">Gagal baca: ${esc(err.message)}</div>`; }
  });

  $("importForm").addEventListener("submit", async e => {
    e.preventDefault();
    const file = $("importFile").files?.[0];
    if(!file) return showToast("Pilih file terlebih dahulu.", true);
    await busy($("importSubmit"), "Mengimpor...", async () => {
      try{
        const rows = await parseSpreadsheetFile(file);
        if(!rows.length) throw new Error("Tidak ada baris data.");
        const [jilidList, waliList] = await Promise.all([fresh("jilid"), fresh("wali")]);
        const jilidByName = new Map(jilidList.map(j => [String(j.nama).trim().toLowerCase(), j]));
        const waliByEmail = new Map(waliList.map(w => [String(w.email || "").trim().toLowerCase(), w]));
        const waliByNama = new Map(waliList.map(w => [String(w.nama || "").trim().toLowerCase(), w]));
        const existingKeys = new Set(existingSantri.map(s => `${String(s.nama || "").trim().toLowerCase()}|${s.jilidId || ""}`));

        const keys = Object.keys(rows[0]);
        const hNama = findHeader(keys, ["nama santri"]) || keys.find(k => /nama/i.test(k) && !/wali/i.test(k));
        if(!hNama) throw new Error("Kolom 'Nama Santri' tidak ditemukan.");
        const h = {
          gender: findHeader(keys, ["jenis kelamin","gender","jk"]),
          jilid: findHeader(keys, ["jilid","kelas"]),
          email: findHeader(keys, ["email"]),
          waliNama: findHeader(keys, ["nama wali","tampilan"]),
          pass: findHeader(keys, ["password"]),
          aktif: findHeader(keys, ["status"])
        };
        const cell = (row, key) => key ? String(row[key] ?? "").trim() : "";
        const defaultPassword = $("importPassword").value.trim();

        let berhasil = 0, dilewati = 0;
        const gagal = [], tanpaJilid = [], waliBaru = [];

        for(const row of rows){
          const nama = cell(row, hNama);
          if(!nama){ dilewati++; continue; }
          const jilidRaw = cell(row, h.jilid);
          const jilid = jilidRaw ? jilidByName.get(jilidRaw.toLowerCase()) : null;
          if(jilidRaw && !jilid) tanpaJilid.push(`${nama} → "${jilidRaw}"`);
          const key = `${nama.toLowerCase()}|${jilid?.id || ""}`;
          if(existingKeys.has(key)){ dilewati++; continue; }

          const email = cell(row, h.email), waliNamaRaw = cell(row, h.waliNama);
          let wali = (email && waliByEmail.get(email.toLowerCase())) || (waliNamaRaw && waliByNama.get(waliNamaRaw.toLowerCase())) || null;
          if(!wali && email){
            try{
              const password = cell(row, h.pass) || defaultPassword;
              if(password.length < 6) throw new Error("password minimal 6 karakter");
              const namaWali = waliNamaRaw || email.split("@")[0];
              const uid = await createManagedAccount({ email, password, role:"wali", profile:{ nama: namaWali, aktif:true } });
              wali = { id: uid, email, nama: namaWali };
              waliByEmail.set(email.toLowerCase(), wali); waliByNama.set(namaWali.toLowerCase(), wali);
              waliBaru.push(`${namaWali} <${email}>`);
            }catch(err){ gagal.push(`Wali untuk "${nama}" (${email}): ${firebaseError(err)}`); }
          }
          try{
            await addCollectionData("santri", {
              nama, jenisKelamin: normalizeGender(cell(row, h.gender)),
              jilidId: jilid?.id || null, jilidNama: jilid?.nama || jilidRaw || null,
              waliUid: wali?.id || null, waliNama: wali?.nama || waliNamaRaw || null,
              aktif: normalizeAktif(cell(row, h.aktif))
            });
            existingKeys.add(key); berhasil++;
          }catch(err){ gagal.push(`${nama}: ${firebaseError(err)}`); }
        }
        sppEnsuredPeriode = null;
        logAudit("IMPORT","santri","",{ berhasil, dilewati, waliDibuat: waliBaru.length, gagal: gagal.length });

        const list = arr => arr.map(esc).join("<br>");
        openModal("Hasil Import", `
          <div class="notice">✅ <b>${berhasil}</b> santri ditambahkan.<br>
            👤 <b>${waliBaru.length}</b> akun wali dibuat.<br>
            ⏭ <b>${dilewati}</b> dilewati.<br>
            ❌ <b>${gagal.length}</b> gagal.</div>
          ${waliBaru.length ? `<div class="notice" style="margin-top:10px"><b>Wali baru:</b><br><span class="small">${list(waliBaru)}</span>
            <div class="muted small" style="margin-top:6px">Password awal: <b>${esc(defaultPassword)}</b>.</div></div>` : ""}
          ${tanpaJilid.length ? `<div class="notice notice-warn" style="margin-top:10px"><b>Jilid tidak ditemukan (${tanpaJilid.length}):</b><br><span class="small">${list(tanpaJilid)}</span></div>` : ""}
          ${gagal.length ? `<div class="notice notice-warn" style="margin-top:10px"><b>Gagal:</b><br><span class="small">${list(gagal)}</span></div>` : ""}
          <button class="btn btn-full" id="importDone" style="margin-top:14px">Selesai</button>`);
        $("importDone").addEventListener("click", () => { closeModal(); onDone?.(); });
      }catch(err){
        console.error(err);
        showToast("Gagal import: " + firebaseError(err), true);
      }
    });
  });
}

        nama: $("jilidNama").value.trim(), keterangan: $("jilidKeterangan").value.trim(),
        aktif: $("jilidAktif").value === "true",
        totalHalamanBaca: uploaders.baca.getTotal(),
        totalHalamanHafalan: uploaders.hafalan.getTotal(),
        ustadzahIds, ustadzahNames: ustadzahList.filter(u => ustadzahIds.includes(u.id)).map(u => u.nama || u.email || "")
      };
      if(item){
        await updateCollectionData("jilid", item.id, payload);
        logAudit("UPDATE","jilid",item.id,{ nama: payload.nama });
      }else{
        await setDoc(doc(db, "jilid", jilidId), { ...payload, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        invalidateCache("jilid"); logAudit("CREATE","jilid",jilidId,{ nama: payload.nama });
      }
      showToast("Jilid disimpan.");
      onSaved?.();
    }
  });
  const uploaders = {
    baca: bindPdfUploader("baca", jilidId, item?.totalHalamanBaca, persist("totalHalamanBaca")),
    hafalan: bindPdfUploader("hafalan", jilidId, item?.totalHalamanHafalan, persist("totalHalamanHafalan"))
  };
}

onClick("[data-backfill-santri]", "backfillSantri", santriId => {
  const santri = santriAll.find(s => s.id === santriId);
  if(!santri) return showToast("Santri tidak ditemukan.", true);

  openBackfillNunggakModal({
    santri,
    settings,
    onSuccess: async () => {
      // 1. Ambil data terbaru
      const freshTagihan = await fresh("tagihanSantri");
      const sppBelum = freshTagihan.filter(x =>
        x.santriId === santriId && x.jenis === "SPP" && x.status !== "lunas"
      );

      // 2. Refresh halaman keuangan dulu
      await renderKeuanganAdmin();

      if(sppBelum.length){
        setTimeout(() => {
          openCatatPembayaranModal(sppBelum, () => renderKeuanganAdmin());
        }, 350);
      }
    }
  });
});

onClick("[data-riwayat-tabungan]", "riwayatTabungan", santriId => {

  const trx = tabunganList

  openModal(`📊 Riwayat Tabungan — ${esc(santri.nama)}`, `

      trx.map((t,i) => `<tr>

        <td><button class="btn btn-sm btn-danger" data-hapus-trx-tabungan="${esc(t.id)}">🗑</button></td>
      </tr>`), "Belum ada transaksi.")}`);

  // Handler hapus transaksi (di dalam modal)
  $("modalContent").querySelectorAll("[data-hapus-trx-tabungan]").forEach(b =>
    b.addEventListener("click", async () => {
      const t = tabunganList.find(x => x.id === b.dataset.hapusTrxTabungan);
      if(!t) return;
      if(!confirm(`Hapus transaksi ${t.jenis === "tarik" ? "tarik" : "setor"} ${formatRupiah(t.jumlah)}?`)) return;
      try{
        await hapusDenganAudit("tabungan", t.id, "Tidak ditemukan.",
          x => ({ santriNama:x.santriNama, jenis:x.jenis, jumlah:x.jumlah }));
        showToast("Transaksi dihapus.");
        closeModal();
        reload();
      }catch(err){ showToast(firebaseError(err), true); }
    }));
});

onClick("[data-hapus-spp-santri]", "hapusSppSantri", santriId => {

function editLiburEvent(idx, onSaved){
  getAppSettings().then(s => {
    const target = (s.liburEvents || [])[idx];
    if(!target) return showToast("Libur event tidak ditemukan.", true);
    openFormModal({
      title: "Edit Libur Event", submit: "Simpan",
      body: `${fg("Nama event", `<input id="elNama" value="${esc(target.nama)}" required>`)}
        <div class="row">
          ${fg("Mulai", `<input id="elMulai" type="date" value="${esc(target.mulai)}" required>`)}
          ${fg("Selesai", `<input id="elSelesai" type="date" value="${esc(target.selesai)}" required>`)}
        </div>
        ${fg("Keterangan", `<textarea id="elKet" rows="2">${esc(target.keterangan)}</textarea>`)}`,
      onSubmit: async () => {
        const baru = {
          nama: $("elNama").value.trim(), mulai: $("elMulai").value,
          selesai: $("elSelesai").value, keterangan: $("elKet").value.trim()
        };
        if(baru.selesai < baru.mulai){ showToast("Tanggal tidak valid.", true); return false; }
        const cur = await getAppSettings();
        const list = [...(cur.liburEvents || [])]; list[idx] = baru;
        await saveSettings({ liburEvents: list });
        const payload = pengumumanLiburPayload(baru);
        for(const p of pengumumanLiburTerkait(await fresh("pengumuman"), target))
          await updateCollectionData("pengumuman", p.id, payload);
        showToast("Libur event diperbarui.");
        onSaved?.();
      }
    });
  });
}

/* ===== Backfill Nunggak (multi-bulan/tahun, dari modal bayar Ustadzah) ===== */
function openBackfillNunggakModal({ santri, settings, onSuccess }){
  const now = nowWIB();
  const tahunSekarang = now.getFullYear();
  const tahunList = [];
  for(let y = tahunSekarang - 3; y <= tahunSekarang + 2; y++) tahunList.push(y);

  // Default: bulan ini & tahun ini tercentang
  const bulanDefault = [now.getMonth() + 1];

  openModal("⏱ Backfill SPP Nunggak", `
    <div class="notice" style="margin-bottom:14px">
      <b>${esc(santri.nama)}</b><br>
      <span class="muted small">Pilih bulan & tahun yang mau ditagihkan. Bisa pilih beberapa sekaligus.</span>
    </div>

    <div class="form-group">
      <label>📅 Bulan</label>
      <div class="check-grid" style="grid-template-columns:repeat(3,1fr);max-height:none">
        ${NAMA_BULAN.map((n,i) => {
          const bln = i + 1;
          return `<label><input type="checkbox" class="bf-bulan" value="${bln}" ${bulanDefault.includes(bln) ? "checked" : ""}>${n}</label>`;
        }).join("")}
      </div>
    </div>

    <div class="form-group">
      <label>📆 Tahun</label>
      <div class="check-grid" style="grid-template-columns:repeat(4,1fr);max-height:none">
        ${tahunList.map(y => `<label><input type="checkbox" class="bf-tahun" value="${y}" ${y === tahunSekarang ? "checked" : ""}>${y}</label>`).join("")}
      </div>
    </div>

    <div class="form-group">
      <label>💵 Nominal SPP / bulan</label>
      <input id="bfNominal" type="number" min="0" value="${num(settings.sppNominal)}" required inputmode="numeric">
    </div>

    <div class="notice" id="bfPreview" style="margin-top:12px"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">
      <button type="button" class="btn btn-light" id="bfBatal">Batal</button>
      <button type="button" class="btn" id="bfProses">⏱ Tagihkan Sekarang</button>
    </div>
  `);

  const hitungKombinasi = () => {
    const bulan = [...document.querySelectorAll(".bf-bulan:checked")].map(x => Number(x.value));
    const tahun = [...document.querySelectorAll(".bf-tahun:checked")].map(x => Number(x.value));
    const kombinasi = [];
    tahun.sort((a,b) => a - b).forEach(y => {
      bulan.sort((a,b) => a - b).forEach(b => {
        kombinasi.push(`${y}-${String(b).padStart(2,"0")}`);
      });
    });
    return kombinasi;
  };

  const updatePreview = () => {
    const kombinasi = hitungKombinasi();
    const nominal = num($("bfNominal").value);
    const total = kombinasi.length * nominal;
    const preview = $("bfPreview");
    if(!kombinasi.length){
      preview.innerHTML = `<span style="color:var(--danger)">⚠️ Pilih minimal 1 bulan & 1 tahun.</span>`;
      return;
    }
    preview.innerHTML = `
      <b>📋 ${kombinasi.length} tagihan akan dibuat:</b><br>
      <span class="small">${kombinasi.map(formatPeriodeLabel).join(", ")}</span><br>
      <span style="margin-top:6px;display:inline-block">Total: <b>${formatRupiah(total)}</b></span>
    `;
  };

  document.querySelectorAll(".bf-bulan, .bf-tahun, #bfNominal").forEach(el =>
    el.addEventListener("change", updatePreview));
  $("bfNominal").addEventListener("input", updatePreview);
  updatePreview();

  $("bfBatal").addEventListener("click", closeModal);

  $("bfProses").addEventListener("click", async () => {
    const kombinasi = hitungKombinasi();
    const nominal = num($("bfNominal").value);
    if(!kombinasi.length) return showToast("Pilih minimal 1 bulan & 1 tahun.", true);
    if(nominal <= 0) return showToast("Nominal harus lebih dari 0.", true);

    const btn = $("bfProses");
    await busy(btn, "Memproses...", async () => {
      try{
        let dibuat = 0, dilewati = 0;
        for(const periode of kombinasi){
          const id = `spp_${santri.id}_${periode}`;
          const ada = await getDocument("tagihanSantri", id);
          if(ada){ dilewati++; continue; }
          await setDoc(doc(db, "tagihanSantri", id), {
            santriId: santri.id, santriNama: santri.nama || "-",
            jenis:"SPP", judul:`SPP ${formatPeriodeLabel(periode)}`,
            periode, kegiatanId:null, nominal,
            terbayar:0, status:"belum", riwayat:[],
            createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
          dibuat++;
        }
        invalidateCache("tagihanSantri");
        logAudit("BACKFILL","tagihanSantri",santri.id,{ dibuat, dilewati, nominal, periode: kombinasi });

showToast(`✅ ${dibuat} tagihan dibuat${dilewati ? `, ${dilewati} sudah ada` : ""}.`);

// Tutup modal backfill dulu
closeModal();

// Panggil callback — callback bertanggung jawab refresh & buka modal bayar
// Beri jeda agar animasi close selesai
setTimeout(() => onSuccess?.(), 300);
      }catch(err){
        console.error(err);
        showToast("Gagal backfill: " + firebaseError(err), true);
      }
    });
  });
}

async function jalankanMigrasiMultiUstadzah(){
  if(!confirm("Jalankan migrasi struktur data? Sekali saja.")) return;
  try{
    let nJilid = 0, nUstadzah = 0;
    for(const j of await fresh("jilid")){
      if(Array.isArray(j.ustadzahIds)) continue;
      await updateCollectionData("jilid", j.id, {
        ustadzahIds: j.ustadzahId ? [j.ustadzahId] : [],
        ustadzahNames: j.ustadzahNama ? [j.ustadzahNama] : []
      });
      nJilid++;
    }
    for(const u of await fresh("ustadzah")){
      if(Array.isArray(u.jilidIds)) continue;
      await updateCollectionData("ustadzah", u.id, {
        jilidIds: u.jilidId ? [u.jilidId] : [],
        jilidNames: u.jilidNama ? [u.jilidNama] : []
      });
      nUstadzah++;
    }
    showToast(`Migrasi selesai. Jilid: ${nJilid}, Ustadzah: ${nUstadzah}.`);
  }catch(err){ showToast("Gagal migrasi: " + firebaseError(err), true); }
}

/* ============ PEMBELAJARAN ============ */
async function saveProgress({ santriId, tipe, halaman, status, pesan }){
  try{
    const existing = (await getCollectionData("progress")).find(x => x.santriId === santriId && x.tipe === tipe);
    const payload = {
      santriId, tipe, halaman: Math.max(1, num(halaman) || 1),
      status: status || "mengulang", pesan: pesan || "",
      ustadzahUid: currentProfile.uid, ustadzahNama: currentProfile.nama || ""
    };
    if(existing) await updateCollectionData("progress", existing.id, payload);
    else await addCollectionData("progress", payload);
    await addCollectionData("riwayat", payload);
    logAudit("UPDATE","progress",santriId,{ tipe, halaman: payload.halaman, status: payload.status });
    showToast("Hasil pembelajaran disimpan.");
  }catch(err){
    console.error(err);
    showToast("Gagal menyimpan: " + firebaseError(err), true);
  }
}

/* ============ VIEWER HALAMAN BUKU ============ */
function openHalamanViewer({ jilidId, tipe, halaman=1, totalHalaman=0, label="Buku" }){
  if(!jilidId || !tipe) return showToast("Buku belum tersedia.", true);
  let page = Math.max(1, num(halaman) || 1), zoom = 100;
  const total = Math.max(0, num(totalHalaman));

  openModal(label, `<div class="pdf-viewer">
    <div class="pdf-toolbar">
      <div class="pdf-toolbar-group">
        <button type="button" id="halPrev" title="Sebelumnya">◀</button>
        <div class="pdf-page-indicator" id="halIndicator"></div>
        <button type="button" id="halNext" title="Berikutnya">▶</button>
      </div>
      <div class="pdf-toolbar-group">
        <button type="button" id="halZoomOut">−</button>
        <span id="halZoom" style="min-width:42px;text-align:center;font-size:12px">100%</span>
        <button type="button" id="halZoomIn">+</button>
        <button type="button" id="halFull" title="Fullscreen">⛶</button>
      </div>
    </div>
    <div class="pdf-frame-wrap" id="halFrameWrap">
      <div class="pdf-loading" id="halLoading"><div class="pdf-skeleton"></div></div>
      <img id="halImage" class="pdf-page-img" alt="${esc(label)}" decoding="async">
    </div>
    <div class="pdf-info-bar">📄 ${esc(label)} · halaman dimuat dari Firestore.</div>
  </div>`);

  const img = $("halImage");
  async function load(){
    $("halIndicator").textContent = `Halaman ${page}${total ? `/${total}` : ""}`;
    $("halLoading").classList.remove("hidden");
    try{
      const gambar = await fetchHalamanGambar(jilidId, tipe, page);
      if(gambar) img.src = gambar;
      else{ img.removeAttribute("src"); showToast(`Halaman ${page} belum tersedia.`, true); }
    }catch(err){ showToast("Gagal memuat: " + firebaseError(err), true); }
    finally{ $("halLoading").classList.add("hidden"); }
    if(total && page < total) fetchHalamanGambar(jilidId, tipe, page + 1).catch(() => {});
    if(page > 1) fetchHalamanGambar(jilidId, tipe, page - 1).catch(() => {});
  }

  const applyZoom = delta => {
    zoom = Math.min(300, Math.max(50, zoom + delta));
    $("halZoom").textContent = zoom + "%";
    if(zoom === 100){ img.style.width = "100%"; img.style.maxWidth = "100%"; }
    else{ img.style.width = zoom + "%"; img.style.maxWidth = "none"; }
  };
  $("halPrev").addEventListener("click", () => { page = Math.max(1, page - 1); load(); });
  $("halNext").addEventListener("click", () => { if(!total || page < total){ page++; load(); } });
  $("halZoomIn").addEventListener("click", () => applyZoom(10));
  $("halZoomOut").addEventListener("click", () => applyZoom(-10));
  $("halFull").addEventListener("click", () => {
    const v = document.querySelector(".pdf-viewer");
    if(!document.fullscreenElement) v?.requestFullscreen().catch(() => {}); else document.exitFullscreen();
  });

  let sx = 0, sy = 0, tracking = false;
  const wrap = $("halFrameWrap");
  wrap.addEventListener("touchstart", e => {
    if(e.touches.length !== 1){ tracking = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    tracking = true;
  }, { passive:true });
  wrap.addEventListener("touchmove", e => {
    if(!tracking || e.touches.length !== 1) return;
    const dx = Math.abs(e.touches[0].clientX - sx);
    const dy = Math.abs(e.touches[0].clientY - sy);
    if(dy > dx + 6) tracking = false;
  }, { passive:true });
  wrap.addEventListener("touchend", e => {
    if(!tracking || !e.changedTouches.length){ tracking = false; return; }
    tracking = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 70) return;
    if(Math.abs(dy) > Math.abs(dx) * 0.7) return;
    if(dx < 0 && (!total || page < total)){ page++; load(); }
    else if(dx > 0 && page > 1){ page--; load(); }
  }, { passive:true });

  load();
}
/* ============ END ============ */
