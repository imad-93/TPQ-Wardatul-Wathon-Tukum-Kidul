<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="description" content="Sistem Informasi TPQ Wardatul Wathon Tukum Kidul Lumajang">
<title>TPQ Wardatul Wathon</title>

<link rel="manifest" href="data:application/manifest+json,{
  %22name%22:%22TPQ%20Wardatul%20Wathon%22,
  %22short_name%22:%22TPQ%20Wardah%22,
  %22start_url%22:%22.%22,
  %22display%22:%22standalone%22,
  %22background_color%22:%22%23f8fafc%22,
  %22theme_color%22:%22%23166534%22
}">

<style>
*{box-sizing:border-box}
:root{
 --primary:#166534;
 --primary2:#15803d;
 --light:#f0fdf4;
 --border:#e2e8f0;
 --text:#172033;
 --muted:#64748b;
 --danger:#dc2626;
 --warning:#d97706;
 --blue:#2563eb;
}
body{
 margin:0;
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#f8fafc;color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.login{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;background:linear-gradient(135deg,#14532d,#166534,#22c55e)
}
.login-card{
 width:100%;max-width:430px;background:white;border-radius:24px;padding:30px;
 box-shadow:0 20px 60px #0004
}
.logo{
 width:65px;height:65px;border-radius:18px;background:var(--primary);
 color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:30px;margin:auto auto 15px
}
h1,h2,h3{margin-top:0}
.muted{color:var(--muted)}
.form-group{margin-bottom:15px}
label{display:block;font-weight:600;margin-bottom:7px;font-size:14px}
input,select,textarea{
 width:100%;border:1px solid var(--border);border-radius:10px;
 padding:11px 12px;background:#fff;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.btn{
 border:0;border-radius:10px;padding:10px 15px;background:var(--primary);
 color:#fff;font-weight:600
}
.btn:hover{background:#14532d}
.btn.secondary{background:#e2e8f0;color:#172033}
.btn.danger{background:var(--danger)}
.btn.warning{background:var(--warning)}
.btn.blue{background:var(--blue)}
.btn.full{width:100%}
.btn.sm{padding:7px 10px;font-size:13px}
.link-btn{
 background:none;border:0;color:var(--primary);font-weight:600;padding:5px
}
.layout{display:flex;min-height:100vh}
.sidebar{
 width:250px;background:#14532d;color:#fff;position:fixed;left:0;top:0;
 bottom:0;padding:20px 14px;z-index:20;overflow:auto
}
.brand{display:flex;gap:10px;align-items:center;padding:10px 8px 25px}
.brand-icon{
 width:42px;height:42px;border-radius:12px;background:#22c55e;
 display:flex;align-items:center;justify-content:center;font-size:21px
}
.brand small{display:block;color:#bbf7d0}
.nav{display:grid;gap:5px}
.nav button{
 border:0;background:transparent;color:#dcfce7;text-align:left;
 padding:12px;border-radius:9px
}
.nav button:hover,.nav button.active{background:#ffffff18;color:white}
.content{margin-left:250px;width:calc(100% - 250px)}
.topbar{
 height:70px;background:#fff;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;padding:0 25px;
 position:sticky;top:0;z-index:10
}
.page{padding:25px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{
 background:#fff;border:1px solid var(--border);border-radius:15px;
 padding:18px
}
.stat-number{font-size:28px;font-weight:800;margin-top:7px}
.stat-label{color:var(--muted);font-size:14px}
.toolbar{
 display:flex;gap:10px;justify-content:space-between;align-items:center;
 margin-bottom:15px;flex-wrap:wrap
}
.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-wrap{
 overflow:auto;background:#fff;border:1px solid var(--border);border-radius:15px
}
table{border-collapse:collapse;width:100%;min-width:700px}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}
th{background:#f8fafc;font-weight:700}
tr:last-child td{border-bottom:0}
.badge{
 display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700
}
.badge.green{background:#dcfce7;color:#166534}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.yellow{background:#fef3c7;color:#92400e}
.badge.blue{background:#dbeafe;color:#1e40af}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.modal{
 position:fixed;inset:0;background:#0008;display:flex;align-items:center;
 justify-content:center;padding:15px;z-index:100
}
.modal-box{
 background:#fff;width:100%;max-width:650px;max-height:90vh;overflow:auto;
 border-radius:18px;padding:22px
}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:#f1f5f9;border-radius:50%;width:35px;height:35px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{
 border-left:4px solid var(--primary);background:#f0fdf4;padding:14px;
 border-radius:8px;margin-bottom:10px
}
.pdf-viewer{
 width:100%;height:65vh;border:1px solid var(--border);border-radius:12px
}
.mobile-menu{display:none}
.toast{
 position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;
 padding:12px 16px;border-radius:10px;z-index:300;box-shadow:0 10px 30px #0003
}
.empty{text-align:center;padding:40px;color:var(--muted)}
.avatar{
 width:38px;height:38px;border-radius:50%;background:#dcfce7;color:#166534;
 display:inline-flex;align-items:center;justify-content:center;font-weight:800
}
@media(max-width:900px){
 .sidebar{transform:translateX(-100%);transition:.2s}
 .sidebar.open{transform:translateX(0)}
 .content{margin-left:0;width:100%}
 .mobile-menu{display:block}
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
 .page{padding:15px}
 .grid{grid-template-columns:1fr}
 .row{grid-template-columns:1fr}
 .topbar{padding:0 15px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login">
 <div class="login-card">
  <div class="logo">📖</div>
  <h2 style="text-align:center;margin-bottom:5px">TPQ Wardatul Wathon</h2>
  <p class="muted" style="text-align:center;margin-top:0">
   Tukum Kidul • Lumajang
  </p>

  <form id="loginForm">
   <div class="form-group">
    <label>Email</label>
    <input id="loginEmail" type="email" required placeholder="admin@email.com">
   </div>
   <div class="form-group">
    <label>Password</label>
    <input id="loginPassword" type="password" required placeholder="Password">
   </div>
   <button class="btn full" type="submit">Masuk</button>
  </form>

  <div style="text-align:center;margin-top:15px">
   <button class="link-btn" onclick="showSetup()">Setup Admin Pertama</button>
  </div>

  <div id="loginError" style="color:#dc2626;text-align:center;margin-top:10px"></div>
 </div>
</div>

<div id="app" class="app hidden">
 <div class="layout">

  <aside id="sidebar" class="sidebar">
   <div class="brand">
    <div class="brand-icon">📖</div>
    <div>
     <strong>TPQ Wardatul Wathon</strong>
     <small id="roleLabel">Portal</small>
    </div>
   </div>
   <nav id="nav" class="nav"></nav>
  </aside>

  <main class="content">
   <header class="topbar">
    <div>
     <button class="btn secondary mobile-menu" onclick="toggleSidebar()">☰</button>
     <strong id="pageTitle">Dashboard</strong>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
     <span id="userName"></span>
     <button class="btn danger sm" onclick="logout()">Keluar</button>
    </div>
   </header>

   <section id="page" class="page"></section>
  </main>
 </div>
</div>

<div id="modal" class="modal hidden">
 <div class="modal-box">
  <div class="modal-head">
   <h3 id="modalTitle"></h3>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">

import {initializeApp}
 from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,
 createUserWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
 getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,
 updateDoc,deleteDoc,query,where,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBUM53K-Av3DkwkW6NNQg0wKQ-ehtVZ428",
 authDomain:"tpqwardah.firebaseapp.com",
 projectId:"tpqwardah",
 storageBucket:"tpqwardah.firebasestorage.app",
 messagingSenderId:"308318249706",
 appId:"1:308318249706:web:ad1f631acee81a2fe6ad93",
 measurementId:"G-ZVC3M0L8XJ"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

let currentUser=null;
let currentProfile=null;
let currentPage="dashboard";
let currentSantri=null;

const $=id=>document.getElementById(id);

function toast(msg){
 $("toast").textContent=msg;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),3000);
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function rupiah(v){
 return new Intl.NumberFormat("id-ID",{
  style:"currency",currency:"IDR",maximumFractionDigits:0
 }).format(Number(v||0));
}

function closeModal(){$("modal").classList.add("hidden")}
function openModal(title,body){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=body;
 $("modal").classList.remove("hidden");
}

window.closeModal=closeModal;
window.showSetup=()=>{
 openModal("Setup Admin Pertama",`
  <form id="setupForm">
   <div class="form-group">
    <label>Nama Admin</label>
    <input id="setupName" required value="Administrator">
   </div>
   <div class="form-group">
    <label>Email Admin</label>
    <input id="setupEmail" type="email" required>
   </div>
   <div class="form-group">
    <label>Password</label>
    <input id="setupPassword" type="password" minlength="6" required>
   </div>
   <button class="btn full">Buat Akun Admin</button>
  </form>
 `);

 $("setupForm").onsubmit=async e=>{
  e.preventDefault();
  try{
   const email=$("setupEmail").value.trim();
   const password=$("setupPassword").value;
   const name=$("setupName").value.trim();

   const cred=await createUserWithEmailAndPassword(auth,email,password);

   await setDoc(doc(db,"users",cred.user.uid),{
    uid:cred.user.uid,
    nama:name,
    email,
    role:"admin",
    createdAt:serverTimestamp()
   });

   await setDoc(doc(db,"admin",cred.user.uid),{
    uid:cred.user.uid,
    nama:name,
    email,
    role:"admin",
    createdAt:serverTimestamp()
   });

   closeModal();
   toast("Akun admin berhasil dibuat");
  }catch(err){
   toast(firebaseError(err));
  }
 };
};

function firebaseError(e){
 const code=e?.code||"";
 const map={
  "auth/email-already-in-use":"Email sudah digunakan.",
  "auth/invalid-email":"Format email tidak valid.",
  "auth/weak-password":"Password minimal 6 karakter.",
  "auth/invalid-credential":"Email atau password salah.",
  "auth/network-request-failed":"Koneksi internet bermasalah."
 };
 return map[code]||e.message||"Terjadi kesalahan.";
}

$("loginForm").onsubmit=async e=>{
 e.preventDefault();
 $("loginError").textContent="";
 try{
  await signInWithEmailAndPassword(
   auth,$("loginEmail").value.trim(),$("loginPassword").value
  );
 }catch(err){
  $("loginError").textContent=firebaseError(err);
 }
};

window.logout=()=>signOut(auth);
window.toggleSidebar=()=>$("sidebar").classList.toggle("open");

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 if(!user){
  $("loginScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }

 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()){
   toast("Profil pengguna belum dibuat admin.");
   await signOut(auth);
   return;
  }

  currentProfile=snap.data();

  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userName").textContent=currentProfile.nama||user.email;
  $("roleLabel").textContent="Portal "+currentProfile.role;

  buildNav();
  navigate("dashboard");
 }catch(e){
  toast(e.message);
 }
});

function buildNav(){
 const role=currentProfile.role;
 let items=[
  ["dashboard","🏠","Dashboard"]
 ];

 if(role==="admin"){
  items.push(
   ["santri","👨‍🎓","Data Santri"],
   ["ustadzah","👩‍🏫","Data Ustadzah"],
   ["wali","👨‍👩‍👧","Data Wali"],
   ["kelas","📚","Jilid / Kelas"],
   ["pengumuman","📢","Pengumuman"],
   ["keuangan","💰","Keuangan"],
   ["settings","⚙️","Pengaturan"]
  );
 }

 if(role==="ustadzah"){
  items.push(
   ["santriKelas","👨‍🎓","Santri Kelas"],
   ["pengumuman","📢","Pengumuman"]
  );
 }

 if(role==="wali"){
  items.push(
   ["belajar","📖","Baca & Hafalan"],
   ["keuanganWali","💰","Keuangan"],
   ["pengumuman","📢","Pengumuman"]
  );
 }

 $("nav").innerHTML=items.map(x=>`
  <button onclick="navigate('${x[0]}')" data-page="${x[0]}">
   ${x[1]} &nbsp; ${x[2]}
  </button>
 `).join("");
}

window.navigate=async p=>{
 currentPage=p;
 document.querySelectorAll("#nav button").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===p)
 });
 $("sidebar").classList.remove("open");

 const titles={
  dashboard:"Dashboard",
  santri:"Data Santri",
  ustadzah:"Data Ustadzah",
  wali:"Data Wali",
  kelas:"Jilid / Kelas",
  pengumuman:"Pengumuman",
  keuangan:"Keuangan",
  settings:"Pengaturan",
  santriKelas:"Santri Kelas",
  belajar:"Baca & Hafalan",
  keuanganWali:"Riwayat Keuangan"
 };

 $("pageTitle").textContent=titles[p]||"Dashboard";

 try{
  const views={
   dashboard:dashboard,
   santri:adminSantri,
   ustadzah:adminUstadzah,
   wali:adminWali,
   kelas:adminKelas,
   pengumuman:pengumuman,
   keuangan:adminKeuangan,
   settings:settings,
   santriKelas:ustadzahSantri,
   belajar:waliBelajar,
   keuanganWali:waliKeuangan
  };
  await (views[p]||dashboard)();
 }catch(e){
  $("page").innerHTML=`
   <div class="card">
    <h3>Terjadi kesalahan</h3>
    <p>${esc(e.message)}</p>
   </div>`;
 }
};

async function count(col){
 const s=await getDocs(collection(db,col));
 return s.size;
}

async function dashboard(){
 const role=currentProfile.role;

 if(role==="admin"){
  const [santri,ustadzah,wali,kelas]=await Promise.all([
   count("santri"),count("ustadzah"),count("wali"),count("jilid")
  ]);

  $("page").innerHTML=`
   <h2>Dashboard Admin</h2>
   <p class="muted">Selamat datang di Sistem Informasi TPQ Wardatul Wathon.</p>
   <div class="grid">
    ${stat("👨‍🎓","Santri",santri)}
    ${stat("👩‍🏫","Ustadzah",ustadzah)}
    ${stat("👨‍👩‍👧","Wali",wali)}
    ${stat("📚","Jilid / Kelas",kelas)}
   </div>
  `;
  return;
 }

 if(role==="ustadzah"){
  const q=query(collection(db,"santri"),where("ustadzahId","==",currentUser.uid));
  const s=await getDocs(q);
  $("page").innerHTML=`
   <h2>Dashboard Ustadzah</h2>
   <p class="muted">Daftar santri yang menjadi tanggung jawab Anda.</p>
   <div class="grid">
    ${stat("👨‍🎓","Santri Binaan",s.size)}
    ${stat("📖","Pembelajaran","Ngaji & Hafalan")}
   </div>
  `;
  return;
 }

 const santriQ=query(
  collection(db,"santri"),
  where("waliId","==",currentUser.uid)
 );
 const s=await getDocs(santriQ);

 let notices=await getDocs(
  query(collection(db,"pengumuman"),orderBy("createdAt","desc"))
 );

 $("page").innerHTML=`
  <h2>Dashboard Wali</h2>
  <p class="muted">Informasi perkembangan putra/putri Anda.</p>
  <div class="grid">
   ${stat("👨‍🎓","Jumlah Santri",s.size)}
   ${stat("📖","Pembelajaran","Baca & Hafalan")}
   ${stat("💰","Keuangan","Lihat tagihan")}
   ${stat("📢","Pengumuman",notices.size)}
  </div>

  <div style="margin-top:20px" class="card">
   <h3>Pengumuman</h3>
   ${notices.empty?
    `<div class="empty">Belum ada pengumuman.</div>`:
    notices.docs.slice(0,5).map(d=>{
     const x=d.data();
     return `<div class="notice">
      <strong>${esc(x.judul)}</strong>
      <div>${esc(x.isi)}</div>
     </div>`
    }).join("")
   }
  </div>
 `;
}

function stat(icon,label,value){
 return `<div class="card">
  <div style="font-size:24px">${icon}</div>
  <div class="stat-label">${label}</div>
  <div class="stat-number">${esc(value)}</div>
 </div>`;
}

/* =========================
   ADMIN - SANTRI
========================= */

async function adminSantri(){
 const s=await getDocs(collection(db,"santri"));

 $("page").innerHTML=`
  <div class="toolbar">
   <div>
    <h2>Data Santri</h2>
    <span class="muted">${s.size} santri</span>
   </div>
   <button class="btn" onclick="formSantri()">+ Tambah Santri</button>
  </div>

  <div class="table-wrap">
   <table>
    <thead>
     <tr><th>No.</th><th>Nama Santri</th><th>Kelas/Jilid</th>
     <th>Wali</th><th>Ustadzah</th><th>Aksi</th></tr>
    </thead>
    <tbody>
     ${s.empty?
      `<tr><td colspan="6" class="empty">Belum ada data.</td></tr>`:
      s.docs.map((d,i)=>{
       const x=d.data();
       return `<tr>
        <td>${i+1}</td>
        <td><strong>${esc(x.nama)}</strong></td>
        <td>${esc(x.kelasNama||x.jilidNama||"-")}</td>
        <td>${esc(x.waliNama||"-")}</td>
        <td>${esc(x.ustadzahNama||"-")}</td>
        <td class="actions">
         <button class="btn sm" onclick="formSantri('${d.id}')">Edit</button>
         <button class="btn danger sm" onclick="hapus('santri','${d.id}')">Hapus</button>
        </td>
       </tr>`
      }).join("")
     }
    </tbody>
   </table>
  </div>
 `;
}

window.formSantri=async id=>{
 let x={};
 if(id)x=(await getDoc(doc(db,"santri",id))).data()||{};

 const [kelas,ust,wali]=await Promise.all([
  getDocs(collection(db,"jilid")),
  getDocs(collection(db,"ustadzah")),
  getDocs(collection(db,"wali"))
 ]);

 openModal(id?"Edit Santri":"Tambah Santri",`
  <form id="santriForm">
   <div class="form-group">
    <label>Nama Santri</label>
    <input id="snama" required value="${esc(x.nama)}">
   </div>

   <div class="row">
    <div class="form-group">
     <label>Jilid / Kelas</label>
     <select id="skelas">
      <option value="">Pilih</option>
      ${kelas.docs.map(d=>{
       const z=d.data();
       return `<option value="${d.id}" data-name="${esc(z.nama)}"
        ${x.kelasId===d.id?"selected":""}>${esc(z.nama)}</option>`
      }).join("")}
     </select>
    </div>

    <div class="form-group">
     <label>Ustadzah</label>
     <select id="sust">
      <option value="">Pilih</option>
      ${ust.docs.map(d=>{
       const z=d.data();
       return `<option value="${d.id}"
        ${x.ustadzahId===d.id?"selected":""}>${esc(z.nama)}</option>`
      }).join("")}
     </select>
    </div>
   </div>

   <div class="form-group">
    <label>Wali</label>
    <select id="swali">
     <option value="">Pilih</option>
     ${wali.docs.map(d=>{
      const z=d.data();
      return `<option value="${d.id}"
       ${x.waliId===d.id?"selected":""}>${esc(z.nama)} — ${esc(z.email||"")}</option>`
     }).join("")}
    </select>
   </div>

   <button class="btn full">Simpan</button>
  </form>
 `);

 $("santriForm").onsubmit=async e=>{
  e.preventDefault();

  const kelasEl=$("skelas");
  const ustEl=$("sust");
  const waliEl=$("swali");

  const kelasName=kelasEl.selectedOptions[0]?.dataset.name||"";
  const ustName=ustEl.selectedOptions[0]?.textContent||"";
  const waliName=waliEl.selectedOptions[0]?.textContent?.split(" — ")[0]||"";

  const data={
   nama:$("snama").value.trim(),
   kelasId:kelasEl.value,
   kelasNama:kelasName,
   jilidId:kelasEl.value,

async function modulBelajarUst(id,jenis){
 const s=await getDoc(doc(db,"santri",id));
 if(!s.exists())return;

 currentSantri={id,...s.data()};

 const kelas=await getDoc(doc(db,"jilid",currentSantri.kelasId));
 const k=kelas.data()||{};

 const hist=await getDocs(
  query(
   collection(db,"riwayat"),
   where("santriId","==",id),
   where("jenis","==",jenis)
  )
 );

 const latest=hist.docs.sort((a,b)=>
  (b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0)
 )[0]?.data()||{};

 const url=jenis==="baca"?k.bukuBacaUrl:k.bukuHafalanUrl;
 const halaman=latest.halamanTerakhir||1;

 openModal(
  `${jenis==="baca"?"📖 Buku Dibaca":"🧠 Buku Hafalan"} — ${currentSantri.nama}`,
  `
   ${url?
    `<iframe class="pdf-viewer" src="${esc(url)}#page=${halaman}"></iframe>`:
    `<div class="card" style="margin-bottom:12px">
     <div class="empty">PDF belum diatur admin untuk kelas ini.</div>
    </div>`
   }

   <div class="card" style="margin-top:12px">
    <h3>Progress</h3>
    <div class="row">
     <div>
      <label>Halaman terakhir dibaca</label>
      <input id="pageNumber" type="number" min="1" value="${halaman}">
     </div>
     <div>
      <label>Status</label>
      <select id="progressStatus">
       <option value="naik">Naik</option>
       <option value="mengulang">Mengulang</option>
      </select>
     </div>
    </div>

    <div class="form-group">
     <label>Pesan Ustadzah</label>
     <textarea id="pesanUst" rows="3"
      placeholder="Contoh: Bacaan sudah bagus..."></textarea>
    </div>

    <button class="btn" onclick="simpanProgress('${id}','${jenis}')">
     💾 Simpan Progress
    </button>

    <button class="btn blue" onclick="rekamPesan('${id}','${jenis}')">
     🎙️ Rekam Pesan Suara
    </button>
   </div>
  `
 );
}

window.simpanProgress=async(id,jenis)=>{
 const page=Number($("pageNumber").value||1);
 const status=$("progressStatus").value;
 const pesan=$("pesanUst").value.trim();

 await addDoc(collection(db,"riwayat"),{
  santriId:id,
  jenis,
  halamanTerakhir:page,
  status,
  pesan,
  ustadzahId:currentUser.uid,
  createdAt:serverTimestamp()
 });

 toast("Progress pembelajaran tersimpan");
};

let mediaRecorder=null;
let audioChunks=[];

window.rekamPesan=async(id,jenis)=>{
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});

  mediaRecorder=new MediaRecorder(stream);
  audioChunks=[];

  mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);

  mediaRecorder.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());

   const blob=new Blob(audioChunks,{type:"audio/webm"});
   const url=URL.createObjectURL(blob);

   openModal("Pesan Suara",`
    <p>Rekaman berhasil dibuat.</p>
    <audio controls style="width:100%" src="${url}"></audio>
    <p class="muted">
     Untuk penyimpanan permanen, unggah blob ini ke Firebase Storage.
     Versi single-file ini menyediakan perekaman dan preview lokal.
    </p>
   `);
  };

  mediaRecorder.start();
  toast("Merekam... klik OK pada dialog berikut untuk berhenti.");
  setTimeout(()=>{
   if(mediaRecorder?.state==="recording")mediaRecorder.stop();
  },10000);

 }catch(e){
  toast("Izin mikrofon tidak tersedia.");
 }
};

     <tr>

/* =========================
   PENGATURAN
========================= */

async function settings(){
 const ref=doc(db,"settings","general");
 const s=await getDoc(ref);
 const x=s.exists()?s.data():{};

 $("page").innerHTML=`
  <h2>Pengaturan</h2>

  <div class="card">
   <form id="settingsForm">
    <div class="row">
     <div class="form-group">
      <label>Nama TPQ</label>
      <input id="setNama" value="${esc(x.nama||"TPQ Wardatul Wathon")}">
     </div>
     <div class="form-group">
      <label>Lokasi</label>
      <input id="setLokasi"
       value="${esc(x.lokasi||"Tukum Kidul, Lumajang")}">
     </div>
    </div>

    <div class="form-group">
     <label>Nomor WhatsApp</label>
     <input id="setWa" value="${esc(x.whatsapp||"")}">
    </div>

    <div class="form-group">
     <label>URL QRIS</label>
     <input id="setQris" type="url" value="${esc(x.qrisUrl||"")}"
      placeholder="https://.../qris.png">
    </div>

    <button class="btn">Simpan Pengaturan</button>
   </form>
  </div>
 `;

 $("settingsForm").onsubmit=async e=>{
  e.preventDefault();

  await setDoc(ref,{
   nama:$("setNama").value.trim(),
   lokasi:$("setLokasi").value.trim(),
   whatsapp:$("setWa").value.trim(),
   qrisUrl:$("setQris").value.trim(),
   updatedAt:serverTimestamp()
  },{merge:true});

  toast("Pengaturan tersimpan");
 };
}

/* =========================
   DELETE
========================= */

window.hapus=async(col,id)=>{
 if(!confirm("Yakin ingin menghapus data ini?"))return;

 await deleteDoc(doc(db,col,id));
 toast("Data berhasil dihapus");
 navigate(currentPage);
};

/* =========================
   SERVICE WORKER PWA
========================= */

if("serviceWorker" in navigator){
 const sw=`
  const CACHE="tpq-wardah-v1";
  self.addEventListener("install",e=>{
   e.waitUntil(caches.open(CACHE).then(c=>c.add(location.href)));
  });
  self.addEventListener("fetch",e=>{
   e.respondWith(
    fetch(e.request).catch(()=>caches.match(e.request))
   );
  });
 `;
 const blob=new Blob([sw],{type:"text/javascript"});
 navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

</script>
